<!doctype html>
<!-- Monthly features / store picks embed for store websites (Duda et al).

     Embedded once as an iframe (or opened directly); the content updates
     every time someone presses "Push to website" in the platform, because
     this page renders a JSON snapshot published to our public storage:

       ?store=brothers            →  .../creatives/website/brothers.json          (monthly features)
       ?store=brothers&view=picks →  .../creatives/website/brothers-picks.json    (manager picks)

     Monthly features show everything at once in a wrapping grid, with
     filters for category, price and savings. Store picks stay a single row
     — a hand-picked shelf reads better as one line the visitor scrolls
     through than a whole page of it.

     Nothing here is authenticated — the snapshot only ever contains what an
     admin or store manager deliberately published, which is the same
     information printed on the shelf. Styling is neutral so it sits on any
     site; ?accent=%23b91c1c overrides the price colour. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Features</title>
<style>
  :root { --accent: #b42a2a; --ink: #191919; --mut: #757575; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
         background: transparent; color: var(--ink); padding: 8px; }
  .hdr { text-align: center; margin: 8px 0 4px; }
  .hdr h2 { font-size: 26px; letter-spacing: .02em; }
  .hdr p  { color: var(--mut); font-size: 14px; margin-top: 4px; }

  /* Filter bar — features only. Plain selects so it works everywhere a
     store's site might embed this, no framework required. */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
             justify-content: center; margin: 14px 0 4px; }
  .filters select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px;
                     border: 1px solid #d8d8d8; background: #fff; color: var(--ink); }
  .filters label { font-size: 13px; color: var(--mut); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .filters .count { font-size: 12px; color: var(--mut); }

  /* Monthly features: every card, wrapping to as many rows as it takes. */
  .grid.wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
               gap: 14px; margin-top: 18px; }

  /* Store picks: one row, native horizontal scroll — a shelf, not a page. */
  .grid.row { display: flex; gap: 14px; margin-top: 18px; overflow-x: auto;
              -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; padding-bottom: 8px; }
  .grid.row .card { flex: 0 0 200px; scroll-snap-align: start; }
  .grid.row::-webkit-scrollbar { height: 7px; }
  .grid.row::-webkit-scrollbar-thumb { background: #d8d8d8; border-radius: 4px; }

  /* Uniform cards: the photo box is always square, the name always gets two
     lines of room, the size line one, and the price sits at the same height
     on every card — nothing shifts with content length. Oversized images
     scale down to fit the box; they never enlarge it.

     Cards with a cocktail flip over: front is the product, back is the
     recipe on a brand-coloured card. */
  .card { perspective: 1200px; position: relative; }
  .flip { position: relative; height: 100%; transition: transform .55s;
          transform-style: preserve-3d; }
  .card.on .flip { transform: rotateY(180deg); }
  .face { border: 1px solid #e5e5e5; border-radius: 10px; overflow: hidden;
          background: #fff; display: flex; flex-direction: column;
          -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .face.front { position: relative; height: 100%; }
  .face.back { position: absolute; inset: 0; transform: rotateY(180deg);
               border: 0; color: #fff; padding: 14px; overflow-y: auto; }
  .card .ph { aspect-ratio: 1; background: #fafafa; position: relative; flex: none; }
  .card img { position: absolute; inset: 0; margin: auto; z-index: 1;
              max-width: 88%; max-height: 88%; width: auto; height: auto; object-fit: contain; }
  .card .tx { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nm { font-weight: 600; font-size: 14px; line-height: 1.25;
        height: 35px; overflow: hidden;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sz { color: var(--mut); font-size: 12px; height: 15px; overflow: hidden; }
  .pr { padding-top: 6px; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; height: 34px; }
  .sale { color: var(--accent); font-size: 24px; font-weight: 800; }
  .reg  { color: var(--mut); font-size: 13px; }
  .reg s { text-decoration: line-through; }
  /* The saving is the story — a ribbon on the photo, where the eye already
     is, not a footnote under the price. */
  .save { position: absolute; top: 10px; right: -1px; z-index: 3;
          background: var(--accent); color: #fff;
          font-size: 15px; font-weight: 800; letter-spacing: .02em;
          padding: 6px 12px 6px 14px; border-radius: 6px 0 0 6px;
          box-shadow: 0 2px 6px rgba(0,0,0,.18); line-height: 1.15; text-align: right; }
  .save small { display: block; font-size: 10px; font-weight: 700; opacity: .92; }
  .ft { text-align: center; color: var(--mut); font-size: 11px; margin: 16px 0 4px; }
  .empty { text-align: center; color: var(--mut); padding: 40px 0; }
  /* Cocktail flip trigger under the price, and the recipe back face. */
  .rxbtn { border-top: 1px dashed #e5e5e5; margin-top: 2px; padding: 7px 0 8px;
           font-size: 12px; font-weight: 600; color: var(--accent);
           background: none; border-left: 0; border-right: 0; border-bottom: 0;
           cursor: pointer; text-align: left; font-family: inherit; }
  .rxbtn::before { content: '🍸 '; }
  .back .rname { font-size: 17px; font-weight: 800; line-height: 1.2; margin: 2px 18px 4px 0; }
  .back .rblurb { font-size: 11px; font-style: italic; margin-bottom: 8px; }
  .back ul { margin: 0 0 8px 16px; padding: 0; font-size: 12px; }
  .back ol { margin: 0 0 8px 16px; padding: 0; font-size: 11px; }
  .back li { margin-bottom: 3px; }
  .back .rserve { font-size: 11px; font-style: italic; margin-top: auto; }
  .back .close { position: absolute; top: 8px; right: 10px; background: none; border: 0;
                 color: inherit; font-size: 16px; cursor: pointer; opacity: .8; }
</style>
</head>
<body>
<div id="app"><p class="empty">Loading…</p></div>
<script>
(function () {
  // Tell the embedding page how tall we are, so the iframe can fit the whole
  // block instead of growing a scrollbar. The parent's snippet listens for
  // this message; sent on every layout change (images loading, window
  // resizing, filters changing).
  function reportHeight() {
    if (window.parent === window) return;
    parent.postMessage({ lrsFeaturesHeight: document.documentElement.scrollHeight }, '*');
  }
  if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener('load', reportHeight);
  window.__reportHeight = reportHeight;

  var qs = new URLSearchParams(location.search);
  var store = (qs.get('store') || '').replace(/[^a-z0-9-]/g, '');
  // ?view=picks shows the manager-curated shelf instead of the monthly
  // features. Picks self-hide when empty; features show a friendly note.
  var isPicks = qs.get('view') === 'picks';
  var accent = qs.get('accent');
  if (accent && /^#[0-9a-fA-F]{3,8}$/.test(accent)) {
    document.documentElement.style.setProperty('--accent', accent);
  }
  var app = document.getElementById('app');
  function hide() {
    app.innerHTML = '';
    document.body.style.padding = '0';
    document.body.style.margin = '0';
    if (window.__reportHeight) { window.__reportHeight(); setTimeout(window.__reportHeight, 300); }
  }
  if (!store) { app.innerHTML = '<p class="empty">No store given.</p>'; return; }

  var base = 'https://yyveikxfomxmedlxsulh.supabase.co/storage/v1/object/public/creatives/website/';
  fetch(base + store + (isPicks ? '-picks' : '') + '.json?t=' + Math.floor(Date.now() / 300000))
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (d) {
      var money = function (n) { return '$' + Number(n).toFixed(2); };
      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
        });
      };
      var catLabel = function (c) {
        return String(c).replace(/-/g, ' ').replace(/\b\w/g, function (m) { return m.toUpperCase(); });
      };
      // Images only from our own storage — the snapshot is trusted, but a
      // belt goes well with braces on a page other sites embed.
      var okImg = function (u) {
        return /^https:\/\/yyveikxfomxmedlxsulh\.supabase\.co\/storage\//.test(u || '');
      };
      var items = (d.items || []).filter(function (it) { return it.placeholder || okImg(it.image); });
      var bp = (d.brand && /^#[0-9a-fA-F]{3,8}$/.test(d.brand.primary || '')) ? d.brand.primary : '#1e3a5f';
      var bs = (d.brand && /^#[0-9a-fA-F]{3,8}$/.test(d.brand.secondary || '')) ? d.brand.secondary : '#c4a35a';
      if (!items.length) {
        if (isPicks) { hide(); } else {
          app.innerHTML = '<p class="empty">Check back soon for this month’s features.</p>';
        }
        return;
      }

      var h = '<div class="hdr"><h2>' + esc(d.title || 'Monthly Features') + '</h2>'
        + (d.dates ? '<p>' + esc(d.dates) + '</p>' : '') + '</div>';

      // Filters only make sense once there's enough on the page to sort
      // through — and only for the full features grid, never the one-row
      // picks shelf, which is short by design.
      var showFilters = !isPicks && items.length > 3;
      if (showFilters) {
        var cats = {};
        items.forEach(function (it) { if (it.category) cats[it.category] = true; });
        var catNames = Object.keys(cats).sort();
        h += '<div class="filters">';
        if (catNames.length > 1) {
          h += '<select id="fcat"><option value="all">All categories</option>'
            + catNames.map(function (c) { return '<option value="' + esc(c) + '">' + esc(catLabel(c)) + '</option>'; }).join('')
            + '</select>';
        }
        h += '<select id="fprice"><option value="any">Any price</option>'
          + '<option value="u15">Under $15</option><option value="15-30">$15 – $30</option>'
          + '<option value="30-50">$30 – $50</option><option value="50p">$50+</option></select>';
        h += '<label><input type="checkbox" id="fsale"> On sale only</label>';
        h += '<span class="count" id="fcount"></span>';
        h += '</div>';
      }

      h += '<div class="grid ' + (isPicks ? 'row' : 'wrap') + '">';
      items.forEach(function (it) {
        // The saving leads; a percentage joins it when it reads bigger than
        // the dollars do (everything here is under $100, so it usually does).
        var ribbon = '';
        if (it.savings != null && Number(it.savings) > 0) {
          var pct = (it.reg && Number(it.reg) > 0)
            ? Math.round(Number(it.savings) / Number(it.reg) * 100) : 0;
          ribbon = '<span class="save">SAVE ' + money(it.savings).replace('.00', '')
            + (pct >= 10 ? '<small>' + pct + '% OFF</small>' : '') + '</span>';
        }
        var photo = it.placeholder
          ? '<div style="position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;'
            + 'justify-content:center;gap:8px;background:' + bp + ';padding:16px;text-align:center">'
            + '<span style="color:' + bs + ';font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase">'
            + esc((d.title || '').split(' ')[0]) + '</span>'
            + '<span style="color:#fff;font-size:19px;font-weight:800;line-height:1.2">' + esc(it.name) + '</span>'
            + '<span style="color:' + bs + ';font-size:12px;font-style:italic">Too good to wait for a photo</span>'
            + '</div>'
          : '<img loading="lazy" src="' + esc(it.image) + '" alt="' + esc(it.name) + '">';
        var front = '<div class="face front"><div class="ph">' + ribbon + photo + '</div>'
          + '<div class="tx"><span class="nm">' + esc(it.name) + '</span>'
          + '<span class="sz">' + esc([it.size, it.note].filter(Boolean).join(' · ')) + '</span>'
          + '<span class="pr">'
          + (it.sale != null ? '<span class="sale">' + money(it.sale) + '</span>' : '')
          + (it.reg != null && it.sale != null && Number(it.reg) > Number(it.sale)
              ? '<span class="reg">was <s>' + money(it.reg) + '</s></span>' : '')
          + '</span>'
          + (it.recipe && it.recipe.name
              ? '<button class="rxbtn" data-flip>Cocktail idea: ' + esc(it.recipe.name) + '</button>'
              : '')
          + '</div></div>';

        var back = '';
        if (it.recipe && it.recipe.name) {
          var rx = it.recipe;
          back = '<div class="face back" style="background:' + bp + '">'
            + '<button class="close" data-flip aria-label="Back to the product">✕</button>'
            + '<span style="color:' + bs + ';font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase">'
            + esc(it.name) + '</span>'
            + '<p class="rname">' + esc(rx.name) + '</p>'
            + (rx.blurb ? '<p class="rblurb" style="color:' + bs + '">' + esc(rx.blurb) + '</p>' : '')
            + '<ul>' + (rx.ingredients || []).map(function (i) {
                return '<li>' + esc((i.amount ? i.amount + ' ' : '') + i.item) + '</li>';
              }).join('') + '</ul>'
            + '<ol>' + (rx.method || []).map(function (s) {
                return '<li>' + esc(s) + '</li>';
              }).join('') + '</ol>'
            + (rx.glass ? '<p class="rserve" style="color:' + bs + '">Serve in a ' + esc(rx.glass)
                + (rx.garnish ? ' · ' + esc(rx.garnish) : '') + '</p>' : '')
            + '</div>';
        }

        h += '<div class="card" data-cat="' + esc(it.category || '') + '" data-price="' + (it.sale != null ? it.sale : '')
          + '" data-savings="' + (it.savings != null ? it.savings : '') + '"><div class="flip">' + front + back + '</div></div>';
      });
      h += '</div><p class="ft">' + esc(d.footnote || 'Prices exclude tax & deposit — while supplies last.') + '</p>';
      app.innerHTML = h;

      // One listener flips any card whose trigger (front line or back ✕) is
      // clicked. The back face is absolutely positioned over the front, so
      // the card never reflows — it just turns over.
      app.addEventListener('click', function (e) {
        var t = e.target.closest('[data-flip]');
        if (t) { var c = t.closest('.card'); if (c) c.classList.toggle('on'); }
      });

      if (showFilters) {
        var cards = [].slice.call(app.querySelectorAll('.card'));
        var fcat = document.getElementById('fcat');
        var fprice = document.getElementById('fprice');
        var fsale = document.getElementById('fsale');
        var fcount = document.getElementById('fcount');
        function apply() {
          var cat = fcat ? fcat.value : 'all';
          var price = fprice.value;
          var saleOnly = fsale.checked;
          var shown = 0;
          cards.forEach(function (c) {
            var savings = parseFloat(c.getAttribute('data-savings'));
            var p = parseFloat(c.getAttribute('data-price'));
            var ok = true;
            if (cat !== 'all' && c.getAttribute('data-cat') !== cat) ok = false;
            if (saleOnly && !(savings > 0)) ok = false;
            if (price !== 'any') {
              if (isNaN(p)) ok = false;
              else if (price === 'u15' && !(p < 15)) ok = false;
              else if (price === '15-30' && !(p >= 15 && p < 30)) ok = false;
              else if (price === '30-50' && !(p >= 30 && p < 50)) ok = false;
              else if (price === '50p' && !(p >= 50)) ok = false;
            }
            c.style.display = ok ? '' : 'none';
            if (ok) shown++;
          });
          fcount.textContent = shown + ' of ' + cards.length;
          window.__reportHeight();
        }
        if (fcat) fcat.addEventListener('change', apply);
        fprice.addEventListener('change', apply);
        fsale.addEventListener('change', apply);
        apply();
      }

      window.__reportHeight();
      setTimeout(window.__reportHeight, 600);
    })
    .catch(function () {
      app.innerHTML = '<p class="empty">Check back soon for this month’s features.</p>';
    });
})();
</script>
</body>
</html>
