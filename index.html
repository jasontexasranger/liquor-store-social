  const { templates, loading:tplLoading } = useSTTemplates(storeId, isAdmin);
  const { saves, saveTag, deleteTag } = useSavedTags(userId);
  const [savingTag, setSavingTag] = useState(false);
  const [selected,   setSelected]   = useState(null);
  const [values,     setValues]     = useState({});
  const [layout,     setLayout]     = useState('4up');
  const [qty,        setQty]        = useState(4);
  const [step,       setStep]       = useState('browse'); // browse|compose|preview
  const [printing,      setPrinting]      = useState(false);
  const [printPages,    setPrintPages]    = useState([]);
  const [printDims,     setPrintDims]     = useState(null);
  const [printMode,     setPrintMode]     = useState('single'); // 'single'|'queue'
  const [printQueue,    setPrintQueue]    = useState([]);       // [{id,label,canvas}]
  const [addingToQueue, setAddingToQueue] = useState(false);
  const [queuePrinting, setQueuePrinting] = useState(false);
  const { fields, loading:fLoading } = useSTFields(selected?.id);
  const [catFilter,  setCatFilter]  = useState('all');
  const [search,     setSearch]     = useState('');
  const previewRef = useRef();

  // When a saved tag is loaded from the library, pre-populate template + values
  useEffect(function() {
    if (!pendingLoad || tplLoading || !templates.length) return;
    var tpl = templates.find(function(t) { return t.id === pendingLoad.templateId; });
    if (tpl) {
      setSelected(tpl);
      setValues(pendingLoad.values || {});
      setStep('compose');
      if (onLoadComplete) onLoadComplete();
    } else {
      toast.error('Template no longer available');
      if (onLoadComplete) onLoadComplete();
    }
  }, [pendingLoad, templates, tplLoading]);

  // Derive display values: apply formula and/or prefix for every field
  const computedValues = Object.assign({}, values);
  fields.forEach(function(f) {
    const pfx = f.prefix || '';
    const isPricePfx = pfx.indexOf('$') !== -1;
    if (typeof f.formula === 'string' && f.formula.trim()) {
      const cv = evaluateFormula(f.formula, fields, values);
      if (cv !== '') {
        var fmtCv = isPricePfx ? (function(){ var n = parseFloat(cv); return !isNaN(n) ? n.toFixed(2) : cv; }()) : cv;
        computedValues[f.id] = pfx + fmtCv;
      }
    } else if (pfx && values[f.id]) {
      var fmtVal = isPricePfx ? (function(){ var n = parseFloat(values[f.id]); return !isNaN(n) ? n.toFixed(2) : values[f.id]; }()) : values[f.id];
      computedValues[f.id] = pfx + fmtVal;
    }
  });

  // Field overflow validation — use actual box pixel dims from the template
  const overflowIds = fields.filter(f => {
    if (typeof f.formula === 'string' && f.formula.trim()) return false; // auto fields can't overflow
    const text = computedValues[f.id]||'';
    if (!text) return false;
    const tplW = Math.round((selected?.width_in  || 4.25) * PX_PER_IN);
    const tplH = Math.round((selected?.height_in || 5.5)  * PX_PER_IN);
    const boxW = Math.round(f.w_pct / 100 * tplW);
    const boxH = Math.round(f.h_pct / 100 * tplH);
    const { overflow } = fitText(text, boxW, boxH, {
      maxFontSize:f.max_font_size, minFontSize:f.min_font_size,
      bold:f.bold, lineSpacing:f.line_spacing, wrap:f.wrap,
      maxLines:f.multiline?f.max_lines:1,
    });
    return overflow;
  }).map(f=>f.id);
  const missingRequired = fields.filter(f => {
    if (typeof f.formula === 'string') return false; // formula fields are never "missing"
    return f.required && !(values[f.id] && values[f.id].trim());
  }).map(f=>f.id);
  const canPrint = overflowIds.length===0 && missingRequired.length===0 && selected;

  const selectTemplate = (tpl) => { setSelected(tpl); setValues({}); setStep('compose'); };

  const buildPreview = async () => {
    if (!canPrint) return;
    setPrinting(true);
    try {
      const stCanvas = await renderSTCanvas(selected, fields, computedValues);
      const { pages, dw, dh } = buildPrintPages(stCanvas, layout, qty, !!selected.is_landscape);
      setPrintPages(pages);
      setPrintDims({ dw, dh, scale: PX_PER_IN });
      setStep('preview');
    } catch(e) { toast.error('Preview failed: '+e.message); }
    finally { setPrinting(false); }
  };

  const addToQueue = async () => {
    if (!canPrint || printQueue.length >= 4) return;
    setAddingToQueue(true);
    try {
      const stCanvas = await renderSTCanvas(selected, fields, computedValues);
      const firstVal = computedValues[fields[0]?.id] || '';
      const label = selected.name + (firstVal ? ` – ${firstVal.substring(0,18)}` : '');
      setPrintQueue(q => [...q, { id: Date.now(), canvas: stCanvas, label }]);
      toast.success(`Added to queue (${printQueue.length+1}/4)`);
    } catch(e) { toast.error('Error: '+e.message); }
    finally { setAddingToQueue(false); }
  };

  const printQueueSheet = async () => {
    if (!printQueue.length) return;
    setQueuePrinting(true);
    try {
      const page = buildMixedPrintPage(printQueue.map(q=>q.canvas));
      setPrintPages([page]);
      setPrintDims({ dw: PAGE_W, dh: PAGE_H });
      setPrintMode('queue');
      setStep('preview');
    } catch(e) { toast.error('Error: '+e.message); }
    finally { setQueuePrinting(false); }
  };

  const printSheet = () => {
    if (!printPages.length) return;
    const w = window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>Shelf Talkers</title>
      <style>
        @page{size:letter portrait;margin:0.25in;}
        body{margin:0;padding:0;background:#fff;}
        img{display:block;width:100%;height:auto;page-break-after:always;}
        img:last-child{page-break-after:avoid;}
      </style></head><body>`);
    printPages.forEach(p => {
      w.document.write(`<img src="${p.toDataURL('image/jpeg',0.92)}"/>`);
    });
    w.document.write(`</body></html>`);
    w.document.close();
    w.focus();
    w.print();
  };

  // Live preview canvas
  const livePreviewRef = useRef();
  useEffect(() => {
    if (!selected || !livePreviewRef.current || step!=='compose') return;
    let cancelled = false;
    (async () => {
      const canvas = livePreviewRef.current;
      const stCanvas = await renderSTCanvas(selected, fields, computedValues);
      if (cancelled) return;
      canvas.width  = stCanvas.width;
      canvas.height = stCanvas.height;
      canvas.getContext('2d').drawImage(stCanvas, 0, 0);
    })();
    return () => { cancelled=true; };
  }, [selected, fields, values, step]);

  const filteredTpls = templates.filter(t => {
    if (catFilter!=='all' && t.category!==catFilter) return false;
    if (search && !t.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  // ── Print Queue Panel (shown on browse + compose steps) ───
  const queuePanel = printQueue.length > 0 && (
    <div className="rounded-2xl border border-indigo-200 dark:border-indigo-700 bg-indigo-50 dark:bg-indigo-950 p-4">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h3 className="text-sm font-bold text-indigo-900 dark:text-indigo-200">
          <Icon name="note"/> Print Queue — {printQueue.length} of 4 tags
        </h3>
        <div className="flex gap-2">
          <button onClick={()=>setPrintQueue([])} className="text-xs text-indigo-500 hover:text-red-500 underline">Clear all</button>
          <Button size="sm" onClick={printQueueSheet} loading={queuePrinting}>
            <Icon name="print"/> Print Sheet ({printQueue.length}-up)
          </Button>
          <Button size="sm" variant="secondary" onClick={()=>{ const p=buildMixedPrintPage(printQueue.map(q=>q.canvas)); exportPDF([p],'queue-sheet.pdf'); }}>
            <Icon name="down"/> PDF
          </Button>
        </div>
      </div>
      <div className="flex gap-3 flex-wrap">
        {printQueue.map((item,i)=>(
          <div key={item.id} className="relative group">
            <div className="w-16 h-20 rounded-lg overflow-hidden border border-indigo-200 dark:border-indigo-600 bg-white flex items-center justify-center">
              <canvas ref={el=>{ if(el){ el.width=item.canvas.width; el.height=item.canvas.height; el.getContext('2d').drawImage(item.canvas,0,0); }}} className="w-full h-full object-contain"/>
            </div>
            <p className="text-xs text-indigo-700 dark:text-indigo-300 mt-1 w-16 truncate">{item.label}</p>
            <button onClick={()=>setPrintQueue(q=>q.filter((_,j)=>j!==i))}
              className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-red-500 text-white text-xs leading-none flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">×</button>
          </div>
        ))}
        {printQueue.length < 4 && (
          <div className="w-16 h-20 rounded-lg border-2 border-dashed border-indigo-300 dark:border-indigo-600 flex items-center justify-center text-indigo-300 text-2xl select-none">+</div>
        )}
      </div>
    </div>
  );

  // ── Browse step ────────────────────────────────────────────
  if (step==='browse') return (
    <div className="space-y-4">
      {queuePanel}

      {/* Saved Tags */}
      {saves.length > 0 && (
        <div>
          <h3 className="text-sm font-bold text-gray-700 dark:text-gray-200 mb-2"><Icon name="save"/> Saved Tags</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {saves.map(s => {
              const tpl = s.shelf_talker_templates;
              return (
                <div key={s.id} className="flex items-center gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-2.5 shadow-sm">
                  {tpl?.file_data && (
                    <img src={tpl.file_data} alt={tpl.name} className="w-12 h-12 object-contain rounded-lg bg-gray-100 dark:bg-gray-900 shrink-0"/>
                  )}
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-gray-900 dark:text-white truncate">{s.name}</p>
                    <p className="text-xs text-gray-400 truncate">{tpl?.name}</p>
                  </div>
                  <div className="flex flex-col gap-1 shrink-0">
                    <button
                      onClick={() => {
                        const tplObj = templates.find(t => t.id === s.template_id);
                        if (tplObj) { setSelected(tplObj); setValues(s.values || {}); setStep('compose'); }
                        else toast.error('Template no longer available');
                      }}
                      className="text-xs bg-indigo-600 text-white px-2 py-0.5 rounded hover:bg-indigo-700">
                      Load
                    </button>
                    <button
                      onClick={async () => { if(confirm('Delete this saved tag?')) await deleteTag(s.id); }}
                      className="text-xs text-red-500 hover:text-red-700 px-2 py-0.5">
                      Delete
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="flex flex-wrap gap-2">
        <Input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" className="max-w-xs"/>
        <Select value={catFilter} onChange={e=>setCatFilter(e.target.value)} className="w-auto">
          <option value="all">All Categories</option>
          {ST_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
        </Select>
      </div>
      {tplLoading && <p className="text-sm text-gray-400 animate-pulse">Loading templates…</p>}
      {!tplLoading && filteredTpls.length===0 && (
        <div className="text-center py-16 text-gray-400">
          <p className="mb-3"><Icon name="tag" size={40} style={{color:"var(--cy-dim)"}}/></p>
          <p className="font-medium">No shelf talker templates available</p>
          {isAdmin && <p className="text-sm mt-1">Create one in the Admin tab</p>}
        </div>
      )}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        {filteredTpls.map(tpl => {
          const isGlobal = tpl.scope==='global';
          const brandNames = STORES.filter(s=>(tpl.shelf_talker_template_brands||[]).some(b=>b.store_id===s.id)).map(s=>s.name.split(' ')[0]);
          return (
            <button key={tpl.id} onClick={()=>selectTemplate(tpl)}
              className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm hover:border-indigo-400 hover:shadow-md transition-all text-left overflow-hidden group">
              <div className="relative aspect-[4/5] bg-gray-100 dark:bg-gray-900 overflow-hidden">
                <img src={tpl.file_data} alt={tpl.name} className="absolute inset-0 w-full h-full object-contain group-hover:scale-105 transition-transform"/>
              </div>
              <div className="p-2.5">
                <p className="font-semibold text-sm text-gray-900 dark:text-white truncate">{tpl.name}</p>
                <p className="text-xs text-gray-500">{tpl.category}</p>
                <div className="flex gap-1 mt-1 flex-wrap">
                  {isGlobal ? <Badge color="blue"><Icon name="globe"/> Global</Badge> : brandNames.map(n=><Badge key={n} color="indigo">{n}</Badge>)}
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );

  // ── Compose step ───────────────────────────────────────────
  if (step==='compose') return (
    <div className="space-y-4">
      {queuePanel}
      <div className="flex items-center gap-3">
        <button onClick={()=>setStep('browse')} className="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">← Back to Templates</button>
        <Badge color="indigo">{selected?.category}</Badge>
        <span className="font-semibold text-gray-900 dark:text-white text-sm">{selected?.name}</span>
        <span className="text-xs text-gray-400">{selected?.width_in}″ × {selected?.height_in}″</span>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-2 gap-5">
        {/* Form */}
        <Card>
          <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-4">Fill in the fields</h3>
          {fLoading && <p className="text-xs text-gray-400 animate-pulse">Loading fields…</p>}
          {!fLoading && fields.length===0 && <p className="text-xs text-gray-400 italic">No text fields configured for this template.</p>}
          <div className="space-y-3">
            {fields.map(f => {
              const isFormula = typeof f.formula === 'string' && !!f.formula.trim();
              const overflow = overflowIds.includes(f.id);
              const missing  = missingRequired.includes(f.id) && values[f.id]!==undefined;
              return (
                <div key={f.id}>
                  <Label>
                    {f.label}
                    {f.required && !isFormula && <span className="text-red-500 ml-0.5">*</span>}
                    {isFormula && <span className="ml-1.5 text-xs font-normal text-indigo-500">auto</span>}
                  </Label>
                  {isFormula
                    ? <Input value={computedValues[f.id]||''} readOnly
                        className="bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 cursor-default text-center font-semibold"/>
                    : <div className={f.prefix ? 'flex items-center gap-1' : ''}>
                        {f.prefix && <span className="text-sm font-semibold text-gray-500 dark:text-gray-300 select-none">{f.prefix}</span>}
                        {f.multiline
                          ? <Textarea value={values[f.id]||''} onChange={e=>setValues(v=>({...v,[f.id]:f.uppercase?e.target.value.toUpperCase():e.target.value}))}
                              placeholder={f.placeholder} rows={Math.min(f.max_lines||2, 4)}
                              className={(overflow||missing?'border-red-400 focus:ring-red-400':'')+' flex-1'}/>
                          : <Input value={values[f.id]||''} onChange={e=>setValues(v=>({...v,[f.id]:f.uppercase?e.target.value.toUpperCase():e.target.value}))}
                              placeholder={f.placeholder} maxLength={f.max_chars||undefined}
                              className={(overflow||missing?'border-red-400 focus:ring-red-400':'')+' flex-1'}/>
                        }
                      </div>
                  }
                  {!isFormula && f.prefix && <p className="text-xs text-gray-400 mt-0.5">"{f.prefix}" is added automatically — just enter the number</p>}
                  {overflow && <p className="text-xs text-red-500 mt-0.5"><Icon name="warn" className="text-amber-400"/> Text too long — please shorten</p>}
                  {missing  && <p className="text-xs text-amber-500 mt-0.5">This field is required</p>}
                </div>
              );
            })}
          </div>

          <Divider label="Print Settings"/>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <Label>Layout</Label>
              <div className="flex gap-2 mt-1">
                {['2up','4up','6up'].map(l=>(
                  <label key={l} className="flex items-center gap-1.5 text-sm cursor-pointer">
                    <input type="radio" checked={layout===l} onChange={()=>{ setLayout(l); setQty(l==='6up'?6:l==='4up'?4:2); }} className="accent-indigo-600"/>
                    {l==='2up'?'2-up':l==='4up'?'4-up':'6-up (Small)'}
                  </label>
                ))}
              </div>
            </div>
            <div>
              <Label>Qty</Label>
              <Input type="number" value={qty} min={1} max={100} onChange={e=>setQty(Math.max(1,+e.target.value))} className="w-20"/>
            </div>
          </div>
          <p className="text-xs text-gray-400 mt-2">
            {Math.ceil(qty/(layout==='6up'?6:layout==='4up'?4:2))} page{Math.ceil(qty/(layout==='6up'?6:layout==='4up'?4:2))>1?'s':''} · ¼″ margin · disable headers &amp; footers
          </p>
          <div className="flex gap-2 mt-4 flex-wrap">
            <Button onClick={buildPreview} loading={printing} disabled={!canPrint} className="flex-1">
              <Icon name="eye"/> Preview Copies
            </Button>
            <Button variant="secondary" onClick={addToQueue} loading={addingToQueue}
              disabled={!canPrint || printQueue.length >= 4}
              title={printQueue.length>=4?'Queue is full (4/4)':'Add this tag to the mixed print queue'}>
              <Icon name="note"/> {printQueue.length>=4 ? 'Queue Full' : `Add to Queue (${printQueue.length}/4)`}
            </Button>
            <Button variant="secondary" loading={savingTag} disabled={!selected}
              onClick={async () => {
                setSavingTag(true);
                try {
                  const firstName = fields[0] ? (values[fields[0].id] || '') : '';
                  const name = selected.name + (firstName ? ` – ${firstName.substring(0,24)}` : '');
                  await saveTag(name, selected.id, values, storeId);
                  toast.success('Tag saved!');
                } catch(e) { toast.error('Save failed: ' + e.message); }
                finally { setSavingTag(false); }
              }}>
              <Icon name="save"/> Save Tag
            </Button>
          </div>
          {(overflowIds.length>0||missingRequired.length>0) && (
            <p className="text-xs text-red-500 mt-1">Fix errors above before printing</p>
          )}
        </Card>

        {/* Live Preview */}
        <div>
          <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">Live Preview</p>
          <div className="rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-48">
            <canvas ref={livePreviewRef} className="max-w-full max-h-[500px] object-contain"/>
          </div>
        </div>
      </div>
    </div>
  );

  // ── Print Preview step ─────────────────────────────────────
  if (step==='preview') return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-3">
        <button onClick={()=>{ setStep(printMode==='queue'?'browse':'compose'); setPrintMode('single'); }} className="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">← Back</button>
        <span className="text-sm font-semibold text-gray-900 dark:text-white">
          {printMode==='queue'
            ? `Mixed Sheet · ${printQueue.length} different tags`
            : `${selected?.name} · ${layout==='4up'?'4-up':'2-up'} · ${qty} copies`}
        </span>
        {printDims && (
          <span className="text-xs text-gray-400">
            Actual print size: {(printDims.dw/PX_PER_IN).toFixed(2)}″ × {(printDims.dh/PX_PER_IN).toFixed(2)}″
          </span>
        )}
      </div>

      {printPages.map((page,i) => (
        <div key={i}>
          <p className="text-xs text-gray-400 mb-1">Page {i+1} of {printPages.length}</p>
          <div className="border border-gray-300 dark:border-gray-600 rounded-xl overflow-hidden shadow-sm bg-white">
            <canvas ref={i===0?previewRef:undefined}
              width={page.width} height={page.height}
              className="w-full"
              ref={(el)=>{ if(el){el.width=page.width;el.height=page.height;el.getContext('2d').drawImage(page,0,0);} }}
            />
          </div>
        </div>
      ))}

      <div className="flex gap-3">
        <Button onClick={printSheet} size="lg"><Icon name="print"/> Print</Button>
        <Button variant="secondary" size="lg" onClick={()=>exportPDF(printPages, printMode==='queue'?'mixed-sheet.pdf':`${selected?.name||'shelf-talkers'}.pdf`)}>
          <Icon name="down"/> Download PDF
        </Button>
      </div>
      <p className="text-xs text-gray-400">Pages include a ¼″ margin. Disable "Print headers and footers" in your browser's print dialog.</p>
    </div>
  );

  return null;
}

// ═══════════════════════════════════════════════════════════════
// SHELF TALKER — MAIN PAGE
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// SHELF TALKER — SAVED TAG LIBRARY
// ═══════════════════════════════════════════════════════════════
function STSavedLibrary({ userId, isAdmin, onLoad }) {
  const { saves, loading, deleteTag } = useSavedTags(userId, isAdmin);
  const [storeFilter, setStoreFilter] = useState('all');
  const [userFilter,  setUserFilter]  = useState('all');

  // Derive filter options from data
  const storeOptions = STORES.filter(function(st) {
    return saves.some(function(s) { return s.store_id === st.id; });
  });
  const userOptions = isAdmin ? Array.from(new Set(saves.map(function(s) { return s.user_email; }).filter(Boolean))) : [];

  const displayed = saves.filter(function(s) {
    if (storeFilter !== 'all' && s.store_id !== storeFilter) return false;
    if (userFilter  !== 'all' && s.user_email !== userFilter)  return false;
    return true;
  });

  if (loading) return <p className="text-sm text-gray-400 animate-pulse py-8 text-center">Loading library…</p>;

  return (
    <div className="space-y-4">
      {/* Filters — admin only */}
      {isAdmin && (
        <div className="flex gap-2 flex-wrap">
          <Select value={storeFilter} onChange={function(e){ setStoreFilter(e.target.value); }} className="w-auto text-xs">
            <option value="all">All Stores</option>
            {storeOptions.map(function(st) { return <option key={st.id} value={st.id}>{st.name}</option>; })}
          </Select>
          <Select value={userFilter} onChange={function(e){ setUserFilter(e.target.value); }} className="w-auto text-xs">
            <option value="all">All Users</option>
            {userOptions.map(function(email) { return <option key={email} value={email}>{email}</option>; })}
          </Select>
          <span className="text-xs text-gray-400 self-center">{displayed.length} tag{displayed.length!==1?'s':''}</span>
        </div>
      )}

      {!displayed.length && (
        <div className="text-center py-16 text-gray-400 dark:text-gray-500">
          <p className="mb-3"><Icon name="tag" size={50} style={{color:"var(--cy-dim)"}}/></p>
          <p className="text-sm font-semibold">{saves.length ? 'No tags match the filters' : 'No saved tags yet'}</p>
          {!saves.length && <p className="text-xs mt-1">Create a shelf talker and click <strong>Save Tag</strong> to build your library</p>}
        </div>
      )}

      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        {displayed.map(function(s) {
          var tpl = s.shelf_talker_templates;
          var storeName = s.store_id ? (function(){ var st = STORES.find(function(x){ return x.id===s.store_id; }); return st ? st.name.split(' ')[0] : null; }()) : null;
          return (
            <div key={s.id} className="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden flex flex-col">
              {/* Thumbnail */}
              <div className="aspect-video bg-gray-100 dark:bg-gray-700 flex items-center justify-center overflow-hidden relative">
                {tpl && tpl.file_data
                  ? <img src={tpl.file_data} alt={tpl.name} className="w-full h-full object-cover"/>
                  : <Icon name="tag" size={40} style={{color:"var(--cy-dim)"}}/>
                }
                {storeName && (
                  <span className="absolute top-1.5 right-1.5 text-xs bg-indigo-600 text-white px-1.5 py-0.5 rounded-md font-semibold">{storeName}</span>
                )}
              </div>
              {/* Info */}
              <div className="p-2.5 flex-1">
                <p className="text-sm font-semibold text-gray-900 dark:text-white truncate" title={s.name}>{s.name}</p>
                {tpl && tpl.category && (
                  <span className="text-xs text-indigo-600 dark:text-indigo-400 font-medium">{tpl.category}</span>
                )}
                {isAdmin && s.user_email && (

// ─────────────────────────────────────────────
// HELP BOT — pinned platform guide
// ─────────────────────────────────────────────
// Scoped hard on the server: it only talks about using this app, never
// answers as a general assistant. The client just renders a conversation
// and, when the model names one, a "take me there" shortcut into the app's
// own navigation — it never invents its own idea of what pages exist.
function HelpBot({ go, nav, user, page }) {
  const toast = useToast();
  const [open,     setOpen]     = useState(false);
  const [messages, setMessages] = useState([
    { role:'assistant',
      content:"Hi — I'm the guide for Liquor Store Social. Ask me how to do something here, or where to find a screen." },
  ]);
  const [input, setInput] = useState('');
  const [busy,  setBusy]  = useState(false);
  const listRef = useRef(null);

  // The manual fallback for when the bot genuinely can't help — files a
  // ticket with the chat transcript attached so nobody has to retype what
  // they already told the bot. An admin works these under Settings.
  const [ticketOpen,  setTicketOpen]  = useState(false);
  const [ticketSub,   setTicketSub]   = useState('');
  const [ticketNote,  setTicketNote]  = useState('');
  const [ticketBusy,  setTicketBusy]  = useState(false);

  const allowedPages = new Set((nav || []).map(n => n.id));

  useEffect(function() {
    if (open && listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, open, busy]);

  // Pulls a trailing marker out of the reply — either a "[[nav:page=x;tab=y]]"
  // shortcut (only kept if that page is one this user can actually reach, so
  // the bot never points someone at a locked door) or a "[[ticket:summary]]"
  // for a request the platform genuinely doesn't do (a newspaper ad, a radio
  // spot — real marketing work, just not built here).
  function parseMarkers(text) {
    const navM = text.match(/\[\[nav:page=([a-z]+)(?:;tab=([a-z]+))?\]\]\s*$/i);
    if (navM) {
      const page  = navM[1].toLowerCase();
      const tab   = navM[2] ? navM[2].toLowerCase() : null;
      const clean = text.slice(0, navM.index).trim();
      if (!allowedPages.has(page)) return { text: clean, navTo: null, ticketHint: null };
      return { text: clean, navTo: { page: page, tab: tab }, ticketHint: null };
    }
    const tM = text.match(/\[\[ticket:([^\[\]]+)\]\]\s*$/i);
    if (tM) {
      const clean = text.slice(0, tM.index).trim();
      return { text: clean, navTo: null, ticketHint: tM[1].trim().slice(0, 120) };
    }
    return { text, navTo: null, ticketHint: null };
  }

  // The model is told to write plain text, but a stray **bold** or "- "
  // list slips through sometimes — this renders those instead of showing
  // the raw asterisks, without pulling in a full markdown parser.
  function renderMsg(text) {
    const boldSplit = s => s.split(/(\*\*[^*]+\*\*)/g).map((part, i) =>
      part.startsWith('**') && part.endsWith('**')
        ? <strong key={i}>{part.slice(2, -2)}</strong>
        : part);

    const blocks = String(text || '').split(/\n{2,}/);
    return blocks.map(function(block, bi) {
      const lines = block.split('\n').filter(l => l.trim());
      const isList = lines.length > 1 && lines.every(l => /^\s*(?:[-•]|\d+[.)])\s+/.test(l));
      if (isList) {
        const ordered = /^\s*\d+[.)]\s+/.test(lines[0]);
        const Tag = ordered ? 'ol' : 'ul';
        return (
          <Tag key={bi} style={{margin: bi ? '8px 0 0' : 0, paddingLeft:'18px', listStyle: ordered ? 'decimal' : 'disc'}}>
            {lines.map((l, li) => (
              <li key={li} style={{marginBottom: li < lines.length-1 ? '3px' : 0}}>
                {boldSplit(l.replace(/^\s*(?:[-•]|\d+[.)])\s+/, ''))}
              </li>
            ))}
          </Tag>
        );
      }
      return (
        <p key={bi} style={{margin: bi ? '8px 0 0' : 0}}>
          {lines.flatMap((l, li) => li ? [<br key={'br'+li}/>, ...boldSplit(l)] : boldSplit(l))}
        </p>
      );
    });
  }

  const send = async function() {
    const q = input.trim();
    if (!q || busy) return;
    const next = messages.concat({ role:'user', content:q });
    setMessages(next);
    setInput('');
    setBusy(true);
    try {
      const r = await callEdge('meta-social', 'assistantChat', {
        messages: next.map(m => ({ role:m.role, content:m.content })),
      });
      const parsed = parseMarkers(r.text || '');
      setMessages(prev => prev.concat({
        role:'assistant',
        content: parsed.text || "Sorry, I didn't catch that — try asking a different way.",
        navTo: parsed.navTo,
        ticketHint: parsed.ticketHint,
      }));
    } catch (e) {
      setMessages(prev => prev.concat({
        role:'assistant', content:"Something went wrong reaching the guide — try again in a moment.",
      }));
    } finally {
      setBusy(false);
    }
  };

  // Opens the ticket form. A preset subject (from the bot recognizing a
  // request this platform doesn't do — a print ad, a radio spot) wins over
  // guessing from the last thing they typed.
  const openTicket = function(presetSubject) {
    const lastQuestion = messages.filter(m => m.role === 'user').slice(-1)[0];
    setTicketSub(presetSubject || (lastQuestion ? lastQuestion.content : ''));
    setTicketNote('');
    setTicketOpen(true);
  };

  const submitTicket = async function() {
    const subject = ticketSub.trim();
    if (!subject || ticketBusy) return;
    setTicketBusy(true);
    try {
      const sb = getSB();
      const transcript = messages
        .filter(m => m.role === 'user' || m.role === 'assistant')
        .map(m => ({ role:m.role, content:m.content }))
        .concat(ticketNote.trim() ? [{ role:'user', content: ticketNote.trim() }] : []);
      const { error } = await sb.from('help_tickets').insert({
        user_id:    user ? user.id : null,
        user_email: user ? user.email : null,
        question:   subject,
        transcript: transcript,
        page:       page || null,
      });
      if (error) throw error;
      setTicketOpen(false);
      setMessages(prev => prev.concat({
        role:'assistant',
        content:"Done — I've filed a ticket with this conversation attached. Someone will follow up with you directly.",
      }));
    } catch (e) {
      toast.error('Could not create the ticket: ' + e.message);
    } finally {
      setTicketBusy(false);
    }
  };

  return (
    <div style={{position:'fixed', right:'20px', bottom:'20px', zIndex:9999}}>
      {open && (
        <div style={{
          width:'360px', maxWidth:'calc(100vw - 40px)', height:'480px', maxHeight:'calc(100vh - 110px)',
          display:'flex', flexDirection:'column', marginBottom:'14px',
          background:'var(--menu)', border:'1px solid var(--line)', borderRadius:'16px',
          boxShadow:'0 12px 40px rgba(0,0,0,.28)', overflow:'hidden',
        }}>
          <div className="flex items-center gap-2 px-4 py-3.5" style={{borderBottom:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.35)'}}>
            <div style={{width:'26px', height:'26px', borderRadius:'50%', background:'var(--cy)', display:'flex', alignItems:'center', justifyContent:'center', flex:'none'}}>
              <Icon name="comment" size={13} style={{color:'#0a0a0a'}}/>
            </div>
            <div>
              <p className="ttl" style={{fontSize:'12.5px', lineHeight:1.2}}>Platform guide</p>
              <p style={{fontSize:'10.5px', color:'var(--txt2)', marginTop:'1px'}}>Ask about the app — not general questions</p>
            </div>
            <span className="flex-1"/>
            {!ticketOpen && (
              <button onClick={openTicket} title="Open a support ticket"
                style={{color:'var(--txt2)'}}>
                <Icon name="tag" size={15}/>
              </button>
            )}
            <button onClick={()=>setOpen(false)} style={{color:'var(--txt2)'}}><Icon name="close" size={15}/></button>
          </div>

          {ticketOpen ? (
            <div className="flex-1 overflow-auto px-4 py-4" style={{display:'flex', flexDirection:'column', gap:'11px'}}>
              <div>
                <p className="ttl" style={{fontSize:'12px'}}>Create a support ticket</p>
                <p style={{fontSize:'11.5px', color:'var(--txt2)', marginTop:'3px', lineHeight:1.4}}>
                  This sends your question and this conversation to the team — a person will follow up with you.
                </p>
              </div>
              <div>
                <label style={{fontSize:'11px', color:'var(--txt2)', display:'block', marginBottom:'4px'}}>What do you need help with?</label>
                <input value={ticketSub} onChange={e=>setTicketSub(e.target.value)}
                  placeholder="Short summary…"
                  className="text-sm px-3 py-2 w-full"
                  style={{background:'var(--void)', border:'1px solid var(--line)', borderRadius:'10px', color:'var(--txt)', outline:'none'}}/>
              </div>
              <div>
                <label style={{fontSize:'11px', color:'var(--txt2)', display:'block', marginBottom:'4px'}}>Anything else to add? (optional)</label>
                <textarea value={ticketNote} onChange={e=>setTicketNote(e.target.value)} rows={4}
                  placeholder="Extra detail, store name, what you tried…"
                  className="text-sm px-3 py-2 w-full"
                  style={{background:'var(--void)', border:'1px solid var(--line)', borderRadius:'10px', color:'var(--txt)', outline:'none', resize:'none'}}/>
              </div>
              <p style={{fontSize:'10.5px', color:'var(--txt3)', lineHeight:1.4}}>
                Your recent conversation with the guide is attached automatically.
              </p>
              <div className="flex gap-2 mt-1">
                <button onClick={()=>setTicketOpen(false)} disabled={ticketBusy}
                  className="flex-1 text-sm font-semibold py-2"
                  style={{borderRadius:'10px', border:'1px solid var(--line)', background:'transparent', color:'var(--txt2)', cursor:'pointer'}}>
                  Cancel
                </button>
                <button onClick={submitTicket} disabled={ticketBusy || !ticketSub.trim()}
                  className="flex-1 text-sm font-semibold py-2"
                  style={{
                    borderRadius:'10px', border:'none', background:'var(--cy)', color:'#0a0a0a', cursor:'pointer',
                    opacity: (ticketBusy || !ticketSub.trim()) ? .5 : 1,
                  }}>
                  {ticketBusy ? 'Sending…' : 'Create ticket'}
                </button>
              </div>
            </div>
          ) : (
          <div ref={listRef} className="flex-1 overflow-auto px-3.5 py-3.5" style={{display:'flex', flexDirection:'column', gap:'12px'}}>
            {messages.map(function(m, i) {
              const isUser = m.role === 'user';
              return (
                <div key={i} style={{display:'flex', justifyContent: isUser ? 'flex-end' : 'flex-start'}}>
                  <div>
                    <div style={{
                      maxWidth:'260px', padding:'9px 12px', fontSize:'13.5px', lineHeight:1.5,
                      borderRadius: isUser ? '13px 13px 3px 13px' : '13px 13px 13px 3px',
                      background: isUser ? 'var(--cy)' : 'var(--void)',
                      color: isUser ? '#0a0a0a' : 'var(--txt)',
                      border: isUser ? 'none' : '1px solid var(--line)',
                      boxShadow: isUser ? 'none' : '0 1px 3px rgba(0,0,0,.06)',
                    }}>
                      {renderMsg(m.content)}
                    </div>
                    {m.navTo && (
                      <button onClick={()=>{ go(m.navTo.page, m.navTo.tab); setOpen(false); }}
                        className="flex items-center gap-1.5"
                        style={{
                          marginTop:'6px', fontSize:'12px', fontWeight:700, padding:'7px 12px',
                          borderRadius:'999px', border:'none', background:'var(--cy)', color:'#0a0a0a',
                          cursor:'pointer', boxShadow:'0 2px 8px rgba(0,0,0,.15)',
                        }}>
                        Take me there <Icon name="fwd" size={11}/>
                      </button>
                    )}
                    {m.ticketHint && (
                      <button onClick={()=>openTicket(m.ticketHint)}
                        className="flex items-center gap-1.5"
                        style={{
                          marginTop:'6px', fontSize:'12px', fontWeight:700, padding:'7px 12px',
                          borderRadius:'999px', border:'1px solid var(--cy)', background:'transparent', color:'var(--cy)',
                          cursor:'pointer',
                        }}>
                        <Icon name="tag" size={11}/> File a ticket: {m.ticketHint}
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
            {busy && (
              <div style={{display:'flex', justifyContent:'flex-start'}}>
                <div style={{padding:'9px 12px', borderRadius:'13px 13px 13px 3px', background:'var(--void)', border:'1px solid var(--line)', color:'var(--txt2)', fontSize:'13px'}}>
                  …
                </div>
              </div>
            )}
          </div>
          )}

          {!ticketOpen && (
            <div className="text-center" style={{padding:'2px 0 8px'}}>
              <button onClick={openTicket}
                className="text-xs font-semibold"
                style={{color:'var(--cy)', background:'transparent', border:'none', cursor:'pointer', textDecoration:'underline'}}>
                Can't find your answer? Open a support ticket
              </button>
            </div>
          )}

          {!ticketOpen && (
          <div className="flex items-center gap-2 px-3 py-3" style={{borderTop:'1px solid var(--line)'}}>
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{ if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
              placeholder="Ask how to do something…" disabled={busy}
              className="flex-1 text-sm px-3 py-2"
              style={{background:'var(--void)', border:'1px solid var(--line)', borderRadius:'10px', color:'var(--txt)', outline:'none'}}/>
            <button onClick={send} disabled={busy || !input.trim()}
              style={{
                width:'34px', height:'34px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flex:'none',
                background:'var(--cy)', color:'#0a0a0a', border:'none', cursor:'pointer',
                opacity: (busy || !input.trim()) ? .4 : 1,
              }}>
              <Icon name="send" size={15}/>
            </button>
          </div>
          )}
        </div>
      )}

      <button onClick={()=>setOpen(v=>!v)} title="Need help finding something?"
        style={{
          width:'52px', height:'52px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
          background:'var(--cy)', color:'#0a0a0a', border:'none', boxShadow:'0 4px 18px rgba(0,0,0,.35)', cursor:'pointer',
        }}>
        <Icon name={open ? 'close' : 'comment'} size={22}/>
      </button>
    </div>
  );
}

// AUTHENTICATED APP (main shell)
// ─────────────────────────────────────────────
function AuthenticatedApp({ user, theme, onTheme, openChangePw }) {
  const toast = useToast();
  const hardcodedAdmin = ADMIN_EMAILS.includes((user && user.email ? user.email : '').toLowerCase());
  const [isAdmin,        setIsAdmin]        = useState(hardcodedAdmin);
  // null = no per-user restriction; an array narrows the nav.
  const [allowedSections, setAllowedSections] = useState(null);
  const [page,           setPage]           = useState('home');
  // Deep links from the home cards into a specific tab of a page.
  const [postsTab, setPostsTab] = useState(null);
  const [adsTab,   setAdsTab]   = useState(null);
  const goHome = (p, t) => {
    if (p === 'posts') setPostsTab(t || null);
    if (p === 'ads')   setAdsTab(t || null);
    setPage(p);
  };
  // A recipe (or anything else) handing the composer a ready image + caption.
  const [composePrefill, setComposePrefill] = useState(null);
  const composeWith = prefill => {
    setComposePrefill(Object.assign({ at: Date.now() }, prefill));
    setPostsTab('compose');
    setPage('posts');
  };
  const [settingsLoaded, setSettingsLoaded] = useState(false);
  const [settings,       setSettings]       = useState({
    tokens: Object.fromEntries(STORES.map(s=>[s.id,''])),
    metaToken:'', anthropicKey:'', openaiKey:'',
  });

  // Load settings + role from Supabase on mount
  useEffect(function() {
    var sb = getSB(); if (!sb) return;
    // Secrets are NOT loaded into the browser. Page tokens live in Edge Function
    // secrets (PT_{page_id}) and the Anthropic key is used server-side by the
    // meta-social `aiWrite` action. Nothing here should ever hold a credential.
    var tMap = Object.fromEntries(STORES.map(function(s) { return [s.id, '']; }));
    setSettings({ tokens:tMap, metaToken:'', anthropicKey:'', openaiKey:'' });
    setSettingsLoaded(true);
    // Check DB role (catches admin accounts not in hardcoded list)
    if (!hardcodedAdmin && user) {
      sb.from('user_roles').select('role, store_id, store_ids, sections').eq('user_id', user.id).maybeSingle()
        .then(function(result) {
          var data = result.data;
          if (data && data.role === 'admin') {
            setIsAdmin(true);
          } else if (data) {
            var ids = (data.store_ids && data.store_ids.length > 0) ? data.store_ids : (data.store_id ? [data.store_id] : []);
            setUserStoreIds(ids);
          }
          // Empty array and null both mean "no restriction set", so an admin
          // clearing every box doesn't accidentally lock someone out entirely.
          if (data && data.sections && data.sections.length) setAllowedSections(data.sections);
        });
    }
  }, []);

  // Credentials are no longer written from the browser. Page tokens and API
  // keys live in Supabase Edge Function secrets, so there is nothing sensitive
  // to persist here.
  const saveSettings = async (s) => {
    setSettings(s);
  };

  const signOut = async () => {
    await getSB().auth.signOut();
    window.location.reload();
  };

  // Change-password modal (also auto-opens when arriving via reset email link)
  const [showChangePw,   setShowChangePw]   = useState(openChangePw || false);
  const [changePwVal,    setChangePwVal]     = useState('');
  const [changePwConf,   setChangePwConf]   = useState('');
  const [changePwSaving, setChangePwSaving] = useState(false);
  const [showUserMenu,   setShowUserMenu]   = useState(false);

  const doChangePassword = async () => {
    if (changePwVal.length < 8)          { toast.error('Password must be at least 8 characters'); return; }
    if (changePwVal !== changePwConf)    { toast.error('Passwords do not match'); return; }
    setChangePwSaving(true);
    try {
      const { error } = await getSB().auth.updateUser({ password: changePwVal });
      if (error) throw error;
      toast.success('Password updated!');
      setShowChangePw(false); setChangePwVal(''); setChangePwConf('');
    } catch(e) { toast.error(e.message); }
    finally { setChangePwSaving(false); }
  };

  // Store assignments for non-hardcoded non-admin users (loaded above in combined effect)
  const [userStoreIds, setUserStoreIds] = useState([]);

  // "View as": an admin borrowing another user's nav, sections and stores to
  // see what they see. Purely a lens — every server call still runs as the
  // real signed-in admin, so this previews navigation, not permissions.
  const [viewAs, setViewAs] = useState(null);   // {email, role, sections, storeIds}
  const effIsAdmin  = viewAs ? viewAs.role === 'admin' : isAdmin;
  const effSections = viewAs
    ? ((viewAs.sections && viewAs.sections.length) ? viewAs.sections : null)
    : allowedSections;
  const effStoreIds = viewAs ? (viewAs.storeIds || []) : userStoreIds;

  // Products and Ads can be handed to a non-admin explicitly. Brand and
  // Settings stay admin-only: one changes how every store's artwork looks, the
  // other holds the tokens and the user list.
  const granted = id => effIsAdmin || (effSections ? effSections.indexOf(id) !== -1 : false);

  // A per-user list narrows what the role already allows; it can never widen
  // it. Settings is always kept, or an admin could lock themselves out of the
  // screen that undoes it; Home is always kept because it self-filters.
  const navAllowed = id =>
    (!effSections || id === 'settings' || id === 'home' || effSections.includes(id));

  // The nav, grouped: the three everyday destinations stay top-level, the
  // rest fold into small menus so the bar reads instead of sprawling.
  const NAV_ITEMS = {
    home:      { id:'home',      icon:'star',    label:'Home' },
    posts:     { id:'posts',     icon:'note',    label:'Social' },
    features:  { id:'features',  icon:'tag',     label:'Features' },
    reviews:   { id:'reviews',   icon:'star',    label:'Reviews' },
    shelf:     { id:'shelf',     icon:'print',   label:'Shelf Talkers' },
    creatives: { id:'creatives', icon:'image',   label:'Creatives' },
    recipes:   { id:'recipes',   icon:'cocktail',label:'Recipes' },
    website:   { id:'website',   icon:'globe',   label:'Website' },
    signage:   { id:'signage',   icon:'grid',    label:'Signage' },
    ads:       { id:'ads',       icon:'mega',    label:'Ads' },
    prices:    { id:'prices',    icon:'search',  label:'Price Check' },
    products:  { id:'products',  icon:'package', label:'Products' },
    brand:     { id:'brand',     icon:'palette', label:'Brand' },
    radar:     { id:'radar',     icon:'search',  label:'Market Radar' },
    settings:  { id:'settings',  icon:'gear',    label:'Settings' },
  };
  const pick = ids => ids.map(i => NAV_ITEMS[i]).filter(t =>
    navAllowed(t.id)
    && (['signage','products','ads'].includes(t.id) ? granted(t.id) : true)
    && (['brand','settings','radar'].includes(t.id) ? effIsAdmin : true));

  const navGroups = [
    { kind:'link',  item: NAV_ITEMS.home },
    ...pick(['posts','features','reviews']).map(item => ({ kind:'link', item })),
    { kind:'menu', id:'create',  icon:'palette', label:'Create',  items: pick(['shelf','creatives','recipes']) },
    { kind:'menu', id:'publish', icon:'globe',   label:'Publish', items: pick(['website','signage','ads']) },
    { kind:'menu', id:'catalog', icon:'package', label:'Catalogue', items: pick(['prices','products']) },
    { kind:'menu', id:'admin',   icon:'gear',    label:'Admin',   items: pick(['brand','radar','settings']) },
  ].filter(g => g.kind === 'link' || g.items.length > 0);
  const [openMenu, setOpenMenu] = useState(null);

  // Everything reachable, flat — for the "am I still allowed here" fallback.
  const nav = navGroups.flatMap(g => g.kind === 'link' ? [g.item] : g.items);

  // If the section you were on is no longer permitted — access changed, or a
  // stale link — land somewhere real rather than rendering a blank shell.
  useEffect(function() {
    if (!nav.length) return;
    if (!nav.some(t => t.id === page)) setPage(nav[0].id);
  }, [allowedSections, isAdmin, viewAs, page]);

  if (!settingsLoaded) return (
    <div className="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900">
      <div className="text-center"><div className="mb-3 flex justify-center"><Icon name="whisky" size={44} style={{color:"var(--cy)"}}/></div><p className="text-gray-500 dark:text-gray-400 text-sm animate-pulse">Loading settings…</p></div>
    </div>
  );

  return (
    <div className="min-h-screen flex flex-col bg-gray-100 dark:bg-gray-900 transition-colors">
      {/* On Home the cards are the navigation, so the bar stays out of the
          scene — it returns on every other page. */}
      {page !== 'home' && (
      <header className="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
          <div className="flex items-center gap-2.5 cursor-pointer" onClick={()=>setPage('home')}
               title="Home">
            <img src="https://yyveikxfomxmedlxsulh.supabase.co/storage/v1/object/public/creatives/website/sueno-logo.png" alt="The Sueño Company" style={{height:'38px', width:'auto'}}
                 onError={e=>{ e.target.style.display='none'; }}/>
            <div>
              <p className="text-sm font-bold text-gray-900 dark:text-white leading-none">Liquor Store Social</p>
              <p className="text-xs text-gray-400 leading-none mt-0.5">The Sueño Company · 4 locations</p>
            </div>
          </div>
          <div className="flex items-center gap-1">
            {navGroups.map(function(g) {
              if (g.kind === 'link') {
                const n = g.item;
                return (
                  <button key={n.id} onClick={()=>{ setOpenMenu(null); setPage(n.id); }}
                    className={`px-3 py-2 rounded-xl text-sm font-semibold transition-all ${page===n.id?'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300':'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-gray-200'}`}>
                    <Icon name={n.icon} size={15} className="mr-2"/><span className="hidden sm:inline">{n.label}</span>
                  </button>
                );
              }
              const active = g.items.some(t => t.id === page);
              return (
                <div key={g.id} className="relative">
                  <button onClick={()=>setOpenMenu(openMenu === g.id ? null : g.id)}
                    className={`px-3 py-2 rounded-xl text-sm font-semibold transition-all ${active?'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300':'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-gray-200'}`}>
                    <Icon name={g.icon} size={15} className="mr-2"/>
                    <span className="hidden sm:inline">{active ? (g.items.find(t=>t.id===page)||{}).label : g.label}</span>
                    <Icon name="down" size={10} className="ml-1.5" style={{opacity:.6}}/>
                  </button>
                  {openMenu === g.id && (
                    <React.Fragment>
                      <div className="fixed inset-0 z-40" onClick={()=>setOpenMenu(null)}/>
                      <div className="absolute left-0 top-full mt-1 w-48 bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-100 dark:border-gray-700 z-50 overflow-hidden">
                        {g.items.map(t=>(
                          <button key={t.id} onClick={()=>{ setOpenMenu(null); setPage(t.id); }}
                            className={`w-full text-left px-3 py-2.5 text-sm font-medium flex items-center gap-2 ${page===t.id?'text-indigo-600 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/30':'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                            <Icon name={t.icon} size={14}/>{t.label}
                          </button>
                        ))}
                      </div>
                    </React.Fragment>
                  )}
                </div>
              );
            })}
            
            {/* Day / night toggle */}
            <button onClick={()=>onTheme(theme==='light' ? 'dark' : 'light')}
                    className="p-2 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                    title={theme==='light' ? 'Switch to dark' : 'Switch to light'}
                    aria-label={theme==='light' ? 'Switch to dark theme' : 'Switch to light theme'}>
              <Icon name={theme==='light' ? 'moon' : 'sun'}/>
            </button>

            {/* User menu */}
            <div className="relative ml-1">
              <button onClick={()=>setShowUserMenu(function(v){return !v;})} className="p-2 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"><Icon name="user"/></button>
              {showUserMenu && (
                <div className="absolute right-0 top-full mt-1 w-52 bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-100 dark:border-gray-700 z-50 overflow-hidden">
                  <div className="px-3 py-2 border-b border-gray-100 dark:border-gray-700">
                    <p className="text-xs text-gray-500 dark:text-gray-400 truncate">{user ? user.email : ''}</p>
                  </div>
                  <button onClick={()=>{setShowUserMenu(false);setShowChangePw(true);}} className="w-full text-left px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700">
                    <Icon name="key"/> Change Password
                  </button>
                  <button onClick={()=>{setShowUserMenu(false);signOut();}} className="w-full text-left px-3 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-50 dark:hover:bg-gray-700">
                    Sign Out
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      </header>
      )}

      {/* Change Password Modal */}
      {showChangePw && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={()=>setShowChangePw(false)}>
          <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm" onClick={function(e){e.stopPropagation();}}>
            <h2 className="text-base font-bold text-gray-900 dark:text-white mb-4">Change Password</h2>
            <div className="space-y-3">
              <div>
                <Label>New Password</Label>
                <Input type="password" value={changePwVal} onChange={function(e){setChangePwVal(e.target.value);}} placeholder="Min 8 characters"/>
              </div>
              <div>
                <Label>Confirm Password</Label>
                <Input type="password" value={changePwConf} onChange={function(e){setChangePwConf(e.target.value);}} placeholder="Re-enter new password"
                  onKeyDown={function(e){if(e.key==='Enter') doChangePassword();}}/>
              </div>
            </div>
            <div className="flex gap-2 mt-5">
              <Button onClick={doChangePassword} loading={changePwSaving} className="flex-1">Save Password</Button>
              <Button variant="secondary" onClick={()=>setShowChangePw(false)} className="flex-1">Cancel</Button>
            </div>
          </div>
        </div>
      )}

      {viewAs && (
        <div className="sticky z-40 flex items-center gap-3 px-4 py-2"
             style={{top:'56px', background:'rgba(255,176,32,.12)', borderBottom:'1px solid var(--amb)'}}>
          <Icon name="eye" size={13} style={{color:'var(--amb)'}}/>
          <span className="text-xs" style={{color:'var(--amb)'}}>
            Viewing as {viewAs.email} — menus and stores match their access. Actions still run as you.
          </span>
          <span className="flex-1"/>
          <button onClick={()=>setViewAs(null)} className="text-xs font-semibold px-2 py-1"
                  style={{border:'1px solid var(--amb)', color:'var(--amb)'}}>
            Exit view
          </button>
        </div>
      )}

      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
        {page==='home'                   && <HomePage granted={granted} isAdmin={effIsAdmin} go={goHome}/>}
        {page==='posts'                  && <PostsPage       key={'pt-'+(postsTab||'x')+'-'+(composePrefill?composePrefill.at:0)}
                                             initialTab={postsTab} prefill={composePrefill}
                                             settings={settings} userStoreIds={effIsAdmin ? [] : effStoreIds} isAdmin={effIsAdmin}/>}
        {page==='shelf'                  && <ShelfTalkerPage isAdmin={effIsAdmin} userStoreIds={effIsAdmin ? [] : effStoreIds} userId={user ? user.id : null}/>}
        {page==='creatives'              && <CreativeLibrary isAdmin={effIsAdmin}
                                             myStores={effIsAdmin ? STORES : STORES.filter(st=>effStoreIds.includes(st.id))}/>}
        {page==='features'               && <FeaturesPage isAdmin={effIsAdmin}
                                             myStores={STORES}
                                             editableIds={effIsAdmin ? null : effStoreIds}/>}
        {page==='website'                && <WebsitePage editableIds={effIsAdmin ? null : effStoreIds}/>}
        {page==='prices'                 && <PriceCheckPage isAdmin={effIsAdmin}/>}
        {page==='signage' && granted('signage') && <SignagePage/>}
        {page==='recipes'                && <RecipesPage isAdmin={effIsAdmin} onCompose={composeWith}
                                             myStores={effIsAdmin ? STORES : STORES.filter(st=>effStoreIds.includes(st.id))}/>}
        {page==='products' && granted('products') && <ProductLibrary/>}
        {page==='ads'      && granted('ads')      && <AdsPage key={'at-'+(adsTab||'x')} initialTab={adsTab} settings={settings}/>}
        {page==='brand'    && effIsAdmin && <BrandPage        settings={settings}/>}
        {page==='radar'    && effIsAdmin && <MarketRadarPage/>}
        {page==='reviews'                && <ReviewsPage isAdmin={effIsAdmin}/>}
        {page==='settings' && effIsAdmin && <SettingsPage     settings={settings} onSave={saveSettings} currentUserId={user ? user.id : null}
                                             onViewAs={isAdmin ? setViewAs : null} theme={theme} onTheme={onTheme}/>}
      </main>
      <footer className="text-center py-3 text-xs text-gray-300 dark:text-gray-600">
        Liquor Store Social · Supabase · Graph API v25.0 · {user && user.email ? user.email : ''}
      </footer>

      <HelpBot go={goHome} nav={nav} user={user} page={page}/>
    </div>
  );
}

// ─────────────────────────────────────────────
// ROOT APP (auth routing)
// ─────────────────────────────────────────────
function App() {
  // 'dark' (the HUD look) or 'light' (day). The Tailwind `dark` class stays
  // on regardless — its dark: variants are remapped to CSS vars in the
  // stylesheet, and those vars are what actually flip with data-theme.
  const [theme,     setTheme]     = useState(()=>ls.get('smm_theme','dark'));
  const [authState, setAuthState] = useState('checking');
  const [user,      setUser]      = useState(null);
  const [recovery,  setRecovery]  = useState(false);

  // A one-time login link (?login=TOKEN): redeeming it happens once, up
  // front, before anything else renders — null once it's out of the way
  // (either there was no token, or it finished and onAuthStateChange took
  // over), 'redeeming' while in flight, or an error string if the link
  // turned out to be used, expired, or revoked.
  const [loginLinkState, setLoginLinkState] = useState(null);

  useEffect(()=>{
    document.documentElement.classList.add('dark');
    document.documentElement.setAttribute('data-theme', theme);
    ls.set('smm_theme', theme);
  },[theme]);

  useEffect(function() {
    const token = new URLSearchParams(window.location.search).get('login');
    if (!token) return;
    setLoginLinkState('redeeming');
    (async function() {
      try {
        const resp = await fetch(SUPABASE_URL + '/functions/v1/meta-social', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + SUPABASE_KEY },
          body: JSON.stringify({ action:'redeemLoginLink', token: token }),
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        const sb = getSB();
        const { error } = await sb.auth.verifyOtp({ token_hash: data.token_hash, type:'magiclink' });
        if (error) throw error;
        // Strip ?login=... so a refresh doesn't try to redeem an already-used
        // link and show a scary error on a page that's actually fine now.
        window.history.replaceState({}, '', window.location.pathname);
        setLoginLinkState(null);
      } catch(e) {
        setLoginLinkState('error:' + e.message);
      }
    })();
  }, []);

  useEffect(()=>{
    const sb=getSB(); if(!sb) return;
    sb.auth.getSession().then(function(res) {
      var session = res.data.session;
      setUser(session ? session.user : null);
      setAuthState(session ? 'authed' : 'anon');
    });
    const sub = sb.auth.onAuthStateChange(function(event, session) {
      if (event === 'PASSWORD_RECOVERY') {
        setRecovery(true);
        setUser(session ? session.user : null);
        setAuthState('authed');
        return;
      }
      setUser(session ? session.user : null);
      setAuthState(session ? 'authed' : 'anon');
      if (event === 'USER_UPDATED') setRecovery(false);
    });
    return function() { sub.data.subscription.unsubscribe(); };
  },[]);

  if (loginLinkState === 'redeeming') return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
      <div className="text-center"><div className="mb-3 flex justify-center"><Icon name="whisky" size={44} style={{color:"var(--cy)"}}/></div><p className="text-gray-400 text-sm animate-pulse">Signing you in…</p></div>
    </div>
  );

  if (typeof loginLinkState === 'string' && loginLinkState.startsWith('error:')) return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 px-4">
      <div className="text-center max-w-sm">
        <div className="mb-3 flex justify-center"><Icon name="warn" size={40} style={{color:'var(--red)'}}/></div>
        <p className="text-gray-200 text-sm font-semibold mb-1">This link didn't work</p>
        <p className="text-gray-400 text-xs mb-5">{loginLinkState.slice(6)}</p>
        <button onClick={()=>{ window.history.replaceState({}, '', window.location.pathname); setLoginLinkState(null); }}
          className="text-xs font-semibold px-4 py-2" style={{border:'1px solid var(--line)', color:'var(--cy)'}}>
          Go to login
        </button>
      </div>
    </div>
  );

  if (authState==='checking') return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
      <div className="text-center"><div className="mb-3 flex justify-center"><Icon name="whisky" size={44} style={{color:"var(--cy)"}}/></div><p className="text-gray-400 text-sm animate-pulse">Connecting…</p></div>
    </div>
  );

  if (authState==='anon') return (
    <ToastProvider>
      <LoginScreen/>
    </ToastProvider>
  );

  return (
    <ToastProvider>
      <AuthenticatedApp user={user} theme={theme} onTheme={setTheme} openChangePw={recovery}/>
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
