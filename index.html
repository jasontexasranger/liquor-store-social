      background-attachment:fixed;

    ::-webkit-scrollbar-thumb{background:rgba(56,224,240,.28)}
    ::-webkit-scrollbar-thumb:hover{background:var(--cy)}
    .line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .hud{position:relative;background:var(--panel);border:1px solid var(--line);
      backdrop-filter:blur(7px);
      clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
      box-shadow:inset 0 1px 0 rgba(56,224,240,.09),0 0 34px rgba(0,0,0,.5)}
    .hud::before{content:'';position:absolute;top:0;left:13px;right:0;height:1px;
      background:linear-gradient(90deg,var(--cy),transparent 70%);opacity:.5}
    .hud-brk::after{content:'';position:absolute;top:6px;right:6px;width:9px;height:9px;
      border:1px solid var(--cy);border-left:0;border-bottom:0;opacity:.45}
    .clip{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
    .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--cy-dim)}
    .ttl{font-size:12.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--cy)}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .glow{box-shadow:0 0 8px currentColor}
    .pulse{animation:hudpulse 2s ease-in-out infinite}
    @keyframes hudpulse{50%{opacity:.35}}
    .scan{position:relative;overflow:hidden}
    .scan::after{content:'';position:absolute;left:0;right:0;height:34%;top:-40%;
      background:linear-gradient(180deg,transparent,rgba(56,224,240,.07),transparent);
      animation:sweep 5.5s ease-in-out infinite}
    @keyframes sweep{0%{top:-40%}100%{top:120%}}
    input,textarea,select{font-family:var(--disp)}
    input::placeholder,textarea::placeholder{color:var(--txt3)}
    select option{background:#0a111e;color:var(--txt)}
    ::selection{background:rgba(56,224,240,.3);color:#fff}

    html{color-scheme:dark}
    .dark .dark\:bg-gray-900,.dark .dark\:bg-gray-950{background-color:transparent!important}
    .dark .dark\:bg-gray-800{background-color:var(--panel)!important}

// ─────────────────────────────────────────────
// EDGE FUNCTION CALLER
// All Meta API calls go through server-side edge functions so that
// tokens / system-user secrets never touch the browser.
// ─────────────────────────────────────────────
async function callEdge(funcName, action, params) {
  const sb = getSB();
  var sessionData = await sb.auth.getSession();
  var session = sessionData.data.session;
  if (!session) throw new Error('Not authenticated');
  var resp = await fetch(SUPABASE_URL + '/functions/v1/' + funcName, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token,
    },
    body: JSON.stringify(Object.assign({ action: action }, params || {})),
  });
  var data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// Upload an image (File object or data-URL string) to Supabase Storage
// and return the public URL.  Called from PostComposer before publishing.
async function uploadImageToStorage(fileOrDataUrl) {
  // Already a hosted URL (e.g. picked from the Creative Library) — reuse it
  // rather than round-tripping the bytes through Storage again.
  if (typeof fileOrDataUrl === 'string' && /^https?:\/\//.test(fileOrDataUrl)) {
    return fileOrDataUrl;
  }
  var sb = getSB();
  var sessionData = await sb.auth.getSession();
  var session = sessionData.data.session;
  if (!session) throw new Error('Not authenticated');

  var blob, ext;
  if (typeof fileOrDataUrl === 'string' && fileOrDataUrl.startsWith('data:')) {
    // Convert data URL to Blob
    var arr = fileOrDataUrl.split(',');
    var mime = arr[0].match(/:(.*?);/)[1];
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bstr.charCodeAt(i);
    blob = new Blob([u8], { type: mime });
    ext = mime.split('/')[1] || 'jpg';
  } else {
    blob = fileOrDataUrl;
    ext = (fileOrDataUrl.name || 'image').split('.').pop() || 'jpg';
  }

  var userId = session.user.id;
  var filename = userId + '/' + Date.now() + '.' + ext;

  var uploadResult = await sb.storage.from('post-images').upload(filename, blob, {
    contentType: blob.type || 'image/jpeg',
    upsert: false,
  });
  if (uploadResult.error) throw new Error(uploadResult.error.message);

  var urlResult = sb.storage.from('post-images').getPublicUrl(filename);
  return urlResult.data.publicUrl;
}

const ASPECTS = [
  { id:'1:1',    label:'Square',    ratio:1/1,      hint:'1080 × 1080',  surfaces:['post','ad'] },
  { id:'3:5',    label:'Portrait',  ratio:3/5,      hint:'1080 × 1800',  surfaces:['post','ad'] },
  { id:'16:9',   label:'Landscape', ratio:16/9,     hint:'1920 × 1080',  surfaces:['ad'] },
  { id:'1.91:1', label:'Link',      ratio:1.91/1,   hint:'1200 × 628',   surfaces:['ad'] },
];
const POST_ASPECTS = ASPECTS.filter(a=>a.surfaces.includes('post')).map(a=>a.id);
const AD_ASPECTS   = ASPECTS.map(a=>a.id);
const aspectMeta   = id => ASPECTS.find(a=>a.id===id) || ASPECTS[0];

// Ratio tolerance — a 1080x1082 export shouldn't be called wrong.
const RATIO_TOLERANCE = 0.04;
function ratioCheck(w, h, aspectId) {
  if (!w || !h) return { ok:true };
  const want = aspectMeta(aspectId).ratio;
  const got  = w / h;
  const off  = Math.abs(got - want) / want;
  if (off <= RATIO_TOLERANCE) return { ok:true };
  const near = ASPECTS.reduce((b,a)=>
    Math.abs(got-a.ratio)/a.ratio < Math.abs(got-b.ratio)/b.ratio ? a : b, ASPECTS[0]);
  return { ok:false, got, near:near.id, pct:Math.round(off*100) };
}

function readImageSize(file) {
  return new Promise(function(resolve) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { resolve({ w:img.naturalWidth, h:img.naturalHeight }); URL.revokeObjectURL(url); };
    img.onerror = () => { resolve({ w:0, h:0 }); URL.revokeObjectURL(url); };
    img.src = url;
  });
}

function useCampaigns() {
  const [campaigns, setCampaigns] = useState([]);
  const [loading, setLoading] = useState(true);
  const reload = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('campaigns').select('*').order('created_at',{ascending:false});
    setCampaigns(data || []); setLoading(false);
  }, []);
  useEffect(function(){ reload(); }, [reload]);

  const create = async function(fields) {
    const sb = getSB();
    const { data:{ user } } = await sb.auth.getUser();
    const { error } = await sb.from('campaigns').insert({ ...fields, created_by:user?.id });
    if (error) throw error;
    await reload();
  };
  const update = async function(id, fields) {
    const sb = getSB();
    const { error } = await sb.from('campaigns').update(fields).eq('id', id);
    if (error) throw error;
    await reload();
  };
  return { campaigns, loading, reload, create, update };
}

function useCreatives() {
  const [creatives, setCreatives] = useState([]);
  const [loading, setLoading] = useState(true);
  const reload = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('creatives').select('*').order('created_at',{ascending:false});
    setCreatives(data || []); setLoading(false);
  }, []);
  useEffect(function(){ reload(); }, [reload]);

  const upload = async function(file, meta) {
    const sb = getSB();
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Not authenticated');
    const size = await readImageSize(file);
    const ext  = (file.name||'image').split('.').pop() || 'jpg';
    const path = session.user.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;

    const up = await sb.storage.from('creatives').upload(path, file, {
      contentType: file.type || 'image/jpeg', upsert:false,
    });
    if (up.error) throw new Error(up.error.message);
    const url = sb.storage.from('creatives').getPublicUrl(path).data.publicUrl;

    const { error } = await sb.from('creatives').insert({
      name: meta.name, campaign_id: meta.campaignId || null, store_id: meta.storeId || null,
      aspect: meta.aspect, storage_path: path, public_url: url,
      width: size.w, height: size.h, bytes: file.size, mime: file.type,
      created_by: session.user.id,
    });
    if (error) { await sb.storage.from('creatives').remove([path]); throw error; }
    await reload();
  };

  const remove = async function(c) {
    const sb = getSB();
    await sb.storage.from('creatives').remove([c.storage_path]);
    const { error } = await sb.from('creatives').delete().eq('id', c.id);
    if (error) throw error;
    await reload();
  };
  return { creatives, loading, reload, upload, remove };
}

              return (
                <div key={c.id} className="hud p-0 overflow-hidden group relative">
                  <div className="w-full" style={{aspectRatio:String(aspectMeta(c.aspect).ratio), background:'rgba(4,8,16,.7)'}}>
                    <img src={c.public_url} alt={c.name} className="w-full h-full object-cover"/>
                  </div>
                  <button onClick={()=>del(c)}
                    className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity p-1.5"
                    style={{background:'rgba(2,5,11,.85)', color:'var(--red)', border:'1px solid var(--red)'}}
                    aria-label={'Delete '+c.name}>

                    {cp && <p className="lbl mt-1.5 truncate">{cp.name}</p>}

        )}

      {showUp && <UploadCreativeModal campaigns={campaigns} myStores={myStores}
                    onClose={()=>setShowUp(false)} onUpload={upload}/>}
    </div>
  );

// Renders a blank template image and fills only the boxes an admin positioned.
// Nothing is invented — badges and panels that are baked into the artwork stay
// baked, which is what the hardcoded renderer got wrong.
const AD_FIELD_KEYS = [
  { key:'product_name',  label:'Product name',  type:'text',          hint:'e.g. CORONA EXTRA' },
  { key:'pack_size',     label:'Pack / size',   type:'text',          hint:'e.g. 12 PACK · 355ml' },
  { key:'price',         label:'Price',         type:'text',          hint:'e.g. 18.99' },
  { key:'save',          label:'Save amount',   type:'text',          hint:'e.g. $3.00' },
  { key:'product_image', label:'Product photo', type:'product_image', hint:'Bottle / pack shot' },
  { key:'custom',        label:'Custom text',   type:'text',          hint:'Anything else' },
];

const AD_FIELD_DEFAULTS = {
  field_key:'custom', field_type:'text', label:'New field',
  align:'left', valign:'top', color:'#1b365d', bold:true, uppercase:true,
  font_family:'Anton', font_weight:400, padding_pct:2,
  prefix_scale:55, prefix_valign:'middle', suffix_scale:35, suffix_valign:'bottom',
  wrap:true, max_lines:2, min_font_size:8, max_font_size:200,
  line_spacing:1.15, prefix:'', suffix:'',
  fit_mode:'contain', remove_bg:true,
};

function useAdTemplateFields(templateId) {
  const [fields, setFields] = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(async () => {
    if (!templateId) { setFields([]); return; }
    const sb=getSB(); if(!sb) return;
    setLoading(true);
    const { data } = await sb.from('ad_template_fields')
      .select('*').eq('template_id', templateId).order('field_order');
    // Rows saved before a column existed come back with nulls. Merging the
    // defaults means an old field renders — and displays in the editor — the
    // same as a freshly created one.
    const merged = (data || []).map(f => {
      const out = { ...AD_FIELD_DEFAULTS, ...f };
      for (const k of Object.keys(AD_FIELD_DEFAULTS)) {
        if (out[k] === null || out[k] === undefined) out[k] = AD_FIELD_DEFAULTS[k];
      }
      return out;
    });
    setFields(merged);
    setLoading(false);
  }, [templateId]);

  useEffect(()=>{ load(); }, [load]);

  const save = async (list) => {
    const sb=getSB(); if(!sb) throw new Error('Not connected');
    await sb.from('ad_template_fields').delete().eq('template_id', templateId);
    if (list.length) {
      const rows = list.map((f,i) => {
        const { id:_a, created_at:_b, template_id:_c, ...rest } = f;
        return { ...rest, template_id: templateId, field_order: i };
      });
      const { error } = await sb.from('ad_template_fields').insert(rows);
      if (error) throw error;
    }
    await load();
  };

  return { fields, loading, save, reload: load };
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Could not load image'));
    i.src = src;
  });
}

// Draw an image inside a box without distorting it.
function drawImageFitted(ctx, img, box, mode) {
  const ir = img.width / img.height;
  const br = box.w / box.h;
  let dw, dh;
  if (mode === 'cover' ? ir > br : ir < br) { dh = box.h; dw = dh * ir; }
  else                                      { dw = box.w; dh = dw / ir; }
  const dx = box.x + (box.w - dw) / 2;
  const dy = box.y + (box.h - dh) / 2;
  ctx.save();
  if (mode === 'cover') { ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip(); }
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

async function renderFieldTemplate(tpl, fields, values, productDataUrl, onStep) {
  const W = tpl.canvas_w || 1080;
  const H = tpl.canvas_h || 1080;
  await ensureFontsReady();

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if (tpl.data) {
    const bg = await loadImg(tpl.data);
    ctx.drawImage(bg, 0, 0, W, H);
  }

  const imageFields = fields.filter(f => f.field_type === 'product_image');
  let productImg = null;
  if (productDataUrl && imageFields.length) {
    let src = productDataUrl;
    if (imageFields.some(f => f.remove_bg)) {
      if (onStep) onStep('removing');
      try { src = await removeProductBackground(productDataUrl); } catch(e) { /* keep original */ }
    }
    try { productImg = await loadImg(src); }
    catch(e) {
      // Better to fail loudly than hand back an ad with an empty product box.
      throw new Error('Could not load the product image. If it was imported, check the product-media bucket is public.');
    }
  }

  if (onStep) onStep('compositing');

  const overflows = [];
  const sorted = [...fields].sort((a,b)=>(a.field_order||0)-(b.field_order||0));
  for (const f of sorted) {
    const box = {
      x: Number(f.x_pct)/100*W, y: Number(f.y_pct)/100*H,
      w: Number(f.w_pct)/100*W, h: Number(f.h_pct)/100*H,
    };

    if (f.field_type === 'product_image') {
      if (productImg) drawImageFitted(ctx, productImg, box, f.fit_mode || 'contain');
      continue;
    }

    let text = values[f.field_key];
    if (text == null || text === '') continue;
    text = String(text);
    if (f.uppercase) text = text.toUpperCase();

    const res = drawTextField(ctx, text, box, {
      align: f.align || 'left',
      valign: f.valign || 'top',
      color: f.color || '#000000',
      bold: !!f.bold,
      lineSpacing: Number(f.line_spacing) || 1.15,
      wrap: f.wrap !== false,
      maxLines: f.max_lines || null,
      minFontSize: f.min_font_size || 8,
      maxFontSize: f.max_font_size || 200,
      prefix: f.prefix || '',
      prefixScale: (f.prefix_scale ?? 55) / 100,
      prefixValign: f.prefix_valign || 'middle',
      suffix: f.suffix || '',
      suffixScale: (f.suffix_scale ?? 35) / 100,
      suffixValign: f.suffix_valign || 'bottom',
      fontFamily: fontStack(f.font_family),
      fontWeight: f.font_weight || null,
      // Breathing room so glyphs never sit flush against the clip edge.
      padding: Math.round(Math.min(box.w, box.h) * ((f.padding_pct ?? 2) / 100)),
    });
    if (res && res.overflow) overflows.push(f.label || f.field_key);
  }

  const url = canvas.toDataURL('image/png');
  // Attach non-fatally so callers that just want the image still work.
  try { url.overflows = overflows; } catch(e) {}
  return overflows.length ? { url, overflows } : url;
}

function AdFieldEditor({ templateDataUrl, fields, onChange }) {
  const boxRef = useRef();
  const [sel, setSel] = useState(null);
  const [drag, setDrag] = useState(null);
  const [draw, setDraw] = useState(null);

  const rel = (e) => {
    const r = boxRef.current.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*100, y:(e.clientY-r.top)/r.height*100 };
  };
  const patch = (id, f) => onChange(fields.map(x=>x.id===id?{...x,...f}:x));
  const del   = (id) => { onChange(fields.filter(x=>x.id!==id)); setSel(null); };

  const onDown = (e) => {
    if (e.target !== boxRef.current && !e.target.dataset.canvas) return;
    const { x, y } = rel(e); setDraw({ x, y }); setSel(null);
  };
  const onMove = (e) => {
    if (drag) {
      const { x, y } = rel(e);
      const dx = x-drag.sx, dy = y-drag.sy, o = drag.orig;
      if (drag.mode==='move') patch(drag.id,{ x_pct:Math.max(0,Math.min(100-o.w_pct,o.x_pct+dx)), y_pct:Math.max(0,Math.min(100-o.h_pct,o.y_pct+dy)) });
      else patch(drag.id,{ w_pct:Math.max(3,Math.min(100-o.x_pct,o.w_pct+dx)), h_pct:Math.max(2,Math.min(100-o.y_pct,o.h_pct+dy)) });
    }
  };
  const onUp = (e) => {
    if (draw) {
      const { x, y } = rel(e);
      const w = Math.abs(x-draw.x), h = Math.abs(y-draw.y);
      if (w>3 && h>2) {
        const nf = { id:'new_'+Date.now(), ...AD_FIELD_DEFAULTS,
          x_pct:Math.min(x,draw.x), y_pct:Math.min(y,draw.y), w_pct:w, h_pct:h,
          label:'Field '+(fields.length+1) };
        onChange([...fields, nf]); setSel(nf.id);
      }
      setDraw(null);
    }
    setDrag(null);
  };

  const cur = fields.find(f=>f.id===sel);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2">
        <p className="lbl mb-2">Drag on the template to add a field · click one to edit it</p>
        <div ref={boxRef} data-canvas="1" onMouseDown={onDown} onMouseMove={onMove}
             onMouseUp={onUp} onMouseLeave={onUp}
             className="relative select-none"
             style={{ border:'1px solid var(--line)', cursor:'crosshair', lineHeight:0 }}>
          <img src={templateDataUrl} alt="" className="w-full block pointer-events-none"/>
          {fields.map(f=>{
            const on = f.id===sel;
            const img = f.field_type==='product_image';
            const c = img ? 'var(--amb)' : 'var(--cy)';
            return (
              <div key={f.id}
                onMouseDown={e=>{e.stopPropagation();setSel(f.id);const r=rel(e);setDrag({id:f.id,mode:'move',sx:r.x,sy:r.y,orig:{...f}});}}
                className="absolute"
                style={{ left:f.x_pct+'%', top:f.y_pct+'%', width:f.w_pct+'%', height:f.h_pct+'%',
                         border:'1px '+(img?'dashed':'solid')+' '+c,
                         background: on ? 'rgba(56,224,240,.14)' : 'rgba(56,224,240,.05)',
                         cursor:'move', boxShadow: on ? '0 0 12px rgba(56,224,240,.35)' : 'none' }}>
                <span className="mono absolute -top-4 left-0 whitespace-nowrap"
                      style={{ fontSize:'9px', color:c }}>{f.label}</span>
                {!img && (
                  <span className="absolute inset-0 flex items-center overflow-hidden pointer-events-none px-0.5"
                        style={{
                          fontFamily: fontStack(f.font_family),
                          fontWeight: f.font_weight || 400,
                          color: f.color || '#000',
                          fontSize: 'clamp(8px, 2.2vw, 22px)',
                          textTransform: f.uppercase ? 'uppercase' : 'none',
                          justifyContent: f.align==='center' ? 'center' : f.align==='right' ? 'flex-end' : 'flex-start',
                          opacity:.85, whiteSpace:'nowrap',
                        }}>
                    {(AD_FIELD_KEYS.find(k=>k.key===f.field_key)||{}).hint || f.label}
                  </span>
                )}
                <div onMouseDown={e=>{e.stopPropagation();setSel(f.id);const r=rel(e);setDrag({id:f.id,mode:'size',sx:r.x,sy:r.y,orig:{...f}});}}
                     className="absolute" style={{ right:-4, bottom:-4, width:9, height:9, background:c, cursor:'nwse-resize' }}/>
              </div>
            );
          })}
          {draw && <div className="absolute pointer-events-none"
            style={{ left:Math.min(draw.x,draw.x)+'%', top:Math.min(draw.y,draw.y)+'%',
                     border:'1px dashed var(--cy)', background:'rgba(56,224,240,.1)' }}/>}
        </div>
      </div>

      <div>
        {!cur ? (
          <div className="hud p-4">
            <p className="lbl">No field selected</p>
            <p className="text-xs mt-2" style={{color:'var(--txt2)'}}>
              Drag a box on the template to create one. Amber dashed boxes are product photos, cyan are text.
            </p>
          </div>
        ) : (
          <div className="hud p-4 space-y-3">
            <div className="flex items-center gap-2">
              <span className="ttl flex-1">Field</span>
              <Button size="sm" variant="danger" onClick={()=>del(cur.id)}><Icon name="trash" size={12}/></Button>
            </div>

            <div>
              <Label>Content</Label>
              <Select value={cur.field_key} onChange={e=>{
                const k = AD_FIELD_KEYS.find(x=>x.key===e.target.value);
                patch(cur.id,{ field_key:k.key, field_type:k.type, label:k.label });
              }}>
                {AD_FIELD_KEYS.map(k=><option key={k.key} value={k.key}>{k.label}</option>)}
              </Select>
              <p className="lbl mt-1">{(AD_FIELD_KEYS.find(k=>k.key===cur.field_key)||{}).hint}</p>
            </div>

            {cur.field_type === 'product_image' ? (
              <React.Fragment>
                <div>
                  <Label>Fit</Label>
                  <Select value={cur.fit_mode||'contain'} onChange={e=>patch(cur.id,{fit_mode:e.target.value})}>
                    <option value="contain">Contain — never crop</option>
                    <option value="cover">Cover — fill and crop</option>
                  </Select>
                </div>
                <label className="flex items-center gap-2 text-xs cursor-pointer" style={{color:'var(--txt2)'}}>
                  <input type="checkbox" checked={cur.remove_bg!==false}
                         onChange={e=>patch(cur.id,{remove_bg:e.target.checked})}/>
                  Remove background before placing
                </label>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div>
                  <Label>Font</Label>
                  <Select value={cur.font_family||'Anton'} onChange={e=>{
                    const f = AD_FONTS.find(x=>x.id===e.target.value);
                    patch(cur.id,{ font_family:f.id, font_weight:f.weights[f.weights.length-1] });
                  }}>
                    {AD_FONTS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                  </Select>
                  <div className="mt-2 px-3 py-2 overflow-hidden"
                       style={{ border:'1px solid var(--line)', background:'#efe7d6' }}>
                    <span style={{
                      fontFamily: fontStack(cur.font_family),
                      fontWeight: cur.font_weight || 400,
                      color: cur.color || '#000',
                      fontSize: '26px', lineHeight: 1.1, whiteSpace: 'nowrap',
                      textTransform: cur.uppercase ? 'uppercase' : 'none',
                    }}>{(AD_FIELD_KEYS.find(k=>k.key===cur.field_key)||{}).hint || 'Sample'}</span>
                  </div>
                </div>

                {(AD_FONTS.find(f=>f.id===(cur.font_family||'Anton'))||{weights:[400]}).weights.length > 1 && (
                  <div>
                    <Label>Weight</Label>
                    <Select value={cur.font_weight||400} onChange={e=>patch(cur.id,{font_weight:+e.target.value})}>
                      {(AD_FONTS.find(f=>f.id===(cur.font_family||'Anton'))||{weights:[400]}).weights
                        .map(w=><option key={w} value={w}>{w}</option>)}
                    </Select>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Align</Label>
                    <Select value={cur.align||'left'} onChange={e=>patch(cur.id,{align:e.target.value})}>
                      <option value="left">Left</option><option value="center">Center</option><option value="right">Right</option>
                    </Select></div>
                  <div><Label>Vertical</Label>
                    <Select value={cur.valign||'top'} onChange={e=>patch(cur.id,{valign:e.target.value})}>
                      <option value="top">Top</option><option value="middle">Middle</option><option value="bottom">Bottom</option>
                    </Select></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Colour</Label>
                    <input type="color" value={cur.color||'#000000'} onChange={e=>patch(cur.id,{color:e.target.value})}
                           style={{width:'100%',height:'34px',background:'transparent',border:'1px solid var(--line)'}}/></div>
                  <div><Label>Max lines</Label>
                    <Input type="number" min="1" max="6" value={cur.max_lines||2}
                           onChange={e=>patch(cur.id,{max_lines:+e.target.value})}/></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Padding %</Label>
                    <Input type="number" min="0" max="25" value={cur.padding_pct ?? 2}
                           onChange={e=>patch(cur.id,{padding_pct:+e.target.value})}/></div>
                  <div><Label>Line spacing</Label>
                    <Input type="number" min="0.8" max="2" step="0.05" value={cur.line_spacing ?? 1.15}
                           onChange={e=>patch(cur.id,{line_spacing:+e.target.value})}/></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Prefix</Label>
                    <Input value={cur.prefix||''} onChange={e=>patch(cur.id,{prefix:e.target.value})} placeholder="$"/></div>
                  <div><Label>Suffix</Label>
                    <Input value={cur.suffix||''} onChange={e=>patch(cur.id,{suffix:e.target.value})} placeholder="ea"/></div>
                </div>
                {cur.prefix && (
                  <div className="grid grid-cols-2 gap-2">
                    <div><Label>Prefix size %</Label>
                      <Input type="number" min="15" max="100" value={cur.prefix_scale ?? 55}
                             onChange={e=>patch(cur.id,{prefix_scale:+e.target.value})}/></div>
                    <div><Label>Prefix position</Label>
                      <Select value={cur.prefix_valign||'middle'} onChange={e=>patch(cur.id,{prefix_valign:e.target.value})}>
                        <option value="middle">Middle</option>
                        <option value="top">Top</option>
                        <option value="baseline">Baseline</option>
                      </Select></div>
                  </div>
                )}
                {cur.suffix && (
                  <div className="grid grid-cols-2 gap-2">
                    <div><Label>Suffix size %</Label>
                      <Input type="number" min="10" max="100" value={cur.suffix_scale ?? 35}
                             onChange={e=>patch(cur.id,{suffix_scale:+e.target.value})}/></div>
                    <div><Label>Suffix position</Label>
                      <Select value={cur.suffix_valign||'bottom'} onChange={e=>patch(cur.id,{suffix_valign:e.target.value})}>
                        <option value="bottom">Bottom</option>
                        <option value="middle">Middle</option>
                        <option value="top">Top</option>
                      </Select></div>
                  </div>
                )}
                <div className="flex gap-4">
                  <label className="flex items-center gap-2 text-xs cursor-pointer" style={{color:'var(--txt2)'}}>
                    <input type="checkbox" checked={!!cur.bold} onChange={e=>patch(cur.id,{bold:e.target.checked})}/> Bold
                  </label>
                  <label className="flex items-center gap-2 text-xs cursor-pointer" style={{color:'var(--txt2)'}}>
                    <input type="checkbox" checked={!!cur.uppercase} onChange={e=>patch(cur.id,{uppercase:e.target.checked})}/> Uppercase
                  </label>
                </div>
              </React.Fragment>
            )}

            <div>
              <Label>Label (editor only)</Label>
              <Input value={cur.label||''} onChange={e=>patch(cur.id,{label:e.target.value})}/>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AdTemplateLayout({ tpl, onClose, onSaved }) {
  const toast = useToast();
  const { fields, loading, save } = useAdTemplateFields(tpl.id);
  const [draft, setDraft] = useState([]);
  const [busy, setBusy] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [mockup, setMockup] = useState(null);
  const [rendering, setRendering] = useState(false);
  const [overflows, setOverflows] = useState([]);
  const [art, setArt] = useState(tpl.data);
  const [swapping, setSwapping] = useState(false);
  const artRef = useRef();

  // Artwork can be replaced in place. Field geometry is stored in percentages,
  // so a revised graphic at any size keeps the existing layout — only the
  // pixels underneath change.
  const replaceArtwork = async (file) => {
    if (!file) return;
    setSwapping(true);
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('Could not read that file'));
        r.readAsDataURL(file);
      });
      const dims = await new Promise(res => {
        const i = new Image();
        i.onload  = () => res({ w:i.naturalWidth, h:i.naturalHeight });
        i.onerror = () => res(null);
        i.src = dataUrl;
      });
      const sb = getSB();
      const patchRow = { data: dataUrl };
      if (dims) { patchRow.canvas_w = dims.w; patchRow.canvas_h = dims.h; }
      const { error } = await sb.from('brand_templates').update(patchRow).eq('id', tpl.id);
      if (error) throw error;
      setArt(dataUrl);
      tpl.data = dataUrl;
      if (dims) { tpl.canvas_w = dims.w; tpl.canvas_h = dims.h; }
      setMockup(null);
      toast.success(dims
        ? `Artwork replaced (${dims.w}×${dims.h}) — field layout kept`
        : 'Artwork replaced — field layout kept');
      if (onSaved) onSaved();
    } catch(e) { toast.error(e.message); }
    finally { setSwapping(false); }
  };

  // Sample copy chosen to stress the layout: a long name that must wrap and
  // shrink, and a save value wider than "$0.00".
  const SAMPLE = {
    product_name:'Okanagan Crush Pad Narrative Rosé',
    pack_size:'6 × 355ml',
    price:'18.99',
    save:'$12.50',
  };

  const makeMockup = async () => {
    if (!draft.length) { toast.error('Add some fields first'); return; }
    setRendering(true);
    try {
      const rendered = await renderFieldTemplate({ ...tpl, data: art }, draft, SAMPLE, null);
      setMockup(typeof rendered === 'string' ? rendered : rendered.url);
      const over = typeof rendered === 'string' ? [] : rendered.overflows;
      setOverflows(over);
      if (over.length) toast.error('Does not fit: ' + over.join(', '));
    } catch(e) { toast.error(e.message); }
    finally { setRendering(false); }
  };

  useEffect(()=>{ setDraft(fields); setDirty(false); }, [fields]);

  const change = (list) => { setDraft(list); setDirty(true); };

  const persist = async () => {
    setBusy(true);
    try {
      await save(draft);
      const sb = getSB();
      await sb.from('brand_templates')
        .update({ kind: draft.length ? 'price_ad' : 'plain' })
        .eq('id', tpl.id);
      toast.success('Layout saved');
      setDirty(false);
      if (onSaved) onSaved();
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  return (
    <Card>
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <span className="ttl">Field layout — {tpl.name}</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
        {dirty && <Badge color="yellow">Unsaved</Badge>}
        <Button size="sm" variant="outline" onClick={()=>artRef.current?.click()} loading={swapping}>
          <Icon name="image"/> Replace artwork
        </Button>
        <input ref={artRef} type="file" accept="image/*" className="hidden"
               onChange={e=>{ replaceArtwork(e.target.files?.[0]); e.target.value=''; }}/>
        <Button size="sm" onClick={persist} loading={busy}><Icon name="save"/> Save layout</Button>
        <Button size="sm" variant="ghost" onClick={onClose}><Icon name="close"/></Button>
      </div>
      {loading
        ? <p className="lbl text-center py-8">Loading…</p>
        : <AdFieldEditor templateDataUrl={art} fields={draft} onChange={change}/>}

      <div className="mt-5 pt-4" style={{borderTop:'1px solid var(--line)'}}>
        <div className="flex items-center gap-3 mb-3 flex-wrap">
          <span className="ttl">Mockup</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          <Button size="sm" variant="outline" onClick={makeMockup} loading={rendering}>
            <Icon name="eye"/> Render with sample data
          </Button>
          {mockup && <Button size="sm" variant="ghost" onClick={()=>setMockup(null)}>Clear</Button>}
        </div>
        {overflows.length > 0 && (
          <div className="mb-3 p-2.5" style={{border:'1px solid var(--amb)', background:'rgba(240,168,48,.1)'}}>
            <p className="text-xs" style={{color:'var(--amb)'}}>
              <Icon name="warn" size={13} className="mr-1.5"/>
              Too small even at minimum size: {overflows.join(', ')}
            </p>
            <p className="lbl mt-1">Make the box taller or wider, or raise its max lines</p>
          </div>
        )}
        {mockup
          ? <img src={mockup} alt="Template mockup" className="w-full max-w-md mx-auto block"
                 style={{border:'1px solid var(--line)'}}/>
          : <p className="lbl text-center py-6">
              Renders the real canvas output with placeholder copy — exact fonts, sizes and wrapping
            </p>}
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────
// BCLIQUOR PRODUCT LOOKUP
// ─────────────────────────────────────────────
// Searches the public BC Liquor Stores catalogue and copies the selected
// product image into our own Storage. The BCLIQUOR price is shown only to help
// identify the right package — it never becomes the store's feature price.
function BCLiquorSearch({ onImported }) {
  const toast = useToast();
  const [q, setQ] = useState('');
  const [results, setResults] = useState(null);
  const [searching, setSearching] = useState(false);
  const [importing, setImporting] = useState(null);

  const search = async () => {
    const term = q.trim();
    if (term.length < 2)  { toast.error('Enter at least 2 characters'); return; }
    if (term.length > 80) { toast.error('Search is too long'); return; }
    setSearching(true);
    try {
      const r = await callEdge('bcliquor', 'search', { query: term });
      setResults(r.products || []);
      if (!r.products?.length) toast.info ? toast.info('No matches') : null;
    } catch(e) { toast.error(e.message); }
    finally { setSearching(false); }
  };

  const useImage = async (prod) => {
    setImporting(prod.sku);
    try {
      // Server re-verifies the SKU and rebuilds the image URL itself.
      const r = await callEdge('bcliquor', 'import', { sku: prod.sku });
      onImported({
        image_url: r.image_url,
        image_alt: r.image_alt,
        product: r.product,
      });
      toast.success('Product image copied — save the product to keep it');
    } catch(e) { toast.error(e.message); }
    finally { setImporting(null); }
  };

  const money = v => (v == null ? null : '$' + Number(v).toFixed(2));

  return (
    <div className="p-4" style={{border:'1px solid var(--line)', background:'rgba(4,8,16,.4)'}}>
      <div className="flex items-center gap-3 mb-3">
        <span className="ttl">BC Liquor lookup</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
      </div>

      <div className="flex gap-2 mb-3">
        <Input value={q} onChange={e=>setQ(e.target.value)}
               onKeyDown={e=>{ if(e.key==='Enter') search(); }}
               placeholder="Search the BC Liquor catalogue…" className="flex-1"/>
        <Button onClick={search} loading={searching}><Icon name="search"/> Search</Button>
      </div>

      {results && results.length === 0 && (
        <p className="lbl py-6 text-center">No products matched that search</p>
      )}

      {results && results.length > 0 && (
        <React.Fragment>
          <p className="lbl mb-2">
            {results.length} result{results.length===1?'':'s'} · price shown only to identify the package
          </p>
          <div className="space-y-2 max-h-96 overflow-auto">
            {results.map(function(p) {
              return (
                <div key={p.sku} className="flex items-center gap-3 p-2.5"
                     style={{border:'1px solid var(--line)', background:'rgba(2,5,11,.5)'}}>
                  <img src={p.image_url} alt={p.name}
                       className="object-contain flex-none"
                       style={{width:'54px', height:'54px', background:'rgba(255,255,255,.04)'}}
                       onError={e=>{ e.currentTarget.style.visibility='hidden'; }}/>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm truncate" style={{color:'var(--txt)'}}>{p.name}</p>
                    <p className="lbl mt-1 truncate">
                      {[p.package_size, p.category, p.country].filter(Boolean).join(' · ')}
                    </p>
                    <p className="mono mt-1" style={{fontSize:'10px', color:'var(--txt3)'}}>
                      SKU {p.sku}
                      {money(p.current_price) && <span style={{marginLeft:'10px'}}>BCL {money(p.current_price)}</span>}
                      {p.regular_price != null && p.current_price != null && p.regular_price > p.current_price &&
                        <span style={{marginLeft:'6px', textDecoration:'line-through', opacity:.6}}>{money(p.regular_price)}</span>}
                    </p>
                  </div>
                  <Button size="sm" onClick={()=>useImage(p)} loading={importing===p.sku}>
                    <Icon name="down"/> Use image
                  </Button>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// TOAST CONTEXT

const ToastCtx = createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type='info') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 5000);
  }, []);
  const toast = { success:m=>add(m,'success'), error:m=>add(m,'error'), info:m=>add(m,'info') };
  return (
    <ToastCtx.Provider value={toast}>
      {children}
      <div className="fixed bottom-4 right-4 space-y-2 z-50 pointer-events-none">
        {toasts.map(t => (
          <div key={t.id} className={`px-4 py-3 rounded-xl shadow-lg text-white text-sm max-w-sm pointer-events-auto
            ${t.type==='success'?'bg-emerald-600':t.type==='error'?'bg-red-600':'bg-blue-600'}`}>
            <Icon name={t.type==='success'?'check':t.type==='error'?'cross':'info'} className="mr-1.5"/>{t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

function useBrandProfile(storeId) {
  const [profile, setProfile] = useState({ ...BRAND_DEFAULTS });
  const [logo,    setLogo]    = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const sb = getSB();
    if (!sb) { setLoading(false); return; }
    setLoading(true);
    sb.from('brand_profiles').select('*').eq('store_id', storeId).maybeSingle()
      .then(({ data }) => {
        if (data) {
          const { logo_data, id, updated_at, store_id, ...p } = data;
          setProfile({ ...BRAND_DEFAULTS, ...p });
          setLogo(logo_data || null);
        } else {
          setProfile({ ...BRAND_DEFAULTS });
          setLogo(null);
        }
      })
      .finally(() => setLoading(false));
  }, [storeId]);

  const saveProfile = async (p) => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    const { error } = await sb.from('brand_profiles')
      .upsert({ store_id: storeId, ...p }, { onConflict: 'store_id' });
    if (error) throw error;
    setProfile(p);
  };

  const saveLogo = async (dataUrl) => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    const { error } = await sb.from('brand_profiles')
      .upsert({ store_id: storeId, logo_data: dataUrl }, { onConflict: 'store_id' });
    if (error) throw error;
    setLogo(dataUrl);

  const clearLogo = async () => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    await sb.from('brand_profiles').update({ logo_data: null }).eq('store_id', storeId);
    setLogo(null);
  };

  return { profile, logo, loading, saveProfile, saveLogo, clearLogo };
}

// ─────────────────────────────────────────────
// IMAGE COMPRESSION UTILITY
// ─────────────────────────────────────────────
function compressImage(dataUrl, maxPx=600, quality=0.75) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

// ─────────────────────────────────────────────
// BACKGROUND REMOVER
// Flood-fills from all 4 edges to cut out near-white/near-cream backgrounds.
// Returns a transparent-background PNG data URL.
// ─────────────────────────────────────────────
function removeProductBackground(dataUrl, threshold=228) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(dataUrl); return; }

    // This must never hang. Every failure path resolves with the original
    // image so the caller still gets something drawable:
    //   • cross-origin canvas taint (imported Storage URLs) -> SecurityError
    //   • image fails to load at all -> onerror
    //   • anything unexpectedly slow -> watchdog
    let settled = false;
    const done = v => { if (!settled) { settled = true; resolve(v); } };
    const watchdog = setTimeout(() => done(dataUrl), 15000);
    const finish = v => { clearTimeout(watchdog); done(v); };

    const img = new Image();
    // Required for getImageData() on a Supabase Storage URL. Supabase serves
    // the CORS headers that make this work.
    img.crossOrigin = 'anonymous';
    img.onerror = () => finish(dataUrl);
    img.onload = () => {
     try {
      const canvas = document.createElement('canvas');
      canvas.width  = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const { data, width, height } = imgData;
      const visited = new Uint8Array(width * height);

      const isBg = i =>
        data[i] >= threshold && data[i+1] >= threshold && data[i+2] >= threshold && data[i+3] > 0;

      // Iterative flood fill seeded from all 4 edges (avoids recursion stack overflow)
      const stack = [];
      for (let x = 0; x < width; x++)  { stack.push(x, 0); stack.push(x, height - 1); }
      for (let y = 1; y < height - 1; y++) { stack.push(0, y); stack.push(width - 1, y); }

      while (stack.length) {
        const y = stack.pop(), x = stack.pop();
        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        const idx = y * width + x;
        if (visited[idx]) continue;
        visited[idx] = 1;
        const i = idx * 4;
        if (!isBg(i)) continue;
        data[i + 3] = 0; // punch out pixel
        stack.push(x+1, y, x-1, y, x, y+1, x, y-1);
      }

      // Feather: slightly soften opaque pixels that border a transparent one
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const idx = y * width + x;
          const i   = idx * 4;
          if (data[i+3] !== 255) continue; // skip transparent & already-soft
          const neighbors = [
            ((y-1)*width+x)*4, ((y+1)*width+x)*4,
            (y*width+x-1)*4,   (y*width+x+1)*4
          ];
          const nearTransp = neighbors.some(ni => data[ni+3] === 0);
          if (nearTransp) data[i+3] = 180; // anti-alias edge pixel
        }
      }

      ctx.putImageData(imgData, 0, 0);
      finish(canvas.toDataURL('image/png'));
     } catch (err) {
       // Tainted canvas or any other draw failure: use the original image.
       finish(dataUrl);
     }
    };
    img.src = dataUrl;
  });
}

// ─────────────────────────────────────────────
// LOGO COMPOSITOR
// ─────────────────────────────────────────────
function compositeLogoOnImage(imageDataUrl, logoDataUrl, logoSizePct=0.18) {
  return new Promise(resolve => {
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');
    const img    = new Image();
    img.onload = () => {
      canvas.width  = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      if (!logoDataUrl) { resolve(canvas.toDataURL('image/png')); return; }
      const logo = new Image();
      logo.onload = () => {
        const logoW  = Math.round(img.width * logoSizePct);
        const logoH  = Math.round(logoW * (logo.height / logo.width));
        const pad    = Math.round(img.width * 0.03);
        const x      = img.width  - logoW - pad;
        const y      = img.height - logoH - pad;
        const bgPad  = 10;
        const radius = 10;
        // White pill background
        ctx.globalAlpha = 0.88;
        ctx.fillStyle   = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(x-bgPad, y-bgPad, logoW+bgPad*2, logoH+bgPad*2, radius);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.drawImage(logo, x, y, logoW, logoH);
        resolve(canvas.toDataURL('image/png'));
      };
      logo.onerror = () => resolve(canvas.toDataURL('image/png'));
      logo.src = logoDataUrl;
    };
    img.onerror = () => resolve(imageDataUrl);
    img.src = imageDataUrl;
  });
}

// ─────────────────────────────────────────────
// PRODUCT + LOGO + PRICE COMPOSITOR
// Composites real product photo onto AI background, price labels, then logo
// priceOpts: { saveText, priceText, primaryColor, accentColor }
// ─────────────────────────────────────────────
function compositeProductAndLogo(bgDataUrl, productDataUrl, logoDataUrl, priceOpts={}) {
  return new Promise(resolve => {
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');
    const bg     = new Image();
    bg.onload = () => {
      canvas.width  = bg.width;
      canvas.height = bg.height;
      ctx.drawImage(bg, 0, 0);

      const addLogo = () => {
        if (!logoDataUrl) { resolve(canvas.toDataURL('image/png')); return; }
        const logo = new Image();
        logo.onload = () => {
          const logoW = Math.round(bg.width * 0.18);
          const logoH = Math.round(logoW * (logo.height / logo.width));
          const pad   = Math.round(bg.width * 0.03);
          const x     = bg.width  - logoW - pad;
          const y     = bg.height - logoH - pad;
          const bgPad = 10;
          ctx.globalAlpha = 0.88; ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.roundRect(x-bgPad, y-bgPad, logoW+bgPad*2, logoH+bgPad*2, 10); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.drawImage(logo, x, y, logoW, logoH);
          resolve(canvas.toDataURL('image/png'));
        };
        logo.onerror = () => resolve(canvas.toDataURL('image/png'));
        logo.src = logoDataUrl;
      };

      const addPriceThenLogo = () => {
        const { saveText, priceText, primaryColor='#1e3a5f', accentColor='#c4a35a' } = priceOpts;
        if (!saveText && !priceText) { addLogo(); return; }

        const W   = bg.width, H = bg.height;
        const pad = Math.round(W * 0.042);
        const bx  = pad; // left margin

        ctx.textBaseline = 'middle';
        ctx.textAlign    = 'left';

        // ── PRICE BLOCK (main) ──
        // Positioned at vertical center-ish of the left zone, anchored from bottom
        let blockBottom = Math.round(H * 0.80);

        if (priceText) {
          const priceVal  = priceText.startsWith('$') ? priceText : `$${priceText}`;
          const priceFs   = Math.round(H * 0.115); // large price number
          const justFs    = Math.round(H * 0.040); // "JUST" label
          const innerPadV = Math.round(H * 0.018);
          const innerPadH = Math.round(W * 0.030);

          ctx.font = `bold ${justFs}px -apple-system,Arial,sans-serif`;
          const justW = ctx.measureText('JUST').width;

          ctx.font = `900 ${priceFs}px -apple-system,Arial Black,sans-serif`;
          const priceW = ctx.measureText(priceVal).width;

          const blockW = Math.max(justW, priceW) + innerPadH * 2;
          const blockH = justFs * 1.6 + priceFs * 1.3 + innerPadV * 2;
          const by     = blockBottom - blockH;

          // Drop shadow under block
          ctx.save();
          ctx.shadowColor   = 'rgba(0,0,0,0.4)';
          ctx.shadowBlur    = Math.round(W * 0.025);
          ctx.shadowOffsetX = Math.round(W * 0.006);
          ctx.shadowOffsetY = Math.round(H * 0.008);
          ctx.globalAlpha   = 0.93;
          ctx.fillStyle     = primaryColor;
          ctx.beginPath(); ctx.roundRect(bx, by, blockW, blockH, 14); ctx.fill();
          ctx.restore();

          // "JUST" label in accent colour
          ctx.globalAlpha  = 1;
          ctx.font         = `bold ${justFs}px -apple-system,Arial,sans-serif`;
          ctx.fillStyle    = accentColor;
          ctx.fillText('JUST', bx + innerPadH, by + innerPadV + justFs * 0.75);

          // Price in white
          ctx.font      = `900 ${priceFs}px -apple-system,Arial Black,sans-serif`;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(priceVal, bx + innerPadH, by + innerPadV + justFs * 1.6 + priceFs * 0.62);

          blockBottom = by - Math.round(H * 0.018);
        }

        // ── SAVE BADGE (above price block) ──
        if (saveText) {
          const saveVal  = (function(){ var raw = saveText.replace(/^\$/, ''); var n = parseFloat(raw); return 'SAVE $' + (!isNaN(n) ? n.toFixed(2) : raw); }());
          const saveFs   = Math.round(H * 0.052);
          const innerPad = Math.round(W * 0.025);

          ctx.font = `bold ${saveFs}px -apple-system,Arial,sans-serif`;
          const tw  = ctx.measureText(saveVal).width;
          const bw  = tw + innerPad * 2;
          const bh  = Math.round(saveFs * 1.65);
          const by  = blockBottom - bh;

          ctx.save();
          ctx.shadowColor   = 'rgba(0,0,0,0.3)';
          ctx.shadowBlur    = Math.round(W * 0.018);
          ctx.shadowOffsetX = Math.round(W * 0.004);
          ctx.shadowOffsetY = Math.round(H * 0.005);
          ctx.globalAlpha   = 0.95;
          ctx.fillStyle     = accentColor;
          ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.fill();
          ctx.restore();

          ctx.globalAlpha  = 1;
          ctx.font         = `bold ${saveFs}px -apple-system,Arial,sans-serif`;
          ctx.fillStyle    = primaryColor;
          ctx.fillText(saveVal, bx + innerPad, by + bh / 2);
        }

        addLogo();
      };

      if (!productDataUrl) { addPriceThenLogo(); return; }
      const prod = new Image();
      prod.onload = () => {
        // Shift product right so price labels on left don't overlap
        const hasPriceLabels = !!(priceOpts.saveText || priceOpts.priceText);
        const prodH  = Math.round(bg.height * 0.62);
        const prodW  = Math.round(prodH * (prod.width / prod.height));
        const clampW = Math.min(prodW, Math.round(bg.width * (hasPriceLabels ? 0.55 : 0.65)));
        const prodWf = clampW;
        const prodHf = Math.round(prodWf * (prod.height / prod.width));
        // Right-shifted when price labels present, centered otherwise
        const px = hasPriceLabels
          ? Math.round(bg.width * 0.38)
          : Math.round((bg.width - prodWf) / 2);
        const py = bg.height - prodHf - Math.round(bg.height * 0.04);
        ctx.save();
        ctx.shadowColor   = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur    = Math.round(bg.width * 0.04);
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = Math.round(bg.height * 0.02);
        ctx.drawImage(prod, px, py, prodWf, prodHf);
        ctx.restore();
        addPriceThenLogo();
      };
      prod.onerror = addPriceThenLogo;
      prod.src = productDataUrl;
    };
    bg.onerror = () => resolve(bgDataUrl);
    bg.src = bgDataUrl;
  });
}

// ─────────────────────────────────────────────
// RETAIL TEMPLATE RENDERER
// Builds the entire ad with Canvas — no AI involved.
// Locked layout: top bar (logo), left (price), right (product), footer.
// tplId: 'classic' | 'dark' | 'bold'
// brandColors: { primary, accent }
// data: { saveText, priceText, productName, productSize, storeName }
// ─────────────────────────────────────────────
// bgDataUrl: optional uploaded template image (replaces flat-colour background + top bar)
// canvasW/canvasH: from the template metadata (defaults to 1080x1080)
async function renderRetailTemplate(tplId, { productDataUrl, logoDataUrl, brandPrimary='#1e3a5f', brandAccent='#c4a35a', bgDataUrl=null, canvasW=1080, canvasH=1080 }, { saveText='', priceText='', productName='', productSize='', storeName='' }) {
  const W = canvasW, H = canvasH;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const isDark  = tplId === 'dark';
  const txtMain = isDark ? '#FFFFFF' : brandPrimary;

  // ── Layer 1: background (uploaded template or flat colour) ──
  let BAR_H = 0; // when using a custom bg, no bar needed — it's in the design
  if (bgDataUrl) {
    await new Promise(res => {
      const bg = new Image();
      bg.onload = () => { ctx.drawImage(bg, 0, 0, W, H); res(); };
      bg.onerror = res;
      bg.src = bgDataUrl;
    });
  } else {
    // Built-in flat-colour template
    BAR_H = Math.round(H * 0.139); // ~150px at 1080
    const BG = isDark ? '#0D1B2A' : tplId === 'bold' ? '#FFFFFF' : '#F5EDDA';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = brandPrimary;
    ctx.fillRect(0, 0, W, BAR_H);
    ctx.fillStyle = brandAccent;
    ctx.fillRect(0, BAR_H, W, Math.round(H * 0.006));

    // Logo or store name in top bar
    await new Promise(res => {
      if (!logoDataUrl) {
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.round(BAR_H * 0.35)}px -apple-system,Arial,sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((storeName || '').toUpperCase(), W/2, BAR_H/2);
        return res();
      }
      const logo = new Image();
      logo.onload = () => {
        const lh = BAR_H * 0.68, lw = lh * (logo.width / logo.height);
        ctx.drawImage(logo, (W - lw)/2, (BAR_H - lh)/2, lw, lh);
        res();
      };
      logo.onerror = res;
      logo.src = logoDataUrl;
    });

    // Subtle vertical divider
    ctx.strokeStyle = txtMain + '28';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(Math.round(W * 0.477), BAR_H + Math.round(H * 0.046));
    ctx.lineTo(Math.round(W * 0.477), H - Math.round(H * 0.051));
    ctx.stroke();
  }

  // ── LEFT ZONE: measure total height first, then vertically center ──
  // All sizes scale proportionally to canvas dimensions
  const LX          = Math.round(W * 0.057);
  const MAX_TXT_W   = Math.round(W * 0.388);
  const CONTENT_TOP = BAR_H + Math.round(H * 0.013);
  const CONTENT_BOT = H - Math.round(H * 0.051);
  const CONTENT_H   = CONTENT_BOT - CONTENT_TOP;
  const FS_SAVE  = Math.round(H * 0.041);
  const IPV_SAVE = Math.round(H * 0.009);
  const IPH_SAVE = Math.round(W * 0.013);
  const FS_NAME  = Math.round(H * 0.031);
  const FS_SIZE  = Math.round(H * 0.025);
  const FS_JUST  = Math.round(H * 0.030);
  const FS_PRICE = Math.round(H * 0.109);

  // Pre-measure product name lines
  let nameLines = [];
  if (productName) {
    ctx.font = `bold ${FS_NAME}px -apple-system,Arial,sans-serif`;
    const words = productName.toUpperCase().split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? `${line} ${w}` : w;
      if (ctx.measureText(test).width > MAX_TXT_W && line) { nameLines.push(line); line = w; }
      else line = test;
    }
    if (line) nameLines.push(line);
  }

  // Calculate total block height
  const saveBlockH  = saveText    ? (FS_SAVE + IPV_SAVE * 2) + 28 : 0;
  const nameBlockH  = nameLines.length > 0 ? nameLines.length * FS_NAME * 1.35 + 10 : 0;
  const sizeBlockH  = productSize ? FS_SIZE * 1.7 + 4 : 0;
  const priceBlockH = priceText   ? 22 + FS_JUST * 1.45 + FS_PRICE * 1.15 : 0;
  const totalH      = saveBlockH + nameBlockH + sizeBlockH + priceBlockH;

  // Center the block vertically
  let ly = CONTENT_TOP + Math.round(Math.max(30, (CONTENT_H - totalH) / 2));

  ctx.textAlign = 'left'; ctx.textBaseline = 'top';

  // SAVE badge
  if (saveText) {
    const label = (function(){ var raw = saveText.replace(/^\$/, ''); var n = parseFloat(raw); return 'SAVE $' + (!isNaN(n) ? n.toFixed(2) : raw); }());
    ctx.font = `bold ${FS_SAVE}px -apple-system,Arial,sans-serif`;
    const tw = ctx.measureText(label).width;
    const bw = tw + IPH_SAVE * 2, bh = FS_SAVE + IPV_SAVE * 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    ctx.fillStyle = brandAccent;
    ctx.beginPath(); ctx.roundRect(LX, ly, bw, bh, 10); ctx.fill();
    ctx.restore();
    ctx.fillStyle = brandPrimary;
    ctx.textBaseline = 'middle';
    ctx.fillText(label, LX + IPH_SAVE, ly + bh / 2);
    ctx.textBaseline = 'top';
    ly += bh + 28;
  }

  // Product name
  if (nameLines.length > 0) {
    ctx.font = `bold ${FS_NAME}px -apple-system,Arial,sans-serif`;
    ctx.fillStyle = txtMain;
    for (const line of nameLines) { ctx.fillText(line, LX, ly); ly += FS_NAME * 1.35; }
    ly += 10;
  }

  // Product size
  if (productSize) {
    ctx.font = `${FS_SIZE}px -apple-system,Arial,sans-serif`;
    ctx.fillStyle = txtMain + (isDark ? 'aa' : '88');
    ctx.fillText(productSize, LX, ly);
    ly += FS_SIZE * 1.7 + 4;
  }

  // JUST + Price
  if (priceText) {
    const priceVal = priceText.startsWith('$') ? priceText : `$${priceText}`;
    ly += 22;
    ctx.font = `bold ${FS_JUST}px -apple-system,Arial,sans-serif`;
    ctx.fillStyle = brandAccent;
    ctx.fillText('JUST', LX, ly);
    ly += FS_JUST * 1.45;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.12)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
    ctx.font = `900 ${FS_PRICE}px -apple-system,Arial Black,sans-serif`;
    ctx.fillStyle = txtMain;
    ctx.fillText(priceVal, LX, ly);
    ctx.restore();
  }

  // Footer — pinned to bottom
  ctx.font = `22px -apple-system,Arial,sans-serif`;
  ctx.fillStyle = txtMain + (isDark ? '66' : '55');
  ctx.textBaseline = 'bottom';
  ctx.fillText('Plus tax & deposit. While supplies last.', LX, H - 24);

  // ── RIGHT ZONE: product photo — vertically centered ──
  if (productDataUrl) {
    await new Promise(res => {
      const prod = new Image();
      prod.onload = () => {
        const PX = Math.round(W * 0.49), PY = BAR_H + Math.round(H * 0.018), PW = Math.round(W * 0.454), PH = H - BAR_H - Math.round(H * 0.055);
        const scale = Math.min(PW / prod.width, PH / prod.height);
        const dw = prod.width * scale, dh = prod.height * scale;
        const dx = PX + (PW - dw) / 2;
        const dy = PY + (PH - dh) / 2; // vertically centered
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.20)';
        ctx.shadowBlur = 32; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 18;
        ctx.drawImage(prod, dx, dy, dw, dh);
        ctx.restore();
        res();
      };
      prod.onerror = res;
      prod.src = productDataUrl;
    });
  }

  return canvas.toDataURL('image/png');
}

// ─────────────────────────────────────────────
function Lightbox({ src, onClose }) {
  useEffect(()=>{
    const esc = e => { if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  },[onClose]);
  if (!src) return null;
  return (
    <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onClick={onClose}>
      <div className="relative" onClick={e=>e.stopPropagation()}>
        <button onClick={onClose} className="absolute -top-9 right-0 text-white text-sm font-semibold hover:text-gray-300 flex items-center gap-1"><Icon name="close"/> Close</button>
        <img src={src} alt="Generated" className="max-w-[90vw] max-h-[88vh] rounded-2xl shadow-2xl object-contain"/>
        <a href={src} download="generated.png" onClick={e=>e.stopPropagation()} className="absolute -bottom-9 right-0 text-white text-xs font-semibold hover:text-gray-300"><Icon name="down"/> Download</a>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// GRAPH API HELPERS
// ─────────────────────────────────────────────
async function gFetch(path, opts={}) {
  const res  = await fetch(`${GRAPH_API}${path}`, opts);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || 'Graph API error');
  return data;
}
async function gGet(path, params, token) {
  const qs = new URLSearchParams({ ...params, access_token: token }).toString();
  return gFetch(`${path}?${qs}`);
}
async function gPost(path, body, token) {
  return gFetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, access_token: token }),
  });
}
async function gPostForm(path, form) {
  return gFetch(path, { method: 'POST', body: form });
}

// AI HELPERS
// ─────────────────────────────────────────────
// Routed through the meta-social edge function so the Anthropic API key stays
// in Edge Function secrets. It is never loaded into the browser.
async function callAI(prompt, _unusedApiKey, maxTokens=600) {
  const result = await callEdge('meta-social', 'aiWrite', { prompt, maxTokens });
  return (result.text || '').trim();
}

// Both OpenAI calls run server-side via the meta-social edge function so that
// OPENAI_API_KEY never reaches the browser.
async function openAIDescribeImage(base64, mime, _unusedApiKey) {
  const result = await callEdge('meta-social', 'aiDescribeImage', { base64, mime });
  return (result.text || '').trim();
}

async function openAIGenerateImage(prompt, dalleSize, _unusedApiKey) {
  const result = await callEdge('meta-social', 'aiGenerateImage', { prompt, size: dalleSize });
  if (!result.url) throw new Error('No image returned from API');
  return { url: result.url, revised: result.revised || '' };
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function fmtDate(iso)   { return new Date(iso).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' }); }
function fmtBudget(c)   { return c ? `$${(+c/100).toFixed(2)}` : '—'; }
function fmtNum(n)      { if (!n||n==='—') return '—'; return Number(n).toLocaleString(); }
function fmtCTR(v)      { if (!v||v==='—') return '—'; return `${parseFloat(v).toFixed(2)}%`; }
function fbPostUrl(id)  { const p=String(id).split('_'); return p.length===2?`https://www.facebook.com/permalink.php?story_fbid=${p[1]}&id=${p[0]}`:`https://www.facebook.com/${id}`; }

function Button({ children, variant='primary', size='md', className='', loading=false, style={}, ...p }) {
  const base = 'clip inline-flex items-center justify-center gap-2 font-semibold uppercase tracking-[.16em] transition-all outline-none border disabled:opacity-40 disabled:cursor-not-allowed';

    primary:   { borderColor:'var(--cy)',  color:'var(--cy)',  background:'var(--cy-glow)' },

    ghost:     { borderColor:'transparent',color:'var(--txt2)',background:'transparent' },
    outline:   { borderColor:'var(--line2)',color:'var(--cy)', background:'transparent' },
  }[variant] || {};
  const glow = { primary:'0 0 22px rgba(56,224,240,.3)', danger:'0 0 22px rgba(255,77,94,.28)',
                 success:'0 0 22px rgba(63,240,138,.28)' }[variant] || '0 0 14px rgba(56,224,240,.16)';
  return (
    <button className={`${base} ${sz} ${className}`} style={{...V,...style}}

const ST_CATEGORIES = ['Generic','Regular Price','Sale','Multi-Buy','Limited Time','New Product','Staff Pick','Clearance','Seasonal'];

// Render a PDF's first page to a data URL via PDF.js
async function pdfPageToDataUrl(pdfDataUrl, maxPx=2000) {
  if (!window.pdfjsLib) throw new Error('PDF.js not loaded');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const raw = atob(pdfDataUrl.split(',')[1]);
  const bytes = new Uint8Array(raw.length);
  for (let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  const pdf = await window.pdfjsLib.getDocument({ data: bytes }).promise;
  const page = await pdf.getPage(1);
  const vp0 = page.getViewport({ scale: 1 });
  const scale = Math.min(maxPx / vp0.width, maxPx / vp0.height, 4);
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vp.width);
  canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return canvas.toDataURL('image/png');
}

// Binary-search text fitting — returns { fontSize, lines, overflow }
// Operates on an off-screen canvas for measurement; scale-independent.
// Display faces available to ad template fields. Loaded in <head>, so the
// canvas can use them — a font the document hasn't loaded silently falls back.
const AD_FONTS = [
  { id:'Anton',            label:'Anton',            stack:"'Anton',sans-serif",            weights:[400] },
  { id:'Archivo Black',    label:'Archivo Black',    stack:"'Archivo Black',sans-serif",    weights:[400] },
  { id:'Bebas Neue',       label:'Bebas Neue',       stack:"'Bebas Neue',sans-serif",       weights:[400] },
  { id:'Oswald',           label:'Oswald',           stack:"'Oswald',sans-serif",           weights:[400,500,600,700] },
  { id:'Barlow Condensed', label:'Barlow Condensed', stack:"'Barlow Condensed',sans-serif", weights:[600,700,800] },
  { id:'Montserrat',       label:'Montserrat',       stack:"'Montserrat',sans-serif",       weights:[600,700,800,900] },
  { id:'Inter',            label:'Inter',            stack:"'Inter',sans-serif",            weights:[600,700,800,900] },
  { id:'Chakra Petch',     label:'Chakra Petch',     stack:"'Chakra Petch',sans-serif",     weights:[400,500,600,700] },
  { id:'Arial',            label:'Arial (system)',   stack:'Arial,Helvetica,sans-serif',    weights:[400,700] },
];
const fontStack = id => (AD_FONTS.find(f=>f.id===id) || AD_FONTS[0]).stack;

// Canvas silently substitutes a fallback if the face isn't ready yet.
async function ensureFontsReady() {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e) {}
}

function fitText(text, boxW, boxH, settings={}) {
  const {
    maxFontSize=48, minFontSize=8, bold=false,
    lineSpacing=1.2, wrap=true, maxLines=null, align='left',
    fontFamily='Arial,Helvetica,sans-serif', fontWeight=null,
    padding=0,
    prefix='', prefixScale=0.55,
    suffix='', suffixScale=0.35,
  } = settings;
  const weightOf = () => fontWeight != null ? String(fontWeight) : (bold ? 'bold' : 'normal');

  const canvas = document.createElement('canvas');
  canvas.width=2000; canvas.height=2000;
  const ctx = canvas.getContext('2d');

  // Usable area, minus optional breathing room.
  const availW = Math.max(1, boxW - padding*2);
  const availH = Math.max(1, boxH - padding*2);

  // Real ink extents, not the em square. fontSize consistently understates
  // height for display faces (tall caps) and ignores accents and descenders,
  // which is what caused text to be clipped by the box.
  const inkOf = (str) => {
    const m = ctx.measureText(str);
    const asc  = (m.actualBoundingBoxAscent  != null && isFinite(m.actualBoundingBoxAscent))
      ? m.actualBoundingBoxAscent  : parseFloat(ctx.font) * 0.8;
    const desc = (m.actualBoundingBoxDescent != null && isFinite(m.actualBoundingBoxDescent))
      ? m.actualBoundingBoxDescent : parseFloat(ctx.font) * 0.2;
    // Glyphs can overhang the advance width on either side (italics, swashes).
    const left  = (m.actualBoundingBoxLeft  != null && isFinite(m.actualBoundingBoxLeft))  ? m.actualBoundingBoxLeft  : 0;
    const right = (m.actualBoundingBoxRight != null && isFinite(m.actualBoundingBoxRight)) ? m.actualBoundingBoxRight : m.width;
    return { asc, desc, w: Math.max(m.width, right + Math.max(0, left)) };
  };

  const measure = (fontSize) => {
    // Affixes are drawn at their own size beside the text, so the space they
    // occupy has to come out of the width available for wrapping.
    let affixW = 0;
    if (prefix) {
      ctx.font = `${weightOf()} ${Math.max(6, fontSize*prefixScale)}px ${fontFamily}`;
      affixW += ctx.measureText(prefix).width;
    }
    if (suffix) {
      ctx.font = `${weightOf()} ${Math.max(6, fontSize*suffixScale)}px ${fontFamily}`;
      affixW += ctx.measureText(suffix).width;
    }
    const textW = Math.max(1, availW - affixW);

    ctx.font = `${weightOf()} ${fontSize}px ${fontFamily}`;

    let lines;
    if (!wrap) {
      lines = [text];
    } else {
      lines = [];
      let cur = '';
      for (const w of text.split(/\s+/)) {
        const test = cur ? cur+' '+w : w;
        if (inkOf(test).w > textW && cur) { lines.push(cur); cur = w; }
        else cur = test;
      }
      if (cur) lines.push(cur);
    }

    const inks = lines.map(inkOf);
    const maxW = inks.reduce((a,k)=>Math.max(a,k.w), 0);
    const advance = fontSize * lineSpacing;
    // Ink height: ascent of the first line, descent of the last, plus the
    // baseline-to-baseline advance in between.
    const totalH = inks.length
      ? (inks.length-1)*advance + inks[0].asc + inks[inks.length-1].desc
      : 0;

    const limit = maxLines || 99;
    return {
      lines, inks, advance, totalH, affixW,
      fits: lines.length<=limit && totalH<=availH && maxW<=textW,
    };
  };

  // Binary search gets close fast, but fits() is not strictly monotonic —
  // changing font size changes where lines wrap, so a larger size can need
  // fewer lines and suddenly fit. Search, then verify downwards so the value
  // returned is guaranteed to fit and can never be clipped.
  let lo=minFontSize, hi=maxFontSize, candidate=minFontSize;
  while (lo<=hi) {
    const mid=Math.floor((lo+hi)/2);
    if (measure(mid).fits) { candidate=mid; lo=mid+1; }
    else hi=mid-1;
  }

  for (let fs=Math.max(candidate, minFontSize); fs>=minFontSize; fs--) {
    const r=measure(fs);
    if (r.fits) return { fontSize:fs, ...r, overflow:false };
  }

  // Nothing fits even at the minimum — the box is genuinely too small. Render
  // at the floor and flag it so the caller can tell the user which field.
  const r=measure(minFontSize);
  return { fontSize:minFontSize, ...r, overflow:true };
}

// Draw a single text field onto a canvas context.
// box: { x, y, w, h } in canvas pixels
function drawTextField(ctx, text, box, settings={}, fit=null) {
  const { align='left', valign='top', color='#000000', bold=false,
          lineSpacing=1.2, minFontSize=8, maxFontSize=48, wrap=true, maxLines=null,
          fontFamily='Arial,Helvetica,sans-serif', fontWeight=null, padding=0,
          prefix='', prefixScale=0.55, prefixValign='middle',
          suffix='', suffixScale=0.35, suffixValign='bottom' } = settings;
  const wt = fontWeight != null ? String(fontWeight) : (bold ? 'bold' : 'normal');
  const r = fit || fitText(text, box.w, box.h, {
    align, bold, lineSpacing, wrap, maxLines, maxFontSize, minFontSize,
    fontFamily, fontWeight, padding, prefix, prefixScale, suffix, suffixScale,
  });
  const { fontSize, lines, inks, advance, totalH } = r;
  if (!lines || !lines.length) return r;

  ctx.save();
  ctx.beginPath();
  // Inflated by 1px: the fit already guarantees containment, so this is only a
  // safety net and must not shave antialiased glyph edges.
  ctx.rect(box.x - 1, box.y - 1, box.w + 2, box.h + 2);
  ctx.clip();

  ctx.fillStyle = color;
  // Baseline positioning: 'top' guesses the em top, which clips accents on
  // display faces. Anchoring to the measured ascent is exact.
  ctx.textBaseline = 'alphabetic';
  ctx.font = `${wt} ${fontSize}px ${fontFamily}`;

  const innerX = box.x + padding;
  const innerW = box.w - padding*2;
  const innerY = box.y + padding;
  const innerH = box.h - padding*2;

  const preSize = prefix ? Math.max(6, Math.round(fontSize * prefixScale)) : 0;
  const sufSize = suffix ? Math.max(6, Math.round(fontSize * suffixScale)) : 0;

  ctx.font = `${wt} ${preSize}px ${fontFamily}`;
  const preW = prefix ? ctx.measureText(prefix).width : 0;
  ctx.font = `${wt} ${sufSize}px ${fontFamily}`;
  const sufW = suffix ? ctx.measureText(suffix).width : 0;

  // The text block sits between the affixes; each gets its own lane.
  const textX = innerX + preW;
  const textW = innerW - preW - sufW;

  let top = innerY;
  if (valign === 'middle')      top = innerY + (innerH - totalH) / 2;
  else if (valign === 'bottom') top = innerY + innerH - totalH;
  top = Math.max(top, innerY);

  const firstAsc = inks && inks[0] ? inks[0].asc : fontSize * 0.8;
  let baseline = top + firstAsc;

  ctx.font = `${wt} ${fontSize}px ${fontFamily}`;
  let lastLineW = 0;
  for (let k = 0; k < lines.length; k++) {
    let x = textX;
    if (align === 'center')     { ctx.textAlign = 'center'; x = textX + textW/2; }
    else if (align === 'right') { ctx.textAlign = 'right';  x = textX + textW; }
    else                        { ctx.textAlign = 'left'; }
    ctx.fillText(lines[k], x, baseline);
    if (k === lines.length-1) lastLineW = ctx.measureText(lines[k]).width;
    baseline += advance;
  }

  const lastIdx  = lines.length - 1;
  const lastBase = top + firstAsc + lastIdx * advance;
  const lastAsc  = inks && inks[lastIdx] ? inks[lastIdx].asc  : fontSize * 0.8;
  const lastDesc = inks && inks[lastIdx] ? inks[lastIdx].desc : fontSize * 0.2;

  // Where the drawn text actually starts and ends horizontally.
  let textLeft, textRight;
  if (align === 'center')     { textLeft = textX + textW/2 - lastLineW/2; textRight = textLeft + lastLineW; }
  else if (align === 'right') { textRight = textX + textW; textLeft = textRight - lastLineW; }
  else                        { textLeft = textX; textRight = textLeft + lastLineW; }

  // Prefix: smaller, in its own lane to the left, vertically centred against
  // the first line by default (a $ shouldn't sit on the same baseline as a
  // 200px numeral).
  if (prefix) {
    ctx.font = `${wt} ${preSize}px ${fontFamily}`;
    ctx.textAlign = 'left';
    const pm = ctx.measureText(prefix);
    const pAsc  = isFinite(pm.actualBoundingBoxAscent)  ? pm.actualBoundingBoxAscent  : preSize*0.8;
    const pDesc = isFinite(pm.actualBoundingBoxDescent) ? pm.actualBoundingBoxDescent : preSize*0.2;
    const firstTop = top;
    const firstBot = top + firstAsc;
    let py;
    if (prefixValign === 'top')          py = firstTop + pAsc;
    else if (prefixValign === 'baseline')py = firstBot;
    else                                 py = firstTop + (firstAsc + pAsc - pDesc) / 2; // middle
    ctx.fillText(prefix, textLeft - preW, py);
  }

  // Suffix: to the right of the text, sitting on the last line's baseline by
  // default so it reads as a unit with the price without overlapping it.
  if (suffix) {
    ctx.font = `${wt} ${sufSize}px ${fontFamily}`;
    ctx.textAlign = 'left';
    const sm = ctx.measureText(suffix);
    const sAsc = isFinite(sm.actualBoundingBoxAscent) ? sm.actualBoundingBoxAscent : sufSize*0.8;
    let sy;
    if (suffixValign === 'top')          sy = lastBase - lastAsc + sAsc;
    else if (suffixValign === 'middle')  sy = lastBase - lastAsc/2 + sAsc/2;
    else                                 sy = lastBase; // bottom / baseline
    const sx = Math.min(textRight + Math.round(sufSize*0.12), innerX + innerW - sm.width);
    ctx.fillText(suffix, sx, sy);
  }

  ctx.restore();
  return r;
}
