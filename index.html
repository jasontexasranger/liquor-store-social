// A row of stars, filled gold up to the (rounded) rating. Used both for the
// per-store aggregate (fractional, e.g. 4.5 — rounds to nearest star for
// display) and for individual reviews (already a whole number 1-5).
function StarRow({ rating, size=13 }) {
  const full = Math.round(rating || 0);
  return (
    <span className="inline-flex items-center" style={{gap:1}}>
      {[1,2,3,4,5].map(i => (
        <Icon key={i} name="star" size={size}
          style={i <= full ? {fill:'var(--cy)', color:'var(--cy)'} : {color:'var(--line2)'}}/>
      ))}
    </span>
  );
}

function ReviewsPage({ isAdmin }) {
  const toast = useToast();
  const [snapshots, setSnapshots] = useState({});   // store_id -> latest snapshot row
  const [recent,    setRecent]    = useState({});   // store_id -> [review rows]
  const [loading,   setLoading]   = useState(true);
  const [syncing,   setSyncing]   = useState(false);
  const [settingUp, setSettingUp] = useState(false);

  const load = useCallback(async function() {
    setLoading(true);
    try {
      const sb = getSB();
      // Latest snapshot per store — pull recent history and keep the first
      // (newest, since sorted desc) row seen per store_id.
      const { data: snapRows } = await sb.from('store_review_snapshots')
        .select('*').order('fetched_at', { ascending:false }).limit(40);
      const bySnap = {};
      (snapRows || []).forEach(r => { if (!bySnap[r.store_id]) bySnap[r.store_id] = r; });
      setSnapshots(bySnap);

      const { data: recentRows } = await sb.from('store_review_recent')
        .select('*').order('review_time', { ascending:false });
      const byRecent = {};
      (recentRows || []).forEach(r => { (byRecent[r.store_id] ??= []).push(r); });
      setRecent(byRecent);
    } catch(e) { toast.error(e.message); }
    finally { setLoading(false); }
  }, []);
  useEffect(function(){ load(); }, [load]);

  const reportResults = (label, results) => {
    const failed = (results || []).filter(x => !x.ok);
    if (failed.length) toast.error(label + ' — ' + failed.map(f => f.store_id + ': ' + f.error).join('; '));
    else toast.success(label + ' — done');
  };

  const runSync = async function() {
    setSyncing(true);
    try {
      const r = await callEdge('google-reviews', 'sync', {});
      reportResults('Sync', r.results);
      await load();
    } catch(e) { toast.error(e.message); }
    finally { setSyncing(false); }
  };

  const runSetup = async function() {
    setSettingUp(true);
    try {
      const r = await callEdge('google-reviews', 'setupPlaceIds', {});
      reportResults('Store match', r.results);
    } catch(e) { toast.error(e.message); }
    finally { setSettingUp(false); }
  };

  // Ranked by rating first, review count as tiebreaker — stores with no
  // snapshot yet sink to the bottom rather than being hidden.
  const ranked = useMemo(function() {
    return STORES.map(s => ({ ...s, snap: snapshots[s.id] || null }))
      .sort((a, b) => {
        const ar = a.snap ? a.snap.rating : -1, br = b.snap ? b.snap.rating : -1;
        if (br !== ar) return br - ar;
        const ac = a.snap ? a.snap.review_count : 0, bc = b.snap ? b.snap.review_count : 0;
        return bc - ac;
      });
  }, [snapshots]);

  const haveAnyData = Object.keys(snapshots).length > 0;

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex items-center gap-3 mb-2 flex-wrap">
          <span className="ttl"><Icon name="star"/> Google Reviews</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {isAdmin && (
            <>
              <Button size="sm" variant="outline" onClick={runSetup} loading={settingUp}>
                <Icon name="search"/> Set up store matches
              </Button>
              <Button size="sm" onClick={runSync} loading={syncing}>
                <Icon name="refresh"/> Sync now
              </Button>
            </>
          )}
        </div>
        <p className="lbl">
          Each store's live Google rating, review count, and most recent reviews —
          synced automatically once a day via Google's Places API, never scraped.
          A friendly leaderboard everyone can see, not a full report: Google's API
          only ever hands back a store's 5 most recent reviews, not its full
          history.
        </p>
      </Card>

      {loading ? (
        <Card><p className="lbl text-center py-10">Loading…</p></Card>
      ) : !haveAnyData ? (
        <Card>
          <div className="text-center py-12">
            <Icon name="star" size={36} style={{color:'var(--cy-dim)'}}/>
            <p className="lbl mt-3">No data yet</p>
            <p className="text-xs mt-2" style={{color:'var(--txt2)'}}>
              {isAdmin ? 'Run "Set up store matches", then "Sync now" above.' : 'Ask an admin to run the first sync.'}
            </p>
          </div>
        </Card>
      ) : ranked.map((s, i) => (
        <Card key={s.id}>
          <div className="flex items-start justify-between gap-3 flex-wrap mb-2">
            <div className="flex items-center gap-2.5">
              <span className="text-base font-bold text-center" style={{color: i===0 ? 'var(--cy)' : 'var(--txt3)', minWidth:'1.6em'}}>
                {i===0 && s.snap ? <Icon name="spark" size={18}/> : ('#'+(i+1))}
              </span>
              <div>
                <span className="text-sm font-semibold" style={{color:'var(--txt)'}}>{s.name}</span>
                {s.snap ? (
                  <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                    <StarRow rating={s.snap.rating}/>
                    <span className="text-sm font-bold" style={{color:'var(--cy)'}}>{Number(s.snap.rating).toFixed(1)}</span>
                    <span className="lbl">· {s.snap.review_count} review{s.snap.review_count===1?'':'s'}</span>
                  </div>
                ) : (
                  <p className="lbl mt-0.5">Not synced yet</p>
                )}
              </div>
            </div>
            {s.snap && (
              <span className="lbl">Updated {new Date(s.snap.fetched_at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
            )}
          </div>
          {!!(recent[s.id] && recent[s.id].length) ? (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
              {recent[s.id].slice(0,5).map(r => (
                <div key={r.id} className="p-2.5" style={{border:'1px solid var(--line)'}}>
                  <div className="flex items-center justify-between gap-2 mb-1 flex-wrap">
                    <StarRow rating={r.rating} size={11}/>
                    <span className="lbl">{r.author_name || 'Anonymous'} · {r.relative_time || ''}</span>
                  </div>
                  <p className="text-xs" style={{color:'var(--txt2)'}}>
                    {r.review_text ? '"' + r.review_text + '"' : 'No written comment'}
                  </p>
                </div>
              ))}
            </div>
          ) : s.snap && (
            <p className="text-xs mt-1" style={{color:'var(--txt3)'}}>No recent review text on file.</p>
          )}
        </Card>
      ))}
    </div>
  );
}

// ─────────────────────────────────────────────
// SCHEDULED POSTS PANEL
// ─────────────────────────────────────────────
// Rows written before multi-image support only carry image_url.
function imagesOfPost(p) {
  if (p.image_urls && p.image_urls.length) return p.image_urls;
  return p.image_url ? [p.image_url] : [];
}

// ─────────────────────────────────────────────
// POST REVIEW
// ─────────────────────────────────────────────
// The whole post, at a size you can actually judge: images large enough to read
// the price off, the full caption, and every field editable in place. Approving
// is the last thing on the page rather than a button next to a thumbnail,
// because approving is the thing that lets it publish unattended.
function PostReviewModal({ post, index, count, onStep, onClose, onChanged }) {
  const dragPanel = useDragPanel();
  const toast = useToast();
  const fileRef = useRef();

  const toLocalInput = iso => {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  };

  const [caption,  setCaption]  = useState(post.caption || '');
  const [images,   setImages]   = useState(imagesOfPost(post));
  const [when,     setWhen]     = useState(post.scheduled_at ? toLocalInput(post.scheduled_at) : '');
  const [channels, setChannels] = useState(post.publish_to || ['facebook']);
  const [busy,     setBusy]     = useState(null);
  const [showLib,  setShowLib]  = useState(false);
  const [lightbox, setLightbox] = useState(null);

  // Moving to the next post in the queue reuses this component, so the fields
  // have to be refilled rather than kept from the post before.
  useEffect(function() {
    setCaption(post.caption || '');
    setImages(imagesOfPost(post));
    setWhen(post.scheduled_at ? toLocalInput(post.scheduled_at) : '');
    setChannels(post.publish_to || ['facebook']);
  }, [post.id]);

  const storeName = (STORES.find(s => s.id === post.store_id) || {}).name || post.store_id;

  // The same view serves the approval queue and a click on the calendar, so it
  // has to cope with a post that's already gone out. Published history is read
  // only — there is nothing left to approve or amend.
  const editable  = post.status === 'needs_approval' || post.status === 'pending';
  const awaiting  = post.status === 'needs_approval';
  const step      = onStep || function(){ onClose(); };

  const dirty =
    caption !== (post.caption || '') ||
    JSON.stringify(images) !== JSON.stringify(imagesOfPost(post)) ||
    JSON.stringify(channels) !== JSON.stringify(post.publish_to || ['facebook']) ||
    when !== (post.scheduled_at ? toLocalInput(post.scheduled_at) : '');

  const igNoImage = channels.includes('instagram') && !images.length;

  const upload = async function(file) {
    if (!file) return;
    setBusy('upload');
    try {
      const url = await uploadImageToStorage(file);
      setImages(prev => prev.concat(url));
    } catch(e) { toast.error('Upload failed: ' + e.message); }
    finally { setBusy(null); }
  };

  const save = async function() {
    if (!caption.trim())  { toast.error('Caption cannot be empty'); return false; }
    if (!channels.length) { toast.error('Choose at least one channel'); return false; }
    if (igNoImage)        { toast.error('Instagram needs an image'); return false; }
    setBusy('save');
    try {
      await callEdge('meta-social', 'updateScheduled', {
        id: post.id,
        caption,
        imageUrls: images,
        publishTo: channels,
        scheduledAt: new Date(when).toISOString(),
      });
      await onChanged();
      return true;
    } catch(e) { toast.error(e.message); return false; }
    finally { setBusy(null); }
  };

  const approve = async function() {
    if (igNoImage) { toast.error('Instagram needs an image'); return; }
    if (dirty) {
      const ok = await save();
      if (!ok) return;
    }
    setBusy('approve');
    try {
      const sb = getSB();
      // Straight to the database on the reviewer's own token: the trigger that
      // records who approved it reads their identity from the request, and the
      // edge function runs as the service role with no identity to record.
      const { error } = await sb.from('scheduled_posts')
        .update({ status:'pending' }).eq('id', post.id).eq('status','needs_approval');
      if (error) throw error;
      toast.success('Approved — it will post at the scheduled time');
      await onChanged();
      step(1);
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  const reject = async function() {
    if (!confirm('Reject this post? It will not publish, and it stays in the list marked rejected.')) return;
    setBusy('reject');
    try {
      const sb = getSB();
      const { error } = await sb.from('scheduled_posts')
        .update({ status:'rejected', error_msg:'Rejected in review' })
        .eq('id', post.id).eq('status','needs_approval');
      if (error) throw error;
      toast.success('Rejected');
      await onChanged();
      step(1);
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  return (
    <Portal>
    {lightbox && <Lightbox src={lightbox} onClose={function(){ setLightbox(null); }}/>}
    <div className="fixed inset-0 z-[205] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.9)', backdropFilter:'blur(4px)'}} onClick={onClose}>
      <div className="hud hud-brk w-full max-w-3xl max-h-[92vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-center gap-3 mb-1">
          <span className="ttl">Review post</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {count > 1 && (
            <React.Fragment>
              <span className="mono text-xs" style={{color:'var(--txt2)'}}>{index+1} of {count}</span>
              <Button size="sm" variant="ghost" onClick={function(){ step(-1); }} disabled={index===0}>
                <Icon name="back" size={12}/>
              </Button>
              <Button size="sm" variant="ghost" onClick={function(){ step(1); }} disabled={index>=count-1}>
                <Icon name="fwd" size={12}/>
              </Button>
            </React.Fragment>
          )}
          <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>
        </div>
        <div className="flex items-center gap-2 mb-4">
          <span className="lbl">{storeName}</span>
          <span style={{width:'9px', height:'9px', background:statusMeta(post.status).color, display:'inline-block'}}/>
          <span className="lbl">{statusMeta(post.status).label}</span>
        </div>

        {!editable && (
          <div className="p-3 mb-4" style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.4)'}}>
            <p className="text-xs" style={{color:'var(--txt2)'}}>
              This post is history and can't be changed.
              {post.error_msg ? ' ' + post.error_msg : ''}
            </p>
          </div>
        )}

        <Label>Images</Label>
        <div className="flex gap-2 flex-wrap mb-2">
          {images.map(function(u, i) {
            return (
              <div key={u+i} className="relative group">
                <img src={u} alt="" onClick={function(){ setLightbox(u); }}
                     className="object-cover cursor-zoom-in"
                     style={{width:'132px', height:'132px', border:'1px solid var(--line2)'}}/>
                {editable && <button onClick={function(){ setImages(images.filter((_,ix)=>ix!==i)); }}
                        className="absolute top-1 right-1 p-1 opacity-0 group-hover:opacity-100"
                        style={{background:'rgba(var(--sink2-rgb),.85)', color:'var(--red)', border:'1px solid var(--red)'}}
                        aria-label="Remove image">
                  <Icon name="close" size={11}/>
                </button>}
                {i === 0 && images.length > 1 && (
                  <span className="lbl absolute bottom-1 left-1 px-1"
                        style={{background:'rgba(var(--sink2-rgb),.85)', color:'var(--cy)'}}>First</span>
                )}
              </div>
            );
          })}
          {images.length === 0 && (
            <div className="flex items-center justify-center"
                 style={{width:'132px', height:'132px', border:'1px dashed var(--line2)'}}>
              <Icon name="image" size={22} style={{color:'var(--cy-dim)'}}/>
            </div>
          )}
        </div>
        {editable && (
          <div className="flex gap-2 flex-wrap mb-4">
            <Button size="sm" variant="secondary" loading={busy==='upload'}
                    onClick={function(){ fileRef.current?.click(); }}>
              <Icon name="up"/> Upload
            </Button>
            <Button size="sm" variant="outline" onClick={function(){ setShowLib(true); }}>
              <Icon name="image"/> From library
            </Button>
            <input ref={fileRef} type="file" accept="image/*" className="hidden"
                   onChange={function(e){ upload(e.target.files?.[0]); e.target.value=''; }}/>
          </div>
        )}
        {showLib && (
          <CreativePicker allowed={POST_ASPECTS} storeIds={[post.store_id]}
            onPick={function(c){ setImages(function(prev){ return prev.concat(c.public_url); }); }}
            onClose={function(){ setShowLib(false); }}/>
        )}

        <Label>Caption</Label>
        <Textarea rows={7} value={caption} readOnly={!editable}
                  onChange={function(e){ setCaption(e.target.value); }}/>
        <p className="lbl mt-1 mb-4">
          "Prices exclude tax &amp; deposit - while supplies last" is added automatically when it posts.
        </p>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div>
            <Label>Send at</Label>
            <Input type="datetime-local" value={when} disabled={!editable}
                   onChange={function(e){ setWhen(e.target.value); }}/>
          </div>
          <div>
            <Label>Channels</Label>
            <div className="flex gap-2">
              {[['facebook','fb','Facebook'],['instagram','ig','Instagram']].map(function(c) {
                const on = channels.includes(c[0]);
                return (
                  <button key={c[0]} disabled={!editable}
                          onClick={function(){
                            if (!editable) return;
                            setChannels(on ? channels.filter(x=>x!==c[0]) : channels.concat(c[0]));
                          }}
                    className="flex-1 flex items-center justify-center gap-1.5 p-2 text-xs border"
                    style={{ borderColor:on?'var(--cy)':'var(--line)',
                             background:on?'var(--cy-glow)':'rgba(var(--sink-rgb),.4)',
                             color:on?'var(--cy)':'var(--txt2)' }}>
                    <Icon name={c[1]} size={13}/>{c[2]}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {igNoImage && (
          <p className="text-xs mb-3" style={{color:'var(--amb)'}}>
            <Icon name="warn" size={12} className="mr-1"/>
            Instagram needs at least one image — add one or turn Instagram off.
          </p>
        )}

        <div className="flex gap-2 items-center pt-3" style={{borderTop:'1px solid var(--line)'}}>
          <span className="lbl mr-auto">
            {!editable ? 'Read only'
             : awaiting ? (dirty ? 'Unsaved edits — approving saves them too'
                                 : 'Approving lets this publish on its own')
             : 'Already approved. Editing it sends it back for approval.'}
          </span>
          {awaiting && (
            <Button size="sm" variant="ghost" onClick={reject} loading={busy==='reject'}>Reject</Button>
          )}
          {editable && dirty && (
            <Button size="sm" variant="outline" onClick={save} loading={busy==='save'}>Save</Button>
          )}
          {awaiting && (
            <Button size="sm" onClick={approve} loading={busy==='approve'} disabled={igNoImage}>
              <Icon name="check"/> Approve
            </Button>
          )}
          {!editable && <Button size="sm" onClick={onClose}>Close</Button>}
        </div>
      </div>
    </div>
    </Portal>
  );
}

// ─────────────────────────────────────────────
// POST CALENDAR
// ─────────────────────────────────────────────
// What's going out, and when. A list answers "what's next"; a calendar answers
// "is next week empty" and "are all four stores posting on the same afternoon",
// which is the question a plan across several stores actually raises.

const POST_STATUS = {
  needs_approval: { label:'Needs approval', color:'var(--cy)'  },
  pending:        { label:'Approved',       color:'var(--amb)' },
  publishing:     { label:'Publishing',     color:'var(--amb)' },
  published:      { label:'Published',      color:'var(--grn)' },
  failed:         { label:'Failed',         color:'var(--red)' },
  missed:         { label:'Missed',         color:'var(--red)' },
  rejected:       { label:'Rejected',       color:'var(--txt3)' },
};

// Rejecting is a decision already taken, so it shouldn't clutter the plan.
// Kept out of the calendar unless you filter for it deliberately — the record
// still exists, it just isn't in the way.
const CALENDAR_HIDDEN = ['rejected'];
const statusMeta = s => POST_STATUS[s] || { label:s || 'Unknown', color:'var(--txt3)' };

const sameDay = (a, b) =>
  a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

const startOfWeek = d => {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - x.getDay());
  return x;
};

// The visible grid: whole weeks, so a month starting on a Wednesday still shows
// the Sunday before it rather than three blank cells.
function calendarDays(anchor, mode) {
  const days = [];
  if (mode === 'week') {
    const s = startOfWeek(anchor);
    for (let i = 0; i < 7; i++) days.push(new Date(s.getFullYear(), s.getMonth(), s.getDate()+i));
    return days;
  }
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const last  = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
  const s = startOfWeek(first);
  const e = new Date(last.getFullYear(), last.getMonth(), last.getDate() + (6 - last.getDay()));
  for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
    days.push(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
  }
  return days;
}

function PostCalendar({ posts, onOpen }) {
  const [mode,   setMode]   = useState('month');
  const [anchor, setAnchor] = useState(new Date());
  const [store,  setStore]  = useState('all');
  const [status, setStatus] = useState('all');

  const shift = n => setAnchor(function(prev) {
    return mode === 'week'
      ? new Date(prev.getFullYear(), prev.getMonth(), prev.getDate() + n*7)
      : new Date(prev.getFullYear(), prev.getMonth() + n, 1);
  });

  const days = calendarDays(anchor, mode);
  const from = days[0];
  const to   = new Date(days[days.length-1].getFullYear(), days[days.length-1].getMonth(), days[days.length-1].getDate(), 23, 59, 59);

  const hidden = p =>
    status === 'all' && CALENDAR_HIDDEN.indexOf(p.status) !== -1;

  const visible = posts.filter(function(p) {
    if (store !== 'all' && p.store_id !== store) return false;
    if (status !== 'all' && p.status !== status) return false;
    if (hidden(p)) return false;
    const d = new Date(p.scheduled_at);
    return d >= from && d <= to;
  });

  const forDay = d => visible
    .filter(p => sameDay(new Date(p.scheduled_at), d))
    .sort((a,b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

  const today = new Date();
  const title = mode === 'week'
    ? days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' – ' +
      days[6].toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
    : anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'});

  // Out-of-range posts are easy to lose behind a filter, so say so rather than
  // showing an empty grid with no explanation.
  const hiddenByRange = posts.filter(function(p) {
    if (store !== 'all' && p.store_id !== store) return false;
    if (status !== 'all' && p.status !== status) return false;
    if (hidden(p)) return false;
    const d = new Date(p.scheduled_at);
    return d < from || d > to;
  }).length;

  const rejectedHere = posts.filter(function(p) {
    if (status !== 'all') return false;
    if (CALENDAR_HIDDEN.indexOf(p.status) === -1) return false;
    if (store !== 'all' && p.store_id !== store) return false;
    const d = new Date(p.scheduled_at);
    return d >= from && d <= to;
  }).length;

  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap mb-3">
        <div className="flex" style={{border:'1px solid var(--line)'}}>
          {[['week','Week'],['month','Month']].map(function(m) {
            const on = mode===m[0];
            return (
              <button key={m[0]} onClick={()=>setMode(m[0])}
                className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
                {m[1]}
              </button>
            );
          })}
        </div>

        <div className="flex items-center gap-1">
          <Button size="sm" variant="ghost" onClick={()=>shift(-1)} aria-label="Previous">
            <Icon name="back" size={13}/>
          </Button>
          <span className="mono text-xs px-2 whitespace-nowrap" style={{color:'var(--cy)'}}>{title}</span>
          <Button size="sm" variant="ghost" onClick={()=>shift(1)} aria-label="Next">
            <Icon name="fwd" size={13}/>
          </Button>
          <Button size="sm" variant="ghost" onClick={()=>setAnchor(new Date())}>Today</Button>
        </div>

        <span className="flex-1"/>

        <StorePicker value={store} onChange={setStore} allLabel="All" compact/>
        <Select value={status} onChange={e=>setStatus(e.target.value)} className="w-auto text-xs">
          <option value="all">Any status</option>
          {Object.keys(POST_STATUS).map(k=><option key={k} value={k}>{POST_STATUS[k].label}</option>)}
        </Select>
      </div>

      <div className="grid grid-cols-7 gap-px" style={{background:'var(--line)'}}>
        {DOW_NAMES.map(function(d) {
          return (
            <div key={d} className="lbl text-center py-1.5" style={{background:'rgba(var(--sink-rgb),.9)'}}>{d}</div>
          );
        })}

        {days.map(function(d, i) {
          const list    = forDay(d);
          const inMonth = mode === 'week' || d.getMonth() === anchor.getMonth();
          const isToday = sameDay(d, today);
          return (
            <div key={i} className="p-1.5"
                 style={{ background: inMonth ? 'rgba(var(--sink-rgb),.62)' : 'rgba(var(--sink-rgb),.3)',
                          minHeight: mode==='week' ? '190px' : '104px' }}>
              <div className="flex items-center gap-1 mb-1">
                <span className="mono text-xs"
                      style={{ color: isToday ? 'var(--cy)' : inMonth ? 'var(--txt2)' : 'var(--txt3)',
                               fontWeight: isToday ? 700 : 400 }}>
                  {d.getDate()}
                </span>
                {isToday && <span className="lbl" style={{color:'var(--cy)'}}>today</span>}
              </div>

              {list.map(function(p) {
                const meta = statusMeta(p.status);
                const t = new Date(p.scheduled_at);
                const imgs = imagesOfPost(p);
                return (
                  <button key={p.id} onClick={()=>onOpen(p)}
                    className="flex items-center gap-1 w-full mb-1 p-1 text-left"
                    title={p.caption}
                    style={{ borderLeft:'3px solid '+meta.color, background:'rgba(10,17,30,.9)' }}>
                    {imgs.length > 0 && (
                      <img src={imgs[0]} alt="" className="w-5 h-5 object-cover flex-none"/>
                    )}
                    <span className="mono flex-none" style={{fontSize:'10px', color:meta.color}}>
                      {t.getHours()}:{String(t.getMinutes()).padStart(2,'0')}
                    </span>
                    <span className="truncate" style={{fontSize:'10px', color:'var(--txt2)'}}>
                      {(STORES.find(s=>s.id===p.store_id)||{}).name?.split(' ')[0] || p.store_id}
                    </span>
                  </button>
                );
              })}
            </div>
          );
        })}
      </div>

      <div className="flex gap-3 flex-wrap mt-3 items-center">
        {Object.keys(POST_STATUS).filter(k => CALENDAR_HIDDEN.indexOf(k) === -1).map(function(k) {
          return (
            <span key={k} className="flex items-center gap-1.5 lbl">
              <span style={{width:'9px', height:'9px', background:POST_STATUS[k].color, display:'inline-block'}}/>
              {POST_STATUS[k].label}
            </span>
          );
        })}
        <span className="flex-1"/>
        <span className="lbl">{visible.length} in view</span>
      </div>

      {hiddenByRange > 0 && (
        <p className="lbl mt-2">
          {hiddenByRange} more outside {mode === 'week' ? 'this week' : 'this month'}.
        </p>
      )}
      {rejectedHere > 0 && (
        <p className="lbl mt-1">
          {rejectedHere} rejected post{rejectedHere===1?'':'s'} hidden — choose Rejected above to see {rejectedHere===1?'it':'them'}.
        </p>
      )}
    </div>
  );
}

function ScheduledPostsPanel() {
  const toast = useToast();
  const [posts,    setPosts]    = useState([]);
  const [loading,  setLoading]  = useState(false);
  const [canceling,setCanceling]= useState(null);
  const [reviewIx, setReviewIx] = useState(null);
  const [picked,   setPicked]   = useState([]);   // ids ticked for a bulk action
  const [bulk,     setBulk]     = useState(null);
  const [view,     setView]     = useState('list');
  const [detail,   setDetail]   = useState(null);
  const [editId,   setEditId]   = useState(null);
  const [draft,    setDraft]    = useState({});
  const [saving,   setSaving]   = useState(false);
  const [uploading,setUploading]= useState(false);
  const [showLib,  setShowLib]  = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const imgRef = useRef();

  const replaceImage = async function(file) {
    if (!file) return;
    setUploading(true);
    try {
      const url = await uploadImageToStorage(file);
      setDraft(function(d){ return { ...d, imageUrl: url }; });
      toast.success('Image swapped — save to keep it');
    } catch(e) { toast.error('Upload failed: ' + e.message); }
    finally { setUploading(false); }
  };

  const toLocalInput = iso => {
    // <input type="datetime-local"> wants local time without a zone suffix.
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  };

  const startEdit = p => {
    setEditId(p.id);
    setDraft({
      caption: p.caption || '',
      scheduledAt: p.scheduled_at ? toLocalInput(p.scheduled_at) : '',
      publishTo: p.publish_to || ['facebook'],
      imageUrl: p.image_url || null,
    });
  };

  const toggleChannel = ch => setDraft(function(d) {
    const on = (d.publishTo || []).includes(ch);
    return { ...d, publishTo: on ? d.publishTo.filter(x=>x!==ch) : [...(d.publishTo||[]), ch] };
  });

  const saveEdit = async function(p) {
    if (!draft.caption.trim())        { toast.error('Caption cannot be empty'); return; }
    if (!(draft.publishTo||[]).length){ toast.error('Choose at least one channel'); return; }
    if ((draft.publishTo||[]).includes('instagram') && !draft.imageUrl) {
      toast.error('Instagram needs an image — remove that channel or cancel and rebuild the post'); return;
    }
    setSaving(true);
    try {
      await callEdge('meta-social', 'updateScheduled', {
        id: p.id,
        caption: draft.caption,
        publishTo: draft.publishTo,
        imageUrl: draft.imageUrl,
        scheduledAt: new Date(draft.scheduledAt).toISOString(),
      });
      toast.success('Scheduled post updated');
      setEditId(null);
      await load();
    } catch(e) { toast.error(e.message); }
    finally { setSaving(false); }
  };

  const load = useCallback(async function() {
    setLoading(true);
    try {
      var result = await callEdge('meta-social', 'listScheduled', {});
      setPosts(result.posts || []);
    } catch(e) { toast.error('Failed to load: ' + e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(function(){ load(); }, [load]);

  const cancel = async function(id) {
    setCanceling(id);
    try {
      await callEdge('meta-social', 'cancelScheduled', { id: id });
      toast.success('Cancelled');
      await load();
    } catch(e) { toast.error(e.message); }
    finally { setCanceling(null); }
  };

  const review  = posts.filter(function(p) { return p.status === 'needs_approval'; });

  const togglePick = id => setPicked(function(prev) {
    return prev.includes(id) ? prev.filter(x => x !== id) : prev.concat(id);
  });
  const allPicked = review.length > 0 && picked.length === review.length;

  // Approve, reject and delete in one go. Approving runs on the reviewer's own
  // token so the database records who did it — the edge function holds the
  // service role and has no identity to record.
  const bulkAct = async function(action) {
    const ids = picked.filter(id => review.some(r => r.id === id));
    if (!ids.length) return;

    const word = action === 'approve' ? 'Approve' : action === 'reject' ? 'Reject' : 'Delete';
    const warn = action === 'approve'
      ? 'Approve ' + ids.length + ' post' + (ids.length===1?'':'s') + '? They publish automatically at their scheduled times, without anyone reading them again.'
      : action === 'delete'
      ? 'Delete ' + ids.length + ' post' + (ids.length===1?'':'s') + ' for good? This cannot be undone — reject instead if you only want to stop them going out.'
      : 'Reject ' + ids.length + ' post' + (ids.length===1?'':'s') + '? They will not publish, and stay in the list marked rejected.';
    if (!confirm(warn)) return;

    setBulk(action);
    try {
      const sb = getSB();
      let res;
      if (action === 'delete') {
        res = await sb.from('scheduled_posts').delete().in('id', ids).eq('status','needs_approval');
      } else if (action === 'approve') {
        res = await sb.from('scheduled_posts').update({ status:'pending' })
                .in('id', ids).eq('status','needs_approval');
      } else {
        res = await sb.from('scheduled_posts')
                .update({ status:'rejected', error_msg:'Rejected in review' })
                .in('id', ids).eq('status','needs_approval');
      }
      if (res.error) throw res.error;
      toast.success(word + 'd ' + ids.length + ' post' + (ids.length===1?'':'s'));
      setPicked([]);
      await load();
    } catch(e) { toast.error(e.message); }
    finally { setBulk(null); }
  };
  const pending = posts.filter(function(p) { return p.status === 'pending'; });
  const past    = posts.filter(function(p) { return p.status !== 'pending' && p.status !== 'needs_approval'; });

  return (
    <Card>
      {lightbox && <Lightbox src={lightbox} onClose={function(){ setLightbox(null); }}/>}
      <div className="flex items-center gap-3 mb-4 flex-wrap">

        <span className="flex-1"/>
        <div className="flex" style={{border:'1px solid var(--line)'}}>
          {[['list','List'],['calendar','Calendar']].map(function(v) {
            const on = view===v[0];
            return (
              <button key={v[0]} onClick={function(){ setView(v[0]); }}
                className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
                {v[1]}
              </button>
            );
          })}
        </div>
        <Button variant="secondary" size="sm" onClick={load} loading={loading}>Refresh</Button>
      </div>

      {view === 'calendar' && (
        <PostCalendar posts={posts} onOpen={function(p){ setDetail(p); }}/>
      )}

      {detail && (
        <PostReviewModal post={detail} index={0} count={1}
          onClose={function(){ setDetail(null); }}
          onChanged={async function(){ await load(); setDetail(null); }}/>
      )}

      {review.length > 0 && (
        <div className="mb-5 p-3" style={{border:'1px solid var(--cy)', background:'var(--cy-glow)'}}>
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <Icon name="warn" size={15} style={{color:'var(--cy)'}}/>
            <p className="text-xs font-semibold uppercase tracking-[.16em]" style={{color:'var(--cy)'}}>
              {review.length} post{review.length===1?'':'s'} waiting for your approval
            </p>
            <span className="flex-1"/>
            <Button size="sm" onClick={function(){ setReviewIx(0); }}>
              <Icon name="edit"/> Review {review.length===1?'it':'them'}
            </Button>
          </div>

          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <label className="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked={allPicked}
                     onChange={function(){ setPicked(allPicked ? [] : review.map(r=>r.id)); }}/>
              <span className="lbl">{allPicked ? 'None' : 'All'}</span>
            </label>

            {picked.length > 0 ? (
              <React.Fragment>
                <span className="lbl" style={{color:'var(--cy)'}}>{picked.length} selected</span>
                <span className="flex-1"/>

                  <Icon name="trash" size={12}/> Delete

                <Button size="sm" variant="outline" loading={bulk==='reject'}

                  Reject

          </div>

          <div className="space-y-1.5">
            {review.map(function(p, ix) {

      .then(function(res) { if (!cancelled) setData(res); })

  return (

      {error && (
        <div className="text-sm text-red-500 dark:text-red-400 bg-red-50 dark:bg-red-900/20 rounded-lg p-3 mb-3">

                  <div className="text-lg font-bold text-gray-900 dark:text-white">{m.value != null ? m.value.toLocaleString() : '—'}</div>
                  <div className="text-xs font-medium text-gray-600 dark:text-gray-400">{m.label}</div>

              <div className="space-y-1.5">

// Everything people say to a brand, in one place: comments on FB posts and
// IG media, Messenger threads, IG DMs — with inline replies. Reads use the
// user-derived page token; messaging scopes may need a token regeneration,
// and the edge function says so plainly when they do.
function timeAgo(iso) {
  const s = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s/60) + 'm';
  if (s < 86400) return Math.round(s/3600) + 'h';
  if (s < 86400*30) return Math.round(s/86400) + 'd';
  return new Date(iso).toLocaleDateString('en-CA', { day:'numeric', month:'short' });
}

function InboxReplyBox({ placeholder, onSend, busy }) {
  const [text, setText] = useState('');
  return (
    <div className="flex gap-2 mt-1.5">
      <Input value={text} onChange={e=>setText(e.target.value)} className="text-xs flex-1"
             placeholder={placeholder || 'Reply…'}
             onKeyDown={e=>{ if (e.key==='Enter' && text.trim() && !busy) { onSend(text.trim()); setText(''); } }}/>
      <Button size="sm" disabled={!text.trim() || busy} loading={busy}
              onClick={()=>{ onSend(text.trim()); setText(''); }}>
        <Icon name="send" size={12}/>
      </Button>
    </div>
  );
}

function InboxCommentsView({ storeId }) {
  const toast = useToast();
  const [data, setData] = useState(null);
  const [busy, setBusy] = useState(null);
  const [openReply, setOpenReply] = useState(null);   // comment id with box open

  const load = useCallback(async function() {
    setData(null);
    try { setData(await callEdge('meta-social', 'inboxComments', { storeId })); }
    catch(e) { setData({ facebook:[], instagram:[], error:e.message }); }
  }, [storeId]);
  useEffect(function(){ load(); }, [load]);

  const reply = async function(commentId, platform, text) {
    setBusy(commentId);
    try {
      await callEdge('meta-social', 'inboxReplyComment', { storeId, commentId, platform, message: text });
      toast.success('Reply posted');
      setOpenReply(null);
      await load();
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  if (data === null) return <p className="lbl text-center py-8">Loading comments…</p>;
  if (data.error) return <p className="text-xs py-4" style={{color:'var(--amb)'}}>{data.error}</p>;
  const fb = data.facebook || [], ig = data.instagram || [];
  if (!fb.length && !ig.length) return <p className="lbl text-center py-8">No comments on recent posts.</p>;

  const thread = function(c, platform, pageOwnId) {
    const mine = platform === 'facebook'
      ? (c.from && c.from.id === data.pageId)
      : false;   // IG replies from the account carry the account username
    const author = platform === 'facebook' ? ((c.from && c.from.name) || 'Someone') : ('@' + c.username);
    const body = platform === 'facebook' ? c.message : c.text;
    const when = c.created_time || c.timestamp;
    const kids = platform === 'facebook' ? ((c.comments && c.comments.data) || []) : ((c.replies && c.replies.data) || []);
    return (
      <div key={c.id} className="py-1.5" style={{borderTop:'1px solid rgba(212,175,55,.06)'}}>
        <div className="flex items-baseline gap-2">
          <span className="text-xs font-semibold" style={{color: mine ? 'var(--cy)' : 'var(--txt)'}}>{author}</span>
          <span className="lbl">{timeAgo(when)}</span>
          <span className="flex-1"/>
          <button className="lbl" style={{color:'var(--cy)'}}
                  onClick={()=>setOpenReply(openReply === c.id ? null : c.id)}>reply</button>
        </div>
        <p className="text-xs" style={{color:'var(--txt2)', whiteSpace:'pre-wrap'}}>{body}</p>
        {kids.map(function(k) {
          const kMine = platform === 'facebook' ? (k.from && k.from.id === data.pageId) : false;
          return (
            <div key={k.id} className="mt-1 pl-3" style={{borderLeft:'2px solid var(--line)'}}>
              <span className="text-xs font-semibold mr-2" style={{color: kMine ? 'var(--cy)' : 'var(--txt)'}}>
                {platform === 'facebook' ? ((k.from && k.from.name) || 'Someone') : ('@' + k.username)}
              </span>
              <span className="lbl mr-2">{timeAgo(k.created_time || k.timestamp)}</span>
              <span className="text-xs" style={{color:'var(--txt2)'}}>{platform === 'facebook' ? k.message : k.text}</span>
            </div>
          );
        })}
        {openReply === c.id && (
          <InboxReplyBox busy={busy === c.id} placeholder="Reply as the store…"
                         onSend={t=>reply(c.id, platform, t)}/>
        )}
      </div>
    );
  };

  return (
    <div className="space-y-3">
      {fb.map(function(p) {
        return (
          <div key={p.id} className="p-3" style={{border:'1px solid var(--line)'}}>
            <div className="flex items-center gap-2 mb-1">
              <Icon name="fb" size={12} style={{color:'var(--cy-dim)'}}/>
              <span className="text-xs truncate flex-1" style={{color:'var(--txt3)'}}>
                {(p.message || '(photo post)').slice(0, 90)}
              </span>
              <span className="lbl">{timeAgo(p.created_time)}</span>
              {p.permalink_url &&
                <a className="lbl" style={{color:'var(--cy)'}} href={p.permalink_url}
                   target="_blank" rel="noopener">open</a>}
            </div>
            {((p.comments && p.comments.data) || []).map(c => thread(c, 'facebook'))}
          </div>
        );
      })}
      {ig.map(function(m) {
        return (
          <div key={m.id} className="p-3" style={{border:'1px solid var(--line)'}}>
            <div className="flex items-center gap-2 mb-1">
              <Icon name="ig" size={12} style={{color:'var(--cy-dim)'}}/>
              <span className="text-xs truncate flex-1" style={{color:'var(--txt3)'}}>
                {(m.caption || '(no caption)').slice(0, 90)}
              </span>
              <span className="lbl">{timeAgo(m.timestamp)}</span>
              {m.permalink &&
                <a className="lbl" style={{color:'var(--cy)'}} href={m.permalink}
                   target="_blank" rel="noopener">open</a>}
            </div>
            {((m.comments && m.comments.data) || []).map(c => thread(c, 'instagram'))}
          </div>
        );
      })}
    </div>
  );
}

function InboxMessagesView({ storeId, platform }) {
  const toast = useToast();
  const [data, setData] = useState(null);
  const [sel,  setSel]  = useState(null);   // conversation id
  const [busy, setBusy] = useState(false);

  const load = useCallback(async function() {
    setData(null); setSel(null);
    try { setData(await callEdge('meta-social', 'inboxConversations', { storeId, platform })); }
    catch(e) { setData({ conversations:[], error:e.message }); }
  }, [storeId, platform]);
  useEffect(function(){ load(); }, [load]);

  if (data === null) return <p className="lbl text-center py-8">Loading conversations…</p>;
  if (data.error) return <p className="text-xs py-4" style={{color:'var(--amb)'}}>{data.error}</p>;
  const convos = data.conversations || [];
  if (!convos.length) return <p className="lbl text-center py-8">No conversations yet.</p>;

  const cur = convos.find(c => c.id === sel) || null;
  const other = function(c) {
    const ps = (c.participants && c.participants.data) || [];
    const o = ps.find(p => p.id !== data.pageId);
    return (o && o.name) || 'Customer';
  };

  const send = async function(text) {
    if (!cur) return;
    const ps = (cur.participants && cur.participants.data) || [];
    const o = ps.find(p => p.id !== data.pageId);
    if (!o) { toast.error('Could not work out who to reply to'); return; }
    setBusy(true);
    try {
      await callEdge('meta-social', 'inboxSendMessage', { storeId, recipientId: o.id, message: text });
      toast.success('Sent');
      await load();
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  return (
    <div className="grid gap-3" style={{gridTemplateColumns:'minmax(180px, 260px) 1fr'}}>
      <div style={{border:'1px solid var(--line)', maxHeight:'480px', overflowY:'auto'}}>
        {convos.map(function(c) {
          const on = sel === c.id;
          const unread = (c.unread_count || 0) > 0;
          return (
            <button key={c.id} onClick={()=>setSel(c.id)} className="block w-full text-left p-2.5"
              style={{borderBottom:'1px solid rgba(212,175,55,.07)',
                      background: on ? 'var(--cy-glow)' : 'transparent'}}>
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold truncate"
                      style={{color: unread ? 'var(--cy)' : 'var(--txt)'}}>{other(c)}</span>
                {unread && <span className="lbl" style={{color:'var(--cy)'}}>{c.unread_count}</span>}
                <span className="flex-1"/>
                <span className="lbl">{timeAgo(c.updated_time)}</span>
              </div>
              <p className="lbl truncate">{c.snippet}</p>
            </button>
          );
        })}
      </div>
      <div style={{border:'1px solid var(--line)'}} className="p-3 flex flex-col">
        {!cur ? <p className="lbl text-center py-8">Pick a conversation.</p> : (
          <React.Fragment>
            <div className="flex-1" style={{maxHeight:'400px', overflowY:'auto'}}>
              {((cur.messages && cur.messages.data) || []).slice().reverse().map(function(m) {
                const mine = m.from && m.from.id === data.pageId;
                return (
                  <div key={m.id} className="mb-1.5 flex" style={{justifyContent: mine ? 'flex-end' : 'flex-start'}}>
                    <div className="px-2.5 py-1.5" style={{
                      maxWidth:'75%',
                      background: mine ? 'var(--cy-glow)' : 'rgba(var(--sink-rgb),.6)',
                      border:'1px solid ' + (mine ? 'var(--cy)' : 'var(--line)')}}>
                      <p className="text-xs" style={{color:'var(--txt)', whiteSpace:'pre-wrap'}}>{m.message}</p>
                      <p className="lbl" style={{textAlign: mine ? 'right' : 'left'}}>{timeAgo(m.created_time)}</p>
                    </div>
                  </div>
                );
              })}
            </div>
            {cur.can_reply === false
              ? <p className="lbl mt-2">Meta has closed the reply window for this conversation.</p>
              : <InboxReplyBox busy={busy} placeholder={'Message ' + other(cur) + '…'} onSend={send}/>}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// HOME — "I WANT TO..."
// ─────────────────────────────────────────────
// The landing screen: not a menu of sections but a menu of intentions, in
// Sueño gold on black. Cards are filtered to what this user can actually do,
// so a store clerk sees five big obvious choices and an admin sees the lot.
// On arrival, a bright band of light sweeps the screen — once per session.
// A quick "who's on top" readout of live Google ratings, above the action
// grid. Renders nothing until real synced data exists — a missing or
// pre-launch leaderboard should be invisible, never a broken-looking gap.
function HomeLeaderboard({ go }) {
  const [snaps, setSnaps] = useState(null); // null = not loaded yet, {} = loaded, nothing synced

  useEffect(function() {
    let alive = true;
    getSB().from('store_review_snapshots').select('*')
      .order('fetched_at', { ascending:false }).limit(40)
      .then(function(res) {
        if (!alive) return;
        const bySnap = {};
        (res.data || []).forEach(r => { if (!bySnap[r.store_id]) bySnap[r.store_id] = r; });
        setSnaps(bySnap);
      })
      .catch(function(){ setSnaps({}); }); // a quiet miss — this is a bonus, not a promise
    return function(){ alive = false; };
  }, []);

  if (!snaps || !Object.keys(snaps).length) return null;

  const ranked = STORES.map(s => ({ ...s, snap: snaps[s.id] || null }))
    .filter(s => s.snap)
    .sort((a, b) => b.snap.rating - a.snap.rating || b.snap.review_count - a.snap.review_count);

  return (
    <div className="sueno-leaderboard">
      {ranked.map((s, i) => (
        <button key={s.id} className="sueno-lb-item" onClick={()=>go('reviews')} title="See full reviews">
          <span className="sueno-lb-rank">
            {i===0 ? <Icon name="spark" size={13} style={{fill:'currentColor'}}/> : ('#'+(i+1))}
          </span>
          <span>{s.name.replace(' Liquor Store','').replace(' - Sicamous','')}</span>
          <Icon name="star" size={11} style={{fill:'currentColor'}}/>
          <span>{Number(s.snap.rating).toFixed(1)}</span>
          <span className="sueno-lb-count">({s.snap.review_count})</span>
        </button>
      ))}
    </div>
  );
}

function HomePage({ granted, isAdmin, go }) {
  const [pending, setPending] = useState(null);
  // The opening plays once per session: logo alone on black, sinking to the
  // bottom as the cards arrive. Revisits go straight to the cards.
  const [intro, setIntro] = useState(() => window.__suenoIntroDone !== true);
  useEffect(function() {
    if (!intro) return;
    const t = setTimeout(function(){ window.__suenoIntroDone = true; setIntro(false); }, 2700);
    return function(){ clearTimeout(t); };
  }, []);
  const base = intro ? 2.1 : 0;

  // How many posts are waiting on a human — the badge that makes the first
  // card a reason to click, not just a label.
  useEffect(function() {
    let alive = true;
    callEdge('meta-social', 'listScheduled', {})
      .then(function(r) {
        if (!alive) return;
        const n = (r.posts || []).filter(p => p.status === 'needs_approval').length;
        setPending(n);
      })
      .catch(function(){ /* badge is a bonus, not a promise */ });
    return function(){ alive = false; };
  }, []);

  const CARDS = [
    { id:'post',      label:'Generate a social post',     icon:'edit',    page:'posts', tab:'compose' },
    { id:'approve',   label:'Approve waiting posts',      icon:'check',   page:'posts', tab:'scheduled',
      badge: pending > 0 ? pending + ' waiting' : null },
    { id:'inbox',     label:'Answer comments & messages', icon:'comment', page:'posts', tab:'inbox' },
    { id:'features',  label:"Update this month's features", icon:'tag',   page:'features' },
    { id:'shelf',     label:'Print shelf talkers',        icon:'print',   page:'shelf' },
    { id:'website',   label:'Update the website',         icon:'globe',   page:'website' },
    { id:'price',     label:'Check a price',              icon:'search',  page:'prices' },

// ═══════════════════════════════════════════════════════════════
// SHELF TALKER — PRINT ENGINE
// Renders a completed shelf talker to a 2-up or 4-up canvas
// Paper: 8.5×11" @ 150 dpi → 1275×1650 px
// ═══════════════════════════════════════════════════════════════
const PX_PER_IN = 150;
const PAGE_W = Math.round(8.5 * PX_PER_IN); // 1275
const PAGE_H = Math.round(11  * PX_PER_IN); // 1650
const MARGIN  = Math.round(0.25 * PX_PER_IN); // 37px = 0.25"
const CROP_LEN = 18;  // px length of crop mark lines
const CROP_GAP = 6;   // px gap between artwork and crop mark

// Evaluate a formula string like "{PRICE 1}+{PRICE 2}+{PRICE 3}"
// using the current field values. Returns a string result or ''.
function evaluateFormula(formula, fields, values) {
  if (!formula || !formula.trim()) return '';
  var expr = formula;
  for (var fi = 0; fi < fields.length; fi++) {
    var field = fields[fi];
    var token = '{' + field.label + '}';
    if (expr.indexOf(token) !== -1) {
      var rawVal = values[field.id] || '0';
      var num = parseFloat(rawVal);
      if (isNaN(num)) num = 0;
      expr = expr.split(token).join(String(num));
    }
  }
  try {
    // eslint-disable-next-line no-new-func
    var result = (new Function('return (' + expr + ')'))();
    if (typeof result === 'number' && isFinite(result)) {
      return String(Math.round(result * 100) / 100);
    }
    return '';
  } catch(evalErr) {
    return '';
  }
}

// Render completed shelf-talker to an off-screen canvas.
// Returns a canvas element at (widthIn×heightIn×PX_PER_IN) px.
async function renderSTCanvas(template, fields, values) {
  const { file_data, width_in, height_in } = template;
  const W = Math.round(width_in  * PX_PER_IN);
  const H = Math.round(height_in * PX_PER_IN);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Draw template artwork
  await new Promise(res => {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, W, H); res(); };
    img.onerror = res;
    img.src = file_data;
  });

  // Draw text fields
  for (const f of fields) {
    const text = values[f.id] || '';
    if (!text && !f.required) continue;
    const box = {
      x: Math.round(f.x_pct / 100 * W),
      y: Math.round(f.y_pct / 100 * H),
      w: Math.round(f.w_pct / 100 * W),
      h: Math.round(f.h_pct / 100 * H),
    };
    drawTextField(ctx, text, box, {
      align: f.align, valign: f.valign, color: f.color,
      bold: f.bold, lineSpacing: f.line_spacing,
      wrap: f.wrap, maxLines: f.multiline ? f.max_lines : 1,
      maxFontSize: f.max_font_size, minFontSize: f.min_font_size,
      suffix: f.suffix || '',
    });
  }
  return canvas;
}

// Draw crop marks (corner) at (cx,cy), oriented by (dx,dy) signs.
function drawCropMark(ctx, cx, cy, dx, dy) {
  ctx.beginPath();
  ctx.moveTo(cx + dx*CROP_GAP, cy);
  ctx.lineTo(cx + dx*(CROP_GAP+CROP_LEN), cy);
  ctx.moveTo(cx, cy + dy*CROP_GAP);
  ctx.lineTo(cx, cy + dy*(CROP_GAP+CROP_LEN));
  ctx.stroke();
}

// Rotate a canvas 90° clockwise and return new canvas.
function rotateCanvas90(canvas) {
  const r = document.createElement('canvas');
  r.width = canvas.height; r.height = canvas.width;
  const ctx = r.getContext('2d');
  ctx.translate(r.width, 0);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(canvas, 0, 0);
  return r;
}

// Arrange shelf-talker canvases into a print page. Returns array of page canvases.
function buildPrintPages(stCanvas, layout, qty, isLandscape=false) {
  const perPage = layout==='4up' ? 4 : layout==='6up' ? 6 : 2;
  const totalPages = Math.ceil(qty / perPage);
  const pages = [];

  // Rotate landscape tags 90° for 4-up so each fills its quarter-page cell
  const src = (layout === '4up' && isLandscape)
    ? rotateCanvas90(stCanvas) : stCanvas;
  const stW = src.width, stH = src.height;
  // Compute cell size
  let cols, rows, cellW, cellH, useMargin;
  if (layout==='4up') {
    cols=2; rows=2; useMargin=true;
  } else if (layout==='6up') {
    // 6-up: 2 cols × 3 rows, no margin — fills page edge to edge (4.25" × 3.667" each at 150dpi)
    cols=2; rows=3; useMargin=false;
  } else {
    // 2-up: pick orientation that maximises shelf talker size
    const horizW = (PAGE_W - MARGIN*3) / 2;
    const horizH = PAGE_H - MARGIN*2;
    const vertW  = PAGE_W - MARGIN*2;
    const vertH  = (PAGE_H - MARGIN*3) / 2;
    const hScale = Math.min(horizW/stW, horizH/stH);
    const vScale = Math.min(vertW/stW,  vertH/stH);
    if (hScale >= vScale) { cols=2; rows=1; } else { cols=1; rows=2; }
    useMargin=true;
  }

  if (useMargin) {
    cellW = (PAGE_W - MARGIN*(cols+1)) / cols;
    cellH = (PAGE_H - MARGIN*(rows+1)) / rows;
  } else {
    cellW = PAGE_W / cols;
    cellH = PAGE_H / rows;
  }

  const scale = Math.min(cellW/stW, cellH/stH, 1); // never upscale beyond natural
  const dw = Math.round(stW * scale);
  const dh = Math.round(stH * scale);

  for (let p=0; p<totalPages; p++) {
    const page = document.createElement('canvas');
    page.width=PAGE_W; page.height=PAGE_H;
    const ctx=page.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,PAGE_W,PAGE_H);

    ctx.save();
    ctx.strokeStyle='#999999';
    ctx.lineWidth=0.75;

    // 6-up: draw full-page dashed cut guides before images
    if (layout==='6up') {
      ctx.save();
      ctx.strokeStyle='#bbbbbb';
      ctx.lineWidth=0.5;
      ctx.setLineDash([5, 5]);
      // vertical cut guide at centre
      ctx.beginPath(); ctx.moveTo(cellW, 0); ctx.lineTo(cellW, PAGE_H); ctx.stroke();
      // horizontal cut guides at 1/3 and 2/3
      ctx.beginPath(); ctx.moveTo(0, cellH); ctx.lineTo(PAGE_W, cellH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, cellH*2); ctx.lineTo(PAGE_W, cellH*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    const startIdx = p*perPage;
    const endIdx   = Math.min(startIdx+perPage, qty);

    for (let i=0; i<(endIdx-startIdx); i++) {
      const col=i%cols, row=Math.floor(i/cols);
      const cellX = useMargin ? MARGIN + col*(cellW+MARGIN) : col*cellW;
      const cellY = useMargin ? MARGIN + row*(cellH+MARGIN) : row*cellH;
      const cx = cellX + (cellW-dw)/2;
      const cy = cellY + (cellH-dh)/2;

      // Draw shelf talker
      ctx.drawImage(src, cx, cy, dw, dh);

      // Crop marks at 4 corners
      drawCropMark(ctx, cx,    cy,    -1, -1);
      drawCropMark(ctx, cx+dw, cy,     1, -1);
      drawCropMark(ctx, cx,    cy+dh, -1,  1);
      drawCropMark(ctx, cx+dw, cy+dh,  1,  1);
    }
    ctx.restore();
    pages.push(page);
  }
  return { pages, dw, dh };
}

// Build ONE print page from an array of different canvases (mixed layout)
function buildMixedPrintPage(canvases) {
  const count = canvases.length;
  let cols, rows;
  if (count === 1)      { cols=1; rows=1; }
  else if (count === 2) { cols=2; rows=1; }
  else                  { cols=2; rows=2; }

  const cellW = (PAGE_W - MARGIN*(cols+1)) / cols;
  const cellH = (PAGE_H - MARGIN*(rows+1)) / rows;

  const page = document.createElement('canvas');
  page.width=PAGE_W; page.height=PAGE_H;
  const ctx=page.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,PAGE_W,PAGE_H);
  ctx.save();
  ctx.strokeStyle='#999999';
  ctx.lineWidth=0.75;

  canvases.forEach((rawCanvas, i) => {
    // Rotate landscape canvases 90° when placing in a 2×2 grid (4 items)
    const stCanvas = (count === 4 && rawCanvas.width > rawCanvas.height)
      ? rotateCanvas90(rawCanvas) : rawCanvas;
    const col=i%cols, row=Math.floor(i/cols);
    const cellX = MARGIN + col*(cellW+MARGIN);
    const cellY = MARGIN + row*(cellH+MARGIN);
    const scale = Math.min(cellW/stCanvas.width, cellH/stCanvas.height, 1);
    const dw = Math.round(stCanvas.width*scale);
    const dh = Math.round(stCanvas.height*scale);
    const cx = cellX + (cellW-dw)/2;
    const cy = cellY + (cellH-dh)/2;
    ctx.drawImage(stCanvas, cx, cy, dw, dh);
    drawCropMark(ctx, cx,    cy,    -1, -1);
    drawCropMark(ctx, cx+dw, cy,     1, -1);
    drawCropMark(ctx, cx,    cy+dh, -1,  1);
    drawCropMark(ctx, cx+dw, cy+dh,  1,  1);
  });
  ctx.restore();
  return page;
}

// Export pages as a jsPDF document and trigger download
function exportPDF(pages, filename='shelf-talkers.pdf') {
  if (!window.jspdf || !window.jspdf.jsPDF) { alert('jsPDF not loaded'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'in', format:'letter' });
  // Fit canvas (8.5×11 proportions) within a 0.25" margin on all sides
  var MRG = 0.25;
  var availW = 8.5 - MRG * 2;  // 8.0"
  var availH = 11  - MRG * 2;  // 10.5"
  var scale  = Math.min(availW / 8.5, availH / 11);
  var imgW   = 8.5 * scale;
  var imgH   = 11  * scale;
  var imgX   = (8.5 - imgW) / 2;
  var imgY   = (11  - imgH) / 2;
  pages.forEach(function(page, i) {
    if (i > 0) doc.addPage('letter', 'portrait');
    var imgData = page.toDataURL('image/jpeg', 0.92);
    doc.addImage(imgData, 'JPEG', imgX, imgY, imgW, imgH);
  });
  doc.save(filename);
}

// SHELF TALKER — MANAGER CREATOR

function STCreator({ storeId, isAdmin, userId, pendingLoad, onLoadComplete }) {
