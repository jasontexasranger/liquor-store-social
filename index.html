// One-time login links: pick an email, a role, and how many hours it's
// good for, and get back a single-use URL. Opening it signs that person
// straight in — creating their account first if needed — with the role
// already applied. Creation/listing/revoking go straight through the
// login_links_admin RLS policy; only *redeeming* a link needs the edge
// function's service role (a fresh visitor has no session to be gated by).
function LoginLinksCard() {
  const toast = useToast();
  const [email,     setEmail]     = useState('');
  const [role,      setRole]      = useState('store');
  const [storeIds,  setStoreIds]  = useState([]);
  const [hours,     setHours]     = useState(24);
  const [creating,  setCreating]  = useState(false);
  const [fresh,     setFresh]     = useState(null);   // the just-created link, shown once
  const [links,     setLinks]     = useState(null);   // null = loading
  const [busyToken, setBusyToken] = useState(null);

  const load = function() {
    getSB().from('login_links').select('*').order('created_at', { ascending:false }).limit(30)
      .then(({ data, error }) => { if (!error) setLinks(data || []); });
  };
  useEffect(load, []);

  const toggleStore = sid => setStoreIds(prev =>
    prev.indexOf(sid) !== -1 ? prev.filter(x=>x!==sid) : prev.concat(sid));

  const create = async function() {
    const cleanEmail = email.trim().toLowerCase();
    if (!cleanEmail) { toast.error('Enter an email address'); return; }
    if (role === 'store' && !storeIds.length) { toast.error('Pick at least one store'); return; }
    const h = Math.min(Math.max(Number(hours) || 24, 1), 168);
    setCreating(true);
    try {
      const { data: { user } } = await getSB().auth.getUser();
      const { data, error } = await getSB().from('login_links').insert({
        email: cleanEmail,
        role: role,
        store_ids: role === 'store' ? storeIds : [],
        created_by: user ? user.id : null,
        expires_at: new Date(Date.now() + h * 3600 * 1000).toISOString(),
      }).select().single();
      if (error) throw error;
      setFresh(data);
      setEmail(''); setStoreIds([]);
      load();
    } catch(e) { toast.error(e.message); }
    finally { setCreating(false); }
  };

  const revoke = async function(token) {
    setBusyToken(token);
    try {
      const { error } = await getSB().from('login_links').update({ revoked:true }).eq('token', token);
      if (error) throw error;
      setLinks(prev => prev.map(l => l.token===token ? { ...l, revoked:true } : l));
      if (fresh && fresh.token === token) setFresh(prev => ({ ...prev, revoked:true }));
    } catch(e) { toast.error(e.message); }
    finally { setBusyToken(null); }
  };

  const copy = function(url) {
    navigator.clipboard.writeText(url).then(()=>toast.success('Link copied'));
  };

  const urlFor = token => window.location.origin + '/?login=' + token;

  const statusOf = l => {
    if (l.revoked) return { label:'Revoked', color:'var(--txt3)' };
    if (l.redeemed_at) return { label:'Used', color:'var(--grn)' };
    if (new Date(l.expires_at) < new Date()) return { label:'Expired', color:'var(--txt3)' };
    return { label:'Active', color:'var(--cy)' };
  };

  return (
    <Card>
      <h2 className="text-base font-bold text-gray-900 dark:text-white mb-1"><Icon name="key"/> One-time login links</h2>
      <p className="text-xs text-gray-500 dark:text-gray-400 mb-4">
        Send someone a single-use link instead of a password — opening it signs them in (creating
        their account first if it's their first time) with the role you pick, and it stops working
        the moment it's used or its time runs out.
      </p>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
        <div>
          <Label>Email</Label>
          <Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="staff@hideaway.com"/>
        </div>
        <div>
          <Label>Access</Label>
          <Select value={role} onChange={e=>{ setRole(e.target.value); setStoreIds([]); }}>
            <option value="store">Store manager (Posts + Shelf Talkers)</option>
            <option value="admin">Admin (Full access)</option>
          </Select>
        </div>
        {role==='store' && (
          <div>
            <Label>Assigned stores</Label>
            <div className="flex flex-wrap gap-x-4 gap-y-2 mt-1">
              {STORES.map(s => (
                <label key={s.id} className="flex items-center gap-1.5 text-sm cursor-pointer text-gray-700 dark:text-gray-300">
                  <input type="checkbox" checked={storeIds.indexOf(s.id) !== -1} onChange={()=>toggleStore(s.id)} className="accent-indigo-600"/>
                  {s.name.split(' ')[0]}
                </label>
              ))}
            </div>
          </div>
        )}
        <div>
          <Label>Expires in (hours)</Label>
          <Input type="number" min="1" max="168" value={hours} onChange={e=>setHours(e.target.value)}/>
        </div>
      </div>
      <Button size="sm" onClick={create} loading={creating}>
        <Icon name="key"/> Generate link
      </Button>

      {fresh && !fresh.revoked && (
        <div className="mt-4 p-3" style={{border:'1px solid var(--cy)', background:'rgba(var(--sink-rgb),.35)'}}>
          <p className="text-xs font-semibold mb-2" style={{color:'var(--cy)'}}>
            Link ready for {fresh.email} — expires {new Date(fresh.expires_at).toLocaleString()}
          </p>
          <div className="flex gap-2">
            <Input readOnly value={urlFor(fresh.token)} className="flex-1 text-xs" onClick={e=>e.target.select()}/>
            <Button size="sm" variant="outline" onClick={()=>copy(urlFor(fresh.token))}><Icon name="share" size={12}/> Copy</Button>
          </div>
        </div>
      )}

      {links && links.length > 0 && (
        <div className="mt-5">
          <p className="lbl mb-2">Recent links</p>
          <div className="space-y-1.5">
            {links.map(function(l) {
              const st = statusOf(l);
              const canRevoke = st.label === 'Active';
              return (
                <div key={l.token} className="flex items-center gap-2 px-2.5 py-2 text-xs"
                     style={{border:'1px solid var(--line)'}}>
                  <span className="font-bold flex-none" style={{color:st.color}}>{st.label}</span>
                  <span className="truncate flex-1" style={{color:'var(--txt)'}}>{l.email}</span>
                  <span className="flex-none" style={{color:'var(--txt2)'}}>{l.role==='admin' ? 'Admin' : 'Store'}</span>
                  <span className="flex-none" style={{color:'var(--txt3)'}}>{new Date(l.expires_at).toLocaleDateString()}</span>
                  {canRevoke && (
                    <button onClick={()=>revoke(l.token)} disabled={busyToken===l.token}
                      className="flex-none font-semibold" style={{color:'var(--red)'}}>
                      Revoke
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </Card>
  );
}

function UserAccountsSection({ currentUserId, onViewAs }) {
  const toast = useToast();
  const [users,        setUsers]        = useState([]);
  const [loading,      setLoading]      = useState(true);
  const [email,        setEmail]        = useState('');
  const [password,     setPassword]     = useState('');
  const [role,         setRole]         = useState('store');
  const [newStoreIds,  setNewStoreIds]  = useState([]);
  const [creating,     setCreating]     = useState(false);
  const [deletingId,   setDeletingId]   = useState(null);
  const [showPw,       setShowPw]       = useState(false);
  const [resetId,      setResetId]      = useState(null);
  const [newPw,        setNewPw]        = useState('');
  const [resetting,    setResetting]    = useState(false);
  const [editStoresId, setEditStoresId] = useState(null);
  const [editStoreIds, setEditStoreIds] = useState([]);
  const [savingStores, setSavingStores] = useState(false);
  const [editSections, setEditSections] = useState([]);

  const callAdmin = async (body) => {
    const { data: { session } } = await getSB().auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/user-admin`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
        'apikey': SUPABASE_KEY,
      },
      body: JSON.stringify(body),
    });
    const json = await resp.json();
    if (json.error) throw new Error(json.error);
    return json;
  };

  const loadUsers = useCallback(async () => {
    setLoading(true);
    try {
      const { users: u } = await callAdmin({ action: 'list' });
      const filtered = (u || []).filter(function(x) { return x.user_id !== currentUserId; });
      const userIds = filtered.map(function(x) { return x.user_id; }).filter(Boolean);
      if (userIds.length > 0) {
        const sb = getSB();
        if (sb) {
          const rolesResult = await sb.from('user_roles').select('user_id, store_id, store_ids, sections').in('user_id', userIds);
          const rolesData = rolesResult.data || [];
          const rolesMap = {};
          rolesData.forEach(function(r) { rolesMap[r.user_id] = r; });
          filtered.forEach(function(x) {
            const r = rolesMap[x.user_id];
            if (r) {
              x.store_id = r.store_id;
              x.store_ids = (r.store_ids && r.store_ids.length > 0) ? r.store_ids : (r.store_id ? [r.store_id] : []);
              x.sections = r.sections || null;
            } else {
              x.store_ids = x.store_id ? [x.store_id] : [];
            }
          });
        }
      }
      setUsers(filtered);
    } catch(e) { toast.error(e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { loadUsers(); }, [loadUsers]);

  const toggleNewStore = (sid) => {
    setNewStoreIds(function(prev) {
      return prev.indexOf(sid) !== -1 ? prev.filter(function(x) { return x !== sid; }) : prev.concat(sid);
    });
  };

  const toggleEditStore = (sid) => {
    setEditStoreIds(function(prev) {
      return prev.indexOf(sid) !== -1 ? prev.filter(function(x) { return x !== sid; }) : prev.concat(sid);
    });
  };

  const createUser = async () => {
    if (!email.trim())       { toast.error('Enter an email address'); return; }
    if (password.length < 8) { toast.error('Password must be at least 8 characters'); return; }
    if (role === 'store' && newStoreIds.length === 0) { toast.error('Select at least one store'); return; }
    setCreating(true);
    try {
      await callAdmin({ action: 'create', email: email.trim(), password, role });
      const { users: fresh } = await callAdmin({ action: 'list' });
      const newU = fresh && fresh.find(function(x) { return x.email === email.trim(); });
      if (newU && newU.user_id && role === 'store') {
        await getSB().from('user_roles').update({
          store_id: newStoreIds[0] || null,
          store_ids: newStoreIds,
        }).eq('user_id', newU.user_id);
      }
      toast.success('Account created for ' + email.trim());
      setEmail(''); setPassword(''); setNewStoreIds([]);
      await loadUsers();
    } catch(e) { toast.error(e.message); }
    finally { setCreating(false); }
  };

  const deleteUser = async (userId, userEmail) => {
    if (!confirm('Delete account for ' + userEmail + '?\nThis cannot be undone.')) return;
    setDeletingId(userId);
    try {
      await callAdmin({ action: 'delete', userId });
      toast.success('Account deleted');
      setUsers(function(p) { return p.filter(function(x) { return x.user_id !== userId; }); });
    } catch(e) { toast.error(e.message); }
    finally { setDeletingId(null); }
  };

  const resetPassword = async (userId) => {
    if (newPw.length < 8) { toast.error('Password must be at least 8 characters'); return; }
    setResetting(true);
    try {
      await callAdmin({ action: 'update_password', userId, password: newPw });
      toast.success('Password updated');
      setResetId(null); setNewPw('');
    } catch(e) { toast.error(e.message); }
    finally { setResetting(false); }
  };

  const openEditStores = (u) => {
    setEditStoresId(u.user_id);
    setEditStoreIds(u.store_ids || []);
    // Nothing saved means every assignable section, which is what they have
    // today — so opening the panel shows the truth rather than an empty list.
    setEditSections((u.sections && u.sections.length)
      ? u.sections
      : ASSIGNABLE_SECTIONS.filter(x => !x.admin).map(x => x.id));
    setResetId(null);
  };

  const toggleEditSection = id => setEditSections(prev =>
    prev.indexOf(id) !== -1 ? prev.filter(x => x !== id) : prev.concat(id));

  const saveStores = async (userId) => {
    setSavingStores(true);
    try {
      const all = ASSIGNABLE_SECTIONS.filter(x => !x.admin).length;
      await getSB().from('user_roles').update({
        store_id: editStoreIds[0] || null,
        store_ids: editStoreIds,
        // All of them ticked is the same as no restriction, so it is stored as
        // NULL — that way adding a section later doesn't leave everyone
        // silently locked out of it.
        // "All the everyday ones and nothing special" is the default, stored as
        // NULL. Anything else — fewer, or one of the elevated ones — is listed.
        sections: (editSections.length === all
                   && !editSections.some(id => (ASSIGNABLE_SECTIONS.find(x=>x.id===id)||{}).admin))
                  ? null : editSections,
      }).eq('user_id', userId);
      toast.success('Access updated');
      setEditStoresId(null);
      await loadUsers();
    } catch(e) { toast.error(e.message); }
    finally { setSavingStores(false); }
  };

  return (
    <Card>
      <h2 className="text-base font-bold text-gray-900 dark:text-white mb-1"><Icon name="users"/> Store User Accounts</h2>
      <p className="text-xs text-gray-500 dark:text-gray-400 mb-4">Create logins for store staff. Store accounts can be assigned to one or more locations.</p>

      {/* Create form */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
        <div>
          <Label>Email</Label>
          <Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="staff@hideaway.com"/>
        </div>
        <div>
          <Label>Password</Label>
          <div className="relative">
            <Input type={showPw?'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} placeholder="Min 8 characters"/>
            <button type="button" onClick={()=>setShowPw(p=>!p)} className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">{showPw?'hide':'show'}</button>
          </div>
        </div>
        <div>
          <Label>Role</Label>
          <Select value={role} onChange={e=>{ setRole(e.target.value); setNewStoreIds([]); }}>
            <option value="store">Store (Posts + Shelf Talkers)</option>
            <option value="admin">Admin (Full access)</option>
          </Select>
        </div>
        {role==='store' && (
          <div>
            <Label>Assigned Stores</Label>
            <div className="flex flex-wrap gap-x-4 gap-y-2 mt-1">
              {STORES.map(s => (
                <label key={s.id} className="flex items-center gap-1.5 text-sm cursor-pointer text-gray-700 dark:text-gray-300">
                  <input type="checkbox" checked={newStoreIds.indexOf(s.id) !== -1} onChange={()=>toggleNewStore(s.id)} className="accent-indigo-600"/>
                  {s.name.split(' ')[0]}
                </label>
              ))}
            </div>
          </div>
        )}
      </div>
      <Button onClick={createUser} loading={creating} size="sm" className="mb-5">+ Create Account</Button>

      {/* User list */}
      <div className="border-t border-gray-100 dark:border-gray-700 pt-4">
        <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-3">Existing Accounts</p>
        {loading ? (
          <p className="text-xs text-gray-400 animate-pulse">Loading…</p>
        ) : users.length === 0 ? (
          <p className="text-xs text-gray-400 italic">No store accounts yet.</p>
        ) : (
          <div className="space-y-2">
            {users.map(function(u) { return (
              <div key={u.user_id} className="rounded-xl bg-gray-50 dark:bg-gray-700/50 border border-gray-100 dark:border-gray-700 overflow-hidden">
                <div className="px-3 py-2.5">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-sm font-medium text-gray-900 dark:text-white">{u.email}</span>
                    <span className={`text-xs px-1.5 py-0.5 rounded font-semibold ${u.role==='admin'?'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300':'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300'}`}>{u.role}</span>
                    {(u.store_ids || []).map(function(sid) {
                      var s = STORES.find(function(st) { return st.id === sid; });
                      if (!s) return null;
                      return <span key={sid} className="text-xs text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 rounded px-1.5 py-0.5">{s.name.split(' ')[0]}</span>;
                    })}
                  </div>
                  {/* "Last login" and the action buttons are two stacked lines,
                      not one flex-wrap row — with justify-between, the actions
                      sat beside "Last login" whenever there was room and only
                      dropped below (left-aligned) when there wasn't, so they
                      landed in a different spot on every account. Always
                      left, always its own line, no exceptions. */}
                  <span className="block text-xs text-gray-400 dark:text-gray-500 mt-1.5">Last login: {fmtLastSeen(u.last_sign_in_at)}</span>
                  <div className="flex items-center gap-2 flex-wrap mt-1.5">
                      {onViewAs && (
                        <button
                          onClick={()=>onViewAs({
                            email: u.email,
                            role: u.role,
                            sections: u.sections || null,
                            storeIds: u.store_ids || [],
                          })}
                          title="See the app the way this user sees it — their menus and stores. Actions still run as you."
                          className="text-xs text-amber-600 hover:text-amber-800 dark:text-amber-400 font-semibold">
                          <Icon name="eye"/> View as
                        </button>
                      )}
                      {u.role === 'store' && (
                        <button onClick={()=>{ if(editStoresId===u.user_id){ setEditStoresId(null); } else { openEditStores(u); } }} className="text-xs text-green-600 hover:text-green-800 dark:text-green-400 font-semibold">
                          {editStoresId===u.user_id ? 'Cancel' : <React.Fragment><Icon name="store"/> Stores</React.Fragment>}
                        </button>
                      )}
                      <button onClick={()=>{ setResetId(resetId===u.user_id?null:u.user_id); setNewPw(''); setEditStoresId(null); }} className="text-xs text-indigo-500 hover:text-indigo-700 font-semibold">
                        {resetId===u.user_id ? 'Cancel' : <React.Fragment><Icon name="key"/> Reset PW</React.Fragment>}
                      </button>
                      <button onClick={()=>deleteUser(u.user_id, u.email)} disabled={deletingId===u.user_id} className="text-xs text-red-500 hover:text-red-700 font-semibold disabled:opacity-40">
                        {deletingId===u.user_id ? '…' : 'Remove'}
                      </button>
                  </div>
                </div>
                {editStoresId===u.user_id && (
                  <div className="px-3 pb-3 border-t border-gray-100 dark:border-gray-700 pt-2">
                    <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2">Assign Stores</p>
                    <div className="flex flex-wrap gap-x-4 gap-y-2 mb-3">
                      {STORES.map(function(s) { return (
                        <label key={s.id} className="flex items-center gap-1.5 text-sm cursor-pointer text-gray-700 dark:text-gray-300">
                          <input type="checkbox" checked={editStoreIds.indexOf(s.id) !== -1} onChange={()=>toggleEditStore(s.id)} className="accent-indigo-600"/>
                          {s.name}
                        </label>
                      ); })}
                    </div>
                    <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 mt-3">Sections they can open</p>
                    <div className="flex flex-wrap gap-x-4 gap-y-2 mb-2">
                      {ASSIGNABLE_SECTIONS.map(function(sec) { return (
                        <label key={sec.id} className="flex items-center gap-1.5 text-sm cursor-pointer text-gray-700 dark:text-gray-300">
                          <input type="checkbox" checked={editSections.indexOf(sec.id) !== -1}
                                 onChange={()=>toggleEditSection(sec.id)} className="accent-indigo-600"/>
                          {sec.label}
                          {sec.admin && <span className="text-xs" style={{color:'var(--amb)'}}>· elevated</span>}
                        </label>
                      ); })}
                    </div>
                    {editSections.indexOf('ads') !== -1 && (
                      <p className="text-xs mb-2" style={{color:'var(--amb)'}}>
                        <Icon name="warn" size={11} className="mr-1"/>
                        Ads access lets this person create campaigns against your ad accounts.
                        Everything is created paused, but they can switch it on in Ads Manager.
                      </p>
                    )}
                    <p className="text-xs text-gray-400 mb-3">
                      Hides sections from the menu. What they can actually read and change
                      is still governed by their stores.
                    </p>
                    <Button size="sm" loading={savingStores} onClick={()=>saveStores(u.user_id)}>Save access</Button>
                  </div>
                )}
                {resetId===u.user_id && (
                  <div className="flex gap-2 px-3 pb-2.5 border-t border-gray-100 dark:border-gray-700 pt-2">
                    <Input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="New password (min 8 chars)" className="flex-1 text-sm"/>
                    <Button size="sm" loading={resetting} onClick={()=>resetPassword(u.user_id)}>Save</Button>
                  </div>
                )}
              </div>
            ); })}
          </div>
        )}
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────
// Ad targeting is a circle around a point, so the point has to be right. Held
// per store in meta_accounts and edited here rather than hardcoded, which is
// how the app spent months aiming at the wrong town.
function useStoreLocations() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('meta_accounts')
      .select('store_id, address, lat, lng, ad_radius_km');
    setRows(data || []); setLoading(false);
  }, []);
  useEffect(function(){ load(); }, [load]);

  const save = async function(storeId, patch) {
    const sb = getSB();
    const { error } = await sb.from('meta_accounts').update(patch).eq('store_id', storeId);
    if (error) throw error;
    await load();
  };

  const forStore = id => rows.find(r => r.store_id === id) || null;
  return { rows, loading, save, forStore, reload: load };
}

// "50.6745, -120.3273" is what Google Maps puts on the clipboard, so accept it
// whole rather than making someone split it into two boxes.
function parseLatLng(text) {
  const m = String(text || '').match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (!m) return null;
  const lat = Number(m[1]), lng = Number(m[2]);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
  return { lat, lng };
}

// Which OptiSigns screens belong to each store. Fetched per store so
// Cobblestone's separate account lists its own screens once its key exists.
function SignageScreensSection() {
  const toast = useToast();
  const [open,    setOpen]    = useState(null);   // storeId being edited
  const [screens, setScreens] = useState([]);
  const [ticked,  setTicked]  = useState([]);
  const [saved,   setSaved]   = useState({});     // storeId -> screen ids
  const [busy,    setBusy]    = useState(null);

  useEffect(function() {
    const sb = getSB(); if (!sb) return;
    sb.from('meta_accounts').select('store_id, optisigns_screen_ids')
      .then(function(res) {
        const m = {};
        (res.data || []).forEach(r => { m[r.store_id] = r.optisigns_screen_ids || []; });
        setSaved(m);
      });
  }, []);

  const openStore = async function(st) {
    setOpen(st.id); setScreens(null); setTicked(saved[st.id] || []);
    try {
      const r = await callEdge('optisigns', 'listScreens', { storeId: st.id });
      setScreens(r.screens || []);
    } catch(e) { setScreens([]); toast.error(e.message); }
  };

  const save = async function(storeId) {
    setBusy(storeId);
    try {
      await callEdge('optisigns', 'saveScreens', { storeId, screenIds: ticked });
      setSaved(prev => Object.assign({}, prev, { [storeId]: ticked }));
      setOpen(null);
      toast.success('Screens saved');
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  return (
    <Card>
      <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-1 uppercase tracking-wide">
        <Icon name="grid"/> Signage screens
      </h3>
      <p className="lbl mb-4">
        Which OptiSigns screens each store's pushes go to. The account carries
        screens for other businesses too, so nothing is guessed from names.
      </p>

      {STORES.map(function(st) {
        const ids = saved[st.id] || [];
        return (
          <div key={st.id} className="p-3 mb-2" style={{border:'1px solid var(--line)'}}>
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-semibold" style={{color:'var(--txt)'}}>{st.name}</span>
              <span className="lbl">
                {ids.length ? ids.length + ' screen' + (ids.length===1?'':'s') + ' mapped' : 'No screens mapped'}
              </span>
              <span className="flex-1"/>
              <Button size="sm" variant="outline"
                      onClick={()=>{ open === st.id ? setOpen(null) : openStore(st); }}>
                {open === st.id ? 'Cancel' : 'Choose screens'}
              </Button>
            </div>

            {open === st.id && (
              <div className="mt-3 pt-3" style={{borderTop:'1px solid var(--line)'}}>
                {screens === null ? <p className="lbl">Loading screens from OptiSigns…</p>
                 : screens.length === 0 ? <p className="lbl">No screens found on this account.</p>
                 : (
                  <React.Fragment>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1 mb-3">
                      {screens.map(function(sc) {
                        const on = ticked.includes(sc._id);
                        return (
                          <label key={sc._id} className="flex items-center gap-2 py-1 cursor-pointer">
                            <input type="checkbox" checked={on}
                                   onChange={()=>setTicked(prev => on ? prev.filter(x=>x!==sc._id) : prev.concat(sc._id))}/>
                            <span className="text-xs" style={{color:'var(--txt2)'}}>{sc.deviceName}</span>
                          </label>
                        );
                      })}
                    </div>
                    <Button size="sm" onClick={()=>save(st.id)} loading={busy===st.id}>Save</Button>
                  </React.Fragment>
                )}
              </div>
            )}
          </div>
        );
      })}
    </Card>
  );
}

function StoreLocationsSection() {
  const toast = useToast();
  const { rows, loading, save } = useStoreLocations();
  const [draft, setDraft] = useState({});
  const [busy,  setBusy]  = useState(null);

  // Website lives on brand_profiles (it also drives ad copy/colours on the
  // Brand page) — loaded and saved alongside location so it can be edited
  // from either screen without the two ever disagreeing.
  const [sites,   setSites]   = useState({});
  const [sitesLoading, setSitesLoading] = useState(true);
  const loadSites = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('brand_profiles').select('store_id, website');
    const m = {}; (data || []).forEach(r => { m[r.store_id] = r.website || ''; });
    setSites(m); setSitesLoading(false);
  }, []);
  useEffect(function(){ loadSites(); }, [loadSites]);

  const get = (id, key, fallback) => {
    const d = draft[id] || {};
    if (d[key] !== undefined) return d[key];
    if (key === 'website') return sites[id] != null ? sites[id] : fallback;
    const row = rows.find(r => r.store_id === id) || {};
    return row[key] != null ? row[key] : fallback;
  };
  const set = (id, key, val) =>
    setDraft(prev => Object.assign({}, prev, { [id]: Object.assign({}, prev[id], { [key]: val }) }));

  const commit = async function(st) {
    const coords = parseLatLng(get(st.id, 'coords', ''));
    const radius = Number(get(st.id, 'ad_radius_km', 8));
    if (get(st.id, 'coords', '') && !coords) {
      toast.error('Coordinates should look like  50.6745, -120.3273'); return;
    }
    if (!(radius >= 1 && radius <= 80)) { toast.error('Radius must be between 1 and 80 km'); return; }

    setBusy(st.id);
    try {
      const patch = { address: get(st.id, 'address', '') || null, ad_radius_km: radius };
      if (coords) { patch.lat = coords.lat; patch.lng = coords.lng; }
      await save(st.id, patch);

      const website = get(st.id, 'website', '').trim();
      const sb = getSB();
      const { error: siteErr } = await sb.from('brand_profiles')
        .upsert({ store_id: st.id, website: website || null }, { onConflict: 'store_id' });
      if (siteErr) throw new Error(siteErr.message);

      setDraft(prev => Object.assign({}, prev, { [st.id]: {} }));
      await loadSites();
      toast.success(st.name + ' location saved');
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  return (
    <Card>
      <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-1 uppercase tracking-wide">
        <Icon name="store"/> Store locations
      </h3>
      <p className="lbl mb-4">
        Ads target a circle around each store. In Google Maps, right-click the store
        and click the coordinates to copy them, then paste them in below.
      </p>

      {(loading || sitesLoading) ? <p className="lbl text-center py-6">Loading…</p> : STORES.map(function(st) {
        const row = rows.find(r => r.store_id === st.id) || {};
        const hasCoords = row.lat != null && row.lng != null;
        return (
          <div key={st.id} className="p-3 mb-2" style={{border:'1px solid var(--line)'}}>
            <div className="flex items-center gap-2 mb-2">
              <span className="text-xs font-semibold" style={{color:'var(--txt)'}}>{st.name}</span>
              {hasCoords
                ? <span className="mono text-xs" style={{color:'var(--cy)'}}>
                    {Number(row.lat).toFixed(4)}, {Number(row.lng).toFixed(4)} · {row.ad_radius_km} km
                  </span>
                : <span className="lbl" style={{color:'var(--amb)'}}>Not set — ads fall back to a default</span>}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div className="sm:col-span-2">
                <Label>Address</Label>
                <Input className="text-xs" value={get(st.id,'address','')}
                       placeholder="123 Main St, Town, BC"
                       onChange={e=>set(st.id,'address',e.target.value)}/>
              </div>
              <div>
                <Label>Radius (km)</Label>
                <Input className="text-xs" type="number" min="1" max="80"
                       value={get(st.id,'ad_radius_km',8)}
                       onChange={e=>set(st.id,'ad_radius_km',e.target.value)}/>
              </div>
              <div className="sm:col-span-2">
                <Label>Coordinates</Label>
                <Input className="text-xs" value={get(st.id,'coords','')}
                       placeholder={hasCoords ? Number(row.lat).toFixed(6)+', '+Number(row.lng).toFixed(6) : '50.6745, -120.3273'}
                       onChange={e=>set(st.id,'coords',e.target.value)}/>
              </div>
              <div className="sm:col-span-3">
                <Label>Website</Label>
                <Input className="text-xs" type="url" value={get(st.id,'website','')}
                       placeholder="https://hideawayliquorstore.com"
                       onChange={e=>set(st.id,'website',e.target.value)}/>
                <p className="lbl mt-1">Carries over as the destination link when you build an ad for this store.</p>
              </div>
              <div className="flex items-end">
                <Button size="sm" onClick={()=>commit(st)} loading={busy===st.id}>Save</Button>
              </div>
            </div>
          </div>
        );
      })}
    </Card>
  );
}

// Tickets filed from the pinned help bot when it couldn't answer something
// itself. Open ones first, each expandable to the chat that led to it.
function SupportTicketsCard() {
  const toast = useToast();
  const [tickets, setTickets] = useState(null);   // null = loading
  const [openId,  setOpenId]  = useState(null);
  const [busyId,  setBusyId]  = useState(null);
  const [showResolved, setShowResolved] = useState(false);

  const load = function() {
    const sb = getSB(); if (!sb) return;
    sb.from('help_tickets').select('*').order('created_at', { ascending:false }).limit(200)
      .then(({ data, error }) => { if (!error) setTickets(data || []); });
  };
  useEffect(load, []);

  const resolve = async function(id, status) {
    setBusyId(id);
    try {
      const { error } = await getSB().from('help_tickets')
        .update({ status, resolved_at: status==='resolved' ? new Date().toISOString() : null })
        .eq('id', id);
      if (error) throw error;
      setTickets(prev => prev.map(t => t.id===id ? { ...t, status, resolved_at: status==='resolved' ? new Date().toISOString() : null } : t));
    } catch(e) { toast.error(e.message); }
    finally { setBusyId(null); }
  };

  const open     = (tickets || []).filter(t => t.status !== 'resolved');
  const resolved = (tickets || []).filter(t => t.status === 'resolved');
  const shown    = showResolved ? resolved : open;

  return (
    <Card>
      <div className="flex items-center gap-2 mb-1">
        <h2 className="text-base font-bold text-gray-900 dark:text-white"><Icon name="comment"/> Support tickets</h2>
        {open.length > 0 && (
          <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{background:'var(--red)', color:'#fff'}}>
            {open.length} open
          </span>
        )}
        <span className="flex-1"/>
        <button onClick={()=>setShowResolved(v=>!v)} className="text-xs font-semibold" style={{color:'var(--txt2)'}}>
          {showResolved ? 'Show open' : 'Show resolved'}
        </button>
      </div>
      <p className="text-xs text-gray-500 dark:text-gray-400 mb-4">
        Filed from the platform guide when it couldn't help someone directly.
      </p>

      {tickets === null ? (
        <p className="lbl text-center py-6">Loading…</p>
      ) : shown.length === 0 ? (
        <p className="text-xs text-center py-6" style={{color:'var(--txt2)'}}>
          {showResolved ? 'Nothing resolved yet.' : 'No open tickets — you\'re caught up.'}
        </p>
      ) : (
        <div className="space-y-2">
          {shown.map(function(t) {
            const isOpenRow = openId === t.id;
            return (
              <div key={t.id} style={{border:'1px solid var(--line)', borderRadius:'10px', overflow:'hidden'}}>
                <button onClick={()=>setOpenId(isOpenRow ? null : t.id)}
                  className="w-full text-left px-3 py-2.5 flex items-start gap-2"
                  style={{background:'rgba(var(--sink-rgb),.35)'}}>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm truncate" style={{color:'var(--txt)'}}>{t.question}</p>
                    <p className="lbl mt-0.5">
                      {t.user_email || 'unknown user'} · {t.page || 'unknown page'} · {new Date(t.created_at).toLocaleString()}
                    </p>
                  </div>
                  <Icon name={isOpenRow ? 'up' : 'down'} size={12} style={{color:'var(--txt2)', flex:'none', marginTop:'3px'}}/>
                </button>
                {isOpenRow && (
                  <div className="px-3 py-3" style={{borderTop:'1px solid var(--line)'}}>
                    <div className="space-y-1.5 mb-3" style={{maxHeight:'220px', overflow:'auto'}}>
                      {(t.transcript || []).map((m, i) => (
                        <p key={i} className="text-xs" style={{color: m.role==='user' ? 'var(--txt)' : 'var(--txt2)'}}>
                          <span className="font-bold">{m.role==='user' ? 'Them: ' : 'Guide: '}</span>{m.content}
                        </p>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      {t.status !== 'resolved' ? (
                        <Button size="sm" onClick={()=>resolve(t.id,'resolved')} loading={busyId===t.id}>
                          <Icon name="check" size={12}/> Mark resolved
                        </Button>
                      ) : (
                        <Button size="sm" variant="ghost" onClick={()=>resolve(t.id,'open')} loading={busyId===t.id}>
                          Reopen
                        </Button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </Card>
  );
}

function MarketRadarPage() {
  const toast = useToast();
  const [reports, setReports] = useState([]);
  const [loading, setLoading] = useState(true);
  const [scanning, setScanning] = useState(false);
  const [selected, setSelected] = useState(null); // report id being viewed; null = latest
  const [regionFilter, setRegionFilter] = useState('all');

  const load = useCallback(async function() {
    setLoading(true);
    try {
      const r = await callEdge('market-radar', 'list', { limit: 12 });
      setReports(r.reports || []);
    } catch(e) { toast.error(e.message); }
    finally { setLoading(false); }
  }, []);
  useEffect(function(){ load(); }, [load]);

  const runScan = async function() {
    setScanning(true);
    try {
      await callEdge('market-radar', 'scan', {});
      toast.success('Scan complete');
      setSelected(null);
      await load();
    } catch(e) { toast.error(e.message); }
    finally { setScanning(false); }
  };

  const toggleReviewed = async function(report) {
    try {
      await callEdge('market-radar', 'markReviewed', { id: report.id, reviewed: !report.reviewed_at });
      await load();
    } catch(e) { toast.error(e.message); }
  };

  const current = selected ? reports.find(r => r.id === selected) : reports[0];

  // Two separate, unconnected markets — Shuswap and Cowichan Valley — shown
  // as a filter rather than mixed together, since a brand active near one
  // says nothing about the other.
  const regionCounts = useMemo(function() {
    const counts = {};
    (current?.entries || []).forEach(e => { counts[e.region || 'shuswap'] = (counts[e.region || 'shuswap']||0) + 1; });
    return counts;
  }, [current]);

  // Grouped by category, categories sorted by how much is going on (most
  // brands first) so the busiest part of the shelf is what you see first.
  const grouped = useMemo(function() {
    if (!current) return [];
    const inRegion = (current.entries || []).filter(e => regionFilter === 'all' || (e.region || 'shuswap') === regionFilter);
    const map = {};
    inRegion.forEach(e => { (map[e.category] ??= []).push(e); });
    const order = { high: 0, medium: 1, low: 2 };
    Object.values(map).forEach(list => list.sort((a,b) => (order[a.activity]??3) - (order[b.activity]??3)));
    return Object.entries(map).sort((a,b) => b[1].length - a[1].length);
  }, [current, regionFilter]);

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex items-center gap-3 mb-2 flex-wrap">
          <span className="ttl"><Icon name="search"/> Market Radar</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          <Button size="sm" onClick={runScan} loading={scanning}>
            <Icon name="spark"/> Run scan now
          </Button>
        </div>
        <p className="lbl">
          Which liquor brands are visibly advertising or promoting themselves this
          week, across any category — beer, wine, spirits, RTD, cider. Covers two
          separate markets: Shuswap (Hideaway, Downtown, Brothers) and Cowichan
          Valley on Vancouver Island (Cobblestone) — a brand active near one says
          nothing about the other, so results are tagged and filterable by region.
          Also sweeps the Meta Ad Library directly for drink brands (not
          other liquor retailers) running live ads in Canada, catching ones
          that never showed up in news or social search — Meta doesn't
          expose a BC-only filter, so anything without a clear regional
          match is tagged "National" instead of guessed.
          Creative visibility is a real signal; exact ad spend isn't knowable from
          these sources, so treat this as a starting point, not a hard number.
          Runs automatically every week, or any time with the button above.
        </p>
      </Card>

      {loading ? (
        <Card><p className="lbl text-center py-10">Loading…</p></Card>
      ) : !reports.length ? (
        <Card>
          <div className="text-center py-12">
            <Icon name="search" size={36} style={{color:'var(--cy-dim)'}}/>
            <p className="lbl mt-3">No scans yet</p>
            <p className="text-xs mt-2" style={{color:'var(--txt2)'}}>
              Run the first one above — it usually takes a minute or two.
            </p>
          </div>
        </Card>
      ) : (
        <>
          <Card>
            <div className="flex items-center gap-2 flex-wrap mb-1">
              <span className="text-sm font-semibold" style={{color:'var(--txt)'}}>
                {current === reports[0] ? "This week's report" : 'Report'} — {new Date(current.run_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
              </span>
              <span className="lbl">{(current.entries||[]).length} brand{(current.entries||[]).length===1?'':'s'} · {current.region}</span>
              <span className="flex-1"/>
              <Button size="sm" variant="outline" onClick={()=>toggleReviewed(current)}>
                <Icon name={current.reviewed_at ? 'check' : 'dot'}/> {current.reviewed_at ? 'Reviewed' : 'Mark reviewed'}
              </Button>
            </div>
            <div className="flex items-center gap-1.5 flex-wrap mt-2">
              <button onClick={()=>setRegionFilter('all')}
                className="text-xs px-2 py-1"
                style={{border:'1px solid var(--line)', color: regionFilter==='all' ? 'var(--txt)' : 'var(--txt3)',
                        background: regionFilter==='all' ? 'rgba(var(--sink-rgb),.5)' : 'transparent'}}>
                All regions
              </button>
              {RADAR_REGIONS.map(r => (
                <button key={r.id} onClick={()=>setRegionFilter(r.id)}
                  className="text-xs px-2 py-1"
                  style={{border:'1px solid var(--line)', color: regionFilter===r.id ? 'var(--txt)' : 'var(--txt3)',
                          background: regionFilter===r.id ? 'rgba(var(--sink-rgb),.5)' : 'transparent'}}
                  title={r.sub}>
                  {r.label} <span className="lbl">· {regionCounts[r.id] || 0}</span>
                </button>
              ))}
            </div>
          </Card>

          {current.status === 'failed' ? (
            <Card><p className="text-xs" style={{color:'var(--red)'}}>Scan failed: {current.error_msg || 'unknown error'}</p></Card>
          ) : !grouped.length ? (
            <Card><p className="lbl text-center py-8">Nothing worth reporting this week.</p></Card>
          ) : grouped.map(([category, entries]) => (
            <Card key={category}>
              <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-3 uppercase tracking-wide">
                {category} <span className="lbl">· {entries.length}</span>
              </h3>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-2">
                {entries.map(e => <RadarEntryCard key={e.id} e={e}/>)}
              </div>
            </Card>
          ))}

          {reports.length > 1 && (
            <Card>
              <p className="lbl mb-2">Past reports</p>
              <div className="space-y-1.5">
                {reports.map(r => (
                  <button key={r.id} onClick={()=>setSelected(r.id)}
                    className="w-full flex items-center gap-2 px-2.5 py-2 text-xs text-left"
                    style={{border:'1px solid var(--line)', background: (current===r) ? 'rgba(var(--sink-rgb),.5)' : 'transparent'}}>
                    <span style={{color:'var(--txt)'}}>{new Date(r.run_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>
                    <span className="lbl">{(r.entries||[]).length} brands</span>
                    {r.status === 'failed' && <span style={{color:'var(--red)'}}>failed</span>}
                    {r.reviewed_at && <span style={{color:'var(--grn)'}}><Icon name="check" size={11}/> reviewed</span>}
                  </button>
                ))}
              </div>
            </Card>
          )}
        </>
      )}
    </div>
  );
}
