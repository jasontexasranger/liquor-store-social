const monthKey = d => {
  const dt = d instanceof Date ? d : new Date(d);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-01';
};
const monthLabel = iso => {
  const [y,m] = String(iso).split('-');
  return new Date(+y, +m-1, 1).toLocaleString(undefined, { month:'long', year:'numeric' });
};
const money = v => (v == null || v === '' ? '' : '$' + Number(v).toFixed(2));

// Prices arrive as "$27.00", "27", "$1,234.50" — strip anything that isn't a number.
const parseMoney = v => {
  if (v == null) return null;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  return isFinite(n) ? n : null;
};
const parseInt10 = v => {
  if (v == null) return null;
  const n = parseInt(String(v).replace(/[^0-9\-]/g, ''), 10);
  return isFinite(n) ? n : null;
};

// Savings on the existing sheet is the difference rounded to the nearest
// $0.25 — verified against all twelve rows of a real month. Marketing figure,
// not arithmetic, so it's a default rather than a fixed calculation.
const suggestSavings = (reg, sale) => {
  if (reg == null || sale == null) return null;
  return Math.round((reg - sale) * 4) / 4;
};

// One line of plain English the copy writer can work from, built from whatever
// the feature row actually has.
function featureBrief(f) {
  if (!f) return '';
  const bits = [f.name];
  if (f.size) bits.push('(' + f.size + ')');
  const parts = [bits.join(' ')];
  if (f.sale_price != null) {
    let price = 'on feature at $' + Number(f.sale_price).toFixed(2);
    if (f.reg_price != null) price += ', regularly $' + Number(f.reg_price).toFixed(2);
    parts.push(price);
  }
  if (f.savings != null) parts.push('save $' + Number(f.savings).toFixed(2));
  if (f.notes) parts.push(f.notes);
  return parts.join(' — ');
}

const FEATURE_BLANK = {
  name:'', size:'', reg_price:null, sale_price:null,
  savings:null,
  qty_sold:null, revenue:null, notes:'', product_id:null, campaign_id:null,
};

// Paste straight from the spreadsheet. Tab-separated, header row optional.
// Column order follows the existing sheet but headers win when present.
function parseFeaturePaste(text) {
  const rows = String(text || '').split(/\r?\n/).filter(l => l.trim());
  if (!rows.length) return [];

  const split = l => l.split('\t').map(c => c.trim());
  const HEAD = {
    name:['name','product','item'], size:['size','pack','format'],
    reg_price:['reg price','regular','reg','regular price'],
    sale_price:['sale price','sale','feature price','price'],
    savings:['savings','save'],
    qty_sold:['qty sold','qty','units','quantity'],
    revenue:['revenue','sales','$'],
    notes:['notes','note','comments'],
  };

  let map = null;
  const first = split(rows[0]).map(c => c.toLowerCase());
  if (first.some(c => HEAD.name.includes(c))) {
    map = {};
    first.forEach(function(cell, i) {
      for (const key in HEAD) if (HEAD[key].includes(cell)) map[key] = i;
    });
    rows.shift();
  }

  const at = (cells, key, fallbackIdx) => {
    const i = map && map[key] != null ? map[key] : fallbackIdx;
    return i == null ? '' : (cells[i] ?? '');
  };

  return rows.map(function(line) {
    const c = split(line);
    const name = String(at(c,'name',0) || '').trim();
    if (!name) return null;
    return {
      ...FEATURE_BLANK,
      name,
      size:       String(at(c,'size',1) || '').trim(),
      reg_price:  parseMoney(at(c,'reg_price',2)),
      sale_price: parseMoney(at(c,'sale_price',3)),
      savings:    parseMoney(at(c,'savings',4)),
      qty_sold:   parseInt10(at(c,'qty_sold',9)),
      revenue:    parseMoney(at(c,'revenue',10)),
      notes:      String(at(c,'notes',12) || '').trim(),
    };
  }).filter(Boolean);
}

// The three readiness bars from the sheet, computed rather than typed.
function featureStats(rows) {
  const n = rows.length;
  if (!n) return { data:0, sales:0, n:0 };
  const complete = rows.filter(r => r.name && r.size && r.reg_price != null && r.sale_price != null).length;
  const withSales = rows.filter(r => r.qty_sold != null || r.revenue != null).length;
  return {
    n,
    data:  Math.round(complete/n*100),
    sales: Math.round(withSales/n*100),
  };
}

function useFeaturePeriod(storeId, period) {
  const [periodRow, setPeriodRow] = useState(null);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async function() {
    const sb = getSB(); if (!sb || !storeId || !period) return;
    setLoading(true);
    const { data: p } = await sb.from('feature_periods')
      .select('*').eq('store_id', storeId).eq('period', period).maybeSingle();
    setPeriodRow(p || null);
    if (p) {
      const { data: f } = await sb.from('features')
        .select('*').eq('period_id', p.id).order('position');
      setRows(f || []);
    } else setRows([]);
    setLoading(false);
  }, [storeId, period]);

  useEffect(function(){ load(); }, [load]);

  const ensurePeriod = async function() {
    if (periodRow) return periodRow;
    const sb = getSB();
    const { data:{ user } } = await sb.auth.getUser();
    const { data, error } = await sb.from('feature_periods')
      .insert({ store_id:storeId, period, created_by:user?.id })
      .select().single();
    if (error) throw error;
    setPeriodRow(data);
    return data;
  };

  const addRows = async function(newRows) {
    const sb = getSB();
    const p = await ensurePeriod();
    const base = rows.length;
    const payload = newRows.map((r,i) => ({ ...r, period_id:p.id, position:base+i }));
    const { error } = await sb.from('features').insert(payload);
    if (error) throw error;
    await load();
  };

  const updateRow = async function(id, patch) {
    const sb = getSB();
    const { error } = await sb.from('features').update(patch).eq('id', id);
    if (error) throw error;
    setRows(prev => prev.map(r => r.id===id ? { ...r, ...patch } : r));
  };

  const deleteRow = async function(id) {
    const sb = getSB();
    const { error } = await sb.from('features').delete().eq('id', id);
    if (error) throw error;
    setRows(prev => prev.filter(r => r.id !== id));
  };

  const setStatus = async function(status) {
    const sb = getSB();
    const p = await ensurePeriod();
    const { error } = await sb.from('feature_periods').update({ status }).eq('id', p.id);
    if (error) throw error;
    setPeriodRow(prev => ({ ...prev, status }));
  };

  return { periodRow, rows, loading, reload:load, addRows, updateRow, deleteRow, setStatus, ensurePeriod };
}

// Suggests library products by name. Never blocks — linking is optional and
// only buys you the product photo downstream.
// Creates a library product without leaving the features grid. Prefilled from
// the feature row, so the common case is: pick an image, save.
function QuickProductCreate({ seedName, seedSize, onCreated, onClose }) {
  const dragPanel = useDragPanel();
  const toast = useToast();
  const { add } = useBrandImageLibrary();
  const [name, setName]   = useState(seedName || '');
  const [size, setSize]   = useState(seedSize || '');
  const [cat,  setCat]    = useState('');
  const [prev, setPrev]   = useState(null);
  const [hosted, setHosted] = useState(null);
  const [busy, setBusy]   = useState(false);
  const [showBCL, setShowBCL] = useState(false);
  const fileRef = useRef();

  const pickFile = function(f) {
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { setPrev(r.result); setHosted(null); };
    r.readAsDataURL(f);
  };

  const save = async function() {
    if (!name.trim()) { toast.error('Give the product a name'); return; }
    if (!prev && !hosted) { toast.error('Add a photo first'); return; }
    setBusy(true);
    try {
      const sb = getSB();
      // Empty strings, not nulls — several of these columns are NOT NULL, and
      // the main Product Library form has always written '' for blanks.
      const row = {
        store_id: null,
        product_name: name.trim(),
        size: size.trim(),
        category: cat || '',
        notes: '',
        // A hosted image already lives in Storage; an uploaded one gets
        // compressed into the base64 column like the rest of the library.
        image_url: hosted || null,
        data: hosted ? null : await compressImage(prev, 800, 0.8),
      };
      const { data, error } = await sb.from('brand_images').insert(row).select().single();
      if (error) throw error;
      toast.success('Product created and linked');
      onCreated(data);
      onClose();
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  return (
    <Portal>
    <div className="fixed inset-0 z-[210] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.88)', backdropFilter:'blur(4px)'}} onClick={onClose}>
      <div className="hud hud-brk w-full max-w-lg max-h-[88vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-center gap-3 mb-4">
          <span className="ttl flex-1">New product</span>
          <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>
        </div>

        <ImageDropZone className="p-3 mb-3 flex items-center justify-center"
          style={{border:'1px dashed var(--line2)', background:'rgba(var(--sink-rgb),.4)', minHeight:'132px'}}
          onImage={function(out){ setPrev(out.dataUrl); setHosted(out.hostedUrl || null); }}>
          {prev
            ? <img src={prev} alt="" style={{maxHeight:'150px'}} className="object-contain"/>
            : <div className="text-center py-4">
                <Icon name="image" size={24} style={{color:'var(--cy-dim)'}}/>
                <p className="lbl mt-2">Paste or drop a photo</p>
              </div>}
        </ImageDropZone>

        <div className="flex gap-2 flex-wrap mb-4">
          <Button size="sm" variant="secondary" onClick={()=>fileRef.current?.click()}>
            <Icon name="cam"/> Upload
          </Button>
          <Button size="sm" variant="outline" onClick={()=>setShowBCL(v=>!v)}>
            <Icon name="search"/> BC Liquor
          </Button>
          {prev && <Button size="sm" variant="ghost" onClick={()=>{setPrev(null);setHosted(null);}}>Clear</Button>}
          <input ref={fileRef} type="file" accept="image/*" className="hidden"
                 onChange={e=>{ pickFile(e.target.files?.[0]); e.target.value=''; }}/>
        </div>

        {showBCL && (
          <div className="mb-4">
            <BCLiquorSearch onImported={function(r){
              setHosted(r.image_url); setPrev(r.image_url);
              if (!name.trim()) setName(r.product.name || '');
              if (!size.trim() && r.product.package_size) setSize(r.product.package_size);
              setShowBCL(false);
            }}/>
          </div>
        )}

        <div className="grid grid-cols-2 gap-3 mb-3">
          <div><Label>Name</Label>
            <Input value={name} onChange={e=>setName(e.target.value)}/></div>
          <div><Label>Size</Label>
            <Input value={size} onChange={e=>setSize(e.target.value)} placeholder="750ML"/></div>
        </div>

        <div className="mb-5">
          <Label>Category</Label>
          <Select value={cat} onChange={e=>setCat(e.target.value)}>
            <option value="">Uncategorised</option>
            {LIQUOR_CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
          </Select>
        </div>

        <div className="flex gap-2">
          <Button onClick={save} loading={busy} className="flex-1">
            <Icon name="save"/> Create and link
          </Button>
          <Button variant="ghost" onClick={onClose}>Cancel</Button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

function ProductLink({ row, products, onLink, onCreated }) {
  const [open, setOpen] = useState(false);
  const [creating, setCreating] = useState(false);
  const linked = products.find(p => p.id === row.product_id);

  const suggestions = (function(){
    const q = (row.name || '').toLowerCase().replace(/[^a-z0-9 ]/g,'');
    if (!q) return [];
    const words = q.split(/\s+/).filter(w => w.length > 2);
    return products.map(function(p){
      const n = (p.product_name||'').toLowerCase().replace(/[^a-z0-9 ]/g,'');
      let score = 0;
      if (n === q) score = 100;
      else if (n.includes(q) || q.includes(n)) score = 70;
      else score = words.filter(w => n.includes(w)).length * 20;
      return { p, score };
    }).filter(x => x.score > 0).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.p);
  })();

  if (linked) {
    return (
      <button onClick={()=>onLink(row.id, null)} title={'Linked to ' + linked.product_name + ' — click to unlink'}
              className="flex items-center gap-1.5">
        <img src={prodSrc(linked)} alt="" className="w-7 h-7 object-cover" style={{border:'1px solid var(--cy)'}}/>
      </button>
    );
  }
  return (
    <div className="relative">
      <button onClick={()=>setOpen(v=>!v)} title="Link a product photo"
              className="w-7 h-7 flex items-center justify-center"
              style={{border:'1px dashed var(--line2)', color: suggestions.length ? 'var(--cy)' : 'var(--txt3)'}}>
        <Icon name="image" size={12}/>
      </button>
      {open && (
        <div className="absolute z-30 left-0 mt-1 w-60 p-2" style={{background:'var(--menu)', border:'1px solid var(--line2)'}}>
          {suggestions.length === 0
            ? <p className="lbl py-2 text-center">No close matches</p>
            : suggestions.map(function(p){
                return (
                  <button key={p.id} onClick={()=>{ onLink(row.id, p.id); setOpen(false); }}
                          className="flex items-center gap-2 w-full p-1.5 text-left"
                          style={{color:'var(--txt2)'}}>
                    <img src={prodSrc(p)} alt="" className="w-7 h-7 object-cover flex-none"/>
                    <span className="text-xs truncate">{p.product_name}</span>
                  </button>
                );
              })}
          <button onClick={()=>{ setCreating(true); setOpen(false); }}
                  className="flex items-center gap-2 w-full p-2 mt-1"
                  style={{color:'var(--cy)', borderTop:'1px solid var(--line)'}}>
            <Icon name="tag" size={13}/>
            <span className="text-xs">Create "{(row.name||'').slice(0,18)}"</span>
          </button>
          <button onClick={()=>setOpen(false)} className="lbl w-full text-center pt-1">Close</button>
        </div>
      )}

      {creating && (
        <QuickProductCreate seedName={row.name} seedSize={row.size}
          onCreated={function(prod){ onLink(row.id, prod.id); if (onCreated) onCreated(); }}
          onClose={()=>setCreating(false)}/>
      )}
    </div>
  );
}

// Defined at module scope on purpose. Declaring this inside FeaturesPage makes
// React see a brand-new component type on every render, remounting every input
// and stealing focus after each keystroke.
function FeatureCell({ row, field, type='text', align='left', onCommit }) {
  return (
    <input
      defaultValue={row[field] ?? ''}
      onFocus={e=>{ e.target.style.borderBottomColor='var(--cy)'; e.target.style.background='rgba(212,175,55,.06)'; }}
      onBlur={function(e){
        e.target.style.borderBottomColor = 'transparent';
        e.target.style.background = 'transparent';
        const raw = e.target.value;
        let v = raw === '' ? null : raw;
        if (type === 'money') v = parseMoney(raw);
        if (type === 'int')   v = parseInt10(raw);
        const prev = row[field] ?? null;
        if (String(v ?? '') === String(prev ?? '')) return;

        const patch = { [field]: v };
        // Savings tracks the prices unless someone has overridden it by hand.
        if (field === 'reg_price' || field === 'sale_price') {
          const reg  = field==='reg_price'  ? v : row.reg_price;
          const sale = field==='sale_price' ? v : row.sale_price;
          const auto = suggestSavings(reg, sale);
          const wasAuto = row.savings == null ||
            Number(row.savings) === suggestSavings(row.reg_price, row.sale_price);
          if (wasAuto && auto != null) patch.savings = auto;
        }
        onCommit(row.id, patch);
      }}
      onKeyDown={e=>{ if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { e.target.value = row[field] ?? ''; e.target.blur(); } }}
      style={{
        width:'100%', background:'transparent', border:'none',
        borderBottom:'1px solid transparent', color:'var(--txt)',
        fontSize:'12px', padding:'4px 5px', textAlign:align, outline:'none',
        fontFamily: type==='text' ? 'var(--disp)' : 'var(--mono)',
      }}
    />
  );
}

// ─────────────────────────────────────────────
// BATCH PRICE ADS FROM A MONTH'S FEATURES
// ─────────────────────────────────────────────
// Every feature that has a product photo linked gets rendered against every
// price ad template the store has, and the results land in the creative
// library tagged with the month they belong to.
//
// Rendering happens here in the browser, not on a server, because that's where
// the fonts, the template artwork and the background remover already live —
// the same code path the one-off ad builder uses, just in a loop.

// Canvas taints on a cross-origin image, and a tainted canvas can't be
// exported. Storage URLs do send CORS headers, but pulling the bytes down
// first removes the question entirely.
// Decoded by hand rather than with fetch(dataUrl). The site's Content Security
// Policy allows data: as an image source but not as a connection target, so
// fetching a data URL is blocked outright — which is what "Failed to fetch"
// meant on every image in the first batch run.
function dataUrlToBlob(dataUrl) {
  const comma = dataUrl.indexOf(',');
  const header = dataUrl.slice(0, comma);
  const mime = (header.match(/^data:([^;]+)/) || [,'image/png'])[1];
  const body = dataUrl.slice(comma + 1);

  if (!/;base64/i.test(header)) {
    return new Blob([decodeURIComponent(body)], { type: mime });
  }
  const bin = atob(body);
  // Chunked so a multi-megabyte PNG doesn't blow the argument limit.
  const parts = [];
  for (let i = 0; i < bin.length; i += 8192) {
    const slice = bin.slice(i, i + 8192);
    const buf = new Uint8Array(slice.length);
    for (let j = 0; j < slice.length; j++) buf[j] = slice.charCodeAt(j);
    parts.push(buf);
  }
  return new Blob(parts, { type: mime });
}

// Bytes for a product photo, wherever it came from. Library products are
// either a base64 column or a Storage URL, and only the second can be fetched.
function srcToBlob(src) {
  if (!src) return Promise.reject(new Error('No image'));
  if (src.startsWith('data:')) {
    try { return Promise.resolve(dataUrlToBlob(src)); }
    catch (e) { return Promise.reject(e); }
  }
  return fetch(src).then(r => r.blob());
}

function toDataUrl(src) {
  if (!src || src.startsWith('data:')) return Promise.resolve(src);
  return fetch(src)
    .then(r => r.blob())
    .then(b => new Promise(function(res, rej) {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error('Could not read image'));
      fr.readAsDataURL(b);
    }))
    .catch(() => src);   // fall back and let the canvas try
}

// ─────────────────────────────────────────────
// SIGNAGE PUSH
// ─────────────────────────────────────────────
// The month's creatives become an OptiSigns playlist, named the way the
// playlists in that account are already named by hand — "BROTHERS LRS -
// OCT 24" — and optionally put straight onto the store's mapped screens.
const signagePlaylistName = (storeName, period) => {
  const [y, m] = String(period).split('-').map(Number);
  const mon = new Date(y, m-1, 1).toLocaleString('en', { month:'short' }).toUpperCase();
  return storeName.split(' ')[0].toUpperCase() + ' LRS - ' + mon + ' ' + String(y).slice(2);
};

// One permanent schedule per store — OptiSigns keys can't delete schedules,
// so it's found by this name and reused forever. Month pushes become dated
// entries inside it.
const signageScheduleName = storeName =>
  storeName.split(' ')[0].toUpperCase() + ' LRS SCHEDULE';

const isoDay = d => {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
};

// 'YYYY-MM-DD' → '1 Sep 2026' without timezone drift.
const fmtDay = s => {
  const [y, m, d] = String(s).split('-').map(Number);
  if (!y || !m || !d) return String(s);
  return new Date(y, m-1, d).toLocaleDateString('en-CA', { day:'numeric', month:'short', year:'numeric' });
};

// ─────────────────────────────────────────────
// SIGNAGE CONSOLE
// ─────────────────────────────────────────────
// The admin view of everything OptiSigns is playing: which playlist each
// screen runs, and what's inside each playlist — order, timing, contents.
// Deleting playlists and screens stays in OptiSigns; the API key can't.
// What can honestly be previewed. Items we pushed are web assets whose link
// is the image itself, so those show for real. Files uploaded by hand inside
// OptiSigns live in their private bucket behind signed URLs we cannot mint —
// those get a typed tile rather than a broken image pretending otherwise.
function signagePreviewUrl(it) {
  let w = it.webLink || '';
  // Pushed items point at the letterbox viewer with the real image in ?img=.
  const m = /[?&]img=([^&]+)/.exec(w);
  if (m) { try { w = decodeURIComponent(m[1]); } catch(e) {} }
  if (/^https:\/\/.+\.(png|jpe?g|webp|gif)(\?|$)/i.test(w)) return w;
  // Some web assets point at Storage without an extension; our own bucket is
  // trustworthy for an <img>.
  if (/^https:\/\/[^/]+\.supabase\.co\/storage\//i.test(w)) return w;
  return null;
}

function signageTypeLabel(it) {
  const f = (it.filename || '').toLowerCase();
  if (/\.(mp4|mov|webm|avi)$/.test(f) || it.type === 'video') return 'VIDEO';
  if (/\.(png|jpe?g|webp|gif)$/.test(f)) return 'IMAGE';
  if (it.type === 'web') return 'WEB';
  return (f.split('.').pop() || it.type || 'FILE').toUpperCase().slice(0, 5);
}

// The same preview OptiSigns shows when you select a screen: not a camera on
// the TV (no API for that — verified), but the screen's actual content
// playing at its actual pace. For items we pushed it is pixel-identical,
// because the TV loads the very same images through the same letterbox page.
// Hand-uploaded files sit in OptiSigns' private storage, so they show as
// typed tiles for however many seconds they occupy.
function ScreenPreviewModal({ screen, playlistId, playlistName, account, onClose }) {
  const toast = useToast();
  const [items, setItems] = useState(null);
  const [idx,   setIdx]   = useState(0);

  useEffect(function() {
    let alive = true;
    if (!playlistId) { setItems([]); return; }
    callEdge('optisigns', 'playlistItems', { playlistId, storeId: account })
      .then(function(r){ if (alive) setItems(r.playlist.assets || []); })
      .catch(function(e){ if (alive) { setItems([]); toast.error(e.message); } });
    return function(){ alive = false; };
  }, [playlistId]);

  // Advance at each item's own duration, like the player does.
  useEffect(function() {
    if (!items || !items.length) return;
    const cur = items[idx % items.length];
    const t = setTimeout(function(){ setIdx(i => (i + 1) % items.length); },
                         Math.max(1, Number(cur.duration) || 7) * 1000);
    return function(){ clearTimeout(t); };
  }, [items, idx]);

  const portrait = /portrait/i.test(screen.orientation || '');
  const boxW = portrait ? 304 : 640, boxH = portrait ? 540 : 360;
  const cur = items && items.length ? items[idx % items.length] : null;
  const url = cur ? signagePreviewUrl(cur) : null;

  return (
    <Portal>
    <div className="fixed inset-0 z-[220] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.9)', backdropFilter:'blur(4px)'}} onClick={onClose}>
      <div className="hud hud-brk p-5" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-3">
          <span className="ttl">{screen.deviceName}</span>
          <span className="lbl">{playlistName || 'nothing assigned'}</span>
          <span className="flex-1"/>
          <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>
        </div>
        <div className="flex items-center justify-center"
             style={{width: boxW+'px', height: boxH+'px', background:'#000',
                     border:'1px solid var(--line)'}}>
          {!playlistId ? (
            <p className="lbl px-6 text-center">This screen has no playlist right now.</p>
          ) : items === null ? (
            <p className="lbl">Loading…</p>
          ) : !items.length ? (
            <p className="lbl">The playlist is empty.</p>
          ) : url ? (
            <img src={url} alt="" style={{maxWidth:'100%', maxHeight:'100%', objectFit:'contain'}}/>
          ) : (
            <div className="flex flex-col items-center gap-2">
              <Icon name={signageTypeLabel(cur)==='VIDEO' ? 'play' : 'file'} size={26}
                    style={{color:'var(--cy-dim)'}}/>
              <span className="lbl">{cur.filename}</span>
              <span className="lbl" style={{color:'var(--txt3)'}}>
                {signageTypeLabel(cur)} — stored inside OptiSigns, preview there
              </span>
            </div>
          )}
        </div>
        {items && items.length > 0 && (
          <div className="flex items-center gap-2 mt-3">
            <span className="lbl">{(idx % items.length) + 1} / {items.length}</span>
            <span className="lbl truncate flex-1">{cur && cur.filename}</span>
            <span className="lbl">{cur ? (Number(cur.duration) || 7) + 's' : ''}</span>
          </div>
        )}
      </div>
    </div>
    </Portal>
  );
}

function SignagePage() {
  const toast = useToast();
  // Which OptiSigns account the console is looking at. Stores whose key
  // secret differs from the default are separate accounts — Cobblestone —
  // and every call below carries the chosen account's storeId so the edge
  // function picks the matching key.
  const [accounts, setAccounts] = useState([{ label:'Sueño', storeId: undefined }]);
  const [account,  setAccount]  = useState(undefined);   // storeId or undefined
  const [screens,   setScreens]   = useState(null);
  const [playlists, setPlaylists] = useState(null);
  const [open,      setOpen]      = useState(null);   // playlist id being edited
  const [items,     setItems]     = useState(null);
  const [busy,      setBusy]      = useState(null);
  const [durDraft,  setDurDraft]  = useState({});     // pos -> value being typed
  const [showAdd,   setShowAdd]   = useState(false);
  const [newName,   setNewName]   = useState('');
  const [schedules, setSchedules] = useState(null);
  const [runDates,  setRunDates]  = useState({});     // asset_id -> row, for the open playlist
  const [rdDraft,   setRdDraft]   = useState({});     // asset_id -> {so, eo} being edited

  // Which screens belong to which brand, and which account each brand lives
  // on — drives both the brand filter tiles and the account auto-switch.
  const [brand,     setBrand]     = useState(null);   // store id or null = all
  const [brandMap,  setBrandMap]  = useState({});     // store_id -> { screenIds, ownAccount }

  useEffect(function() {
    const sb = getSB(); if (!sb) return;
    sb.from('meta_accounts').select('store_id, optisigns_key_secret, optisigns_screen_ids')
      .then(function(res) {
        const extra = (res.data || [])
          .filter(r => r.optisigns_key_secret && r.optisigns_key_secret !== 'OPTISIGNS_API_KEY')
          .map(r => ({
            label: (STORES.find(s=>s.id===r.store_id)||{name:r.store_id}).name.split(' ')[0],
            storeId: r.store_id,
          }));
        setAccounts([{ label:'Sueño', storeId: undefined }].concat(extra));
        const bm = {};
        (res.data || []).forEach(function(r) {
          bm[r.store_id] = {
            screenIds: r.optisigns_screen_ids || [],
            ownAccount: (r.optisigns_key_secret && r.optisigns_key_secret !== 'OPTISIGNS_API_KEY')
              ? r.store_id : undefined,
          };
        });
        setBrandMap(bm);
      });
  }, []);

  // Picking a brand narrows the screens to that store's mapped signs — and
  // hops to its OptiSigns account first if it lives on a separate one.
  const pickBrand = function(id) {
    if (id === 'all') { setBrand(null); return; }
    setBrand(id);
    const acct = (brandMap[id] || {}).ownAccount;
    if (acct !== account) setAccount(acct);
  };

  const load = useCallback(async function() {
    setScreens(null); setPlaylists(null); setSchedules(null);
    try {
      // Opportunistic sweep: expired items come off (and due items go back
      // on) the live playlists whenever anyone opens this page, so the daily
      // cron is a backstop rather than the only enforcement.
      try { await callEdge('optisigns', 'sweepSignage', { storeId: account }); } catch(e) {}
      const [s, p, sc] = await Promise.all([
        callEdge('optisigns', 'listScreens', { storeId: account }),
        callEdge('optisigns', 'listPlaylists', { storeId: account }),
        callEdge('optisigns', 'listSchedules', { storeId: account }),
      ]);
      setScreens(s.screens || []);
      setPlaylists((p.playlists || []).sort((a,b)=>a.name.localeCompare(b.name)));
      // LRS schedules first — the pub and office ones matter less here.
      setSchedules((sc.schedules || []).sort((a,b)=>
        (/LRS SCHEDULE/i.test(b.name) - /LRS SCHEDULE/i.test(a.name)) || a.name.localeCompare(b.name)));
    } catch(e) { setScreens([]); setPlaylists([]); setSchedules([]); toast.error(e.message); }
  }, [account]);
  useEffect(function(){ setOpen(null); setItems(null); load(); }, [load]);

  const plName = id => (playlists || []).find(p => p._id === id)?.name || '—';

  const loadRunDates = async function(id) {
    try {
      const r = await callEdge('optisigns', 'itemDates', { playlistId: id, storeId: account });
      const map = {};
      (r.dates || []).forEach(d => { map[d.asset_id] = d; });
      setRunDates(map);
    } catch(e) { setRunDates({}); }
  };

  const openPlaylist = async function(id) {
    if (open === id) { setOpen(null); setItems(null); return; }
    setOpen(id); setItems(null); setDurDraft({}); setRunDates({}); setRdDraft({});
    try {
      const [r] = await Promise.all([
        callEdge('optisigns', 'playlistItems', { playlistId: id, storeId: account }),
        loadRunDates(id),
      ]);
      setItems(r.playlist.assets || []);
    } catch(e) { setItems([]); toast.error(e.message); }
  };

  const refreshItems = async function(id) {
    const r = await callEdge('optisigns', 'playlistItems', { playlistId: id, storeId: account });
    setItems(r.playlist.assets || []);
    await loadRunDates(id);
    await load();
  };

  // Commit one item's run window. Applies on the spot: give a live item a
  // future start date and it leaves the playlist immediately, coming back on
  // that date.
  const commitRunDates = function(assetId, filename, so, eo) {
    if (!so && !eo) return;
    act('rd-' + assetId, async function() {
      const r = await callEdge('optisigns', 'setItemDates', {
        playlistId: open, storeId: account, assetId, filename,
        startsOn: so || null, endsOn: eo || null,
      });
      setRdDraft(prev => { const n = Object.assign({}, prev); delete n[assetId]; return n; });
      toast.success(r.removed ? 'Saved — off the playlist until its start date' : 'Run dates saved');
      await refreshItems(open);
    });
  };

  const clearRunDates = function(assetId) {
    act('rd-' + assetId, async function() {
      await callEdge('optisigns', 'clearItemDates', { playlistId: open, storeId: account, assetId });
      setRdDraft(prev => { const n = Object.assign({}, prev); delete n[assetId]; return n; });
      toast.success('Dates cleared — always plays');
      await refreshItems(open);
    });
  };

  const act = async function(label, fn) {
    setBusy(label);
    try { await fn(); }
    catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  const assign = (screenId, playlistId) => act('assign-' + screenId, async function() {
    if (!playlistId) return;
    const scr = screens.find(x => x._id === screenId);
    if (!confirm('Put "' + plName(playlistId) + '" on ' + (scr?.deviceName || 'this screen') + ' now?')) return;
    await callEdge('optisigns', 'assignScreen', { screenId, playlistId, storeId: account });
    toast.success((scr?.deviceName || 'Screen') + ' is now playing ' + plName(playlistId));
    await load();
  });

  const removeAt = (pos) => act('rm-' + pos, async function() {
    await callEdge('optisigns', 'removeItems', { playlistId: open, pos: [pos], storeId: account });
    await refreshItems(open);
  });

  const move = (from, to) => act('mv-' + from, async function() {
    if (to < 0 || to >= items.length) return;
    await callEdge('optisigns', 'moveItems', { playlistId: open, froms: [from], to, storeId: account });
    await refreshItems(open);
  });

  const commitDur = (pos) => act('dur-' + pos, async function() {
    const v = Number(durDraft[pos]);
    if (!(v >= 1 && v <= 300)) { toast.error('Seconds must be between 1 and 300'); return; }
    await callEdge('optisigns', 'setDurations', { playlistId: open, updates: [{ pos, duration: v }], storeId: account });
    await refreshItems(open);
  });

  const createList = () => act('create', async function() {
    if (!newName.trim()) { toast.error('Give the playlist a name'); return; }
    await callEdge('optisigns', 'createPlaylist', { name: newName.trim(), storeId: account });
    setNewName('');
    toast.success('Playlist created');
    await load();
  });

  const screensPlaying = id => (screens || []).filter(s => s.currentPlaylistId === id).map(s => s.deviceName);

  const shownScreens = brand
    ? (screens || []).filter(s => ((brandMap[brand] || {}).screenIds || []).includes(s._id))
    : (screens || []);

  const [preview, setPreview] = useState(null);   // screen being previewed
  const [plBrand, setPlBrand] = useState('all');  // playlist tag filter

  // Recognized tags are the store slugs plus 'global'; anything else is left
  // alone (OptiSigns users can tag things for their own reasons).
  const KNOWN_TAGS = STORES.map(s=>s.id).concat(['global']);
  const plTag = pl => ((pl.tags || []).find(t => KNOWN_TAGS.includes(t))) || '';
  const shownPlaylists = (playlists || []).filter(pl =>
    plBrand === 'all' ? true : plTag(pl) === plBrand);

  const setTag = (pl, tag) => act('tag-' + pl._id, async function() {
    await callEdge('optisigns', 'setPlaylistTags', {
      playlistId: pl._id, storeId: account,
      tags: tag ? [tag] : [],
    });
    toast.success(tag ? 'Tagged ' + tag : 'Tag cleared');
    await load();
  });

  // What a screen is actually showing right now: its playlist directly, or —
  // when it follows a schedule — the schedule entry whose dates cover today.
  const playlistOnScreen = function(sc) {
    if ((sc.currentType || '').toLowerCase() === 'playlist') return sc.currentPlaylistId || null;
    if ((sc.currentType || '').toLowerCase() === 'schedule') {
      const s = (schedules || []).find(x => x._id === sc.currentScheduleId);
      const today = isoDay(new Date());
      const hit = s && s.items.find(it =>
        it.playlistId && it.startDate && it.startDate <= today &&
        (!it.endDate || it.endDate >= today));
      return hit ? hit.playlistId : null;
    }
    return null;
  };

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex items-center gap-3 mb-4 flex-wrap">
          <span className="ttl">Screens</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {accounts.length > 1 && (
            <div className="flex" style={{border:'1px solid var(--line)'}}>
              {accounts.map(function(a) {
                const on = account === a.storeId;
                return (
                  <button key={a.label} onClick={()=>{ setBrand(null); setAccount(a.storeId); }}
                    className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                    style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
                    {a.label}
                  </button>
                );
              })}
            </div>
          )}
          <Button size="sm" variant="secondary" onClick={load}>Refresh</Button>
        </div>

        <div className="mb-4">
          <StorePicker compact value={brand || 'all'} onChange={pickBrand} allLabel="All screens"/>
        </div>

        {screens === null ? <p className="lbl text-center py-8">Loading from OptiSigns…</p> : (
          <div className="overflow-x-auto">
            <table style={{width:'100%', minWidth:'640px', borderCollapse:'collapse'}}>
              <thead>
                <tr style={{borderBottom:'1px solid var(--line2)'}}>
                  {['Screen','Now playing','Change to'].map(h=>(
                    <th key={h} className="lbl" style={{textAlign:'left', padding:'0 8px 8px'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {shownScreens.length === 0 && (
                  <tr><td colSpan="3" className="text-xs py-6 text-center" style={{color:'var(--amb)'}}>
                    {brand
                      ? 'No screens are mapped to this store yet — set that under Settings → Store locations.'
                      : 'No screens on this account.'}
                  </td></tr>
                )}
                {shownScreens.map(function(sc) {
                  return (
                    <tr key={sc._id} style={{borderBottom:'1px solid rgba(212,175,55,.07)'}}>
                      <td className="text-xs" style={{padding:'7px 8px', color:'var(--txt)'}}>
                        {sc.deviceName}
                        <span className="lbl block">{sc.orientation}</span>
                      </td>
                      <td className="text-xs" style={{padding:'7px 8px', color:'var(--cy)'}}>
                        <span className="flex items-center gap-2">
                          <span>
                            {sc.currentType === 'playlist' ? plName(sc.currentPlaylistId)
                             : (sc.currentType || '').toLowerCase() === 'schedule'
                               ? ((schedules||[]).find(x=>x._id===sc.currentScheduleId)||{}).name || 'schedule'
                             : sc.currentType || '—'}
                            {(sc.currentType || '').toLowerCase() === 'schedule' &&
                              <span className="lbl block" style={{color:'var(--txt3)'}}>on a schedule</span>}
                          </span>
                          <button onClick={()=>setPreview(sc)} title="Preview this screen"
                                  style={{color:'var(--txt3)'}} aria-label={'Preview ' + sc.deviceName}>
                            <Icon name="eye" size={13}/>
                          </button>
                        </span>
                      </td>
                      <td style={{padding:'7px 8px'}}>
                        {/* The dropdown resets to placeholder after each change;
                            the confirm is the real gate — this alters a live
                            screen the moment it succeeds. */}
                        <Select value="" className="w-auto text-xs"
                                disabled={busy === 'assign-' + sc._id}
                                onChange={e=>{ assign(sc._id, e.target.value); e.target.value=''; }}>
                          <option value="">{busy === 'assign-' + sc._id ? 'Switching…' : 'Pick a playlist…'}</option>
                          {(playlists||[]).map(p=>(
                            <option key={p._id} value={p._id}>{p.name}</option>
                          ))}
                        </Select>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Card>
        <div className="flex items-center gap-3 mb-4 flex-wrap">
          <span className="ttl">Playlists</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          <Input value={newName} onChange={e=>setNewName(e.target.value)}
                 placeholder="New playlist name…" className="w-auto text-xs"/>
          <Button size="sm" onClick={createList} loading={busy==='create'}>Create</Button>
        </div>

        <div className="mb-4">
          <StorePicker compact value={plBrand} onChange={setPlBrand} allLabel="All"
                       extra={[{value:'global', label:'Global', title:'Playlists tagged global'}]}/>
        </div>

        {playlists === null ? <p className="lbl text-center py-8">Loading…</p> : shownPlaylists.map(function(pl) {
          const playing = screensPlaying(pl._id);
          const isOpen = open === pl._id;
          return (
            <div key={pl._id} className="mb-2" style={{border:'1px solid ' + (isOpen ? 'var(--cy)' : 'var(--line)')}}>
              <div className="flex items-center gap-3 w-full p-3">
                <button onClick={()=>openPlaylist(pl._id)}
                  className="flex items-center gap-3 flex-1 min-w-0 text-left">
                  <span className="text-xs font-semibold" style={{color:'var(--txt)'}}>{pl.name}</span>
                  <span className="lbl">{(pl.assets||[]).length} item{(pl.assets||[]).length===1?'':'s'}</span>
                  {playing.length > 0 && (
                    <span className="lbl" style={{color:'var(--grn)'}}>
                      playing on {playing.join(', ')}
                    </span>
                  )}
                  <span className="flex-1"/>
                  <Icon name={isOpen ? 'up' : 'down'} size={12} style={{color:'var(--txt3)'}}/>
                </button>
                <Select value={plTag(pl)} className="w-auto text-xs flex-none"
                        disabled={busy === 'tag-' + pl._id}
                        onClick={e=>e.stopPropagation()}
                        onChange={e=>setTag(pl, e.target.value)}
                        title="Brand tag — filters this list and shows in OptiSigns">
                  <option value="">no tag</option>
                  <option value="global">Global</option>
                  {STORES.map(s=>(
                    <option key={s.id} value={s.id}>{s.name.split(' ')[0]}</option>
                  ))}
                </Select>
                {/* Live playlists get no delete button at all — the server
                    refuses anyway, but not offering it is clearer. */}
                {playing.length === 0 && (
                  <button
                    onClick={async function(){
                      const typed = prompt(
                        'Delete "' + pl.name + '" from OptiSigns for good?\n\n' +
                        'Type the playlist name to confirm:');
                      if (typed === null) return;
                      if (typed.trim() !== pl.name.trim()) {
                        toast.error('Name did not match — nothing deleted');
                        return;
                      }
                      await act('del-' + pl._id, async function() {
                        await callEdge('optisigns', 'deletePlaylist', { playlistId: pl._id, storeId: account });
                        toast.success('"' + pl.name + '" deleted');
                        if (open === pl._id) { setOpen(null); setItems(null); }
                        await load();
                      });
                    }}
                    disabled={!!busy}
                    className="flex-none p-1.5"
                    style={{color:'var(--red)', opacity: busy ? 0.4 : 1}}
                    aria-label={'Delete ' + pl.name}
                    title="Delete this playlist from OptiSigns">
                    <Icon name="trash" size={12}/>
                  </button>
                )}
              </div>

              {isOpen && (
                <div className="px-3 pb-3" style={{borderTop:'1px solid var(--line)'}}>
                  {playing.length > 0 && (
                    <p className="text-xs mt-2" style={{color:'var(--amb)'}}>
                      <Icon name="warn" size={11} className="mr-1"/>
                      Live on {playing.join(', ')} — edits show on screen within a minute or two.
                    </p>
                  )}

                  {items === null ? <p className="lbl py-4">Loading items…</p>
                   : items.length === 0 ? <p className="lbl py-4">Empty playlist.</p>
                   : items.map(function(it, i) {
                    return (
                      <div key={(it._id||'') + i} className="flex items-center gap-2 py-1.5"
                           style={{borderBottom:'1px solid rgba(212,175,55,.06)'}}>
                        {(function() {
                          const url = signagePreviewUrl(it);
                          return url
                            ? <img src={url} alt="" className="w-14 h-9 object-cover flex-none cursor-zoom-in"
                                   style={{border:'1px solid var(--line)'}}
                                   onClick={()=>window.open(url, '_blank', 'noopener')}/>
                            : <span className="w-14 h-9 flex-none flex flex-col items-center justify-center"
                                    style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.6)'}}
                                    title="Preview only available in the OptiSigns dashboard — this file lives in their private storage">
                                <Icon name={signageTypeLabel(it)==='VIDEO' ? 'play' : 'file'} size={11}
                                      style={{color:'var(--cy-dim)'}}/>
                                <span style={{fontSize:'8px', letterSpacing:'.08em', color:'var(--txt3)'}}>
                                  {signageTypeLabel(it)}
                                </span>
                              </span>;
                        })()}
                        <span className="mono lbl flex-none" style={{width:'20px'}}>{i+1}</span>
                        <span className="text-xs flex-1 truncate" style={{color:'var(--txt2)'}}
                              title={it.filename}>{it.filename}</span>

                        {(function() {
                          const row = runDates[it._id];
                          const d = rdDraft[it._id] || {};
                          const so = d.so !== undefined ? d.so : (row ? row.starts_on || '' : '');
                          const eo = d.eo !== undefined ? d.eo : (row ? row.ends_on || '' : '');
                          const dirty = d.so !== undefined || d.eo !== undefined;
                          return (
                            <span className="flex items-center gap-1 flex-none"
                                  title="Run dates — the item is only in the rotation between these days">
                              <Input type="date" className="text-xs"
                                     style={{width:'118px', padding:'3px 4px',
                                             opacity: so || row ? 1 : 0.55}}
                                     value={so}
                                     onChange={e=>setRdDraft(prev=>Object.assign({}, prev,
                                       {[it._id]: Object.assign({}, prev[it._id], {so: e.target.value})}))}/>
                              <span className="lbl">–</span>
                              <Input type="date" className="text-xs"
                                     style={{width:'118px', padding:'3px 4px',
                                             opacity: eo || row ? 1 : 0.55}}
                                     value={eo}
                                     onChange={e=>setRdDraft(prev=>Object.assign({}, prev,
                                       {[it._id]: Object.assign({}, prev[it._id], {eo: e.target.value})}))}/>
                              {dirty && (so || eo) && (
                                <Button size="sm" variant="ghost" disabled={!!busy}
                                        onClick={()=>commitRunDates(it._id, it.filename, so, eo)}
                                        aria-label="Save run dates" title="Save run dates">
                                  <Icon name="check" size={11} style={{color:'var(--grn)'}}/>
                                </Button>
                              )}
                              {row && !dirty && (
                                <Button size="sm" variant="ghost" disabled={!!busy}
                                        onClick={()=>clearRunDates(it._id)}
                                        aria-label="Clear run dates" title="Clear dates — always plays">
                                  <Icon name="close" size={10} style={{color:'var(--txt3)'}}/>
                                </Button>
                              )}
                            </span>
                          );
                        })()}

                        <span className="flex items-center gap-1 flex-none">
                          <Input type="number" min="1" max="300" className="text-xs"
                                 style={{width:'58px', padding:'3px 6px'}}
                                 value={durDraft[i] !== undefined ? durDraft[i] : (it.duration ?? 7)}
                                 onChange={e=>setDurDraft(prev=>Object.assign({}, prev, {[i]: e.target.value}))}
                                 onBlur={()=>{ if (durDraft[i] !== undefined && Number(durDraft[i]) !== it.duration) commitDur(i); }}
                                 onKeyDown={e=>{ if (e.key === 'Enter') e.target.blur(); }}/>
                          <span className="lbl">s</span>
                        </span>

                        <Button size="sm" variant="ghost" onClick={()=>move(i, i-1)}
                                disabled={i===0 || !!busy} aria-label="Move up">
                          <Icon name="up" size={11}/>
                        </Button>
                        <Button size="sm" variant="ghost" onClick={()=>move(i, i+1)}
                                disabled={i===items.length-1 || !!busy} aria-label="Move down">
                          <Icon name="down" size={11}/>
                        </Button>
                        <Button size="sm" variant="ghost" onClick={()=>removeAt(i)}
                                disabled={!!busy} aria-label="Remove from playlist">
                          <Icon name="close" size={11}/>
                        </Button>
                      </div>
                    );
                  })}

                  {(function() {
                    const present = new Set((items || []).map(x => x._id));
                    const waiting = Object.values(runDates)
                      .filter(r => r.state === 'pending' && !present.has(r.asset_id));
                    if (!waiting.length) return null;
                    return (
                      <div className="mt-2 p-2" style={{border:'1px dashed var(--line)'}}>
                        <p className="lbl mb-1">Waiting to join this playlist</p>
                        {waiting.map(function(r) {
                          return (
                            <div key={r.asset_id} className="flex items-center gap-3 py-1">
                              <Icon name="clock" size={11} style={{color:'var(--amb)'}}/>
                              <span className="text-xs flex-1 truncate" style={{color:'var(--txt2)'}}>
                                {r.filename || r.asset_id}
                              </span>
                              <span className="lbl" style={{color:'var(--amb)'}}>
                                returns {fmtDay(r.starts_on)}{r.ends_on ? ' · until ' + fmtDay(r.ends_on) : ''}
                              </span>
                              <Button size="sm" variant="ghost" disabled={!!busy}
                                      onClick={()=>clearRunDates(r.asset_id)}
                                      title="Clear dates and put it back now">
                                <Icon name="close" size={10} style={{color:'var(--txt3)'}}/>
                              </Button>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}

                  <div className="flex gap-2 mt-3">
                    <Button size="sm" variant="outline" onClick={()=>setShowAdd(true)}>
                      <Icon name="image"/> Add from creative library
                    </Button>
                  </div>

                  {showAdd && (
                    <CreativePicker allowed={AD_ASPECTS} storeIds={null} multi max={20}
                      onPickMany={function(chosen){
                        act('add', async function() {
                          await callEdge('optisigns', 'addCreatives', {
                            playlistId: open, storeId: account,
                            items: chosen.map(c => ({ url: c.public_url, name: c.name })),
                          });
                          toast.success(chosen.length + ' added');
                          await refreshItems(open);
                        });
                      }}
                      onClose={()=>setShowAdd(false)}/>
                  )}
                </div>
              )}
            </div>
          );
        })}
        <p className="lbl mt-2">
          Playlists can be deleted here once nothing is playing them. Assets and
          screens are still deleted in the OptiSigns dashboard only.
        </p>
      </Card>

      {preview && (
        <ScreenPreviewModal
          screen={preview}
          playlistId={playlistOnScreen(preview)}
          playlistName={(function(){
            const id = playlistOnScreen(preview);
            return id ? plName(id) : null;
          })()}
          account={account}
          onClose={()=>setPreview(null)}/>
      )}
    </div>
  );
}

function SignagePushModal({ storeId, storeName, period, periodRow, onClose }) {
  const dragPanel = useDragPanel();
  const toast = useToast();
  const { creatives } = useCreatives();
  const [screens,  setScreens]  = useState(null);   // null = loading
  const [mapped,   setMapped]   = useState([]);
  const [pickScr,  setPickScr]  = useState([]);
  const [picked,   setPicked]   = useState(null);   // creative ids; null = all
  const [aspect,   setAspect]   = useState('all');
  const [name,     setName]     = useState(signagePlaylistName(storeName, period));
  const [duration, setDuration] = useState(8);
  const [busy,     setBusy]     = useState(false);
  const [done,     setDone]     = useState(null);

  // When the month's run dates start in the future, the natural intent is
  // "have it appear on the start date" — so scheduled is the default then,
  // and "now" is the default when the run is already underway.
  const runR = periodRange(period, periodRow);
  const runStart = isoDay(runR.start);
  const runEnd   = isoDay(runR.end);
  const [when,      setWhen]      = useState(runStart > isoDay(new Date()) ? 'dates' : 'now');
  const [schedFrom, setSchedFrom] = useState(runStart);
  const [schedTo,   setSchedTo]   = useState(runEnd);

  // This month's creatives for this store. Screens are 16:9, so those lead;
  // squares still work — OptiSigns letterboxes them.
  const allMonth = creatives
    .filter(c => c.store_id === storeId && String(c.period) === String(period))
    .sort((a,b) => (a.aspect === '16:9' ? -1 : 1) - (b.aspect === '16:9' ? -1 : 1));
  const sizesPresent = [...new Set(allMonth.map(c => c.aspect))];
  const monthCreatives = aspect === 'all'
    ? allMonth
    : allMonth.filter(c => c.aspect === aspect);

  useEffect(function() {
    let alive = true;
    Promise.all([
      callEdge('optisigns', 'listScreens', { storeId }),
      getSB().from('meta_accounts').select('optisigns_screen_ids').eq('store_id', storeId).maybeSingle(),
    ]).then(function([scr, acct]) {
      if (!alive) return;
      const ids = (acct.data && acct.data.optisigns_screen_ids) || [];
      setScreens(scr.screens || []);
      setMapped(ids);
      setPickScr(ids);   // mapped screens ticked by default
    }).catch(function(e){ if (alive) { setScreens([]); toast.error(e.message); } });
    return function(){ alive = false; };
  }, [storeId]);

  const isOn = id => picked === null ? true : picked.has(id);
  const toggle = id => setPicked(function(prev) {
    const next = new Set(prev === null ? monthCreatives.map(c=>c.id) : prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const chosen = monthCreatives.filter(c => isOn(c.id));

  const push = async function() {
    if (!chosen.length) { toast.error('Pick at least one image'); return; }
    setBusy(true);
    try {
      const r = await callEdge('optisigns', 'pushPlaylist', {
        storeId, name,
        items: chosen.map(c => ({ url: c.public_url, name: c.name, duration: Number(duration) || 8 })),
        screenIds: pickScr,
        tag: storeId,
        schedule: when === 'dates'
          ? { name: signageScheduleName(storeName), startDate: schedFrom, endDate: schedTo }
          : undefined,
      });
      setDone(r);
      toast.success('Playlist "' + r.name + '" created with ' + r.items + ' items'
        + (r.assigned.length ? ' and put on ' + r.assigned.length + ' screen' + (r.assigned.length===1?'':'s') : ''));
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  const mappedScreens = (screens || []).filter(s => mapped.includes(s._id));

  return (
    <Portal>
    <div className="fixed inset-0 z-[210] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.88)', backdropFilter:'blur(4px)'}}
         onClick={busy ? undefined : onClose}>
      <div className="hud hud-brk w-full max-w-2xl max-h-[88vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-center gap-3 mb-4">
          <span className="ttl">Send to signage</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {!busy && <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>}
        </div>

        {done ? (
          <div>
            <p className="text-sm mb-2" style={{color:'var(--txt)'}}>
              "{done.name}" is on OptiSigns with {done.items} item{done.items===1?'':'s'}.
            </p>
            {done.scheduled && (
              <p className="text-xs mb-2" style={{color:'var(--cy)'}}>
                Scheduled {fmtDay(done.scheduled.startDate)} – {fmtDay(done.scheduled.endDate)} on
                "{done.scheduled.name}".
                {done.bridged ? ' The current playlist keeps playing until then.' : ''}
              </p>
            )}
            {done.assigned.length > 0 && (
              <p className="text-xs mb-2" style={{color:'var(--grn)'}}>
                {done.scheduled
                  ? done.assigned.length + ' screen' + (done.assigned.length===1?'':'s') + ' set to follow the schedule.'
                  : 'Now playing on ' + done.assigned.length + ' screen' + (done.assigned.length===1?'':'s') + '.'}
              </p>
            )}
            {done.failedAssign.length > 0 && (
              <div className="p-2.5 mb-3" style={{border:'1px solid var(--amb)'}}>
                {done.failedAssign.map((f,i)=><p key={i} className="text-xs" style={{color:'var(--amb)'}}>{f}</p>)}
              </div>
            )}
            {done.assigned.length === 0 && (
              <p className="lbl mb-3">No screens were changed — assign it in OptiSigns when ready.</p>
            )}
            <div className="flex justify-end"><Button size="sm" onClick={onClose}>Done</Button></div>
          </div>
        ) : (
          <div>
            <p className="lbl mb-4">{storeName} · {monthLabel(period)}</p>

            {monthCreatives.length === 0 ? (
              <p className="text-xs py-6 text-center" style={{color:'var(--amb)'}}>
                No creatives for {monthLabel(period)} yet — generate them first.
              </p>
            ) : (
              <React.Fragment>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div>
                    <Label>Playlist name</Label>
                    <Input value={name} onChange={e=>setName(e.target.value)} className="text-xs"/>
                  </div>
                  <div>
                    <Label>Seconds per image</Label>
                    <Input type="number" min="3" max="60" value={duration}
                           onChange={e=>setDuration(e.target.value)} className="text-xs"/>
                  </div>
                </div>

                <div className="flex items-center gap-2 mb-1 flex-wrap">
                  <Label className="mb-0">Images · {chosen.length} of {monthCreatives.length}</Label>
                  <span className="flex-1"/>
                  {sizesPresent.length > 1 && (
                    <div className="flex" style={{border:'1px solid var(--line)'}}>
                      {[['all','All']].concat(sizesPresent.map(a=>[a,a])).map(function(o) {
                        const on = aspect === o[0];
                        return (
                          <button key={o[0]} onClick={()=>setAspect(o[0])}
                            className="px-2.5 py-1 text-xs"
                            style={{ background:on?'var(--cy-glow)':'transparent',
                                     color:on?'var(--cy)':'var(--txt2)' }}>
                            {o[1]}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
                <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 mb-4"
                     style={{maxHeight:'190px', overflowY:'auto'}}>
                  {monthCreatives.map(function(c) {
                    const on = isOn(c.id);
                    return (
                      <button key={c.id} onClick={()=>toggle(c.id)} className="relative"
                        style={{outline: on ? '2px solid var(--cy)' : '1px solid var(--line)',
                                opacity: on ? 1 : 0.45}}>
                        <img src={c.public_url} alt={c.name} className="w-full object-cover"
                             style={{aspectRatio:'1'}}/>
                        {c.aspect === '16:9' &&
                          <span className="lbl absolute bottom-0 left-0 px-1"
                                style={{background:'rgba(var(--sink2-rgb),.85)', color:'var(--cy)'}}>16:9</span>}
                      </button>
                    );
                  })}
                </div>

                <Label>When should it play?</Label>
                <div className="flex mb-2" style={{border:'1px solid var(--line)'}}>
                  {[['now','Go live now'],['dates','Run on set dates']].map(function(o) {
                    const on = when === o[0];
                    return (
                      <button key={o[0]} onClick={()=>setWhen(o[0])}
                        className="px-3 py-1.5 text-xs flex-1"
                        style={{ background:on?'var(--cy-glow)':'transparent',
                                 color:on?'var(--cy)':'var(--txt2)' }}>
                        {o[1]}
                      </button>
                    );
                  })}
                </div>
                {when === 'dates' ? (
                  <div className="mb-3">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <Label>Starts</Label>
                        <Input type="date" value={schedFrom}
                               onChange={e=>setSchedFrom(e.target.value)} className="text-xs"/>
                      </div>
                      <div>
                        <Label>Ends</Label>
                        <Input type="date" value={schedTo}
                               onChange={e=>setSchedTo(e.target.value)} className="text-xs"/>
                      </div>
                    </div>
                    <p className="lbl mt-1">
                      Prefilled from this month's run dates. Screens switch over automatically —
                      whatever's playing now stays up until the start date, and this playlist
                      stops after the end date.
                    </p>
                  </div>
                ) : (
                  <p className="lbl mb-3">Ticked screens switch to this playlist immediately.</p>
                )}

                <Label>{when === 'dates' ? 'Screens on this run' : 'Put it on screens now'}</Label>
                {screens === null ? <p className="lbl mb-3">Loading screens…</p>
                 : mappedScreens.length === 0 ? (
                  <p className="text-xs mb-3" style={{color:'var(--amb)'}}>
                    No screens are mapped to this store yet — set that under
                    Settings → Store locations. The playlist will still be created.
                  </p>
                ) : (
                  <div className="mb-3">
                    {mappedScreens.map(function(sc) {
                      const on = pickScr.includes(sc._id);
                      return (
                        <label key={sc._id} className="flex items-center gap-2 py-1 cursor-pointer">
                          <input type="checkbox" checked={on}
                                 onChange={()=>setPickScr(prev => on ? prev.filter(x=>x!==sc._id) : prev.concat(sc._id))}/>
                          <span className="text-xs" style={{color:'var(--txt2)'}}>{sc.deviceName}</span>
                        </label>
                      );
                    })}
                    <p className="lbl mt-1">
                      Unticked screens keep whatever they're playing.
                    </p>
                  </div>
                )}

                <div className="flex gap-2 justify-end">
                  <Button size="sm" variant="outline" onClick={onClose}>Cancel</Button>
                  <Button size="sm" onClick={push} loading={busy} disabled={!chosen.length}>
                    <Icon name="up"/> Push {chosen.length} to OptiSigns
                  </Button>
                </div>
              </React.Fragment>
            )}
          </div>
        )}
      </div>
    </div>
    </Portal>
  );
}

// ─────────────────────────────────────────────
// STORE PICKS (WEBSITE)
// ─────────────────────────────────────────────
// A manager-curated shelf, separate from the monthly features: pick products,
// price them or not, and the website block updates itself. An empty list
// makes the block disappear from the site entirely — no sad empty section.
function StorePicksCard({ storeId, storeName, canEdit }) {
  const toast = useToast();
  const { images: products } = useBrandImageLibrary();
  const { profile: brand } = useBrandProfile(storeId);
  const { recipes } = useRecipes();
  const [picks,   setPicks]   = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [q,       setQ]       = useState('');
  const [draft,   setDraft]   = useState({});   // pick id -> {price, reg, note} being typed
  const [busy,    setBusy]    = useState(false);
  const [suggestOpen,  setSuggestOpen]  = useState(false);
  const [suggestions,  setSuggestions]  = useState(null);   // null = not loaded yet
  const [suggestSel,   setSuggestSel]   = useState({});     // product_id -> checked
  const [suggestBusy,  setSuggestBusy]  = useState(false);
  const [suggestScope, setSuggestScope] = useState('store'); // 'store' | 'all'

  const prodOf = id => products.find(p => p.id === id) || null;
  const recipeFor = prod => (prod && recipes.find(x => x.product_id === prod.id)) || null;

  const load = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('store_picks').select('*')
      .eq('store_id', storeId).order('sort').order('created_at');
    setPicks(data || []);
  }, [storeId]);
  useEffect(function(){ setPicks(null); setDraft({}); load(); }, [load]);

  // Publish the snapshot the website block reads. Runs after every change —
  // saving IS publishing here, which is what makes the block feel live.
  const publish = async function(list) {
    const sb = getSB();
    const items = [];
    for (const pk of list) {
      if (pk.visible === false) continue;   // hidden, not gone
      const prod = prodOf(pk.product_id);
      if (!prod) continue;
      let img = prod.image_url || null;
      if (!img && prod.data) {
        // Same hosting rule as the features push: database-only photos get a
        // public copy once, kept on the product.
        try {
          const blob = dataUrlToBlob(prod.data);
          const path = 'website/products/' + prod.id + '.png';
          const { error } = await sb.storage.from('creatives')
            .upload(path, blob, { upsert:true, contentType: blob.type || 'image/png', cacheControl:'31536000' });
          if (!error) {
            img = sb.storage.from('creatives').getPublicUrl(path).data.publicUrl;
            await sb.from('brand_images').update({ image_url: img }).eq('id', prod.id);
            prod.image_url = img;
          }
        } catch(e) { /* placeholder below */ }
      }
      const price = pk.price != null ? Number(pk.price) : null;
      const reg   = pk.reg_price != null ? Number(pk.reg_price) : null;
      const rec = recipeFor(prod);
      const withRec = rec && pk.recipe_on !== false && rec.name;
      items.push({
        name: prod.product_name, size: prod.size || '',
        sale: price, reg,
        savings: (price != null && reg != null && reg > price) ? Math.round((reg - price) * 100) / 100 : null,
        note: pk.note || '',
        category: prod.category || null,
        image: img, placeholder: img ? undefined : true,
        recipe: withRec ? {
          name: rec.name, blurb: rec.notes || '', glass: rec.glass || '',
          garnish: rec.garnish || '',
          ingredients: (rec.ingredients || []).filter(i => i.item),
          method: (rec.method || []).filter(Boolean),
        } : undefined,
      });
    }
    const snap = {
      store: storeId,
      title: storeName.replace(/ Liquor Store.*$/i, '') + ' Picks',
      updated_at: new Date().toISOString(),
      brand: {
        primary: (brand && brand.primary_color) || '#1e3a5f',
        secondary: (brand && brand.secondary_color) || '#c4a35a',
      },
      items,
    };
    const blob = new Blob([JSON.stringify(snap, null, 1)], { type:'application/json' });
    const { error } = await sb.storage.from('creatives')
      .upload('website/' + storeId + '-picks.json', blob,
              { upsert:true, contentType:'application/json', cacheControl:'300' });
    if (error) throw new Error('Saved, but the website copy failed: ' + error.message);
  };

  const mutate = async function(fn) {
    setBusy(true);
    try {
      await fn();
      const sb = getSB();
      const { data } = await sb.from('store_picks').select('*')
        .eq('store_id', storeId).order('sort').order('created_at');
      setPicks(data || []);
      await publish(data || []);
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  const addPick = prod => mutate(async function() {
    const sb = getSB();
    const { data:{ user } } = await sb.auth.getUser();
    const maxSort = (picks || []).reduce((m,p)=>Math.max(m, p.sort||0), 0);
    const { error } = await sb.from('store_picks').insert({
      store_id: storeId, product_id: prod.id, sort: maxSort + 1, created_by: user?.id });
    if (error) throw new Error(/duplicate/i.test(error.message) ? 'Already on the list' : error.message);
  });

  const removePick = pk => mutate(async function() {
    const { error } = await getSB().from('store_picks').delete().eq('id', pk.id);
    if (error) throw new Error(error.message);
  });

  const patchPick = (pk, fields) => mutate(async function() {
    const { error } = await getSB().from('store_picks').update(fields).eq('id', pk.id);
    if (error) throw new Error(error.message);
  });

  const move = (i, dir) => {
    const list = picks.slice();
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    mutate(async function() {
      const sb = getSB();
      await sb.from('store_picks').update({ sort: j }).eq('id', list[i].id);
      await sb.from('store_picks').update({ sort: i }).eq('id', list[j].id);
      // Normalize the rest so sorts stay dense.
      for (let k = 0; k < list.length; k++) {
        if (k !== i && k !== j) await sb.from('store_picks').update({ sort: k }).eq('id', list[k].id);
      }
    });
  };

  // Suggests from what we actually know sold: qty_sold/revenue that managers
  // typed in on monthly features. Not a real POS feed, so this only ever
  // knows about products that were featured — good enough as a starting
  // point, framed honestly rather than as a definitive "top sellers" claim.
  //
  // Sales get entered after a month closes, but by then the row's product_id
  // link is often missing — features from finished months were mostly typed
  // in without ever picking a product photo, while the *current* month's
  // rows are linked but have no sales yet (the month isn't over). So this
  // can't join on product_id alone; it falls back to matching the feature's
  // name against the product library, the same way the rest of the app
  // treats a feature row as "the same product" everywhere else.
  const loadSuggestions = async function(scope) {
    scope = scope || suggestScope;
    setSuggestBusy(true);
    try {
      const sb = getSB();
      // Built from local calendar fields, not toISOString() — that converts
      // to UTC, and an evening local timestamp rolls the date forward a day,
      // which silently excluded the exact first-of-month periods this is
      // supposed to include (that's why Downtown came up empty: its only
      // month with sales in range was cut off by one day).
      const cutoff = (function(){
        const d = new Date();
        const y = d.getFullYear(), mRaw = d.getMonth() - 2;
        const yy = mRaw < 0 ? y - 1 : y, mm = ((mRaw % 12) + 12) % 12;
        return yy + '-' + String(mm + 1).padStart(2, '0') + '-01';
      })();
      let q = sb.from('feature_periods').select('period, store_id, features(*)').gte('period', cutoff);
      if (scope !== 'all') q = q.eq('store_id', storeId);
      const { data, error } = await q;
      if (error) throw new Error(error.message);

      // Feature names are typed free-hand ("CORONA") while the product
      // library carries full SKU names ("Corona Extra"), so exact matching
      // misses almost everything. Match on shared significant words instead
      // — a single shared word only counts if it's long and specific enough
      // to actually mean something (so "LIGHT" or "WHITE" alone can't match
      // two unrelated products that both happen to say it).
      const STOPWORDS = new Set(['MIXER','MIXERS','PACK','PACKS','PK','VARIETY','ASSORTED','CANS','CAN','BOTTLE','BOTTLES','THE','AND','OF','A','ALL','SET','BOXSET','BOX']);
      const GENERIC   = new Set(['LIGHT','WHITE','RED','ROSE','GOLD','SILVER','DRY','SWEET','ORIGINAL','PINK','BLUSH','ICE','EXTRA','CLASSIC','PREMIUM','RESERVE','SPARKLING','BLANC','ROUGE','SPICED','SPICE']);
      const tokenize  = s => String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(w => w && !STOPWORDS.has(w));
      const productTokens = products.map(p => ({ p, tokens: tokenize(p.product_name) }));
      const nameMatch = function(name) {
        const ft = tokenize(name);
        if (!ft.length) return null;
        let best = null, bestOverlap = 0, bestLen = Infinity;
        productTokens.forEach(function(pt) {
          if (!pt.tokens.length) return;
          const common = ft.filter(t => pt.tokens.includes(t));
          const overlap = common.length;
          if (overlap === 0) return;
          if (overlap === 1 && (common[0].length < 5 || GENERIC.has(common[0]))) return;
          if (overlap > bestOverlap || (overlap === bestOverlap && pt.tokens.length < bestLen)) {
            best = pt.p; bestOverlap = overlap; bestLen = pt.tokens.length;
          }
        });
        return best;
      };

      const already = new Set((picks || []).map(pk => pk.product_id));
      const byProduct = {};
      (data || []).flatMap(p => p.features || []).forEach(function(r) {
        if (r.qty_sold == null && r.revenue == null) return;
        const prod = (r.product_id && prodOf(r.product_id))
                  || nameMatch(r.name)
                  || null;
        if (!prod || already.has(prod.id)) return;
        if (!byProduct[prod.id]) byProduct[prod.id] = { product_id: prod.id, prod, qty:0, revenue:0 };
        byProduct[prod.id].qty     += Number(r.qty_sold || 0);
        byProduct[prod.id].revenue += Number(r.revenue  || 0);
      });
      const top = Object.values(byProduct)
        .sort((a,b) => (b.qty - a.qty) || (b.revenue - a.revenue))
        .slice(0, 5);
      setSuggestions(top);
      setSuggestSel(Object.fromEntries(top.map(t => [t.product_id, true])));
    } catch(e) { toast.error(e.message); }
    finally { setSuggestBusy(false); }
  };

  const toggleSuggest = async function() {
    if (suggestOpen) { setSuggestOpen(false); return; }
    setSuggestOpen(true);
    if (suggestions === null) await loadSuggestions();
  };

  const setScope = async function(scope) {
    setSuggestScope(scope);
    await loadSuggestions(scope);
  };

  const addSuggested = () => mutate(async function() {
    const sb = getSB();
    const { data:{ user } } = await sb.auth.getUser();
    const chosen = (suggestions || []).filter(s => suggestSel[s.product_id]);
    if (!chosen.length) return;
    const maxSort = (picks || []).reduce((m,p)=>Math.max(m, p.sort||0), 0);
    const rows = chosen.map((s,i) => ({
      store_id: storeId, product_id: s.product_id, sort: maxSort + 1 + i, created_by: user?.id,
    }));
    const { error } = await sb.from('store_picks').insert(rows);
    if (error) throw new Error(error.message);
    setSuggestOpen(false);
    setSuggestions(null);
    toast.success(chosen.length + (chosen.length===1?' pick':' picks') + ' added');
  });

  const pickEmbed =
    '<iframe id="lrs-picks-' + storeId + '" src="https://lrs.thesuenocompany.com/features-embed.html?store=' + storeId + '&view=picks"'
    + ' style="width:100%;border:0;height:0" scrolling="no" loading="lazy" title="Store picks"></iframe>\n'
    + '<script>window.addEventListener("message",function(e){'
    + 'var f=document.getElementById("lrs-picks-' + storeId + '");'
    + 'if(f&&e.source===f.contentWindow&&e.origin==="https://lrs.thesuenocompany.com"&&e.data&&e.data.lrsFeaturesHeight!=null){'
    + 'f.style.height=e.data.lrsFeaturesHeight+"px";}});<\/script>';

  const candidates = products
    .filter(p => (p.image_url || p.data))
    .filter(p => !(picks || []).some(pk => pk.product_id === p.id))
