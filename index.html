function FeatureCreativeBatch({ storeId, storeName, period, rows, products, campaigns, onClose, onDone }) {
  const dragPanel = useDragPanel();
  const toast = useToast();
  const { templates } = useBrandTemplates(storeId);
  const { addRendered, reload: reloadCreatives } = useCreatives();

  const [picked,   setPicked]   = useState(null);   // Set of feature ids, null = all eligible
  const [campaign, setCampaign] = useState('');
  const [running,  setRunning]  = useState(false);
  const [done,     setDone]     = useState(null);
  const [progress, setProgress] = useState({ n:0, total:0, label:'' });

  const allPriceAds = templates.filter(t => t.kind === 'price_ad');
  // Which templates this run uses. All on by default — unticking is for the
  // month you only need the screen size, or only the social sizes.
  const [tplOff, setTplOff] = useState({});
  const priceAds = allPriceAds.filter(t => !tplOff[t.id]);

  const prodOf = id => products.find(p => p.id === id) || null;

  // A row is only worth rendering if there's a photo to put in the template.
  const eligible = rows.filter(r => r.product_id && prodOf(r.product_id));
  const noPhoto  = rows.filter(r => !r.product_id || !prodOf(r.product_id));

  const isOn = id => (picked === null ? true : picked.has(id));
  const toggle = function(id) {
    setPicked(function(prev) {
      const next = new Set(prev === null ? eligible.map(r=>r.id) : prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const chosen = eligible.filter(r => isOn(r.id));
  const total  = chosen.length * priceAds.length;

  const run = async function() {
    if (!total) return;
    setRunning(true);
    setDone(null);
    const made = [];
    const failed = [];
    let n = 0;

    // Field definitions are per template, so fetch each one once rather than
    // once per feature.
    const sb = getSB();
    const fieldsByTpl = {};
    for (const t of priceAds) {
      const { data } = await sb.from('ad_template_fields')
        .select('*').eq('template_id', t.id).order('field_order');
      fieldsByTpl[t.id] = withFieldDefaults(data);
    }

    for (const row of chosen) {
      const prod = prodOf(row.product_id);
      let productDataUrl = null;
      try { productDataUrl = await toDataUrl(prodSrc(prod)); }
      catch (e) { /* renderFieldTemplate handles a missing photo */ }

      for (const tpl of priceAds) {
        n += 1;
        setProgress({ n, total, label: row.name + ' — ' + tpl.name });

        const flds = fieldsByTpl[tpl.id];
        if (!flds || !flds.length) {
          failed.push(tpl.name + ': no fields set up yet');
          continue;
        }

        try {
          const rendered = await renderFieldTemplate(tpl, flds, {
            product_name: row.name || '',
            pack_size:    row.size || '',
            price:        row.sale_price != null ? Number(row.sale_price).toFixed(2) : '',
            save:         row.savings    != null ? Number(row.savings).toFixed(2) : '',
          }, productDataUrl);

          const url  = typeof rendered === 'string' ? rendered : rendered.url;
          const over = typeof rendered === 'string' ? [] : rendered.overflows;
          const blob = dataUrlToBlob(url);
          const aspect = nearestAspect(tpl.canvas_w, tpl.canvas_h);

          await addRendered(blob, {
            name: monthLabel(period) + ' · ' + (row.name || 'Feature') + ' · ' + aspect,
            storeId, aspect, period,
            campaignId: campaign || null,
            featureId: row.id, templateId: tpl.id,
            width: tpl.canvas_w, height: tpl.canvas_h,
          });

          made.push({ name: row.name, tpl: tpl.name, url,
                      warn: over.length ? 'Text too big to fit: ' + over.join(', ') : null });
        } catch (e) {
          failed.push((row.name || 'Feature') + ' / ' + tpl.name + ': ' + e.message);
        }
      }
    }

    await reloadCreatives();
    setRunning(false);
    setDone({ made, failed });
    if (made.length) toast.success(made.length + ' creative' + (made.length===1?'':'s') + ' added to the library');
    if (!made.length && failed.length) toast.error('Nothing was created');
    if (onDone) onDone();
  };

  return (
    <Portal>
    <div className="fixed inset-0 z-[210] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.88)', backdropFilter:'blur(4px)'}}
         onClick={running ? undefined : onClose}>
      <div className="hud hud-brk w-full max-w-2xl max-h-[88vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-center gap-3 mb-4">
          <span className="ttl">Generate creatives</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {!running && <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>}
        </div>

        <p className="text-xs mb-4" style={{color:'var(--txt2)'}}>
          {storeName} · {monthLabel(period)}
        </p>

        {allPriceAds.length === 0 ? (
          <div className="text-center py-10">
            <Icon name="image" size={34} style={{color:'var(--cy-dim)'}}/>
            <p className="lbl mt-3">No price ad templates for this store</p>
            <p className="text-xs mt-2" style={{color:'var(--txt2)'}}>
              Upload one under Ad Templates and position its fields first.
            </p>
          </div>
        ) : done ? (
          <div>
            <p className="text-sm mb-3" style={{color:'var(--txt)'}}>
              {done.made.length} created{done.failed.length ? ', ' + done.failed.length + ' skipped' : ''}.
            </p>
            {done.made.length > 0 && (
              <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-4">
                {done.made.map(function(m, i) {
                  return (
                    <div key={i} className="hud p-0 overflow-hidden">
                      <img src={m.url} alt="" className="w-full object-cover" style={{aspectRatio:'1'}}/>
                      <p className="lbl p-1.5 truncate">{m.name}</p>
                      {m.warn && <p className="text-[10px] px-1.5 pb-1.5" style={{color:'var(--amb)'}}>{m.warn}</p>}
                    </div>
                  );
                })}
              </div>
            )}
            {done.failed.length > 0 && (
              <div className="p-3 mb-4" style={{border:'1px solid var(--red)', background:'rgba(255,77,94,.07)'}}>
                {done.failed.map((f,i)=><p key={i} className="text-xs" style={{color:'var(--red)'}}>{f}</p>)}
              </div>
            )}
            <div className="flex gap-2 justify-end">
              <Button size="sm" variant="outline" onClick={()=>setDone(null)}>Run again</Button>
              <Button size="sm" onClick={onClose}>Done</Button>
            </div>
          </div>
        ) : running ? (
          <div className="py-8">
            <p className="lbl mb-2">{progress.n} of {progress.total}</p>
            <div style={{height:'4px', background:'rgba(212,175,55,.12)'}}>
              <div style={{height:'100%', width:(progress.total?progress.n/progress.total*100:0)+'%',
                           background:'var(--cy)', transition:'width .2s'}}/>
            </div>
            <p className="text-xs mt-3 truncate" style={{color:'var(--txt2)'}}>{progress.label}</p>
          </div>
        ) : (
          <div>
            <div className="mb-4">
              <Label>Sizes to generate</Label>
              <div className="flex flex-wrap gap-2">
                {allPriceAds.map(function(t) {
                  const on = !tplOff[t.id];
                  return (
                    <button key={t.id}
                      onClick={()=>setTplOff(prev=>Object.assign({}, prev, {[t.id]: on}))}
                      className="px-2.5 py-1.5 text-xs"
                      style={{ border:'1px solid ' + (on ? 'var(--cy)' : 'var(--line)'),
                               background: on ? 'var(--cy-glow)' : 'transparent',
                               color: on ? 'var(--cy)' : 'var(--txt3)' }}>
                      {t.name} · {nearestAspect(t.canvas_w, t.canvas_h)}
                    </button>
                  );
                })}
              </div>
              {priceAds.length === 0 && allPriceAds.length > 0 && (
                <p className="text-xs mt-2" style={{color:'var(--amb)'}}>
                  Every size is unticked — nothing will be generated.
                </p>
              )}
            </div>

            <div className="mb-4">
              <Label>Tag with a campaign (optional)</Label>
              <Select value={campaign} onChange={e=>setCampaign(e.target.value)} className="text-xs">
                <option value="">No campaign</option>
                {campaigns.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </Select>
            </div>

            {eligible.length === 0 ? (
              <p className="lbl py-6 text-center">
                No features have a product photo linked yet — assign photos first.
              </p>
            ) : (
              <div className="mb-4" style={{maxHeight:'260px', overflowY:'auto'}}>
                {eligible.map(function(r) {
                  const p = prodOf(r.product_id);
                  return (
                    <label key={r.id} className="flex items-center gap-2.5 py-1.5 cursor-pointer">
                      <input type="checkbox" checked={isOn(r.id)} onChange={()=>toggle(r.id)}/>
                      <img src={prodSrc(p)} alt="" className="w-7 h-7 object-cover flex-none"
                           style={{border:'1px solid var(--line)'}}/>
                      <span className="text-xs flex-1 truncate" style={{color:'var(--txt)'}}>{r.name}</span>
                      <span className="mono text-xs" style={{color:'var(--cy)'}}>{money(r.sale_price)}</span>
                    </label>
                  );
                })}
              </div>
            )}

            {noPhoto.length > 0 && (
              <p className="text-xs mb-4" style={{color:'var(--amb)'}}>
                {noPhoto.length} feature{noPhoto.length===1?'':'s'} skipped — no product photo linked.
              </p>
            )}

            <div className="flex gap-2 justify-end items-center">
              <span className="lbl mr-auto">{total} image{total===1?'':'s'} will be created</span>
              <Button size="sm" variant="outline" onClick={onClose}>Cancel</Button>
              <Button size="sm" onClick={run} disabled={!total}>
                <Icon name="image"/> Generate
              </Button>
            </div>
          </div>
        )}
      </div>
    </div>
    </Portal>
  );
}

// ─────────────────────────────────────────────
// POST PLANNER
// ─────────────────────────────────────────────
// Turns a month of features into a queue of scheduled posts. Everything it
// produces lands as 'needs_approval' — the scheduler only ever publishes
// 'pending', so nothing written here can go out until a person moves it.

const DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// When a feature month actually runs. Explicit dates on the period win;
// absent, it's the calendar month — which is what every month so far has been.
function periodRange(period, periodRow) {
  const [y, m] = String(period).split('-').map(Number);
  const start = (periodRow && periodRow.starts_on)
    ? new Date(periodRow.starts_on + 'T00:00:00')
    : new Date(y, m-1, 1);
  const end = (periodRow && periodRow.ends_on)
    ? new Date(periodRow.ends_on + 'T23:59:59')
    : new Date(y, m, 0, 23, 59, 59);
  return { start, end };
}

const rangeLabel = r =>
  r.start.toLocaleDateString(undefined,{day:'numeric',month:'short'}) + ' – ' +
  r.end.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});

// The prompts say no hashtags, but a model that has read the whole internet
// drifts back to them, and a stray #SummerSale would go out unnoticed on an
// approved post. Belt and braces.
//
// A hashtag starts with a letter or underscore: "#1 selling gin" and "aisle #3"
// are ordinary English and survive untouched.
// Canadian spelling. The prompts ask for it, but the models are trained mostly
// on American text and drift back — especially in longer copy. This is the
// belt to the prompt's braces.
//
// Deliberately narrow. Only words where Canadian usage is settled and the
// American form would look wrong to a customer in BC. Left out on purpose:
// -ize endings (Canadian keeps them), "program", "analyze", and whisky/whiskey
// — Canadian whisky drops the e but Irish and American whiskey keep it, so
// that one is a judgement call, not a substitution.
const CA_SPELLINGS = [
  [/\bcolor(s|ed|ing|ful|less)?\b/g,   'colour$1'],
  [/\bflavor(s|ed|ing|ful|less)?\b/g,  'flavour$1'],
  [/\bfavor(s|ed|ing)?\b/g,            'favour$1'],
  [/\bfavorite(s)?\b/g,                'favourite$1'],
  [/\bneighbor(s|hood|hoods|ing)?\b/g, 'neighbour$1'],
  [/\bharbor(s)?\b/g,                  'harbour$1'],
  [/\blabor(s|ed|ing)?\b/g,            'labour$1'],
  [/\bhonor(s|ed|ing|able)?\b/g,       'honour$1'],
  [/\bhumor(s|ed|ing|ous)?\b/g,        'humour$1'],
  [/\bsavor(s|ed|ing)?\b/g,            'savour$1'],
  [/\bsavory\b/g,                      'savoury'],
  [/\bvapor(s)?\b/g,                   'vapour$1'],
  [/\bcenter(s)?\b/g,                  'centre$1'],
  [/\bcentered\b/g,                    'centred'],
  [/\bliter(s)?\b/g,                   'litre$1'],
  [/\bfiber(s)?\b/g,                   'fibre$1'],
  [/\btheater(s)?\b/g,                 'theatre$1'],
  [/\bcaliber(s)?\b/g,                 'calibre$1'],
  [/\bsomber\b/g,                      'sombre'],
  [/\bmaneuver(s|ed|ing)?\b/g,         'manoeuvre$1'],
  [/\bgray(s|er|est|ish)?\b/g,         'grey$1'],
  [/\btravel(ed|ing|er|ers)\b/g,       'travell$1'],
  [/\bcancel(ed|ing)\b/g,              'cancell$1'],
  [/\blabel(ed|ing)\b/g,               'labell$1'],
  [/\bfuel(ed|ing)\b/g,                'fuell$1'],
  [/\bcatalog(s)?\b/g,                 'catalogue$1'],
  [/\bdialog(s)?\b/g,                  'dialogue$1'],
  [/\bdefense\b/g,                     'defence'],
  [/\boffense\b/g,                     'offence'],
  // The noun. In this business it is always "a liquor licence".
  [/\blicense(s)?\b/g,                 'licence$1'],
];

function canadianSpelling(text) {
  let out = String(text || '');
  CA_SPELLINGS.forEach(function(rule) {
    // Both passes have to ignore case. Matching "Color" but rewriting with the
    // lower-case pattern leaves it untouched, which is a silent no-op on every
    // capitalised word — the ones at the start of a sentence.
    const ci = new RegExp(rule[0].source, 'i');
    out = out.replace(new RegExp(rule[0].source, 'gi'), function(match) {
      const replaced = match.replace(ci, rule[1]);
      // Carry the original casing across: COLOR, Color and color all keep
      // their shape.
      if (match === match.toUpperCase() && match.length > 1) return replaced.toUpperCase();
      if (match[0] === match[0].toUpperCase()) {
        return replaced.charAt(0).toUpperCase() + replaced.slice(1);
      }
      return replaced;
    });
  });
  return out;
}

// Models sometimes answer with a heading or a label before the copy —
// "# Facebook & Instagram Post", "Caption:", "**Post**" — even when told to
// return only the text. Left in, it publishes.
function stripPreamble(text) {
  let out = String(text || '').replace(/^\s+/, '');
  for (let i = 0; i < 3; i++) {
    const before = out;
    // A markdown heading on its own line, or run straight into the copy.
    out = out.replace(/^#{1,6}\s*[^\n]{0,60}?(post|caption|copy)\b[^\n]{0,20}\n+/i, '');
    out = out.replace(/^#{1,6}\s*[^\n]{0,60}?(post|caption|copy)\b[:\-—]*\s+/i, '');
    // A bare label line.
    out = out.replace(/^\**(facebook|instagram|social)?\s*(and|&|\/)?\s*(facebook|instagram)?\s*(post|caption|copy)\**\s*[:\-—]\s*/i, '');
    out = out.replace(/^\**\s*(post|caption|copy)\s*\**\s*\n+/i, '');
    out = out.replace(/^\s+/, '');
    if (out === before) break;
  }
  return out;
}

function stripHashtags(text) {
  return canadianSpelling(stripPreamble(text))
    .replace(/(^|[\s(])#[A-Za-z_]\w*/g, '$1')
    .replace(/\(\s*\)/g, '')
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/[ \t]+$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

const hourLabel = h => {
  const ampm = h < 12 ? 'am' : 'pm';
  const base = h % 12 === 0 ? 12 : h % 12;
  return base + ampm;
};

// Sensible retail defaults for when Meta has nothing useful to say. Thursday
// and Friday afternoons are when a liquor store's weekend starts.
const DEFAULT_SLOTS = [
  { dow:4, hour:16 }, { dow:5, hour:15 }, { dow:6, hour:11 },
  { dow:2, hour:16 }, { dow:3, hour:17 }, { dow:0, hour:12 }, { dow:1, hour:16 },
];

// Every occurrence of the chosen weekday/hour slots inside the month, in order,
// starting from `from` so a plan built mid-month doesn't schedule into the past.
function planSlots(period, times, count, from, range) {
  if (!times.length || count <= 0) return [];
  const r = range || periodRange(period, null);
  const first = new Date(r.start.getFullYear(), r.start.getMonth(), r.start.getDate());
  const last  = new Date(r.end.getFullYear(), r.end.getMonth(), r.end.getDate());
  const out = [];

  for (let d = new Date(first); d <= last; d.setDate(d.getDate()+1)) {
    const hits = times.filter(t => t.dow === d.getDay())
                      .sort((a,b) => a.hour - b.hour);
    for (const t of hits) {
      const when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.hour, 0, 0, 0);
      if (from && when <= from) continue;
      out.push(when);
    }
  }
  return out.slice(0, count);
}

// Features batched into posts. One per product, or grouped by the linked
// product's category into carousels.
function groupFeatures(rows, products, grouping, maxPerPost) {
  const prodOf = id => products.find(p => p.id === id) || null;
  if (grouping !== 'category') return rows.map(r => [r]);

  const byCat = {};
  rows.forEach(function(r) {
    const p = prodOf(r.product_id);
    const cat = (p && p.category) ? p.category : 'Other';
    (byCat[cat] = byCat[cat] || []).push(r);
  });

  const groups = [];
  Object.keys(byCat).sort().forEach(function(cat) {
    const list = byCat[cat];
    for (let i = 0; i < list.length; i += maxPerPost) {
      const chunk = list.slice(i, i + maxPerPost);
      chunk.category = cat;
      groups.push(chunk);
    }
  });
  return groups;
}

function PostPlanBuilder({ storeId, storeName, period, periodRow, rows, products, onClose, onDone }) {
  const runRange = periodRange(period, periodRow);
  const dragPanel = useDragPanel();
  const toast = useToast();
  const { creatives } = useCreatives();

  const [cadence,  setCadence]  = useState('2x');
  const [perWeek,  setPerWeek]  = useState(2);
  const [grouping, setGrouping] = useState('product');
  const [channels, setChannels] = useState(['facebook']);
  const [times,    setTimes]    = useState(DEFAULT_SLOTS.slice(0, 2));
  const [reco,     setReco]     = useState(null);
  const [recoErr,  setRecoErr]  = useState(null);
  const [loadingReco, setLoadingReco] = useState(false);
  const [busy,     setBusy]     = useState(false);
  const [progress, setProgress] = useState({ n:0, total:0, label:'' });
  const [result,   setResult]   = useState(null);
  // Times already spoken for by posts made elsewhere — by hand, by an earlier
  // plan, or by the recipe builder.
  const [busySlots, setBusySlots] = useState([]);

  const n = cadence === 'custom' ? perWeek : Number(cadence[0]);

  useEffect(function() {
    const sb = getSB(); if (!sb || !storeId || !period) return;
    const [y, m] = String(period).split('-').map(Number);
    const from = new Date(y, m-1, 1).toISOString();
    const to   = new Date(y, m, 1).toISOString();
    let alive = true;
    sb.from('scheduled_posts')
      .select('scheduled_at, status')
      .eq('store_id', storeId)
      .gte('scheduled_at', from).lt('scheduled_at', to)
      // A post that failed or was never approved isn't occupying its slot.
      .in('status', ['needs_approval','pending','publishing','published'])
      .then(function(res) {
        if (!alive) return;
        setBusySlots((res.data || []).map(r => new Date(r.scheduled_at).getTime()));
      });
    return function(){ alive = false; };
  }, [storeId, period, result]);

  // Keep the slot list the same length as the cadence.
  useEffect(function() {
    setTimes(function(prev) {
      if (prev.length === n) return prev;
      if (prev.length > n) return prev.slice(0, n);
      const extra = DEFAULT_SLOTS.filter(d => !prev.some(p => p.dow === d.dow));
      return prev.concat(extra.slice(0, n - prev.length));
    });
  }, [n]);

  const fetchReco = async function() {
    setLoadingReco(true); setRecoErr(null);
    try {
      const r = await callEdge('meta-social', 'bestTimes', { storeId });
      setReco(r);
      if (r.slots && r.slots.length) {
        // One slot per weekday — three posts stacked on the same Thursday is
        // not what "3x weekly" means.
        const picked = [];
        r.slots.forEach(function(s) {
          if (picked.length < n && !picked.some(p => p.dow === s.dow)) {
            picked.push({ dow:s.dow, hour:s.hour });
          }
        });
        if (picked.length) setTimes(picked.concat(DEFAULT_SLOTS.filter(d=>!picked.some(p=>p.dow===d.dow)).slice(0, n - picked.length)));
      }
    } catch(e) { setRecoErr(e.message); }
    finally { setLoadingReco(false); }
  };

  const eligible = rows.filter(r => r.product_id && products.some(p => p.id === r.product_id));
  const groups = groupFeatures(eligible, products, grouping, 4);

  // Every slot left in the month, not just enough for one pass through the
  // features. Twelve features at three a week leaves half of August empty
  // otherwise, and a feature is on all month — running it twice is the point.
  const allSlots = planSlots(period, times, 9999, new Date(), runRange);

  // A slot is taken if something is already booked near it. Two posts ninety
  // minutes apart read as a double post, so the guard is a window rather than
  // an exact match.
  const NEAR_MS = 90 * 60 * 1000;
  const isTaken = when => busySlots.some(t => Math.abs(t - when.getTime()) < NEAR_MS);

  const freeSlots = allSlots.filter(sl => !isTaken(sl));
  const blocked   = allSlots.length - freeSlots.length;

  // Features cycle round so the month fills evenly and the same product never
  // lands twice in a row while others are still waiting for their first run.
  const planned = groups.length
    ? freeSlots.map((when, i) => ({ when, group: groups[i % groups.length] }))
    : [];

  const creativeFor = row =>
    creatives.filter(c => c.feature_id === row.id)
             .sort((a,b) => (a.aspect === '1:1' ? -1 : 1))[0] || null;

  const toggleChannel = ch => setChannels(function(prev) {
    return prev.includes(ch) ? prev.filter(x=>x!==ch) : prev.concat(ch);
  });

  const setSlot = (i, patch) => setTimes(prev => prev.map((t,ix) => ix===i ? { ...t, ...patch } : t));

  const generate = async function() {
    if (!planned.length) { toast.error('Nothing to schedule'); return; }
    if (!channels.length) { toast.error('Pick at least one channel'); return; }
    setBusy(true);
    const made = [], failed = [];
    try {
      const sb = getSB();
      const { data:{ user } } = await sb.auth.getUser();

      const { data: plan, error: planErr } = await sb.from('post_plans').insert({
        store_id: storeId, period, cadence, per_week: n, grouping,
        publish_to: channels, time_source: reco ? 'meta' : 'manual',
        created_by: user?.id,
      }).select().single();
      if (planErr) throw planErr;

      for (let i = 0; i < planned.length; i++) {
        const group = planned[i].group;
        const when  = planned[i].when;
        setProgress({ n:i+1, total:planned.length, label: group.map(g=>g.name).join(', ') });

        const lines = group.map(function(r) {
          const bits = [r.name];
          if (r.size) bits.push(r.size);
          if (r.sale_price != null) bits.push('on sale at ' + money(r.sale_price));
          if (r.reg_price  != null) bits.push('regular ' + money(r.reg_price));
          if (r.savings    != null) bits.push('save ' + money(r.savings));
          return '- ' + bits.join(', ');
        }).join('\n');

        const prompt =
          'Write a short Facebook and Instagram post for ' + storeName + ', a liquor store in British Columbia.\n\n' +
          (group.category ? 'This post features our ' + group.category + ' specials:\n' : 'This post features:\n') +
          lines + '\n\n' +
          'These prices run ' + rangeLabel(runRange) + '. Say "this month", never "this week", ' +
          '"today", "this weekend" or anything else that implies a shorter window — ' +
          'the same products are posted repeatedly through the month.\n' +
          'Rules: Canadian English spelling throughout (colour, flavour, favourite, litre, centre). ' +
          '2 to 3 sentences, warm and straightforward, no hashtags at all, ' +
          'no emoji, do not invent prices or claims, do not mention delivery. ' +
          'Do not add a disclaimer about tax or deposit — one is appended automatically. ' +
          'Vary the wording — this product may appear in several posts this month. ' +
          'Return only the post text.';

        let caption = '';
        try {
          const r = await callEdge('meta-social', 'aiWrite', { prompt, maxTokens: 400 });
          caption = stripHashtags(r.text || '');
        } catch(e) {
          failed.push(group.map(g=>g.name).join(', ') + ': copy failed — ' + e.message);
          continue;
        }
        if (!caption) { failed.push(group.map(g=>g.name).join(', ') + ': no copy returned'); continue; }

        // A post with no image at all used to slip through silently on
        // Facebook-only runs (this check used to only fire for Instagram) —
        // every scheduled post needs at least one image now, regardless of
        // channel, so a missing creative shows up as a clear failure instead
        // of a text-only post nobody meant to publish.
        const imgs = group.map(creativeFor).filter(Boolean).map(c => c.public_url);
        if (!imgs.length) {
          const missing = group.filter(g => !creativeFor(g)).map(g => g.name).join(', ');
          failed.push(group.map(g=>g.name).join(', ') + ': no creative image yet for ' + missing + ' — add one in the Creative Library first');
          continue;
        }

        const { error } = await sb.from('scheduled_posts').insert({
          store_id: storeId,
          caption,
          image_url: imgs[0] || null,
          image_urls: imgs,
          publish_to: channels,
          scheduled_at: when.toISOString(),
          status: 'needs_approval',
          auto_generated: true,
          plan_id: plan.id,
          feature_ids: group.map(g => g.id),
          created_by: user?.id,
        });
        if (error) { failed.push(group.map(g=>g.name).join(', ') + ': ' + error.message); continue; }

        made.push({ when, names: group.map(g=>g.name), images: imgs.length, caption });
      }
    } catch(e) {
      failed.push(e.message);
    }
    setBusy(false);
    setResult({ made, failed });
    if (made.length) toast.success(made.length + ' post' + (made.length===1?'':'s') + ' drafted — waiting for approval');
    if (onDone) onDone();
  };

  return (
    <Portal>
    <div className="fixed inset-0 z-[210] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.88)', backdropFilter:'blur(4px)'}}
         onClick={busy ? undefined : onClose}>
      <div className="hud hud-brk w-full max-w-3xl max-h-[90vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-center gap-3 mb-4">
          <span className="ttl">Plan posts</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {!busy && <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>}
        </div>

        <p className="text-xs mb-5" style={{color:'var(--txt2)'}}>
          {storeName} · {monthLabel(period)} · nothing publishes until it's approved
        </p>

        {result ? (
          <div>
            <p className="text-sm" style={{color:'var(--txt)'}}>
              {result.made.length} post{result.made.length===1?'':'s'} drafted
              {result.failed.length ? ', ' + result.failed.length + ' skipped' : ''}.
            </p>
            <p className="text-xs mb-3" style={{color:'var(--cy)'}}>
              Nothing publishes yet. Go to Posts → Scheduled to read and approve them.
            </p>
            <div className="mb-4" style={{maxHeight:'280px', overflowY:'auto'}}>
              {result.made.map(function(m, i) {
                return (
                  <div key={i} className="p-2.5 mb-2" style={{border:'1px solid var(--line)'}}>
                    <p className="mono text-xs" style={{color:'var(--cy)'}}>
                      {DOW_NAMES[m.when.getDay()]} {m.when.getDate()} · {hourLabel(m.when.getHours())}
                      {m.images ? ' · ' + m.images + ' image' + (m.images===1?'':'s') : ' · no image'}
                    </p>
                    <p className="text-xs mt-1" style={{color:'var(--txt2)'}}>{m.caption}</p>
                  </div>
                );
              })}
            </div>
            {result.failed.length > 0 && (
              <div className="p-3 mb-4" style={{border:'1px solid var(--red)', background:'rgba(255,77,94,.07)'}}>
                {result.failed.map((f,i)=><p key={i} className="text-xs" style={{color:'var(--red)'}}>{f}</p>)}
              </div>
            )}
            <div className="flex gap-2 justify-end">
              <Button size="sm" variant="outline" onClick={()=>setResult(null)}>Plan more</Button>
              <Button size="sm" onClick={onClose}>Done</Button>
            </div>
          </div>
        ) : busy ? (
          <div className="py-8">
            <p className="lbl mb-2">Writing copy · {progress.n} of {progress.total}</p>
            <div style={{height:'4px', background:'rgba(212,175,55,.12)'}}>
              <div style={{height:'100%', width:(progress.total?progress.n/progress.total*100:0)+'%',
                           background:'var(--cy)', transition:'width .2s'}}/>
            </div>
            <p className="text-xs mt-3 truncate" style={{color:'var(--txt2)'}}>{progress.label}</p>
          </div>
        ) : (
          <div>
            <div className="mb-4">
              <Label>How often</Label>
              <div className="flex gap-2 flex-wrap items-center">
                <div className="flex" style={{border:'1px solid var(--line)'}}>
                  {[['1x','1× weekly'],['2x','2× weekly'],['3x','3× weekly'],['custom','Custom']].map(function(c) {
                    const on = cadence===c[0];
                    return (
                      <button key={c[0]} onClick={()=>setCadence(c[0])}
                        className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                        style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
                        {c[1]}
                      </button>
                    );
                  })}
                </div>
                {cadence==='custom' && (
                  <Input type="number" min="1" max="7" value={perWeek} className="w-20 text-xs"
                         onChange={e=>setPerWeek(Math.min(7, Math.max(1, Number(e.target.value)||1)))}/>
                )}
              </div>
            </div>

            <div className="mb-4">
              <Label>What goes in a post</Label>
              <div className="flex" style={{border:'1px solid var(--line)', width:'fit-content'}}>
                {[['product','One product each'],['category','Grouped by category']].map(function(g) {
                  const on = grouping===g[0];
                  return (
                    <button key={g[0]} onClick={()=>setGrouping(g[0])}
                      className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                      style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
                      {g[1]}
                    </button>
                  );
                })}
              </div>
              {grouping==='category' && (
                <p className="lbl mt-2">Up to 4 products per carousel, split by the product's category.</p>
              )}
            </div>

            <div className="mb-4">
              <Label>Where</Label>
              <div className="flex gap-2">
                {[['facebook','Facebook'],['instagram','Instagram']].map(function(c) {
                  const on = channels.includes(c[0]);
                  return (
                    <button key={c[0]} onClick={()=>toggleChannel(c[0])}
                      className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                      style={{ border:'1px solid ' + (on?'var(--cy)':'var(--line)'),
                               background:on?'var(--cy-glow)':'transparent',
                               color:on?'var(--cy)':'var(--txt2)' }}>
                      {c[1]}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mb-4">
              <div className="flex items-center gap-2 mb-2">
                <Label className="mb-0">When</Label>
                <span className="flex-1"/>
                <Button size="sm" variant="outline" onClick={fetchReco} loading={loadingReco}>
                  <Icon name="chart"/> Suggest from history
                </Button>
              </div>

              {recoErr && <p className="text-xs mb-2" style={{color:'var(--amb)'}}>{recoErr}</p>}
              {reco && (
                <p className="text-xs mb-2" style={{color:'var(--txt2)'}}>
                  {reco.distinctSlots > 0
                    ? 'From ' + reco.sampled + ' past posts. This is when this Page has posted well before, not when its audience is online — Meta removed those metrics.'
                    : 'Not enough history yet (' + reco.sampled + ' posts). Keeping the defaults.'}
                </p>
              )}

              {times.map(function(t, i) {
                return (
                  <div key={i} className="flex gap-2 items-center mb-2">
                    <Select value={t.dow} className="w-auto text-xs"
                            onChange={e=>setSlot(i,{dow:Number(e.target.value)})}>
                      {DOW_NAMES.map((d,ix)=><option key={ix} value={ix}>{d}</option>)}
                    </Select>
                    <Select value={t.hour} className="w-auto text-xs"
                            onChange={e=>setSlot(i,{hour:Number(e.target.value)})}>
                      {Array.from({length:15},(_,k)=>k+8).map(h=>
                        <option key={h} value={h}>{hourLabel(h)}</option>)}
                    </Select>
                  </div>
                );
              })}
            </div>

            <div className="p-3 mb-4" style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.4)'}}>
              <p className="lbl mb-2">Plan preview</p>
              {planned.length === 0 ? (
                <p className="text-xs" style={{color:'var(--amb)'}}>
                  Nothing to schedule — features need a linked product photo, and there must be
                  free slots left in {monthLabel(period)}.
                </p>
              ) : (
                <div style={{maxHeight:'190px', overflowY:'auto'}}>
                  {planned.map(function(p, i) {
                    return (
                      <div key={i} className="flex gap-2 text-xs py-0.5">
                        <span className="mono flex-none" style={{color:'var(--cy)', width:'92px'}}>
                          {DOW_NAMES[p.when.getDay()]} {p.when.getDate()} {hourLabel(p.when.getHours())}
                        </span>
                        <span className="truncate" style={{color:'var(--txt2)'}}>
                          {p.group.category ? p.group.category + ' — ' : ''}
                          {p.group.map(x=>x.name).join(', ')}
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}
              {blocked > 0 && (
                <p className="text-xs mt-2" style={{color:'var(--amb)'}}>
                  {blocked} slot{blocked===1?'':'s'} skipped — something is already scheduled there.
                </p>
              )}
              {planned.length > 0 && groups.length > 0 && (
                <p className="lbl mt-2">
                  {groups.length} feature{groups.length===1?'':'s'} across {planned.length} posts —
                  about {Math.round(planned.length / groups.length * 10) / 10} runs each.
                </p>
              )}
            </div>

            <div className="flex gap-2 justify-end items-center">
              <span className="lbl mr-auto">
                {planned.length} post{planned.length===1?'':'s'} filling {rangeLabel(runRange)} · all need approval
              </span>
              <Button size="sm" variant="outline" onClick={onClose}>Cancel</Button>
              <Button size="sm" onClick={generate} disabled={!planned.length}>
                <Icon name="cal"/> Create drafts
              </Button>
            </div>
          </div>
        )}
      </div>
    </div>
    </Portal>
  );
}

// BCL reference prices for the features on screen. Matched by the linked
// product's SKU when it was imported from BCL, else by exact name — feature
// names pasted from the sheet are usually the BCL name verbatim, and a fuzzy
// match that guessed wrong would print a wrong comparison, which is worse
// than a dash.
function useBclPrices(rows, products) {
  const [map, setMap] = useState({});   // feature id -> bcl row

  useEffect(function() {
    const sb = getSB(); if (!sb || !rows.length) { setMap({}); return; }
    let alive = true;

    const bySku = {}, byName = {};
    rows.forEach(function(r) {
      const prod = products.find(p => p.id === r.product_id);
      if (prod && prod.bcliquor_sku) bySku[r.id] = prod.bcliquor_sku;
      else if (r.name) byName[r.id] = r.name.trim().toUpperCase();
    });

    const skus  = [...new Set(Object.values(bySku))];
    const names = [...new Set(Object.values(byName))];

    Promise.all([
      skus.length  ? sb.from('bcl_products').select('*').in('sku', skus)   : Promise.resolve({ data: [] }),
      names.length ? sb.from('bcl_products').select('*').in('name', names) : Promise.resolve({ data: [] }),
    ]).then(function(res) {
      if (!alive) return;
      const skuHit = {}, nameHit = {};
      (res[0].data || []).forEach(b => { skuHit[b.sku] = b; });
      (res[1].data || []).forEach(b => { nameHit[b.name] = b; });
      const next = {};
      rows.forEach(function(r) {
        if (bySku[r.id] && skuHit[bySku[r.id]]) next[r.id] = skuHit[bySku[r.id]];
        else if (byName[r.id] && nameHit[byName[r.id]]) next[r.id] = nameHit[byName[r.id]];
      });
      setMap(next);
    });
    return function(){ alive = false; };
  }, [rows, products]);

  return map;
}

// Reference price from the monthly list, upgraded to today's live price once
// one has been fetched. Clicking re-checks. Green/amber shows how the feature
// price sits against whichever BCL figure is showing.
function BclCell({ feature, bcl, live, onCheck }) {
  const price = live && live.price != null ? live.price
              : bcl && bcl.price != null ? bcl.price : null;

  if (live && live.loading) return <span className="lbl">checking…</span>;
  if (price == null) {
    return (
      <button onClick={onCheck} className="lbl hover:underline"
              title={live && live.error ? live.error : 'Check the live BCL price'}>
        {live && live.error ? 'n/a' : '—'}
      </button>
    );
  }

  const ours = feature.sale_price != null ? Number(feature.sale_price) : null;
  const diff = ours != null ? ours - Number(price) : null;
  const src  = live && live.price != null ? 'live ' + live.at : (bcl ? bcl.list_label : '');

  return (
    <button onClick={onCheck} className="mono text-xs whitespace-nowrap text-left"
            title={(bcl ? bcl.name + ' · ' : '') + src + ' — click to check the live price'}>
      <span style={{color: live && live.price != null ? 'var(--cy)' : 'var(--txt2)'}}>
        {money(price)}
      </span>
      {diff != null && (
        <span className="block" style={{color: diff < 0 ? 'var(--grn)' : diff > 0 ? 'var(--amb)' : 'var(--txt3)'}}>
          {diff === 0 ? 'match' : (diff < 0 ? money(Math.abs(diff)) + ' under' : money(diff) + ' over')}
        </span>
      )}
      <span className="lbl block">{src}</span>
    </button>
  );
}

function FeaturesPage({ isAdmin, myStores, editableIds }) {
  const toast = useToast();
  // Everyone sees every store's month (managers need to know what the chain
  // is running); editing is only for your own stores. The database enforces
  // the same rule, so this mirrors reality rather than inventing it.
  const [storeId, setStoreId] = useState(
    (editableIds && editableIds.length ? editableIds[0] : (myStores[0]||{}).id) || '');
  const canEdit = !editableIds || editableIds.includes(storeId);
  const [period,  setPeriod]  = useState(monthKey(new Date()));
  const [showPaste, setShowPaste] = useState(false);
  const [showCsv, setShowCsv] = useState(false);
  const [showBatch, setShowBatch] = useState(false);
  const [showPlan,  setShowPlan]  = useState(false);
  const [showSign,  setShowSign]  = useState(false);
  const [showWeb,   setShowWeb]   = useState(false);
  const [showCocktails, setShowCocktails] = useState(false);
  const [view, setView] = useState('month');   // month | dashboard
  const [mode, setMode] = useState('plan');   // plan | sales

  const { periodRow, rows, loading, reload, addRows, updateRow, deleteRow, setStatus, ensurePeriod } =
    useFeaturePeriod(storeId, period);
  const { images: products, load: reloadProducts } = useBrandImageLibrary();
  const { campaigns } = useCampaigns();
  const bclMap = useBclPrices(rows, products);

  // The store's inventory SKUs, when an inventory has been imported — powers
  // "not in the stock list" warnings on rows. null = no inventory loaded, so
  // no warnings (absence of data is not evidence of absence from shelves).
  const [invSkus, setInvSkus] = useState(null);
  useEffect(function() {
    const sb = getSB(); if (!sb || !storeId) { setInvSkus(null); return; }
    let alive = true;
    sb.from('store_inventory').select('sku').eq('store_id', storeId).range(0, 9999)
      .then(function(res) {
        if (!alive) return;
        setInvSkus(res.data && res.data.length ? new Set(res.data.map(r=>r.sku)) : null);
      });
    return function(){ alive = false; };
  }, [storeId]);

  // Live BCL prices, fetched from the public catalogue as rows are worked on.
  // One request per name commit — typing doesn't fire anything until the field
  // is left — and results are kept for the session so re-renders cost nothing.
  const [liveMap, setLiveMap] = useState({});
  const liveInflight = useRef({});

  const checkLive = useCallback(async function(row) {
    if (!row || liveInflight.current[row.id]) return;
    const prod = products.find(p => p.id === row.product_id);
    const term = (prod && prod.bcliquor_sku) || (row.name || '').trim();
    if (term.length < 3) return;

    liveInflight.current[row.id] = true;
    setLiveMap(prev => Object.assign({}, prev, { [row.id]: { loading:true } }));
    try {
      const r = await callEdge('bcliquor', 'search', { query: term });
      const list = r.products || [];
      // Exact SKU beats everything; else exact name; else give up rather than
      // show a confident price for the wrong bottle.
      const hit = (prod && prod.bcliquor_sku && list.find(p => p.sku === prod.bcliquor_sku))
               || list.find(p => p.name.trim().toUpperCase() === (row.name || '').trim().toUpperCase())
               || (list.length === 1 ? list[0] : null);
      if (!hit) throw new Error('No exact match in the live catalogue');
      setLiveMap(prev => Object.assign({}, prev, { [row.id]: {
        price: hit.current_price, regular: hit.regular_price,
        at: new Date().toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }),
      }}));
    } catch(e) {
      setLiveMap(prev => Object.assign({}, prev, { [row.id]: { error: e.message } }));
    } finally {
      delete liveInflight.current[row.id];
    }
  }, [products]);

  const stats = featureStats(rows);
  const shiftMonth = n => {
    const [y,m] = period.split('-').map(Number);
    setPeriod(monthKey(new Date(y, m-1+n, 1)));
  };

  const patch = async (id, p) => {
    try {
      await updateRow(id, p);
      // A new name or a newly linked product is the moment the manager wants
      // the comparison, so fetch it then rather than making them ask.
      if (('name' in p && p.name) || ('product_id' in p && p.product_id)) {
        const row = rows.find(r => r.id === id);
        checkLive(Object.assign({}, row, p));
      }
    } catch(e){ toast.error(e.message); }
  };

  const addBlank = async () => {
    try { await addRows([{ ...FEATURE_BLANK, name:'New feature' }]); }
    catch(e){ toast.error(e.message); }
  };

  const totalRev = rows.reduce((a,r)=>a + (Number(r.revenue)||0), 0);
  const totalQty = rows.reduce((a,r)=>a + (Number(r.qty_sold)||0), 0);

  if (view === 'dashboard') {
    return (
      <div className="space-y-4">

// ─────────────────────────────────────────────
// MONTHLY CSV IMPORT
// ─────────────────────────────────────────────
// The exported sheet is one file per month containing a block per store:
//   STORE NAME
//   MARKETING / TASTING / DATA READINESS rows
//   Name,Size,Reg Price,...           <- feature table
//   Product,Date,Start Time,...       <- tastings table (skipped)
const STORE_HEADER = /^(HIDEAWAY|DOWNTOWN|BROTHERS|COBBLESTONE)[^,]*LIQUOR STORE/i;

// Proper CSV split — names like "GRAN PASSIONE PROSECCO, ROSSO, BIANCO" are
// quoted and contain the delimiter.
function splitCsvLine(line) {
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(c => c.replace(/\r$/, '').trim());
}

const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

// "LRS FEATURES 2026(Aug 2026).csv" -> 2026-08-01
function monthFromFilename(filename) {
  const f = String(filename || '').toLowerCase();
  const m = f.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s*,?\s*((?:19|20)\d{2})/);
  if (m) return m[2] + '-' + String(MONTHS.indexOf(m[1]) + 1).padStart(2,'0') + '-01';
  const y = f.match(/(19|20)\d{2}/);
  return y ? y[0] + '-01-01' : monthKey(new Date());
}

function parseFeatureCsv(text) {
  const lines = String(text || '').split(/\r?\n/);
  const blocks = [];
  let store = null, mode = null;

  for (const line of lines) {
    if (!line.trim() || /^,+$/.test(line)) continue;
    const c = splitCsvLine(line);
    const first = c[0] || '';

    if (STORE_HEADER.test(first)) {
      store = { storeName: first.trim(), rows: [] };
      blocks.push(store);
      mode = null;
      continue;
    }
    if (/^name$/i.test(first) && /^size$/i.test(c[1] || '')) { mode = 'features'; continue; }
    if (/^product$/i.test(first) && /^date$/i.test(c[1] || '')) { mode = 'tastings'; continue; }
    if (/readiness|completeness/i.test(first)) continue;
    if (mode !== 'features' || !store || !first) continue;

    const reg  = parseMoney(c[2]);
    const sale = parseMoney(c[3]);
    const sav  = parseMoney(c[4]);
    const qty  = parseInt10(c[9]);
    const rev  = parseMoney(c[10]);
    store.rows.push({
      ...FEATURE_BLANK,
      name: first.replace(/\s+/g,' ').trim(),
      size: (c[1] || '').replace(/\s+/g,' ').trim(),
      reg_price: reg, sale_price: sale,
      savings: sav != null ? sav : suggestSavings(reg, sale),
      // Revenue of exactly 0 is the sheet's placeholder, not a real figure.
      qty_sold: qty || null,
      revenue: rev ? rev : null,
      notes: (c[12] || '').trim(),
    });
  }
  return blocks.filter(b => b.rows.length);
}

// "DOWNTOWN LIQUOR STORE" -> the store id used everywhere else in the app.
function matchStoreId(label) {
  const l = String(label || '').toLowerCase();
  const hit = STORES.find(s => l.includes(s.id) || l.includes(s.name.split(' ')[0].toLowerCase()));
  return hit ? hit.id : null;
}

async function importFeatureCsv(blocks, period, { replace = false } = {}) {
  const sb = getSB();
  const { data:{ user } } = await sb.auth.getUser();
  const result = [];

  for (const b of blocks) {
    const storeId = b.matchedStore || matchStoreId(b.storeName);
    if (!storeId) { result.push({ store:b.storeName, skipped:'no matching store' }); continue; }

    let { data: p } = await sb.from('feature_periods')
      .select('*').eq('store_id', storeId).eq('period', period).maybeSingle();

    if (!p) {
      const ins = await sb.from('feature_periods')
        .insert({ store_id:storeId, period, status:'closed', created_by:user?.id })
        .select().single();
      if (ins.error) { result.push({ store:storeId, skipped:ins.error.message }); continue; }
      p = ins.data;
    } else if (replace) {
      await sb.from('features').delete().eq('period_id', p.id);
    }

    const { count } = await sb.from('features')
      .select('id', { count:'exact', head:true }).eq('period_id', p.id);
    const base = count || 0;

    const payload = b.rows.map((r,i) => ({ ...r, period_id:p.id, position:base+i }));
    const { error } = await sb.from('features').insert(payload);
    result.push(error ? { store:storeId, skipped:error.message } : { store:storeId, added:payload.length });
  }
  return result;
}

function FeatureCsvImport({ onDone, onClose }) {
  const toast = useToast();
  const [blocks, setBlocks] = useState(null);
  const [period, setPeriod] = useState(monthKey(new Date()));
  const [filename, setFilename] = useState('');
  const [replace, setReplace] = useState(false);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef();

  const handleFile = async function(file) {
    if (!file) return;
    setFilename(file.name);
    setPeriod(monthFromFilename(file.name));
    const text = await file.text();
    const parsed = parseFeatureCsv(text).map(b => ({ ...b, matchedStore: matchStoreId(b.storeName) }));
    setBlocks(parsed);
    if (!parsed.length) toast.error('No feature rows found in that file');
  };

  const run = async function() {
    setBusy(true);
    try {
      const res = await importFeatureCsv(blocks, period, { replace });
      const added = res.reduce((a,r)=>a+(r.added||0), 0);
      const bad = res.filter(r=>r.skipped);
      toast.success('Imported ' + added + ' rows for ' + monthLabel(period));
      if (bad.length) toast.error(bad.map(b=>b.store+': '+b.skipped).join(' · '));
      if (onDone) onDone();
      onClose();
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  const total = (blocks||[]).reduce((a,b)=>a+b.rows.length, 0);

  return (
    <div className="p-4" style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.45)'}}>
      <div className="flex items-center gap-3 mb-3">
        <span className="ttl">Import a monthly CSV</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
        <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>
      </div>

      <div className="flex items-center gap-2 flex-wrap mb-3">
        <Button size="sm" variant="secondary" onClick={()=>fileRef.current?.click()}>
          <Icon name="folder"/> Choose file
        </Button>
        {filename && <span className="mono text-xs truncate" style={{color:'var(--txt2)', maxWidth:'260px'}}>{filename}</span>}
        <input ref={fileRef} type="file" accept=".csv,text/csv" className="hidden"
               onChange={e=>{ handleFile(e.target.files?.[0]); e.target.value=''; }}/>
      </div>

      {blocks && (
        <React.Fragment>
          <div className="grid grid-cols-2 gap-3 mb-3">
            <div>
              <Label>Month</Label>
              <Input type="month" value={period.slice(0,7)}
                     onChange={e=>setPeriod(e.target.value + '-01')}/>
              <p className="lbl mt-1">Read from the filename — change it if that's wrong</p>
            </div>
            <div>
              <Label>If the month already has rows</Label>
              <Select value={replace ? 'replace' : 'append'} onChange={e=>setReplace(e.target.value==='replace')}>
                <option value="append">Add to them</option>
                <option value="replace">Replace them</option>
              </Select>
            </div>
          </div>

          <div style={{border:'1px solid var(--line)'}}>
            {blocks.map(function(b,i){
              const st = STORES.find(s=>s.id===b.matchedStore);
              return (
                <div key={i} className="flex items-center gap-3 px-3 py-2"
                     style={{borderBottom:'1px solid rgba(212,175,55,.07)'}}>
                  <Icon name={st ? 'check' : 'warn'} size={13}
                        style={{color: st ? 'var(--grn)' : 'var(--amb)'}}/>
                  <span className="text-xs flex-1 truncate" style={{color:'var(--txt)'}}>{b.storeName}</span>
                  <span className="lbl">{st ? st.name : 'no matching store — will be skipped'}</span>
                  <span className="mono text-xs" style={{color:'var(--cy)'}}>{b.rows.length}</span>
                </div>
              );
            })}
          </div>

          <div className="flex gap-2 mt-3">
            <Button size="sm" onClick={run} loading={busy} disabled={!total}>
              <Icon name="down"/> Import {total} rows
            </Button>
            <Button size="sm" variant="ghost" onClick={onClose}>Cancel</Button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}
