    .filter(p => !q.trim() || (p.product_name || '').toUpperCase().includes(q.trim().toUpperCase()))
    .slice(0, 30);

  return (
    <Card>
      <div className="flex items-center gap-3 mb-1 flex-wrap">
        <span className="ttl">Store picks · website</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
        <button className="lbl hover:underline" style={{color:'var(--cy)'}}
          onClick={async function(){
            try { await navigator.clipboard.writeText(pickEmbed); toast.success('Embed code copied'); }
            catch(e) { toast.error(e.message); }
          }}>
          Copy embed code
        </button>
        {canEdit && (
          <Button size="sm" variant="outline" onClick={toggleSuggest} disabled={busy || suggestBusy}>
            <Icon name="chart"/> Top sellers
          </Button>
        )}
        {canEdit && (
          <Button size="sm" variant="outline" onClick={()=>setShowAdd(v=>!v)} disabled={busy}>
            <Icon name="tag"/> Add products
          </Button>
        )}
      </div>
      <p className="lbl mb-3">
        A hand-picked shelf for the store's website, separate from the monthly
        features. Prices optional. Changes go live in about five minutes — and
        an empty list hides the whole block on the site.
      </p>

      {suggestOpen && canEdit && (
        <div className="mb-3 p-3" style={{border:'1px solid var(--line)'}}>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <span className="lbl">Top 5 from feature sales, last two months</span>
            <div className="flex items-center" style={{border:'1px solid var(--line)'}}>
              <button className="lbl px-2 py-1" disabled={suggestBusy}
                      onClick={()=>setScope('store')}
                      style={{color: suggestScope==='store' ? '#0a121f' : 'var(--txt2)',
                              background: suggestScope==='store' ? 'var(--cy)' : 'transparent'}}>
                This store
              </button>
              <button className="lbl px-2 py-1" disabled={suggestBusy}
                      onClick={()=>setScope('all')}
                      style={{color: suggestScope==='all' ? '#0a121f' : 'var(--txt2)',
                              background: suggestScope==='all' ? 'var(--cy)' : 'transparent'}}>
                All stores
              </button>
            </div>
            <span className="flex-1"/>
            <button className="lbl hover:underline" style={{color:'var(--cy)'}}
                    onClick={()=>loadSuggestions()} disabled={suggestBusy}>Refresh</button>
          </div>
          {suggestBusy ? <p className="lbl py-3">Checking feature sales…</p>
           : !suggestions || suggestions.length === 0 ? (
            <p className="lbl py-3">
              No feature sales figures {suggestScope==='all' ? 'for any store' : 'for this store'} in
              the last two months. This ranks by qty sold on monthly features, so it only knows
              about products that were featured with sales entered — not a
              full sales feed.
            </p>
          ) : (
            <React.Fragment>
              <div className="space-y-1 mb-2">
                {suggestions.map(function(s) {
                  return (
                    <label key={s.product_id} className="flex items-center gap-2 py-1 cursor-pointer">
                      <input type="checkbox" checked={!!suggestSel[s.product_id]}
                             onChange={e=>setSuggestSel(prev=>Object.assign({}, prev, {[s.product_id]: e.target.checked}))}/>
                      <img src={prodSrc(s.prod)} alt="" className="w-7 h-7 object-contain flex-none"
                           style={{background:'#fff', border:'1px solid var(--line)'}}/>
                      <span className="text-xs flex-1 truncate">{s.prod.product_name}</span>
                      <span className="lbl">{s.qty ? s.qty.toLocaleString() + ' sold' : fmtMoney(s.revenue)}</span>
                    </label>
                  );
                })}
              </div>
              <Button size="sm" onClick={addSuggested} disabled={busy || !Object.values(suggestSel).some(Boolean)}>
                <Icon name="check"/> Add selected to picks
              </Button>
            </React.Fragment>
          )}
        </div>
      )}

      {showAdd && canEdit && (
        <div className="mb-3 p-3" style={{border:'1px solid var(--line)'}}>
          <Input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search products…"
                 className="text-xs mb-2 max-w-xs"/>
          <div className="grid grid-cols-4 sm:grid-cols-8 gap-2" style={{maxHeight:'150px', overflowY:'auto'}}>
            {candidates.map(function(p) {
              return (
                <button key={p.id} onClick={()=>addPick(p)} disabled={busy} title={p.product_name}
                        className="text-left" style={{border:'1px solid var(--line)'}}>
                  <img src={prodSrc(p)} alt="" className="w-full object-contain" style={{aspectRatio:'1', background:'#fff'}}/>
                  <span className="lbl block px-1 truncate">{p.product_name}</span>
                </button>
              );
            })}
            {candidates.length === 0 && <p className="lbl col-span-full py-3">No matching products with photos.</p>}
          </div>
        </div>
      )}

      {picks === null ? <p className="lbl py-4">Loading…</p>
       : picks.length === 0 ? (
        <p className="lbl py-3">Nothing picked — the website block is hidden.</p>
      ) : picks.map(function(pk, i) {
        const prod = prodOf(pk.product_id);
        if (!prod) return null;
        const d = draft[pk.id] || {};
        const off = pk.visible === false;
        const rec = recipeFor(prod);
        const recOn = pk.recipe_on !== false;
        return (
          <div key={pk.id} className="flex items-center gap-3 py-1.5 flex-wrap"
               style={{borderBottom:'1px solid rgba(212,175,55,.06)', opacity: off ? 0.45 : 1}}>
            <button disabled={!canEdit || busy}
                    onClick={()=>patchPick(pk, { visible: off })}
                    title={off ? 'Hidden from the website — click to show' : 'Showing on the website — click to hide'}
                    aria-label={off ? 'Show on website' : 'Hide from website'}>
              <Icon name="eye" size={14} style={{color: off ? 'var(--txt3)' : 'var(--cy)'}}/>
            </button>
            {rec && (
              <button disabled={!canEdit || busy}
                      onClick={()=>patchPick(pk, { recipe_on: !recOn })}
                      title={recOn ? 'Card flips to "' + rec.name + '" — click to remove the flip' : 'Click to add the "' + rec.name + '" flip card'}
                      aria-label={recOn ? 'Remove recipe flip' : 'Add recipe flip'}>
                <Icon name="cocktail" size={14} style={{color: recOn ? 'var(--cy)' : 'var(--txt3)'}}/>
              </button>
            )}
            <img src={prodSrc(prod)} alt="" className="w-9 h-9 object-contain flex-none"
                 style={{background:'#fff', border:'1px solid var(--line)'}}/>
            <span className="text-xs flex-1 truncate" style={{color:'var(--txt)', minWidth:'120px'}}>
              {prod.product_name}
              {off && <span className="lbl ml-2" style={{color:'var(--amb)'}}>hidden</span>}
            </span>
            <fieldset disabled={!canEdit || busy} style={{border:0, padding:0, margin:0, display:'contents'}}>
              <Input type="number" step="0.01" placeholder="price" className="text-xs"
                     style={{width:'80px', padding:'3px 6px'}}
                     value={d.price !== undefined ? d.price : (pk.price ?? '')}
                     onChange={e=>setDraft(prev=>Object.assign({}, prev, {[pk.id]: Object.assign({}, prev[pk.id], {price: e.target.value})}))}
                     onBlur={()=>{ if (d.price !== undefined) patchPick(pk, { price: d.price === '' ? null : Number(d.price) }); }}/>
              <Input type="number" step="0.01" placeholder="was" className="text-xs"
                     style={{width:'80px', padding:'3px 6px'}}
                     value={d.reg !== undefined ? d.reg : (pk.reg_price ?? '')}
                     onChange={e=>setDraft(prev=>Object.assign({}, prev, {[pk.id]: Object.assign({}, prev[pk.id], {reg: e.target.value})}))}
                     onBlur={()=>{ if (d.reg !== undefined) patchPick(pk, { reg_price: d.reg === '' ? null : Number(d.reg) }); }}/>
              <Input placeholder="note (optional)" className="text-xs"
                     style={{width:'150px', padding:'3px 6px'}}
                     value={d.note !== undefined ? d.note : (pk.note ?? '')}
                     onChange={e=>setDraft(prev=>Object.assign({}, prev, {[pk.id]: Object.assign({}, prev[pk.id], {note: e.target.value})}))}
                     onBlur={()=>{ if (d.note !== undefined) patchPick(pk, { note: d.note.trim() || null }); }}/>
              <Button size="sm" variant="ghost" onClick={()=>move(i,-1)} disabled={i===0} aria-label="Up"><Icon name="up" size={11}/></Button>
              <Button size="sm" variant="ghost" onClick={()=>move(i,1)} disabled={i===picks.length-1} aria-label="Down"><Icon name="down" size={11}/></Button>
              <Button size="sm" variant="ghost" onClick={()=>removePick(pk)} aria-label="Remove"><Icon name="close" size={11}/></Button>
            </fieldset>
          </div>
        );
      })}
    </Card>
  );
}

// A small labelled dropdown for toolbars that would otherwise sprawl.
function ToolMenu({ label, icon, items }) {
  const [open, setOpen] = useState(false);
  const [pos,  setPos]  = useState(null);
  const btnRef = useRef(null);
  const usable = items.filter(Boolean);
  if (!usable.length) return null;
  // The menu is portalled to the body: cards use a clip-path, which silently
  // clips any absolutely positioned child that pokes past the card's edge —
  // the same trap that once ate the draggable dialogs.
  const toggle = function() {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setPos({ top: r.bottom + 4, right: Math.max(8, window.innerWidth - r.right) });
    }
    setOpen(v=>!v);
  };
  return (
    <div className="inline-block" ref={btnRef}>
      <Button size="sm" variant="outline" onClick={toggle}>
        <Icon name={icon}/> {label} <Icon name="down" size={9} style={{opacity:.6}}/>
      </Button>
      {open && pos && (
        <Portal>
          <div className="fixed inset-0 z-[240]" onClick={()=>setOpen(false)}/>
          <div className="fixed z-[250] min-w-[190px] py-1"
               style={{top: pos.top + 'px', right: pos.right + 'px',
                       background:'var(--menu)', border:'1px solid var(--line)',
                       boxShadow:'0 10px 30px rgba(0,0,0,.5)'}}>
            {usable.map(function(it, i) {
              if (it.divider) return <div key={i} className="my-1" style={{borderTop:'1px solid var(--line)'}}/>;
              return (
                <button key={i} disabled={it.disabled}
                  onClick={()=>{ setOpen(false); it.onClick(); }}
                  className="w-full text-left px-3 py-2 text-xs flex items-center gap-2"
                  style={{color: it.danger ? 'var(--amb)' : 'var(--txt2)', opacity: it.disabled ? 0.4 : 1}}>
                  <Icon name={it.icon} size={13}/>{it.label}
                </button>
              );
            })}
          </div>
        </Portal>
      )}
    </div>
  );
}

// The website's own corner of the app: store picks now, whatever else the

// month; they're "what we want on the site right now".

    (editableIds && editableIds.length ? editableIds[0] : (STORES[0]||{}).id) || '');
  const canEdit = !editableIds || editableIds.includes(storeId);
  const store = STORES.find(s=>s.id===storeId) || {};
  return (
    <div className="space-y-4">

        <div className="flex items-center gap-3 flex-wrap">

}

// ─────────────────────────────────────────────
// MONTHLY COCKTAILS
// ─────────────────────────────────────────────
// One easy cocktail per featured spirit (wine on request), written by the
// same engine as the recipe editor and saved to the recipe library linked to
// the feature — where the website push and the social recipe cards both find
// them. No photos here: those cost money and belong to the social flow.
function FeatureCocktailBatch({ storeId, period, rows, products, onClose, onDone }) {
  const dragPanel = useDragPanel();
  const toast = useToast();
  const { recipes, save } = useRecipes();
  const [picked,  setPicked]  = useState(null);   // null until computed below
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState('');

  const prodOf = id => products.find(p => p.id === id) || null;
  const candidates = rows
    .map(function(r) {
      const prod = prodOf(r.product_id);
      const kind = prod ? recipeEligibility(prod.category) : null;
      const existing = recipes.find(x => x.feature_id === r.id);
      return kind ? { r, prod, kind, existing } : null;
    })
    .filter(Boolean);

  // Spirits pre-ticked, wine offered unticked, existing recipes unticked —
  // re-running the month must not overwrite anyone's edited recipe.
  const effPicked = picked !== null ? picked
    : new Set(candidates.filter(c => c.kind === 'spirit' && !c.existing).map(c => c.r.id));
  const toggle = id => setPicked(function(prev) {
    const next = new Set(prev === null ? effPicked : prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });

  const run = async function() {
    const todo = candidates.filter(c => effPicked.has(c.r.id));
    if (!todo.length) { toast.error('Nothing ticked'); return; }
    setRunning(true);
    let made = 0, failed = 0, firstError = null;
    try {
      for (const c of todo) {
        const label = c.r.name || c.prod.product_name;
        const base = label + (c.prod.size ? ' (' + c.prod.size + ')' : '');
        setProgress(label + '… (' + (made + failed + 1) + '/' + todo.length + ')');
        try {
          const resp = await callEdge('meta-social', 'aiWrite',
            { prompt: cocktailRecipePrompt(base, label, c.kind), maxTokens: 700 });
          const raw = (resp.text || '').replace(/^```(?:json)?/i, '').replace(/```$/,'').trim();
          const p = JSON.parse(raw);
          // Column names, not editor names: the screen's "blurb" lives in
          // the notes column — same mapping the recipe editor's save does.
          await save({
            store_id: null,
            product_id: c.prod.id,
            feature_id: c.r.id,
            name: p.name || label + ' cocktail',
            notes: p.blurb || null,
            glass: p.glass || null,
            garnish: p.garnish || null,
            ingredients: recipeProductFirst(
              (p.ingredients || []).map(i => ({ amount: toOunces(i.amount || ''), item: i.item || '' })),
              label).filter(i => i.item || i.amount),
            method: Array.isArray(p.method) ? p.method.filter(Boolean) : [],
          });
          made++;
        } catch (e) { failed++; if (!firstError) firstError = e.message || String(e); }
      }
      if (made) {
        toast.success(made + ' cocktail' + (made===1?'':'s') + ' saved to the recipe library'
          + (failed ? ' · ' + failed + ' failed: ' + firstError : ''));
        onDone && onDone();
        onClose();
      } else {
        toast.error('Every recipe failed — ' + (firstError || 'unknown error'));
      }
    } finally { setRunning(false); setProgress(''); }
  };

  return (
    <Portal>
    <div className="fixed inset-0 z-[210] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.88)', backdropFilter:'blur(4px)'}}
         onClick={running ? undefined : onClose}>
      <div className="hud hud-brk w-full max-w-lg max-h-[88vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-center gap-3 mb-4">
          <span className="ttl">Monthly cocktails</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {!running && <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>}
        </div>

        {candidates.length === 0 ? (
          <p className="lbl py-6 text-center">
            No cocktail-worthy features this month — spirits (and the odd wine) qualify; beer and RTDs don't.
          </p>
        ) : (
          <React.Fragment>
            <p className="lbl mb-3">
              One easy cocktail per ticked feature, saved to the recipe library and
              available to the website push. Spirits are pre-ticked; wine is offered;
              features that already have a recipe stay untouched unless ticked.
            </p>
            <div className="mb-4" style={{maxHeight:'260px', overflowY:'auto', border:'1px solid var(--line)'}}>
              {candidates.map(function(c) {
                const on = effPicked.has(c.r.id);
                return (
                  <label key={c.r.id} className="flex items-center gap-3 px-3 py-1.5 cursor-pointer"
                         style={{borderBottom:'1px solid rgba(212,175,55,.06)'}}>
                    <input type="checkbox" checked={on} onChange={()=>toggle(c.r.id)}/>
                    <Icon name={c.kind === 'wine' ? 'wine' : 'cocktail'} size={13}
                          style={{color: c.kind === 'wine' ? 'var(--amb)' : 'var(--cy)'}}/>
                    <span className="text-xs flex-1 truncate" style={{color:'var(--txt)'}}>{c.r.name}</span>
                    {c.existing && <span className="lbl" style={{color:'var(--grn)'}}>has "{c.existing.name}"</span>}
                    {c.kind === 'wine' && !c.existing && <span className="lbl">wine — optional</span>}
                  </label>
                );
              })}
            </div>
            <div className="flex items-center gap-3 justify-end">
              {progress && <span className="lbl">{progress}</span>}
              <Button size="sm" variant="outline" onClick={onClose} disabled={running}>Cancel</Button>
              <Button size="sm" onClick={run} loading={running} disabled={!effPicked.size}>
                <Icon name="cocktail"/> Write {effPicked.size} recipe{effPicked.size===1?'':'s'}
              </Button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
    </Portal>
  );
}

// ─────────────────────────────────────────────
// WEBSITE PUSH
// ─────────────────────────────────────────────
// The month's features, published to the store's website. Two shapes from
// one snapshot: an iframe embed that updates itself on every push (Duda's
// HTML/embed widget, added once), and a static HTML block for pasting when
// someone wants the markup in the page itself. Only rows whose product has a
// hosted photo — or a generated creative — make the cut; a features grid
// with grey squares sells nothing.
function WebsitePushModal({ storeId, storeName, period, periodRow, rows, products, onClose }) {
  const dragPanel = useDragPanel();
  const toast = useToast();
  const { profile: brand } = useBrandProfile(storeId);
  const { recipes } = useRecipes();
  const [busy, setBusy] = useState(false);
  const [published, setPublished] = useState(false);

  // A cocktail under a spirit's card reframes the bottle from a price into an
  // occasion. Recipes ride along when the feature has one — tickable, on by
  // default, because someone made that recipe deliberately.
  const recipeFor = r => recipes.find(x => x.feature_id === r.id) || null;
  const [recOn, setRecOn] = useState({});
  const recActive = r => recOn[r.id] !== undefined ? recOn[r.id] : true;

  const runR = periodRange(period, periodRow);
  const dates = 'Prices run ' + rangeLabel(runR);
  const prodOf = id => products.find(p => p.id === id) || null;

  // Every card is a plain product shot — mixing bottle photos with price-ad
  // graphics looked patchy, and the graphics repeat the price the card
  // already shows. Products whose photo lives only in the database get a
  // hosted copy uploaded at publish time (and the library keeps it, so it's
  // once per product, ever).
  const imageFor = function(r) {
    const prod = prodOf(r.product_id);
    if (!prod) return null;
    if (prod.image_url) return { src: prod.image_url, hosted: true, prod };
    if (prod.data)      return { src: prod.data,      hosted: false, prod };
    return null;
  };
  // Every named row makes a card. No photo? A branded placeholder — better a
  // confident card in store colours than a silent absence from the flyer.
  const withImage = rows
    .filter(r => r.name)
    .map(function(r) {
      const img = imageFor(r);
      return img
        ? { r, image: img.src, hosted: img.hosted, prod: img.prod, placeholder: false }
        : { r, image: null, hosted: true, prod: null, placeholder: true };
    });

  // Upload a database-only photo and remember the URL on the product.
  const hostPhoto = async function(prod) {
    const sb = getSB();
    const blob = dataUrlToBlob(prod.data);
    const path = 'website/products/' + prod.id + '.png';
    const { error } = await sb.storage.from('creatives')
      .upload(path, blob, { upsert: true, contentType: blob.type || 'image/png', cacheControl: '31536000' });
    if (error) throw new Error('Could not host the photo for "' + prod.product_name + '": ' + error.message);
    const url = sb.storage.from('creatives').getPublicUrl(path).data.publicUrl;
    await sb.from('brand_images').update({ image_url: url }).eq('id', prod.id);
    prod.image_url = url;
    return url;
  };

  // Which of those actually go on the site. The choice is stored on the
  // feature row itself (on_website), so it survives closing this dialog and
  // pre-ticks the same way next time.
  const [webOn, setWebOn] = useState(function() {
    const m = {};
    withImage.forEach(x => { m[x.r.id] = x.r.on_website !== false; });
    return m;
  });
  const toggleWeb = async function(row) {
    const next = !webOn[row.id];
    setWebOn(prev => Object.assign({}, prev, { [row.id]: next }));
    try {
      const { error } = await getSB().from('features')
        .update({ on_website: next }).eq('id', row.id);
      if (error) throw new Error(error.message);
    } catch(e) {
      setWebOn(prev => Object.assign({}, prev, { [row.id]: !next }));
      toast.error(e.message);
    }
  };
  const eligible = withImage.filter(x => webOn[x.r.id]);

  const snapshot = () => ({
    store: storeId,
    title: storeName.replace(/ Liquor Store.*$/i, '') + ' Monthly Features',
    period, dates,
    updated_at: new Date().toISOString(),
    footnote: 'Prices exclude tax & deposit — while supplies last.',
    brand: {
      primary: (brand && brand.primary_color) || '#1e3a5f',
      secondary: (brand && brand.secondary_color) || '#c4a35a',
    },
    items: eligible.map(function(x) {
      const rec = recipeFor(x.r);
      const withRec = rec && recActive(x.r) && rec.name;
      return {
        name: x.r.name, size: x.r.size || '',
        reg: x.r.reg_price != null ? Number(x.r.reg_price) : null,
        sale: x.r.sale_price != null ? Number(x.r.sale_price) : null,
        savings: x.r.savings != null ? Number(x.r.savings) : null,
        category: (x.prod && x.prod.category) || null,
        image: x.image,
        placeholder: x.placeholder || undefined,
        recipe: withRec ? {
          name: rec.name, blurb: rec.notes || '', glass: rec.glass || '',
          garnish: rec.garnish || '',
          ingredients: (rec.ingredients || []).filter(i => i.item),
          method: (rec.method || []).filter(Boolean),
        } : undefined,
      };
    }),
  });

  const embedUrl = 'https://lrs.thesuenocompany.com/features-embed.html?store=' + encodeURIComponent(storeId);
  // The frame sizes itself: the embedded page reports its height and this
  // snippet's listener applies it — the whole grid shows, no scrollbar.
  // The e.source check matters when a page carries two of our blocks
  // (features + picks): without it each listener obeys the other's height.
  const iframeCode =
    '<iframe id="lrs-features-' + storeId + '" src="' + embedUrl + '"'
    + ' style="width:100%;border:0;height:600px" scrolling="no" loading="lazy" title="Monthly features"></iframe>\n'
    + '<script>window.addEventListener("message",function(e){'
    + 'var f=document.getElementById("lrs-features-' + storeId + '");'
    + 'if(f&&e.source===f.contentWindow&&e.origin==="https://lrs.thesuenocompany.com"&&e.data&&e.data.lrsFeaturesHeight!=null){'
    + 'f.style.height=e.data.lrsFeaturesHeight+"px";}});<\/script>';

  const htmlBlock = function() {
    const money = n => '$' + Number(n).toFixed(2);
    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const d = snapshot();
    let h = '<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#191919">'
      + '<div style="text-align:center;margin:8px 0"><h2 style="font-size:26px;margin:0">' + esc(d.title) + '</h2>'
      + '<p style="color:#757575;font-size:14px;margin:4px 0 0">' + esc(d.dates) + '</p></div>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px">';
    d.items.forEach(function(it) {
      const pct = (it.savings > 0 && it.reg > 0) ? Math.round(it.savings / it.reg * 100) : 0;
      const ribbon = it.savings > 0
        ? '<span style="position:absolute;top:10px;right:-1px;z-index:3;background:#b42a2a;color:#fff;font-size:15px;font-weight:800;padding:6px 12px 6px 14px;border-radius:6px 0 0 6px;box-shadow:0 2px 6px rgba(0,0,0,.18);line-height:1.15;text-align:right">SAVE ' + money(it.savings).replace('.00','')
          + (pct >= 10 ? '<small style="display:block;font-size:10px;font-weight:700;opacity:.92">' + pct + '% OFF</small>' : '')
          + '</span>'
        : '';
      const bp = d.brand.primary, bs = d.brand.secondary;
      const photo = it.placeholder
        ? '<div style="position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:' + bp + ';padding:16px;text-align:center">'
          + '<span style="color:' + bs + ';font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase">' + esc(d.title.split(' ')[0]) + '</span>'
          + '<span style="color:#fff;font-size:19px;font-weight:800;line-height:1.2">' + esc(it.name) + '</span>'
          + '<span style="color:' + bs + ';font-size:12px;font-style:italic">Too good to wait for a photo</span></div>'
        : '<img loading="lazy" src="' + esc(it.image) + '" alt="' + esc(it.name) + '" style="position:absolute;inset:0;margin:auto;z-index:1;max-width:88%;max-height:88%;width:auto;height:auto;object-fit:contain">';
      // The static block flips by showing/hiding an overlaid back face —
      // no stylesheet or script tag needed, just inline handlers Duda keeps.
      const rxBack = (it.recipe && it.recipe.name)
        ? '<div data-back style="display:none;position:absolute;inset:0;z-index:5;background:' + bp + ';color:#fff;padding:14px;border-radius:10px;flex-direction:column;overflow-y:auto">'
          + '<button onclick="this.parentNode.style.display=\'none\'" aria-label="Back to the product" style="position:absolute;top:8px;right:10px;background:none;border:0;color:#fff;font-size:16px;cursor:pointer;opacity:.8">&#10005;</button>'
          + '<span style="color:' + bs + ';font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase">' + esc(it.name) + '</span>'
          + '<p style="font-size:17px;font-weight:800;line-height:1.2;margin:2px 18px 4px 0">' + esc(it.recipe.name) + '</p>'
          + (it.recipe.blurb ? '<p style="color:' + bs + ';font-size:11px;font-style:italic;margin:0 0 8px">' + esc(it.recipe.blurb) + '</p>' : '')
          + '<ul style="margin:0 0 8px 16px;padding:0;font-size:12px">' + (it.recipe.ingredients||[]).map(i=>'<li style="margin-bottom:3px">' + esc((i.amount?i.amount+' ':'')+i.item) + '</li>').join('') + '</ul>'
          + '<ol style="margin:0 0 8px 16px;padding:0;font-size:11px">' + (it.recipe.method||[]).map(s=>'<li style="margin-bottom:3px">' + esc(s) + '</li>').join('') + '</ol>'
          + (it.recipe.glass ? '<p style="color:' + bs + ';font-size:11px;font-style:italic;margin-top:auto">Serve in a ' + esc(it.recipe.glass) + (it.recipe.garnish ? ' · ' + esc(it.recipe.garnish) : '') + '</p>' : '')
          + '</div>'
        : '';
      const rxBtn = (it.recipe && it.recipe.name)
        ? '<button onclick="var b=this.parentNode.parentNode.querySelector(\'[data-back]\');if(b)b.style.display=\'flex\'" '
          + 'style="display:block;width:100%;text-align:left;border:0;border-top:1px dashed #e5e5e5;margin-top:2px;padding:7px 0 8px;font-size:12px;font-weight:600;color:#b42a2a;background:none;cursor:pointer;font-family:inherit">'
          + '&#127864; Cocktail idea: ' + esc(it.recipe.name) + '</button>'
        : '';
      h += '<div style="border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;background:#fff;position:relative">'
        + '<div style="aspect-ratio:1;background:#fafafa;position:relative">' + ribbon + photo + '</div>'
        + '<div style="padding:10px 12px 12px">'
        + '<div style="font-weight:600;font-size:14px;line-height:1.25;height:35px;overflow:hidden">' + esc(it.name) + '</div>'
        + '<div style="color:#757575;font-size:12px;height:15px;overflow:hidden">' + esc(it.size || '') + '</div>'
        + '<div style="padding-top:6px;height:34px;white-space:nowrap">'
        + (it.sale != null ? '<span style="color:#b42a2a;font-size:24px;font-weight:800">' + money(it.sale) + '</span> ' : '')
        + (it.reg != null && it.sale != null && it.reg > it.sale
            ? '<span style="color:#757575;font-size:13px">was <s>' + money(it.reg) + '</s></span>' : '')
        + '</div>'
        + rxBtn
        + '</div>'
        + rxBack
        + '</div>';
    });
    h += '</div><p style="text-align:center;color:#757575;font-size:11px;margin:16px 0 4px">' + esc(d.footnote) + '</p></div>';
    return h;
  };

  const publish = async function() {
    if (!eligible.length) { toast.error('No features with usable photos yet'); return; }
    setBusy(true);
    try {
      const sb = getSB();
      // Host any photos that only exist inside the database first, so the
      // snapshot carries real URLs for every card.
      for (const x of eligible) {
        if (!x.hosted) { x.image = await hostPhoto(x.prod); x.hosted = true; }
      }
      const blob = new Blob([JSON.stringify(snapshot(), null, 1)], { type:'application/json' });
      const { error } = await sb.storage.from('creatives')
        .upload('website/' + storeId + '.json', blob,
                { upsert:true, contentType:'application/json', cacheControl:'300' });
      if (error) throw new Error(error.message);
      setPublished(true);
      toast.success(eligible.length + ' features published — the website embed shows them within ~5 minutes');
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  const copy = async function(text, what) {
    try { await navigator.clipboard.writeText(text); toast.success(what + ' copied'); }
    catch(e) { toast.error('Could not copy — ' + e.message); }
  };

  return (
    <Portal>
    <div className="fixed inset-0 z-[210] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.88)', backdropFilter:'blur(4px)'}} onClick={busy ? undefined : onClose}>
      <div className="hud hud-brk w-full max-w-xl max-h-[88vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-center gap-3 mb-4">
          <span className="ttl">Push to website</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {!busy && <button onClick={onClose} style={{color:'var(--txt2)'}}><Icon name="close"/></button>}
        </div>

        <p className="lbl mb-3">{storeName} · {monthLabel(period)} · {dates}</p>

        <Label>On the website · {eligible.length} of {withImage.length}</Label>
        <div className="mb-3" style={{maxHeight:'240px', overflowY:'auto', border:'1px solid var(--line)'}}>
          {withImage.length === 0 && (
            <p className="lbl p-3">No features with usable photos yet — add product photos or generate creatives first.</p>
          )}
          {withImage.map(function(x) {
            const on = !!webOn[x.r.id];
            return (
              <label key={x.r.id} className="flex items-center gap-3 px-3 py-1.5 cursor-pointer"
                     style={{borderBottom:'1px solid rgba(212,175,55,.06)', opacity: on ? 1 : 0.5}}>
                <input type="checkbox" checked={on} onChange={()=>toggleWeb(x.r)}/>
                {x.placeholder ? (
                  <span className="w-9 h-9 flex-none flex items-center justify-center"
                        title="No photo — shows as a branded card"
                        style={{background:(brand && brand.primary_color) || '#1e3a5f',
                                color:(brand && brand.secondary_color) || '#c4a35a',
                                border:'1px solid var(--line)', fontSize:'8px', fontWeight:'700',
                                textAlign:'center', lineHeight:'1.1'}}>
                    NO<br/>PHOTO
                  </span>
                ) : (
                  <img src={x.image} alt="" className="w-9 h-9 object-contain flex-none"
                       style={{background:'#fff', border:'1px solid var(--line)'}}/>
