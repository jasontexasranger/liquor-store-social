    if (!topic.trim()) { toast.error('Enter a topic or promotion description'); return; }
    setLoading(true);
    try {
      let prompt;
      if (mode==='caption') {
        prompt = `Write a ${tone.toLowerCase()} Facebook post caption for "${storeName}", an independent retail liquor store in BC, Canada.\n\nPost topic/promotion: ${topic}${extra?`\n\nAdditional instructions: ${extra}`:''}\n\nRules:\n- Under 280 characters\n- Engaging and authentic\n- No hashtags, ever\n- Canadian English spelling (colour, flavour, favourite, litre, centre)\n- Output ONLY the caption text with no quotes, labels, or explanation`;
      } else {
        prompt = `Write Facebook ad copy for "${storeName}", an independent retail liquor store in BC, Canada.\n\nPromotion: ${topic}\nTone: ${tone}${extra?`\nNotes: ${extra}`:''}\n\nCanadian English spelling (colour, flavour, favourite, litre, centre). No hashtags.\n\nOutput EXACTLY two lines:\nHEADLINE: [max 25 characters]\nBODY: [max 90 characters]\n\nNo other text.`;
      }
      const result = stripHashtags(await callAI(prompt, apiKey, 400));
      onResult(result, mode);
      toast.success('AI copy generated!');
    } catch (e) {
      toast.error(`AI error: ${e.message}`);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="rounded-xl border border-violet-200 dark:border-violet-800 bg-violet-50 dark:bg-violet-950/40 p-4 space-y-3">
      <p className="text-xs font-bold text-violet-700 dark:text-violet-300 uppercase tracking-widest"><Icon name="spark"/> AI Copy Writer</p>
      <div>
        <Label>Topic / Promotion</Label>
        <Input value={topic} onChange={e=>setTopic(e.target.value)} placeholder={mode==='caption'?'e.g. Weekend sale — 20% off all BC craft beer':'e.g. Summer whiskey sale, $5 off any bottle'}/>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <Label>Tone</Label>
          <Select value={tone} onChange={e=>setTone(e.target.value)}>{TONES.map(t=><option key={t}>{t}</option>)}</Select>
        </div>
        <div>
          <Label>Extra instructions</Label>
          <Input value={extra} onChange={e=>setExtra(e.target.value)} placeholder="Optional"/>
        </div>
      </div>
      <Button onClick={generate} loading={loading} variant="outline" className="w-full">Generate with Claude Haiku</Button>
    </div>
  );
}

// ─────────────────────────────────────────────
// INLINE IMAGE GENERATOR (embedded in PostComposer)
// ─────────────────────────────────────────────
function InlineImageGenerator({ storeId, settings, onGenerated, seedFeature }) {
  const toast = useToast();
  const [mode,        setMode]       = useState('template'); // 'template' | 'lifestyle'
  const [template,    setTemplate]   = useState('classic');
  const [brief,       setBrief]      = useState('');
  const [size,        setSize]       = useState('1024x1024');
  const [prodFile,    setProdFile]   = useState(null);
  const [prodPrev,    setProdPrev]   = useState(null);
  const [saveText,    setSaveText]   = useState('');
  const [priceText,   setPriceText]  = useState('');
  const [productName, setProductName]= useState('');
  const [productSize, setProductSize]= useState('');
  const [lastAd, setLastAd] = useState(null);
  const [showFeatures, setShowFeatures] = useState(false);
  const [nameTouched, setNameTouched] = useState(false);
  const [sizeTouched, setSizeTouched] = useState(false);
  const [genStep,     setGenStep]    = useState('idle');
  const [brand,       setBrand]      = useState({ ...BRAND_DEFAULTS });
  const [logo,        setLogo]       = useState(null);
  const [showLib,     setShowLib]    = useState(false);
  const [lightbox,    setLightbox]   = useState(null);
  const [selectedTpl, setSelectedTpl]= useState(null); // uploaded template object
  const { images:libImages, remove:removeFromLib } = useBrandImageLibrary();
  const { templates: uploadedTpls }  = useBrandTemplates(storeId);

  // Seeded from a monthly feature: switch to price-ad mode, fill the copy, and
  // pick the store's price ad template so it's ready to render immediately.
  const seedRef = useRef(null);
  useEffect(function(){
    if (!seedFeature || seedFeature.stamp === seedRef.current) return;
    seedRef.current = seedFeature.stamp;
    const f = seedFeature.feature, prod = seedFeature.product;

    setMode('template');
    setProductName(f.name || '');
    setProductSize(f.size || '');
    setNameTouched(true); setSizeTouched(true);
    if (f.sale_price != null) setPriceText(Number(f.sale_price).toFixed(2));
    // No dollar sign: the template's save field prints its own prefix, and the
    // built-in renderer adds "SAVE $" itself.
    if (f.savings != null)    setSaveText(Number(f.savings).toFixed(2));

    if (prod) {
      const src = prodSrc(prod);
      setProdPrev(src);
      srcToBlob(src)
        .then(b=>setProdFile(new File([b], (prod.product_name||'product')+'.jpg', {type:'image/jpeg'})))
        .catch(()=>{});
    }
  }, [seedFeature]);

  // Auto-select a price ad template once templates have loaded.
  useEffect(function(){
    if (!seedFeature || selectedTpl) return;
    const priceAd = uploadedTpls.find(t => t.kind === 'price_ad');
    if (priceAd) setSelectedTpl(priceAd);
  }, [seedFeature, uploadedTpls]);
  const { save:saveToQuickLib } = useProductLibrary();
  const prodRef = useRef();

  useEffect(()=>{
    const sb=getSB(); if(!sb) return;
    sb.from('brand_profiles').select('*').eq('store_id',storeId).maybeSingle()
      .then(({data})=>{
        if(data){ const {logo_data,...p}=data; setBrand({...BRAND_DEFAULTS,...p}); setLogo(logo_data||null); }
        else { setBrand({...BRAND_DEFAULTS}); setLogo(null); }
      });
  },[storeId]);

  const handleProd = file => {
    if (!file) return;
    setProdFile(file);
    const r=new FileReader();
    r.onload=async()=>{ setProdPrev(r.result); try { await saveToLib(file.name, r.result); } catch{} };
    r.readAsDataURL(file);
  };

  const applyFeature = (f, prod) => {
    setProductName(f.name || '');
    setProductSize(f.size || '');
    if (f.sale_price != null) setPriceText(String(f.sale_price.toFixed ? f.sale_price.toFixed(2) : f.sale_price));
    // No dollar sign: the template's save field prints its own prefix, and the
    // built-in renderer adds "SAVE $" itself.
    if (f.savings != null)    setSaveText(Number(f.savings).toFixed(2));
    setNameTouched(true); setSizeTouched(true);
    if (prod) {
      const src = prodSrc(prod);
      setProdPrev(src);
      srcToBlob(src)
        .then(b=>setProdFile(new File([b], (prod.product_name||'product')+'.jpg', {type:'image/jpeg'})))
        .catch(()=>{});
    }
  };

  const selectFromLib = img => {
    setProdPrev(prodSrc(img) || img.data);
    // Only prefill fields the user hasn't typed into — picking a product for
    // its photo shouldn't silently rewrite copy they already wrote.
    if (!nameTouched) setProductName(img.product_name || '');
    if (!sizeTouched) setProductSize(img.size || '');
    srcToBlob(prodSrc(img)||img.data).then(blob=>setProdFile(new File([blob],img.product_name||'product',{type:'image/jpeg'}))).catch(()=>{});
    setShowLib(false);
  };

  // ── TEMPLATE MODE: pure Canvas, no AI ──
  const generateTemplate = async () => {
    if (!prodPrev) { toast.error('Upload a product photo first'); return; }
    const store = STORES.find(s=>s.id===storeId);
    try {
      // Field-driven template: the artwork already contains its own panels and
      // badges, so only the positioned boxes get filled.
      if (selectedTpl && selectedTpl.kind === 'price_ad') {
        const sb = getSB();
        const { data: rawFields } = await sb.from('ad_template_fields')
          .select('*').eq('template_id', selectedTpl.id).order('field_order');
        const tplFields = withFieldDefaults(rawFields);
        if (!tplFields || tplFields.length === 0) {
          toast.error('That template has no fields yet — set them up under Ad Templates');
          return;
        }
        const rendered = await renderFieldTemplate(
          selectedTpl, tplFields,
          { product_name: productName.trim(), pack_size: productSize.trim(),
            price: priceText.trim(), save: saveText.trim() },
          prodPrev,
          step => setGenStep(step)
        );
        const finalUrl = typeof rendered === 'string' ? rendered : rendered.url;
        const over = typeof rendered === 'string' ? [] : rendered.overflows;
        setLastAd(finalUrl);
        onGenerated(finalUrl);
        if (over.length) toast.error('Too small to fit: ' + over.join(', ') + ' — enlarge the box in the template');
        else toast.success('Ad created');
        setGenStep('idle');
        if (sb) sb.from('generation_history').insert({
          store_id:storeId, store_name:store?.name, image_url:finalUrl,
          brief:`Template: ${selectedTpl.name}`, size_label:selectedTpl.size_label });
        return;
      }

      setGenStep('removing');
      let cleanProd = prodPrev;
      try { cleanProd = await removeProductBackground(prodPrev); } catch(e) {}

      setGenStep('compositing');
      // Use uploaded template if selected, otherwise fall back to built-in
      const bgDataUrl  = selectedTpl ? selectedTpl.data  : null;
      const canvasW    = selectedTpl ? selectedTpl.canvas_w : 1080;
      const canvasH    = selectedTpl ? selectedTpl.canvas_h : 1080;
      const sizeLabel  = selectedTpl ? selectedTpl.size_label : '1:1 Square';

      const finalUrl = await renderRetailTemplate(
        template,
        { productDataUrl: cleanProd, logoDataUrl: logo, brandPrimary: brand.primary_color||'#1e3a5f', brandAccent: brand.secondary_color||'#c4a35a', bgDataUrl, canvasW, canvasH },
        { saveText: saveText.trim(), priceText: priceText.trim(), productName: productName.trim(), productSize: productSize.trim(), storeName: store?.name||'' }
      );
      setLastAd(finalUrl);
      onGenerated(finalUrl);
      toast.success('Ad created');
      setGenStep('idle');
      const sb=getSB();
      if(sb) sb.from('generation_history').insert({ store_id:storeId, store_name:store?.name, image_url:finalUrl, brief:`Template: ${selectedTpl?.name||template}`, size_label: sizeLabel });
    } catch(e) { toast.error(`Failed: ${e.message}`); setGenStep('idle'); }
  };

  // ── LIFESTYLE MODE: AI background + composite ──
  const generateLifestyle = async () => {
    const apiKey = null; // key is server-side; kept for signature compatibility
    const store    = STORES.find(s=>s.id===storeId);
    const storeName= store?.name || 'the store';
    const dalleSize= IMAGE_SIZES.find(s=>s.value===size)?.dalleSize || '1024x1024';
    setGenStep('building');
    try {
      const parts = [`Clean atmospheric background for a retail liquor store campaign in BC, Canada.`];
      if (brand.visual_style)   parts.push(`Visual style: ${brand.visual_style}.`);
      if (brand.mood)           parts.push(`Mood: ${brand.mood}.`);
      if (brand.style_keywords) parts.push(`Keywords: ${brand.style_keywords}.`);
      if (brand.avoid_visually) parts.push(`Avoid: ${brand.avoid_visually}.`);
      if (brief.trim())         parts.push(brief.trim());
      parts.push('NO text, NO bottles, NO products, NO logos, NO prices. Pure background only.');
      const prompt = parts.join(' ');

      setGenStep('generating');
      const img = await openAIGenerateImage(prompt, dalleSize, apiKey);

      let cleanProd = prodPrev;
      if (prodPrev) {
        setGenStep('removing');
        try { cleanProd = await removeProductBackground(prodPrev); } catch(e) {}
      }

      setGenStep('compositing');
      let finalUrl;
      if (prodPrev) {
        const priceOpts = { saveText: saveText.trim(), priceText: priceText.trim(), primaryColor: brand.primary_color, accentColor: brand.secondary_color };
        finalUrl = await compositeProductAndLogo(img.url, cleanProd, logo, priceOpts);
      } else {
        finalUrl = logo ? await compositeLogoOnImage(img.url, logo) : img.url;
      }

      onGenerated(finalUrl);
      toast.success('Image generated!');
      setGenStep('idle');
      const sb=getSB();
      if(sb) sb.from('generation_history').insert({ store_id:storeId, store_name:storeName, image_url:finalUrl, revised_prompt:img.revised, brief, size_label:size, prompt });
    } catch(e) { toast.error(e.message); setGenStep('idle'); }
  };

  const generate  = mode === 'template' ? generateTemplate : generateLifestyle;
  const isBusy    = genStep !== 'idle';
  const stepLabel = { building:'Building prompt…', generating:'Generating…', removing:'Removing background…', compositing:'Building ad…' };

  const clearProduct = () => { setProdFile(null); setProdPrev(null); setSaveText(''); setPriceText(''); setProductName(''); setProductSize(''); setLastAd(null); };

  const startOver = () => {
    clearProduct(); setNameTouched(false); setSizeTouched(false); setLastAd(null);
  };

  return (
    <>
    {lightbox && <Lightbox src={lightbox} onClose={()=>setLightbox(null)}/>}
    <div className="rounded-xl border border-indigo-200 dark:border-indigo-800 bg-indigo-50 dark:bg-indigo-950/30 p-4 space-y-3">
      <p className="text-xs font-bold text-indigo-700 dark:text-indigo-300 uppercase tracking-widest"><Icon name="palette"/> Image Creator</p>

      {/* Mode toggle */}
      <div className="flex rounded-lg overflow-hidden border border-indigo-300 dark:border-indigo-700">
        <button onClick={()=>setMode('template')} className={`flex-1 py-2 text-xs font-bold transition-colors ${mode==='template'?'bg-indigo-600 text-white':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700'}`}>
          <Icon name="note"/> Price Ad
        </button>
        <button onClick={()=>setMode('lifestyle')} className={`flex-1 py-2 text-xs font-bold transition-colors ${mode==='lifestyle'?'bg-indigo-600 text-white':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700'}`}>
          <Icon name="palette"/> Lifestyle (AI)
        </button>
      </div>

      {/* ── TEMPLATE MODE ── */}
      {mode==='template' && (<>
        {/* Template picker — uploaded first, built-in as fallback */}
        <div>
          <Label>{uploadedTpls.length>0 ? 'Your Templates' : 'Template Style'}</Label>
          {uploadedTpls.length>0 ? (
            <>
              <div className="grid grid-cols-2 gap-2 mb-2">
                {uploadedTpls.map(t=>(
                  <button key={t.id} onClick={()=>setSelectedTpl(t)}
                    className={`rounded-xl border-2 overflow-hidden text-left transition-all ${selectedTpl?.id===t.id?'border-indigo-500 ring-2 ring-indigo-200 dark:ring-indigo-900':'border-gray-200 dark:border-gray-700'}`}>
                    <img src={t.data} alt={t.name} className="w-full aspect-video object-cover"/>
                    <div className="px-2 py-1.5">
                      <p className="text-xs font-semibold text-gray-800 dark:text-gray-200 truncate">{t.name}</p>
                      <p className="text-xs text-gray-400">{t.size_label}</p>
                    </div>
                  </button>
                ))}
                {/* Option to use built-in */}
                <button onClick={()=>setSelectedTpl(null)}
                  className={`rounded-xl border-2 p-2 text-center transition-all ${!selectedTpl?'border-indigo-500 ring-2 ring-indigo-200 dark:ring-indigo-900':'border-gray-200 dark:border-gray-700'}`}>
                  <div className="w-full h-10 rounded mb-1 overflow-hidden flex flex-col">
                    <div className="flex-none h-3" style={{background:'#1e3a5f'}}/>
                    <div className="flex-1 bg-amber-50"/>
                  </div>
                  <span className="text-xs font-semibold text-gray-600 dark:text-gray-400">Built-in Style</span>
                </button>
              </div>
              {!selectedTpl && (
                <div className="grid grid-cols-3 gap-1.5">
                  {RETAIL_TEMPLATES.map(t=>(
                    <button key={t.id} onClick={()=>setTemplate(t.id)}
                      className={`rounded-lg border-2 p-1.5 text-center transition-all ${template===t.id?'border-indigo-400':'border-gray-200 dark:border-gray-700'}`}>
                      <div className="w-full h-6 rounded mb-1 overflow-hidden flex flex-col">
                        <div className="flex-none h-2" style={{background:t.previewBar}}/>
                        <div className="flex-1" style={{background:t.previewBg}}/>
                      </div>
                      <span className="text-xs text-gray-600 dark:text-gray-400">{t.name}</span>
                    </button>
                  ))}
                </div>
              )}
              <p className="text-xs text-gray-400 mt-1.5 italic">
                {selectedTpl ? `Using: ${selectedTpl.name} (${selectedTpl.canvas_w}×${selectedTpl.canvas_h})` : 'Upload templates in Brand → Ad Templates'}
              </p>
            </>
          ) : (
            <>
              <div className="grid grid-cols-3 gap-2">
                {RETAIL_TEMPLATES.map(t=>(
                  <button key={t.id} onClick={()=>setTemplate(t.id)}
                    className={`rounded-lg border-2 p-1.5 text-center transition-all ${template===t.id?'border-indigo-500':'border-gray-200 dark:border-gray-700'}`}>
                    <div className="w-full h-8 rounded mb-1 overflow-hidden flex flex-col">
                      <div className="flex-none h-2.5" style={{background:t.previewBar}}/>
                      <div className="flex-1" style={{background:t.previewBg}}/>
                    </div>
                    <span className="text-xs font-semibold text-gray-700 dark:text-gray-300">{t.name}</span>
                  </button>
                ))}
              </div>
              <p className="text-xs text-indigo-500 dark:text-indigo-400 mt-1.5"><Icon name="bulb"/> Upload your own brand templates under Brand → Ad Templates</p>
            </>
          )}
        </div>

        {/* Product upload */}
        <div>
          <div className="flex items-center justify-between mb-1">
            <Label className="mb-0">Product Photo <span className="text-red-500">*</span></Label>
            {libImages.length>0 && <button onClick={()=>setShowLib(v=>!v)} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">{showLib?'Hide ↑':<React.Fragment><Icon name="book"/> Library ({libImages.length})</React.Fragment>}</button>}
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <Button variant="secondary" size="sm" onClick={()=>prodRef.current?.click()}><Icon name="package"/> Upload Photo</Button>
            {prodPrev && <button onClick={clearProduct} className="text-xs text-red-500 hover:underline"><Icon name="close"/> Clear</button>}
          </div>
          <input ref={prodRef} type="file" accept="image/*" className="hidden" onChange={e=>handleProd(e.target.files[0])}/>
          {prodPrev && <img src={prodPrev} alt="" className="mt-2 h-20 rounded-lg object-contain border border-gray-200 dark:border-gray-600 bg-white p-1"/>}
          {showLib && (
            <div className="mt-2">
              {libImages.length>0 ? (
                <div className="grid grid-cols-4 gap-2">
                  {libImages.map(img=>{
                    const cat=LIQUOR_CATEGORIES.find(c=>c.id===img.category);
                    return (
                      <div key={img.id} className="cursor-pointer group" onClick={()=>selectFromLib(img)}>
                        <img src={img.data} alt={img.product_name}
                          className="w-full aspect-square object-contain rounded-lg border border-gray-200 dark:border-gray-600 bg-white hover:border-indigo-400 transition-all p-0.5"/>
                        <p className="text-xs text-gray-600 dark:text-gray-400 mt-0.5 truncate font-medium">{img.product_name}</p>
                        <p className="text-xs text-gray-400">{img.size}</p>
                      </div>
                    );
                  })}
                </div>
              ) : <p className="text-xs text-gray-400 italic">No products in library yet.</p>}
            </div>
          )}
        </div>

        {/* Product details */}
        <div className="flex items-center gap-2 mb-2">
          <Label className="mb-0 flex-1">Product details</Label>
          <button onClick={()=>setShowFeatures(true)} className="text-xs font-semibold hover:underline"
                  style={{color:'var(--cy)'}}>
            <Icon name="tag"/> Pull from features
          </button>
        </div>
        {showFeatures && (
          <FeaturePicker storeId={storeId} onPick={applyFeature}
                         onClose={()=>setShowFeatures(false)}/>
        )}
        <div className="grid grid-cols-2 gap-2">
          <div>
            <Label>Product Name</Label>
            <Input value={productName} onChange={e=>{setProductName(e.target.value);setNameTouched(true);}} placeholder="e.g. Corona Extra"/>
          </div>
          <div>
            <Label>Size / Format</Label>
            <Input value={productSize} onChange={e=>{setProductSize(e.target.value);setSizeTouched(true);}} placeholder="e.g. 12 × 330 ml"/>
          </div>
        </div>

        {/* Price fields */}
        <div className="grid grid-cols-2 gap-2">
          <div>
            <Label>Save Amount</Label>
            <Input value={saveText} onChange={e=>setSaveText(e.target.value)} placeholder="e.g. $5.50"/>
          </div>
          <div>
            <Label>Sale Price</Label>
            <Input value={priceText} onChange={e=>setPriceText(e.target.value)} placeholder="e.g. $27.99"/>
          </div>
        </div>

        <Button onClick={generate} loading={isBusy} className="w-full" variant="primary">
          {isBusy?(stepLabel[genStep]||'Working…'):
            lastAd ? <React.Fragment><Icon name="refresh"/> Rebuild with changes</React.Fragment>
                   : <React.Fragment><Icon name="note"/> Build Price Ad</React.Fragment>}
        </Button>

        {lastAd ? (
          <div className="mt-1 p-3" style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.45)'}}>
            <div className="flex items-center gap-3 mb-2.5">
              <span className="ttl">Latest ad</span>
              <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
              <button onClick={startOver} className="text-xs hover:underline" style={{color:'var(--txt2)'}}>
                Start over
              </button>
            </div>
            <img src={lastAd} alt="Generated ad" onClick={()=>setLightbox(lastAd)}
                 className="w-full max-w-[220px] mx-auto block cursor-zoom-in"
                 style={{border:'1px solid var(--line)'}}/>
            <p className="lbl text-center mt-2.5">
              Fields above stay filled — fix anything and hit rebuild
            </p>
            <div className="flex gap-2 mt-3">
              <a href={lastAd} download="price-ad.png" className="flex-1">
                <Button variant="secondary" size="sm" className="w-full"><Icon name="down"/> Download</Button>
              </a>
              <Button variant="secondary" size="sm" className="flex-1"
                      onClick={()=>{ onGenerated(lastAd); toast.success('Added to the post'); }}>
                <Icon name="note"/> Use in post
              </Button>
            </div>
          </div>
        ) : (
          <p className="text-xs text-center" style={{color:'var(--txt3)'}}>No AI image generation — fast, clean, brand-accurate</p>
        )}
      </>)}

      {/* ── LIFESTYLE MODE ── */}
      {mode==='lifestyle' && (<>
        <div>
          <Label>Scene Brief</Label>
          <Textarea value={brief} onChange={e=>setBrief(e.target.value)} rows={2} placeholder="e.g. warm wooden bar, soft amber lighting, craft whisky vibe — atmosphere only, no products"/>
        </div>
        <div>
          <div className="flex items-center justify-between mb-1">
            <Label className="mb-0">Product (optional — will be composited)</Label>
            {libImages.length>0 && <button onClick={()=>setShowLib(v=>!v)} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">{showLib?'Hide ↑':<React.Fragment><Icon name="book"/> Library ({libImages.length})</React.Fragment>}</button>}
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <Button variant="secondary" size="sm" onClick={()=>prodRef.current?.click()}><Icon name="package"/> Upload</Button>
            {prodPrev && <button onClick={clearProduct} className="text-xs hover:underline" style={{color:"var(--red)"}}><Icon name="close" size={13}/></button>}
          </div>
          <input ref={prodRef} type="file" accept="image/*" className="hidden" onChange={e=>handleProd(e.target.files[0])}/>
          {prodPrev && <img src={prodPrev} alt="" className="mt-2 h-14 rounded-lg object-contain border border-gray-200 dark:border-gray-600 bg-white p-0.5"/>}
          {showLib && libImages.length>0 && (
            <div className="mt-2 grid grid-cols-4 gap-2">
              {libImages.map(img=>(
                <div key={img.id} className="cursor-pointer" onClick={()=>selectFromLib(img)}>
                  <img src={img.data} alt={img.product_name} className="w-full aspect-square object-contain rounded-lg border border-gray-200 dark:border-gray-600 bg-white hover:border-indigo-400 transition-all p-0.5"/>
                  <p className="text-xs text-gray-500 truncate mt-0.5">{img.product_name}</p>
                </div>
              ))}
            </div>
          )}
        </div>
        <div>
          <Label>Size</Label>
          <div className="grid grid-cols-2 gap-1.5">
            {IMAGE_SIZES.map(s=>(
              <label key={s.value} className={`flex items-center gap-2 p-2 rounded-lg border cursor-pointer text-xs transition-all ${size===s.value?'border-indigo-500 bg-white dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400'}`}>
                <input type="radio" name="inlineSize" value={s.value} checked={size===s.value} onChange={()=>setSize(s.value)} className="flex-shrink-0"/>
                <span><strong>{s.label}</strong> — {s.desc}</span>
              </label>
            ))}
          </div>
        </div>
        <Button onClick={generate} loading={isBusy} className="w-full" variant="primary">
          {isBusy?(stepLabel[genStep]||'Working…'):<React.Fragment><Icon name="palette"/> Generate & Add to Post</React.Fragment>}
        </Button>
      </>)}
    </div>
    </>
  );
}

// ─────────────────────────────────────────────
// MODULE 1 — POST COMPOSER
// ─────────────────────────────────────────────
function PostComposer({ settings, pendingImage, pendingCaption, onClearPending, visibleStores }) {
  const toast = useToast();
  var myStores = (visibleStores && visibleStores.length > 0) ? visibleStores : STORES;
  const [selected,    setSelected]   = useState([myStores[0].id]);
  const [caption,     setCaption]    = useState('');
  const [imgFile,     setImgFile]    = useState(null);
  const [imgPrev,     setImgPrev]    = useState(null);
  const [genImgUrl,   setGenImgUrl]  = useState(null);
  const [schedule,    setSchedule]   = useState('');
  const [loading,     setLoading]    = useState(false);
  const [showAI,      setShowAI]     = useState(false);
  const [showImgGen,  setShowImgGen] = useState(false);
  const [lightbox,    setLightbox]   = useState(null);
  const [results,     setResults]    = useState([]);
  const [images, setImages] = useState([]);   // [{ url, file }] in post order
  const multiRef = useRef();
  const [showCreatives, setShowCreatives] = useState(false);
  const [showFeaturePick, setShowFeaturePick] = useState(false);
  const [featureSeed, setFeatureSeed] = useState('');
  const [imageSeed, setImageSeed] = useState(null);
  const [postToFB,    setPostToFB]   = useState(true);
  const [postToIG,    setPostToIG]   = useState(false);
  const [uploading,   setUploading]  = useState(false);

  useEffect(()=>{
    if (pendingImage) {
      setImages(prev => prev.some(x=>x.url===pendingImage) ? prev : prev.concat([{ url:pendingImage, file:null }]));
      setImgFile(null); setImgPrev(pendingImage); setGenImgUrl(pendingImage); setShowImgGen(false);
      // A caption arriving with the image (recipe hand-offs) seeds the box,
      // but never overwrites something already being typed.
      if (pendingCaption) setCaption(prev => prev && prev.trim() ? prev : pendingCaption);
    }
  },[pendingImage]);

  const toggleStore = id => setSelected(p => p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const MAX_POST_IMAGES = 10;

  const addImages = files => {
    const list = Array.from(files || []).filter(Boolean);
    if (!list.length) return;
    const room = MAX_POST_IMAGES - images.length;
    if (room <= 0) { toast.error('Up to ' + MAX_POST_IMAGES + ' images per post'); return; }
    list.slice(0, room).forEach(function(file) {
      const r = new FileReader();
      r.onload = () => setImages(prev => prev.concat([{ url: r.result, file }]));
      r.readAsDataURL(file);
    });
    if (list.length > room) toast.error('Only added ' + room + ' — limit is ' + MAX_POST_IMAGES);
    if (onClearPending) onClearPending();
  };

  const addUrl = url => {
    if (!url) return;
    if (images.length >= MAX_POST_IMAGES) { toast.error('Up to ' + MAX_POST_IMAGES + ' images per post'); return; }
    setImages(prev => prev.concat([{ url, file: null }]));
  };

  const removeImage = i => setImages(prev => prev.filter((_, k) => k !== i));

  const moveImage = (i, dir) => setImages(function(prev) {
    const j = i + dir;
    if (j < 0 || j >= prev.length) return prev;
    const next = prev.slice();
    const t = next[i]; next[i] = next[j]; next[j] = t;
    return next;
  });

  const handleFile = file => {
    if (!file) return;
    addImages([file]);
  };

  const clearImage = () => {
    setImages([]); setImgFile(null); setImgPrev(null); setGenImgUrl(null);
    if (onClearPending) onClearPending();
  };

  // One click sets up the whole post: caption topic, price ad builder, product
  // photo and template — everything the feature row already knows.
  const applyFeatureToPost = (f, prod) => {
    setFeatureSeed(featureBrief(f));
    setShowAI(true);
    setImageSeed({ feature:f, product:prod, stamp:Date.now() });
    setShowImgGen(true);
    toast.success(prod
      ? 'Feature loaded — copy writer and price ad ready'
      : 'Feature loaded — link a product photo for the ad image');
  };

  const handleGenerated = (url) => {
    addUrl(url);
    setGenImgUrl(url); setImgPrev(url); setImgFile(null);
    // Deliberately left open: closing unmounts the builder and throws away
    // every field, so fixing a typo meant retyping the whole ad.
    if (onClearPending) onClearPending();
  };

  const post = async () => {
    if (!caption.trim())     { toast.error('Write a caption first'); return; }
    if (selected.length===0) { toast.error('Select at least one store'); return; }
    if (!postToFB && !postToIG) { toast.error('Choose Facebook, Instagram, or both'); return; }
    if (postToIG && images.length === 0) {
      toast.error('Instagram requires at least one image'); return;
    }
    if (schedule) {
      const ts = new Date(schedule).getTime();
      if (ts < Date.now()+10*60*1000) { toast.error('Scheduled time must be at least 10 minutes in the future'); return; }
    }

    setLoading(true); setResults([]);

    // Upload image to Storage first if we have one (gives a stable public URL for Meta)
    var imageUrls = [];
    if (images.length) {
      try {
        setUploading(true);
        for (const item of images) {
          // Library and generated images are already hosted; the helper passes
          // http(s) URLs straight through.
          imageUrls.push(await uploadImageToStorage(item.file || item.url));
        }
      } catch(uploadErr) {
        toast.error('Image upload failed: ' + uploadErr.message);
        setLoading(false); setUploading(false); return;
      } finally { setUploading(false); }
    }
    var imageUrl = imageUrls[0] || null;

    const publishTo = [];
    if (postToFB) publishTo.push('facebook');
    if (postToIG && imageUrls.length) publishTo.push('instagram');
    if (publishTo.length === 0) {
      toast.error('Instagram needs an image — nothing to publish');
      setLoading(false); return;
    }

    try {
      if (schedule) {
        // Schedule via edge function + DB
        var sched = await callEdge('meta-social', 'schedule', {
          storeIds: selected,
          caption: caption,
          imageUrl: imageUrl,
          imageUrls: imageUrls,
          publishTo: publishTo,
          scheduledAt: new Date(schedule).toISOString(),
        });
        setResults(selected.map(id => ({ store: (STORES.find(s=>s.id===id)||{}).name||id, success:true, scheduled:true })));
        toast.success('Post scheduled!');
      } else {
        // Publish now via edge function
        var result = await callEdge('meta-social', 'publish', {
          storeIds: selected,
          caption: caption,
          imageUrl: imageUrl,
          imageUrls: imageUrls,
          publishTo: publishTo,
        });
        var res = (result.results || []).map(function(r) {
          var storeName = (STORES.find(s=>s.id===r.storeId)||{}).name || r.storeId;
          return { store: storeName, success: r.success, postId: r.fbPostId, igPostId: r.igPostId, error: r.error, igError: r.igError };
        });
        setResults(res);
        res.forEach(function(r) {
          if (r.success) {
            var where = (r.postId && r.igPostId) ? 'Facebook + Instagram'
                      : r.postId ? 'Facebook'
                      : 'Instagram';
            toast.success(r.store + ': Published to ' + where);
          } else if (r.error) {
            toast.error(r.store + ': ' + r.error);
          }
          // Channel-level warnings never contradict the success toast above.
          if (r.success && r.error) toast.error(r.store + ' Facebook: ' + r.error);
          if (r.igError) toast.error(r.store + ' Instagram: ' + r.igError);
        });
      }
      setCaption(''); setImages([]); setImgFile(null); setImgPrev(null); setGenImgUrl(null); setSchedule('');
      if (onClearPending) onClearPending();
    } catch(e) {
      toast.error('Failed: ' + e.message);
    }
    setLoading(false);
  };

  const activeStoreId = selected.length===1 ? selected[0] : myStores[0].id;
  const activeStore   = (STORES.find(s=>s.id===activeStoreId)||{}).name || 'our store';

  return (
    <>
    {lightbox && <Lightbox src={lightbox} onClose={()=>setLightbox(null)}/>}
    <Card>
      <h2 className="text-base font-bold text-gray-900 dark:text-white mb-4"><Icon name="note"/> Compose Post</h2>
      <div className="mb-4">
        <Label>Stores</Label>
        <StoreMultiPicker stores={myStores} selected={selected} onToggle={toggleStore}/>
      </div>
      <div className="mb-4">
        <Label>Publish to</Label>
        <div className="grid grid-cols-2 gap-2">
          <label className={`flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer text-sm transition-all
            ${postToFB?'border-blue-500 bg-blue-50 dark:bg-blue-950/50 text-blue-800 dark:text-blue-200 shadow-sm':'border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:border-blue-300'}`}>
            <input type="checkbox" className="rounded accent-blue-600" checked={postToFB} onChange={e=>setPostToFB(e.target.checked)}/>
            <span className="leading-tight"><Icon name="fb"/> Facebook</span>
          </label>
          <label className={`flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer text-sm transition-all
            ${postToIG?'border-pink-500 bg-pink-50 dark:bg-pink-950/50 text-pink-800 dark:text-pink-200 shadow-sm':'border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:border-pink-300'}`}>
            <input type="checkbox" className="rounded accent-pink-500" checked={postToIG} onChange={e=>setPostToIG(e.target.checked)}/>
            <span className="leading-tight"><Icon name="ig"/> Instagram <span className="text-gray-400 text-xs">(needs image)</span></span>
          </label>
        </div>
        {!postToFB && !postToIG && (
          <p className="text-xs text-red-500 mt-1.5">Choose at least one destination.</p>
        )}
        {postToIG && !imgFile && !genImgUrl && !pendingImage && (
          <p className="text-xs text-amber-600 dark:text-amber-400 mt-1.5">Instagram needs an image — add one below.</p>
        )}
      </div>
      <div className="mb-4">
        <button onClick={()=>setShowFeaturePick(true)} disabled={selected.length===0}
          className="clip w-full flex items-center justify-center gap-2.5 py-3 font-semibold uppercase tracking-[.2em] transition-all disabled:opacity-40"
          style={{ fontSize:'11.5px', border:'1px solid var(--cy)', color:'var(--cy)', background:'var(--cy-glow)' }}
          onMouseEnter={e=>{ if(!e.currentTarget.disabled) e.currentTarget.style.boxShadow='0 0 22px rgba(212,175,55,.3)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.boxShadow='none'; }}>
          <Icon name="tag" size={15}/> Use feature
        </button>
        <p className="lbl mt-1.5 text-center">
          {selected.length === 0
            ? 'Select a store first'
            : 'Fills the caption writer and builds the price ad in one step'}
        </p>
      </div>

      <div className="mb-3">
        <div className="flex items-center justify-between mb-1">
          <Label className="mb-0">Caption</Label>
          <button onClick={()=>setShowAI(v=>!v)} className="text-xs font-semibold hover:underline"
                  style={{color:'var(--vio)'}}>
            {showAI?'Hide AI Writer ↑':<React.Fragment><Icon name="spark"/> AI Writer</React.Fragment>}
          </button>
        </div>
        {showFeaturePick && (
          <FeaturePicker storeId={selected[0] || (myStores[0]||{}).id}
                         onPick={applyFeatureToPost}
                         onClose={()=>setShowFeaturePick(false)}/>
        )}
        <Textarea value={caption} onChange={e=>setCaption(e.target.value)} rows={4} placeholder="What's happening at the store?"/>
        <p className="text-xs text-gray-400 mt-1 text-right">{caption.length} chars</p>
        <p className="text-xs text-gray-400 dark:text-gray-500 mt-1 italic">↳ <span className="text-gray-500 dark:text-gray-400">Auto-appended:</span> Prices exclude tax &amp; deposit - while supplies last</p>
      </div>
      {showAI && <div className="mb-4"><AIWriter storeName={activeStore} mode="caption" seedTopic={featureSeed} onResult={t=>setCaption(t)}/></div>}

      {/* Image section */}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-2">
          <Label className="mb-0">Image</Label>
          <div className="flex gap-3 items-center">
            <button onClick={()=>setShowCreatives(true)} className="text-xs font-semibold hover:underline" style={{color:'var(--cy)'}}><Icon name="image"/> Creative library</button>
            <button onClick={()=>setShowImgGen(v=>!v)} className="text-xs font-semibold hover:underline" style={{color:'var(--vio)'}}>{showImgGen?'Hide Generator ↑':<React.Fragment><Icon name="palette"/> Generate with AI</React.Fragment>}</button>
          </div>
        </div>

        {images.length > 0 && (
          <div className="mb-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="lbl">{images.length} image{images.length===1?'':'s'}</span>
              {images.length > 1 && <span className="lbl" style={{color:'var(--txt3)'}}>· first is the cover</span>}
              <span className="flex-1"/>
              <button onClick={clearImage} className="text-xs hover:underline" style={{color:'var(--red)'}}>
                Remove all
              </button>
            </div>
            <div className="grid grid-cols-4 sm:grid-cols-5 gap-2">
              {images.map(function(img, i) {
                return (
                  <div key={i} className="relative group" style={{border:'1px solid var(--line)'}}>
                    <img src={img.url} alt="" onClick={()=>setLightbox(img.url)}
                         className="w-full object-cover cursor-zoom-in"
                         style={{aspectRatio:'1'}}/>
                    <span className="mono absolute top-1 left-1 px-1"
                          style={{fontSize:'9px', background:'rgba(var(--sink2-rgb),.8)', color:'var(--cy)'}}>{i+1}</span>
                    <button onClick={()=>removeImage(i)} aria-label="Remove image"
                      className="absolute top-1 right-1 w-5 h-5 items-center justify-center hidden group-hover:flex"
                      style={{background:'rgba(var(--sink2-rgb),.85)', color:'var(--red)', border:'1px solid var(--red)'}}>
                      <Icon name="close" size={11}/>
                    </button>
                    <div className="absolute bottom-1 left-1 right-1 gap-1 hidden group-hover:flex">
                      <button onClick={()=>moveImage(i,-1)} disabled={i===0} aria-label="Move earlier"
                        className="flex-1 flex items-center justify-center py-0.5 disabled:opacity-30"
                        style={{background:'rgba(var(--sink2-rgb),.85)', color:'var(--cy)', border:'1px solid var(--line2)'}}>
                        <Icon name="back" size={11}/>
                      </button>
                      <button onClick={()=>moveImage(i,1)} disabled={i===images.length-1} aria-label="Move later"
                        className="flex-1 flex items-center justify-center py-0.5 disabled:opacity-30"
                        style={{background:'rgba(var(--sink2-rgb),.85)', color:'var(--cy)', border:'1px solid var(--line2)'}}>
                        <Icon name="fwd" size={11}/>
                      </button>
                    </div>
                  </div>
                );
              })}
              {images.length < 10 && (
                <button onClick={()=>multiRef.current?.click()}
                  className="flex flex-col items-center justify-center gap-1"
                  style={{border:'1px dashed var(--line2)', aspectRatio:'1', color:'var(--cy-dim)'}}>
                  <Icon name="up" size={18}/>
                  <span className="lbl" style={{fontSize:'8px'}}>Add</span>
                </button>
              )}
            </div>
            {postToIG && images.length > 10 && (
              <p className="lbl mt-2" style={{color:'var(--amb)'}}>Instagram carousels cap at 10</p>
            )}
          </div>
        )}

        <input ref={multiRef} type="file" accept="image/*" multiple className="hidden"
               onChange={function(e){ addImages(e.target.files); e.target.value=''; }}/>

        {images.length === 0 && (
          <ImagePicker file={imgFile} preview={imgPrev} onFile={handleFile} onClear={clearImage} label="Upload Image"/>
        )}

        {showCreatives && (
          <CreativePicker allowed={POST_ASPECTS} storeIds={selected}
            onPick={c=>{ addUrl(c.public_url); }}
            onClose={()=>setShowCreatives(false)}/>
        )}

        {/* Inline generator */}
        {showImgGen && (
          <div className="mt-3">
            <InlineImageGenerator storeId={activeStoreId} settings={settings} seedFeature={imageSeed} onGenerated={handleGenerated}/>
          </div>
        )}
      </div>

      <div className="mb-5">
        <Label>Schedule (leave blank to post immediately)</Label>
        <Input type="datetime-local" value={schedule} onChange={e=>setSchedule(e.target.value)}/>
      </div>
      {uploading && <p className="text-xs text-indigo-500 dark:text-indigo-400 mb-2 text-center"><Icon name="up"/> Uploading image…</p>}
      <Button onClick={post} loading={loading} className="w-full" size="lg">
        {schedule?<React.Fragment><Icon name="cal"/> Schedule Post</React.Fragment>:<React.Fragment><Icon name="rocket"/> Publish Now</React.Fragment>}
      </Button>
      {results.length>0 && (
        <div className="mt-4 space-y-2">
          <Divider label="Results"/>
          {results.map((r,i) => (
            <div key={i} className={`flex flex-col gap-1 text-sm p-3 rounded-xl ${r.success?'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-300':'bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-400'}`}>
              <div className="flex items-center justify-between">
                <span>
                  <Icon name={r.success?"check":"cross"} style={{color:r.success?"var(--grn)":"var(--red)"}}/> {r.store} — {
                    !r.success ? (r.error || 'Not published')
                    : r.scheduled ? 'Scheduled'
                    : (r.postId && r.igPostId) ? 'Published to Facebook + Instagram'
                    : r.postId ? 'Published to Facebook'
                    : r.igPostId ? 'Published to Instagram'
                    : 'Published'
                  }
                </span>
                {r.postId && <a href={fbPostUrl(r.postId)} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline ml-3 whitespace-nowrap">FB →</a>}
                {r.igPostId && <a href={'https://www.instagram.com/p/'+r.igPostId} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-pink-600 dark:text-pink-400 hover:underline ml-1 whitespace-nowrap">IG →</a>}
              </div>
              {r.success && r.error && <p className="text-xs text-amber-600 dark:text-amber-400"><Icon name="warn" className="text-amber-400"/> Facebook: {r.error}</p>}
              {r.igError && <p className="text-xs text-amber-600 dark:text-amber-400"><Icon name="warn" className="text-amber-400"/> Instagram: {r.igError}</p>}
            </div>
          ))}
        </div>
      )}
    </Card>
    </>
  );
}

// ─────────────────────────────────────────────
// MODULE 1 — POST HISTORY
// ─────────────────────────────────────────────
function PostHistory({ settings, visibleStores }) {
  const toast   = useToast();
  var myStores = (visibleStores && visibleStores.length > 0) ? visibleStores : STORES;
  const [storeId, setStoreId] = useState(myStores[0].id);
  const [posts,   setPosts]   = useState([]);
  const [loading, setLoading] = useState(false);
  const [loaded,  setLoaded]  = useState(false);

  useEffect(function(){setLoaded(false);setPosts([]);},[storeId]);

  const load = async () => {
    setLoading(true);
    try {
      var result = await callEdge('meta-social', 'listPosts', { storeId: storeId });
      setPosts(result.posts || []);
      setLoaded(true);
    } catch(e) { toast.error('Failed to load posts: ' + e.message); }
    finally    { setLoading(false); }
  };

  return (
    <Card>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <h2 className="text-base font-bold text-gray-900 dark:text-white flex-1"><Icon name="note"/> Post History</h2>
        <StorePicker value={storeId} onChange={setStoreId} stores={myStores} compact/>
        <Button variant="secondary" size="sm" onClick={load} loading={loading}>{loaded?'Refresh':'Load Posts'}</Button>
      </div>
      {!loaded&&!loading && <div className="text-center py-10 text-gray-400 dark:text-gray-500 text-sm">Select a store and click Load Posts</div>}
      {loaded&&posts.length===0 && <div className="text-center py-10 text-gray-400 dark:text-gray-500 text-sm">No posts found.</div>}
      <div className="space-y-3 max-h-[480px] overflow-y-auto pr-1">
        {posts.map(function(p) {
          var text = p.message||p.story||'(no text)';
          var likesCount = p.likes && p.likes.summary ? (p.likes.summary.total_count || 0) : 0;
          var commentsCount = p.comments && p.comments.summary ? (p.comments.summary.total_count || 0) : 0;
          var sharesCount = p.shares ? (p.shares.count || 0) : 0;
          return (
            <div key={p.id} className="flex gap-3 p-3 rounded-xl border border-gray-100 dark:border-gray-700 hover:border-indigo-200 dark:hover:border-indigo-700 transition-colors">
              {p.full_picture && <img src={p.full_picture} alt="" className="w-16 h-16 rounded-lg object-cover flex-shrink-0 border border-gray-200 dark:border-gray-600"/>}
              <div className="flex-1 min-w-0">
                <p className="text-sm text-gray-800 dark:text-gray-200 line-clamp-3 leading-snug">{text}</p>
                <p className="text-xs text-gray-400 mt-1">{fmtDate(p.created_time)}</p>
                <div className="flex items-center gap-3 mt-1.5 flex-wrap">
                  <span className="text-xs text-gray-500 dark:text-gray-400"><Icon name="thumb"/> {likesCount}</span>
                  <span className="text-xs text-gray-500 dark:text-gray-400"><Icon name="comment"/> {commentsCount}</span>
                  {sharesCount>0 && <span className="text-xs text-gray-500 dark:text-gray-400"><Icon name="share"/> {sharesCount}</span>}
                  <a href={p.permalink_url||fbPostUrl(p.id)} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline ml-auto">Open →</a>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────
// MODULE 2 — CAMPAIGN BUILDER
// ─────────────────────────────────────────────
function CampaignBuilder({ settings }) {
  const toast = useToast();
  const [storeId,     setStoreId]     = useState(STORES[0].id);
  const [objective,   setObjective]   = useState('OUTCOME_AWARENESS');
  const [campName,    setCampName]    = useState('');
  const [dailyBudget, setDailyBudget] = useState('20');
  const [lat,         setLat]         = useState(String(STORES[0].lat));
  const [lng,         setLng]         = useState(String(STORES[0].lng));
  const [radius,      setRadius]      = useState('8');
  const [ageMin,      setAgeMin]      = useState('19');
  const [budgetType,  setBudgetType]  = useState('daily');   // 'daily' | 'lifetime'
  const [startAt,     setStartAt]     = useState('');
  const [endAt,       setEndAt]       = useState('');
  const [gender,      setGender]      = useState('all');     // 'all' | 'men' | 'women'
  const [ageMax,      setAgeMax]      = useState('65');
  const [placements,  setPlacements]  = useState(['facebook_feed']);
  const [headline,    setHeadline]    = useState('');
  const [bodyText,    setBodyText]    = useState('');
  const [ctaType,     setCtaType]     = useState('LEARN_MORE');
  const [destUrl,     setDestUrl]     = useState('');
  // Carousel. Cards are held separately from the single ad image so switching
  // format back and forth doesn't lose either one.
  const [format,      setFormat]      = useState('single');   // 'single' | 'carousel'
  const [cards,       setCards]       = useState([]);
  const [cardPick,    setCardPick]    = useState(false);
  const [optimizeOrder, setOptimizeOrder] = useState(false);
  const [endCard,     setEndCard]     = useState(true);
  const [writing,     setWriting]     = useState(false);
  const [built,       setBuilt]       = useState(null);   // what the last build produced
  const [showAdCreatives, setShowAdCreatives] = useState(false);
  const [adCreativeUrl, setAdCreativeUrl] = useState(null);
  const [adImg,       setAdImg]       = useState(null);
  const [adImgPrev,   setAdImgPrev]   = useState(null);
  const [showAI,      setShowAI]      = useState(false);
  const [steps,       setSteps]       = useState([]);
  const [running,     setRunning]     = useState(false);

  const store = STORES.find(s=>s.id===storeId);

  // The saved location wins; the hardcoded constant is only a fallback for a
  // store nobody has set up yet, and it is flagged as such in the UI.
  const { forStore: locFor, loading: locLoading } = useStoreLocations();

  // The brand's website prefills the destination URL. Only ever fills a blank
  // box — once you've typed a campaign-specific link, switching store won't
  // wipe it out from under you.
  useEffect(function() {
    const sb = getSB(); if (!sb || !storeId) return;
    let alive = true;
    sb.from('brand_profiles').select('website').eq('store_id', storeId).maybeSingle()
      .then(function(res) {
        const site = res.data && res.data.website;
        if (alive && site) setDestUrl(prev => prev.trim() ? prev : site);
      });
    return function(){ alive = false; };
  }, [storeId]);
  const savedLoc = locFor(storeId);
  const locIsSaved = !!(savedLoc && savedLoc.lat != null && savedLoc.lng != null);

  useEffect(function(){
    if (locLoading) return;
    if (locIsSaved) {
      setLat(String(savedLoc.lat));
      setLng(String(savedLoc.lng));
      if (savedLoc.ad_radius_km) setRadius(String(savedLoc.ad_radius_km));
      return;
    }
    const s = STORES.find(x=>x.id===storeId);
    if (s) { setLat(String(s.lat)); setLng(String(s.lng)); }
  }, [storeId, locLoading, locIsSaved, savedLoc && savedLoc.lat, savedLoc && savedLoc.lng]);

  const togglePlacement = p => setPlacements(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);

  const handleAI = (text) => {
    const lines = text.split('\n');
    for (const ln of lines) {
      if (ln.startsWith('HEADLINE:')) setHeadline(ln.replace('HEADLINE:','').trim().slice(0,25));
      if (ln.startsWith('BODY:'))     setBodyText(ln.replace('BODY:','').trim().slice(0,125));
    }
  };

  const addStep    = (label,status='pending',detail='') => setSteps(p=>[...p,{label,status,detail}]);
  const finishStep = (status,detail='') => setSteps(p=>{ const a=[...p]; a[a.length-1]={...a[a.length-1],status,detail}; return a; });

  // Only touches cards you haven't written yourself, so pressing it twice is
  // safe and it never overwrites an edit.
  const fillCards = async function() {
    const todo = cards.map((c, i) => ({ c, i })).filter(x => !x.c.headline.trim());
    if (!todo.length) { toast.success('Every card already has a headline'); return; }
    setWriting(true);
    let done = 0, failed = 0;
    for (const { c, i } of todo) {
      try {
        const copy = await cardCopyFromImage(c.url);
        if (!copy.headline) { failed++; continue; }
        setCards(prev => prev.map((x, ix) => ix === i
          ? Object.assign({}, x, { headline: copy.headline,
                                   description: x.description.trim() || copy.description })
          : x));
        done++;
      } catch(e) { failed++; }
    }
    setWriting(false);
    if (done)   toast.success(done + ' card' + (done===1?'':'s') + ' written');
    if (failed) toast.error(failed + ' card' + (failed===1?'':'s') + " couldn't be read — type those in");
  };

  const launch = async () => {
    if (!campName.trim())  { toast.error('Enter a campaign name'); return; }
    if (!bodyText.trim())  { toast.error('Enter the primary text'); return; }
    if (format === 'single' && !headline.trim()) { toast.error('Enter a headline'); return; }
    if (placements.length===0) { toast.error('Select at least one placement'); return; }
    if (budgetType === 'lifetime' && !endAt) { toast.error('A lifetime budget needs an end date'); return; }
    if (startAt && endAt && new Date(endAt) <= new Date(startAt)) {
      toast.error('The end date has to be after the start date'); return;
    }
    if (format === 'carousel') {
      if (cards.length < 2)  { toast.error('A carousel needs at least 2 cards'); return; }
      if (cards.length > 10) { toast.error('Meta allows at most 10 carousel cards'); return; }
    }

    setRunning(true); setBuilt(null);
    setSteps([{ label: 'Sending to server…', status: 'running', detail: '' }]);

    try {
      // Upload ad image to Storage first if provided
      var imageUrl = null;
      if (adCreativeUrl) {
        imageUrl = adCreativeUrl;
      } else if (adImg) {
        setSteps([{ label: 'Uploading image…', status: 'running', detail: '' }]);
        imageUrl = await uploadImageToStorage(adImg);
      }

      var result = await callEdge('meta-ads', 'createCampaign', {
        storeId: storeId,
        campName: store.name + ' — ' + campName,
        objective: objective,
        dailyBudget: parseFloat(dailyBudget) || 20,
        lat: parseFloat(lat) || store.lat,
        lng: parseFloat(lng) || store.lng,
        radius: parseInt(radius) || 8,
        ageMin: parseInt(ageMin) || 19,
        ageMax: parseInt(ageMax) || 65,
        budgetType: budgetType,
        startTime: startAt ? new Date(startAt).toISOString() : null,
        endTime:   endAt   ? new Date(endAt).toISOString()   : null,
        genders: gender === 'men' ? [1] : gender === 'women' ? [2] : [],
        placements: placements,
        headline: headline,
        bodyText: bodyText,
        ctaType: ctaType,
        destUrl: destUrl,
        imageUrl: format === 'carousel' ? null : imageUrl,
        cards: format === 'carousel'
          ? cards.map(c => ({ imageUrl:c.url, headline:c.headline, description:c.description, link:c.link }))
          : null,
        optimizeOrder: optimizeOrder,
        endCard: endCard,
      });
      setSteps(result.steps || []);
      setBuilt(result);
      toast.success('Campaign created — paused until you switch it on');
    } catch(e) {
      setSteps(function(p) { var a=[...p]; if(a.length) a[a.length-1]={...a[a.length-1],status:'error',detail:e.message}; return a; });
      toast.error('Failed: ' + e.message);
    }
    finally    { setRunning(false); }
  };

  return (
    <div className="space-y-4">
      <Card>
        <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-4 uppercase tracking-wide">Campaign</h3>
        <div className="grid grid-cols-2 gap-4">
          <div><Label>Store</Label><StorePicker value={storeId} onChange={setStoreId}/></div>
          <div><Label>Objective</Label><Select value={objective} onChange={e=>setObjective(e.target.value)}>{AD_OBJECTIVES.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</Select></div>
          <div><Label>Campaign Name</Label><Input value={campName} onChange={e=>setCampName(e.target.value)} placeholder="Summer Whiskey Sale"/></div>
          <div>
            <Label>{budgetType==='lifetime' ? 'Total Budget (CAD $)' : 'Daily Budget (CAD $)'}</Label>
            <Input type="number" min="1" step="1" value={dailyBudget} onChange={e=>setDailyBudget(e.target.value)}/>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3 mt-3">
          <div>
            <Label>Budget type</Label>
            <div className="flex" style={{border:'1px solid var(--line)'}}>
              {[['daily','Per day'],['lifetime','Total']].map(function(b) {
                const on = budgetType===b[0];
                return (
                  <button key={b[0]} onClick={()=>setBudgetType(b[0])}
                    className="flex-1 px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                    style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
                    {b[1]}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="flex items-end">
            <p className="lbl">
              {budgetType==='lifetime'
                ? 'Spread across the run. Needs an end date.'
                : 'Spent each day until you stop it.'}
            </p>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3 mt-3">
          <div>
            <Label>Starts</Label>
            <Input type="datetime-local" value={startAt} onChange={e=>setStartAt(e.target.value)}/>
            <p className="lbl mt-1">Blank starts as soon as you unpause it.</p>
          </div>
          <div>
            <Label>Ends</Label>
            <Input type="datetime-local" value={endAt} onChange={e=>setEndAt(e.target.value)}/>
            <p className="lbl mt-1">Blank runs until you stop it.</p>
          </div>
        </div>
      </Card>
      <Card>
        <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-4 uppercase tracking-wide">Ad Set &amp; Targeting</h3>
        <div className="grid grid-cols-3 gap-3 mb-4">
          <div><Label>Latitude</Label><Input value={lat} onChange={e=>setLat(e.target.value)} placeholder="50.6745"/></div>
          <div><Label>Longitude</Label><Input value={lng} onChange={e=>setLng(e.target.value)} placeholder="-120.3273"/></div>
          <div><Label>Radius (km)</Label><Input type="number" min="1" max="80" value={radius} onChange={e=>setRadius(e.target.value)}/></div>
        </div>
        {!locLoading && !locIsSaved && (
          <p className="text-xs mb-3" style={{color:'var(--amb)'}}>
            <Icon name="warn" size={12} className="mr-1"/>
            No saved location for this store — these are placeholder coordinates.
            Set the real ones under Settings → Store locations before spending anything.
          </p>
        )}
        {locIsSaved && savedLoc.address && (
          <p className="lbl mb-3">Centred on {savedLoc.address}</p>
        )}
        <div className="grid grid-cols-3 gap-3 mb-4">
          <div>
            <Label>Min Age</Label>
            <Input type="number" min="19" max="65" value={ageMin} onChange={e=>setAgeMin(e.target.value)}/>
          </div>
          <div><Label>Max Age</Label><Input type="number" min="19" max="65" value={ageMax} onChange={e=>setAgeMax(e.target.value)}/></div>
          <div>
            <Label>Gender</Label>
            <Select value={gender} onChange={e=>setGender(e.target.value)}>
              <option value="all">Everyone</option>
              <option value="men">Men</option>
              <option value="women">Women</option>
            </Select>
          </div>
        </div>
        <p className="lbl mb-3">
          BC's legal drinking age is 19, and Meta requires alcohol ads to be targeted no lower.
          Anything below that is raised to 19 before the ad set is created.
        </p>
        <div><Label>Placements</Label>
          <div className="flex gap-2 flex-wrap">
            {AD_PLACEMENTS.map(p => (
              <label key={p.value} className={`flex items-center gap-2 px-3 py-2 rounded-xl border cursor-pointer text-sm transition-all
                ${placements.includes(p.value)?'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400'}`}>
                <input type="checkbox" className="rounded" checked={placements.includes(p.value)} onChange={()=>togglePlacement(p.value)}/>{p.label}
              </label>
            ))}
          </div>
        </div>
      </Card>
      <Card>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-sm font-bold text-gray-900 dark:text-white uppercase tracking-wide">Ad Creative</h3>
          <button onClick={()=>setShowAI(v=>!v)} className="text-xs font-semibold text-violet-600 dark:text-violet-400 hover:underline">{showAI?'Hide AI ↑':<React.Fragment><Icon name="spark"/> AI Copy</React.Fragment>}</button>
        </div>
        {showAI && <div className="mb-4"><AIWriter storeName={store.name} mode="ad" onResult={handleAI}/></div>}
        <div className="space-y-3">
          <div>
            <Label>Format</Label>
            <div className="flex" style={{border:'1px solid var(--line)', width:'fit-content'}}>
              {[['single','Single image'],['carousel','Carousel']].map(function(fm) {
                const on = format===fm[0];
                return (
                  <button key={fm[0]} onClick={()=>setFormat(fm[0])}
                    className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
                    style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
                    {fm[1]}
                  </button>
                );
              })}
            </div>
          </div>

          {format === 'single' && (
            <div><Label>Headline <span className="text-gray-400 font-normal normal-case">({headline.length}/25)</span></Label><Input value={headline} onChange={e=>setHeadline(e.target.value)} maxLength={25} placeholder="Shop Our Whiskey Sale"/></div>
          )}
          <div><Label>Primary Text</Label><Textarea value={bodyText} onChange={e=>setBodyText(e.target.value)} rows={3} placeholder="Discover amazing local spirits…"/></div>
          <div className="grid grid-cols-2 gap-3">
            <div><Label>Call to Action</Label><Select value={ctaType} onChange={e=>setCtaType(e.target.value)}>{CTA_OPTIONS.map(c=><option key={c} value={c}>{c.replace(/_/g,' ')}</option>)}</Select></div>
            <div>
              <div className="flex items-center justify-between mb-2">
                <Label className="mb-0">Destination URL</Label>
                {locIsSaved && (
                  <button onClick={()=>setDestUrl(
                            'https://www.google.com/maps/dir/?api=1&destination=' + savedLoc.lat + ',' + savedLoc.lng)}
                          className="text-xs font-semibold hover:underline" style={{color:'var(--cy)'}}>
                    <Icon name="store"/> Use map link
                  </button>
                )}
              </div>
              <Input value={destUrl} onChange={e=>setDestUrl(e.target.value)}
                     placeholder="https://yourstore.com" type="url"/>
              <p className="lbl mt-1">
                {destUrl.indexOf('google.com/maps') !== -1
                  ? 'Opens directions to the store. Pair it with Learn More.'
                  : destUrl.trim()
                  ? 'Blank falls back to the store\'s Facebook Page.'
                  : 'Set a website under Brand to fill this in automatically.'}
              </p>
            </div>
          </div>
          {format === 'carousel' && (
            <div>
              <div className="flex items-center justify-between mb-2">
                <Label className="mb-0">
                  Cards <span className="text-gray-400 font-normal normal-case">({cards.length}/10)</span>
                </Label>
                <div className="flex items-center gap-3">
                  {cards.length > 0 && (
                    <button onClick={fillCards} disabled={writing}
                            className="text-xs font-semibold hover:underline"
                            style={{color:'var(--vio)', opacity: writing ? 0.5 : 1}}>
                      <Icon name="spark"/> {writing ? 'Reading…' : 'Write empty cards'}
                    </button>
                  )}
                  <button onClick={()=>setCardPick(true)} className="text-xs font-semibold hover:underline"
                          style={{color:'var(--cy)'}}>
                    <Icon name="image"/> Add from library
                  </button>
                </div>
              </div>

              {cards.length === 0 && (
                <p className="lbl mb-2">
                  Two cards minimum, ten maximum. Square images only — Meta crops
                  everything else to 1:1 in the carousel.
                </p>
              )}

              <div className="space-y-2">
                {cards.map(function(c, i) {
                  const setCard = (k,v) => setCards(prev => prev.map((x,ix)=> ix===i ? {...x,[k]:v} : x));
                  const move = d => setCards(function(prev) {
                    const next = prev.slice();
                    const j = i + d;
                    if (j < 0 || j >= next.length) return prev;
                    const t = next[i]; next[i] = next[j]; next[j] = t;
                    return next;
                  });
                  return (
                    <div key={i} className="flex gap-3 p-2.5"
                         style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.4)'}}>
                      <div className="flex-none">
                        <img src={c.url} alt="" className="object-cover"
                             style={{width:'76px', height:'76px', border:'1px solid var(--line2)'}}/>
                        <p className="lbl text-center mt-1">Card {i+1}</p>
                      </div>
                      <div className="flex-1 min-w-0 space-y-1.5">
                        <Input value={c.headline} maxLength={40} className="text-xs"
                               placeholder="Card headline"
                               onChange={e=>setCard('headline', e.target.value)}/>
                        <Input value={c.description} maxLength={60} className="text-xs"
                               placeholder="Description (optional)"
                               onChange={e=>setCard('description', e.target.value)}/>
                        <Input value={c.link} className="text-xs" type="url"
                               placeholder="Card link — blank uses the destination URL"
                               onChange={e=>setCard('link', e.target.value)}/>
                      </div>
                      <div className="flex-none flex flex-col gap-1">
                        <Button size="sm" variant="ghost" onClick={()=>move(-1)} disabled={i===0}
                                aria-label="Move up"><Icon name="up" size={11}/></Button>
                        <Button size="sm" variant="ghost" onClick={()=>move(1)}
                                disabled={i===cards.length-1} aria-label="Move down">
                          <Icon name="down" size={11}/>
                        </Button>
                        <Button size="sm" variant="ghost"
                                onClick={()=>setCards(cards.filter((_,ix)=>ix!==i))}
                                aria-label="Remove card"><Icon name="trash" size={11}/></Button>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="mt-3 space-y-1.5">
                <label className="flex items-start gap-2 cursor-pointer">
                  <input type="checkbox" className="mt-0.5" checked={optimizeOrder}
                         onChange={e=>setOptimizeOrder(e.target.checked)}/>
                  <span className="text-xs" style={{color:'var(--txt2)'}}>
                    Let Meta reorder the cards by performance
                    <span className="lbl block">Leave off when the order tells a story or counts up a list.</span>
                  </span>
                </label>
                <label className="flex items-start gap-2 cursor-pointer">
                  <input type="checkbox" className="mt-0.5" checked={endCard}
                         onChange={e=>setEndCard(e.target.checked)}/>
                  <span className="text-xs" style={{color:'var(--txt2)'}}>
                    Finish with a card linking to the Page
                  </span>
                </label>
              </div>

              {cardPick && (
                <CreativePicker allowed={['1:1']} storeIds={storeId?[storeId]:null}
                  multi max={10 - cards.length}
                  onPickMany={function(chosen){
                    const base = cards.length;
                    setCards(prev => prev.concat(chosen.map(c => ({
                      url: c.public_url, headline:'', description:'', link:'',
                      featureId: c.feature_id || null,
                    }))));

                    // Anything made from a monthly feature fills its own copy
                    // from that feature — no API call, and the real numbers.
                    const linked = chosen
                      .map((c, i) => ({ c, i: base + i }))
                      .filter(x => x.c.feature_id);
                    if (!linked.length) return;
                    getSB().from('features').select('*')
                      .in('id', linked.map(x => x.c.feature_id))
                      .then(function(res){
                        const byId = {};
                        (res.data || []).forEach(f => { byId[f.id] = f; });
                        setCards(prev => prev.map(function(card, ix) {
                          const hit = linked.find(x => x.i === ix);
                          if (!hit) return card;
                          const copy = cardCopyFromFeature(byId[hit.c.feature_id]);
                          return copy ? Object.assign({}, card, copy) : card;
                        }));
                      });
                  }}
                  onClose={()=>setCardPick(false)}/>
              )}
            </div>
          )}

          {format === 'single' && (
          <div>
            <div className="flex items-center justify-between mb-2">
              <Label className="mb-0">Ad Image (optional)</Label>
              <button onClick={()=>setShowAdCreatives(true)} className="text-xs font-semibold hover:underline" style={{color:'var(--cy)'}}>
                <Icon name="image"/> Creative library
              </button>
            </div>
            <ImagePicker file={adImg} preview={adImgPrev} onFile={f=>{setAdCreativeUrl(null);setAdImg(f);const r=new FileReader();r.onload=()=>setAdImgPrev(r.result);r.readAsDataURL(f);}} onClear={()=>{setAdImg(null);setAdImgPrev(null);setAdCreativeUrl(null);}} label=""/>
            {showAdCreatives && (
              <CreativePicker allowed={AD_ASPECTS} storeIds={storeId?[storeId]:null}
                onPick={c=>{ setAdCreativeUrl(c.public_url); setAdImgPrev(c.public_url); setAdImg(null); }}
                onClose={()=>setShowAdCreatives(false)}/>
            )}
          </div>
          )}
        </div>
      </Card>
      {steps.length>0 && (
        <Card>
          <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-3 uppercase tracking-wide">Build Progress</h3>
          <StepIndicator steps={steps}/>

          {built && built.managerUrl && (
            <div className="mt-4 pt-4" style={{borderTop:'1px solid var(--line)'}}>
              <p className="text-xs mb-3" style={{color:'var(--txt2)'}}>
                Nothing is spending yet. Everything was created paused — read it over
                in Ads Manager, then switch the campaign on there.
              </p>
              <div className="flex gap-2 flex-wrap items-center">
                {/* Opened in a new tab so a half-filled builder isn't lost. */}
                <a href={built.managerUrl} target="_blank" rel="noopener noreferrer">
                  <Button size="sm"><Icon name="up"/> Open in Ads Manager</Button>
                </a>
                <span className="mono text-xs" style={{color:'var(--txt3)'}}>
                  Campaign {built.campaignId}
                </span>
              </div>
            </div>
          )}
        </Card>
      )}
      <Button onClick={launch} loading={running} className="w-full" size="lg"><Icon name="rocket"/> Create Campaign (starts Paused)</Button>
    </div>
  );
}

// ─────────────────────────────────────────────
// CAROUSEL CARD COPY
// ─────────────────────────────────────────────
// Two ways to fill a card, and the cheap one is also the accurate one.
//
// A creative generated from a monthly feature carries feature_id, so the exact
// name, price and saving are one query away — no guessing, no cost, no waiting.
// Reading numbers back off an image we rendered ourselves would be daft.
//
// Only when that link is missing does the image go to a vision model.

async function urlToBase64(url) {
  const blob = await (await fetch(url)).blob();
  const dataUrl = await new Promise(function(res, rej) {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error('Could not read the image'));
    fr.readAsDataURL(blob);
  });
  const comma = dataUrl.indexOf(',');
  return {
    base64: dataUrl.slice(comma + 1),
    mime: (dataUrl.slice(0, comma).match(/^data:([^;]+)/) || [, 'image/png'])[1],
  };
}

const clip = (t, n) => {
  const s = String(t || '').trim();
  return s.length <= n ? s : s.slice(0, n - 1).trimEnd() + '…';
};

// Headline and description straight from the feature row.
function cardCopyFromFeature(f) {
  if (!f) return null;
  const bits = [];
  if (f.sale_price != null) bits.push(money(f.sale_price));
  if (f.savings != null && Number(f.savings) > 0) bits.push('save ' + money(f.savings));
  else if (f.reg_price != null && Number(f.reg_price) > Number(f.sale_price)) {
    bits.push('was ' + money(f.reg_price));
  }
  if (f.size) bits.push(f.size);
  return {
    headline: clip(f.name, 40),
    description: clip(bits.join(' · '), 60),
  };
}

async function cardCopyFromImage(url) {
  const { base64, mime } = await urlToBase64(url);
  const prompt =
    'This is a retail ad for a liquor store in British Columbia. ' +
    'Read the product name and any price or saving printed on it.\n' +
    'Reply with JSON only, no code fence: {"headline":"","description":""}\n' +
    'headline: the product name as printed, at most 40 characters. ' +
    'description: the price and saving if shown, like "$15.49 · save $4.00", at most 60 characters. ' +
    'Leave description empty if no price is visible. ' +
    'Invent nothing. Canadian English spelling. No hashtags, no emoji.';
  const r = await callEdge('meta-social', 'aiDescribeImage', { base64, mime, prompt });
  const raw = String(r.text || '').replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  let parsed;
  try { parsed = JSON.parse(raw); }
  catch(e) { throw new Error('Could not read that image'); }
  return {
    headline: clip(stripHashtags(parsed.headline || ''), 40),
    description: clip(stripHashtags(parsed.description || ''), 60),
  };
}

// A personal token expires; a system user token doesn't. Either way, finding
// out on the morning a campaign is due is the wrong time, so whatever life is
// left is shown wherever ads are managed.
function TokenStatusBar() {
  const [info, setInfo] = useState(null);
  const [err,  setErr]  = useState(null);

  useEffect(function() {
    let alive = true;
    callEdge('meta-ads', 'tokenStatus', {})
      .then(r => { if (alive) setInfo(r); })
      .catch(e => { if (alive) setErr(e.message); });
    return function(){ alive = false; };
  }, []);

  if (err) {
    return (
      <div className="p-2.5 mb-3" style={{border:'1px solid var(--red)', background:'rgba(255,77,94,.08)'}}>
        <p className="text-xs" style={{color:'var(--red)'}}>
          <Icon name="warn" size={12} className="mr-1"/> Meta token: {err}
        </p>
      </div>
    );
  }
  if (!info) return null;

  const days = info.daysLeft;
  const tone = days == null ? 'var(--txt3)'
             : days <= 7    ? 'var(--red)'
             : days <= 21   ? 'var(--amb)'
             : 'var(--txt3)';

  return (
    <div className="flex items-center gap-2 mb-3 flex-wrap">
      <span className="lbl" style={{color:tone}}>
        <Icon name="key" size={11} className="mr-1"/>
        {info.source === 'user' ? 'Personal token' : 'System user token'}
        {days == null ? ' · never expires' : ' · ' + days + ' day' + (days===1?'':'s') + ' left'}
      </span>
      {days != null && days <= 21 && (
        <span className="lbl" style={{color:tone}}>
          Regenerate it and run: supabase secrets set META_USER_TOKEN=…
        </span>
      )}
    </div>
  );
}
