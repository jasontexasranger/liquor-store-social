  <style>
    :root{
      --void:#04070e; --deep:#070c17; --panel:rgba(10,17,30,.82);
      --cy:#e3c565; --cy-dim:#9c7f2e; --cy-glow:rgba(212,175,55,.14);
      --amb:#f0a830; --red:#ff4d5e; --grn:#3ff08a; --vio:#a98cf5;
      --txt:#dbe9f2; --txt2:#7d93a8; --txt3:#48596b;
      --line:rgba(212,175,55,.18); --line2:rgba(212,175,55,.34);
      --menu:#0a121f; --headerbg:rgba(6,11,20,.9); --hudshadow:0 0 34px rgba(0,0,0,.5);
      /* Recessed/nested surfaces (inputs, sub-panels, calendar cells) are
         built as rgba(var(--sink*-rgb), alpha) throughout the app, alpha
         varying per spot. Retheming these two triplets recolours every one
         of them without touching each call site. */
      --sink-rgb:4,8,16; --sink2-rgb:2,5,11;
      --field:rgba(var(--sink-rgb),.55); --scanline-op:.45;
      --disp:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    /* Day theme: same gold-on-warm-neutral brand language, just flipped for
       daylight use. Deepened the gold/accent hues (the pale HUD gold reads
       fine on near-black but washes out on white) and switched the CRT
       scanline overlay off — that's a dark-console detail, not a look this
       theme is going for. */
    html[data-theme="light"]{
      --void:#f7f3ea; --deep:#efe7d3; --panel:rgba(255,255,255,.86);
      --cy:#a3781e; --cy-dim:#8a6a26; --cy-glow:rgba(163,120,30,.12);
      --amb:#b5761c; --red:#c23348; --grn:#1f9a5a; --vio:#7457c9;
      --txt:#241d12; --txt2:#5c5140; --txt3:#948972;
      --line:rgba(60,45,15,.14); --line2:rgba(60,45,15,.26);
      --menu:#ffffff; --headerbg:rgba(255,255,255,.92);
      --hudshadow:0 4px 18px rgba(40,28,5,.10);
      /* Same warm tan for both — the two darks read as one "sunken" surface
         once inverted for daylight, no need to keep them distinct here. */
      --sink-rgb:206,190,152; --sink2-rgb:206,190,152;
      --field:rgba(0,0,0,.035); --scanline-op:0;
      color-scheme: light;
    }
    html,body{background:var(--void);color:var(--txt);font-family:var(--disp)}
    body{
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 900px 620px at 12% -8%, rgba(212,175,55,.085), transparent 60%),
        radial-gradient(ellipse 760px 520px at 92% 3%, rgba(240,168,48,.05), transparent 60%),
        linear-gradient(rgba(212,175,55,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,175,55,.026) 1px, transparent 1px);
      background-size:auto,auto,44px 44px,44px 44px;
      background-attachment:fixed;
    }
    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);opacity:var(--scanline-op)}
    ::-webkit-scrollbar{width:7px;height:7px}
    ::-webkit-scrollbar-track{background:rgba(212,175,55,.04)}
    ::-webkit-scrollbar-thumb{background:rgba(212,175,55,.28)}
    ::-webkit-scrollbar-thumb:hover{background:var(--cy)}
    .line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .hud{position:relative;background:var(--panel);border:1px solid var(--line);
      backdrop-filter:blur(7px);
      clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
      box-shadow:inset 0 1px 0 rgba(212,175,55,.09),var(--hudshadow)}
    .hud::before{content:'';position:absolute;top:0;left:13px;right:0;height:1px;
      background:linear-gradient(90deg,var(--cy),transparent 70%);opacity:.5}
    .hud-brk::after{content:'';position:absolute;top:6px;right:6px;width:9px;height:9px;
      border:1px solid var(--cy);border-left:0;border-bottom:0;opacity:.45}
    .clip{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
    .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--cy-dim)}
    .ttl{font-size:12.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--cy)}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .glow{box-shadow:0 0 8px currentColor}
    .pulse{animation:hudpulse 2s ease-in-out infinite}
    @keyframes hudpulse{50%{opacity:.35}}
    .scan{position:relative;overflow:hidden}
    .scan::after{content:'';position:absolute;left:0;right:0;height:34%;top:-40%;
      background:linear-gradient(180deg,transparent,rgba(212,175,55,.07),transparent);
      animation:sweep 5.5s ease-in-out infinite}
    @keyframes sweep{0%{top:-40%}100%{top:120%}}
    input,textarea,select{font-family:var(--disp)}
    input::placeholder,textarea::placeholder{color:var(--txt3)}
    select option{background:var(--menu);color:var(--txt)}
    ::selection{background:rgba(212,175,55,.3);color:#fff}

    html{color-scheme:dark}
    .dark .dark\:bg-gray-900,.dark .dark\:bg-gray-950{background-color:transparent!important}
    .dark .dark\:bg-gray-800{background-color:var(--panel)!important}
    .dark .dark\:bg-gray-750,.dark .dark\:bg-gray-700{background-color:var(--field)!important}
    .dark .dark\:hover\:bg-gray-700:hover,.dark .dark\:hover\:bg-gray-600:hover{background-color:rgba(212,175,55,.08)!important}
    .dark .dark\:border-gray-600,.dark .dark\:border-gray-700,.dark .dark\:border-gray-800{border-color:var(--line)!important}
    .dark .dark\:text-white,.dark .dark\:text-gray-100,.dark .dark\:text-gray-200{color:var(--txt)!important}
    .dark .dark\:text-gray-300,.dark .dark\:text-gray-400{color:var(--txt2)!important}
    .dark .dark\:text-gray-500,.dark .dark\:text-gray-600{color:var(--txt3)!important}
    .dark .dark\:text-indigo-300,.dark .dark\:text-indigo-400,.dark .dark\:text-violet-300,.dark .dark\:text-violet-400{color:var(--cy)!important}
    .dark .dark\:text-emerald-300,.dark .dark\:text-emerald-400{color:var(--grn)!important}
    .dark .dark\:text-amber-300,.dark .dark\:text-amber-400{color:var(--amb)!important}
    .dark .dark\:text-red-300,.dark .dark\:text-red-400{color:var(--red)!important}
    .dark [class*="dark:bg-indigo-9"],.dark [class*="dark:bg-indigo-95"]{background-color:var(--cy-glow)!important}
    .dark [class*="dark:bg-emerald-9"]{background-color:rgba(63,240,138,.1)!important}
    .dark [class*="dark:bg-amber-9"]{background-color:rgba(240,168,48,.1)!important}
    .dark [class*="dark:bg-red-9"]{background-color:rgba(255,77,94,.1)!important}
    .dark .dark\:border-indigo-600,.dark .dark\:border-indigo-700{border-color:var(--line2)!important}
    .bg-white{background-color:var(--panel)!important}
    .bg-gray-50,.bg-gray-100{background-color:transparent!important}
    .border-gray-100,.border-gray-200{border-color:var(--line)!important}
    .text-gray-900{color:var(--txt)!important}
    .text-gray-700,.text-gray-600{color:var(--txt2)!important}
    .text-gray-500,.text-gray-400{color:var(--txt3)!important}
    .text-indigo-600,.text-violet-600{color:var(--cy)!important}
    .rounded-xl,.rounded-2xl,.rounded-lg{border-radius:0!important}
    header.sticky{background:var(--headerbg)!important;backdrop-filter:blur(9px);border-color:var(--line)!important}

    /* ── Sueño home screen ─────────────────────────────────────────────── */
    .sueno-home { position: relative; min-height: 70vh; }

    /* The logo as a mask over animated gold: a moving highlight passes
       through the metal every few seconds — actual shine, not a static tint. */
    .sueno-logo {
      -webkit-mask: url('https://yyveikxfomxmedlxsulh.supabase.co/storage/v1/object/public/creatives/website/sueno-logo.png') center / contain no-repeat;
      mask: url('https://yyveikxfomxmedlxsulh.supabase.co/storage/v1/object/public/creatives/website/sueno-logo.png') center / contain no-repeat;
      background:
        linear-gradient(110deg, transparent 35%, rgba(255,252,230,.95) 50%, transparent 65%),
        linear-gradient(160deg, #f0d87c, #d4af37 40%, #97741f 78%, #e3c163);
      background-size: 250% 100%, 100% 100%;
      background-position: 200% 0, 0 0;
      background-repeat: no-repeat;
      animation: suenoSheen 3s ease-in-out .4s infinite; }
    @keyframes suenoSheen {
      0% { background-position: 200% 0, 0 0; }
      45%, 100% { background-position: -120% 0, 0 0; } }

    /* Opening: the logo alone on black, then it sinks to the bottom of the
       screen shrinking as it goes, and the cards take the stage. */
    .sueno-intro { position: fixed; inset: 0; z-index: 200; background: #05070c;
      display: flex; align-items: center; justify-content: center;
      animation: suenoIntroFade .5s ease 2.15s forwards; }
    .sueno-intro .sueno-logo { width: min(430px, 70vw); height: min(380px, 58vh);
      animation: suenoLogoIn .8s ease both,
                 suenoSheen 3s ease-in-out .4s infinite,
                 suenoLogoOut .7s cubic-bezier(.6,0,.4,1) 1.55s forwards; }
    @keyframes suenoLogoIn { from { opacity: 0; transform: scale(.82); }
                             to { opacity: 1; transform: scale(1); } }
    @keyframes suenoLogoOut { to { transform: translateY(36vh) scale(.34); } }
    @keyframes suenoIntroFade { to { opacity: 0; visibility: hidden; } }
    .sueno-bottom-logo { padding: 26px 0 10px; opacity: 0; animation: suenoIn .6s ease forwards; }
    .sueno-bottom-logo .sueno-logo { width: 170px; height: 150px; margin: 0 auto; }
    .sueno-title { text-align: center; font-size: 34px; letter-spacing: .35em;
      color: #d4af37; font-weight: 800; margin: 6px 0 28px;
      text-shadow: 0 0 24px rgba(212,175,55,.35); }
    .sueno-dots { animation: suenoBlink 1.4s steps(1) infinite; }
    @keyframes suenoBlink { 50% { opacity: 0; } }
    .sueno-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px; max-width: 1100px; margin: 0 auto; padding: 0 8px 30px; }
    .sueno-card { position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; min-height: 150px;
      padding: 18px; border-radius: 14px !important; cursor: pointer; color: #d4af37;
      background: linear-gradient(160deg, rgba(22,17,7,.92), rgba(9,8,4,.96));
      border: 1px solid rgba(212,175,55,.35);
      transition: transform .18s, box-shadow .18s, border-color .18s;
      opacity: 0; animation: suenoIn .5s ease forwards; }
      /* Hover inverts: the whole card turns to polished gold, dark lettering. */
    .sueno-card:hover { transform: translateY(-4px);
      background: linear-gradient(150deg, #f6e08a, #d4af37 45%, #a3812a 90%);
      border-color: #f6e08a; color: #181203;
      box-shadow: 0 12px 36px rgba(212,175,55,.45), inset 0 1px 0 rgba(255,255,240,.6); }
    .sueno-card:hover .sueno-card-label { color: #181203; }
    .sueno-card:hover .sueno-badge { background: #181203; color: #f6e08a; }
    @keyframes suenoIn { from { opacity: 0; transform: translateY(14px); }
                         to { opacity: 1; transform: translateY(0); } }
    .sueno-card-label { font-size: 15px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; text-align: center; line-height: 1.3; color: #e7cd7f; }
    .sueno-badge { position: absolute; top: 10px; right: 10px; background: #d4af37;
      color: #120e05; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 99px !important; }
    .sueno-foot { text-align: center; font-size: 11px; letter-spacing: .2em;
      text-transform: uppercase; color: rgba(212,175,55,.5); padding-bottom: 24px; }

    /* Google rating leaderboard — a quick, friendly-competition readout
       above the action grid. Stays quiet (renders nothing) until there's
       real synced data, so it never shows as a broken placeholder. */
    .sueno-leaderboard { display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px; max-width: 1100px; margin: 0 auto 28px; padding: 0 8px;
      opacity: 0; animation: suenoIn .5s ease forwards; }
    .sueno-lb-item { display: flex; align-items: center; gap: 7px; padding: 7px 14px;
      border-radius: 999px !important; border: 1px solid rgba(212,175,55,.3);
      background: rgba(212,175,55,.06); color: #e7cd7f; cursor: pointer;
      font-size: 12.5px; font-weight: 600; transition: background .15s, border-color .15s; }
    .sueno-lb-item:hover { background: rgba(212,175,55,.16); border-color: rgba(212,175,55,.6); }
    .sueno-lb-rank { display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; color: #d4af37; min-width: 1.3em; }
    .sueno-lb-count { color: rgba(231,205,127,.55); }
  </style>
</head>

// EDGE FUNCTION CALLER
// All Meta API calls go through server-side edge functions so that
// tokens / system-user secrets never touch the browser.
// ─────────────────────────────────────────────
async function callEdge(funcName, action, params) {
  const sb = getSB();
  var sessionData = await sb.auth.getSession();
  var session = sessionData.data.session;
  if (!session) throw new Error('Not authenticated');
  var resp = await fetch(SUPABASE_URL + '/functions/v1/' + funcName, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token,
    },
    body: JSON.stringify(Object.assign({ action: action }, params || {})),
  });
  var data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// Upload an image (File object or data-URL string) to Supabase Storage
// and return the public URL.  Called from PostComposer before publishing.
async function uploadImageToStorage(fileOrDataUrl) {
  // Already a hosted URL (e.g. picked from the Creative Library) — reuse it
  // rather than round-tripping the bytes through Storage again.
  if (typeof fileOrDataUrl === 'string' && /^https?:\/\//.test(fileOrDataUrl)) {
    return fileOrDataUrl;
  }
  var sb = getSB();
  var sessionData = await sb.auth.getSession();
  var session = sessionData.data.session;
  if (!session) throw new Error('Not authenticated');

  var blob, ext;
  if (typeof fileOrDataUrl === 'string' && fileOrDataUrl.startsWith('data:')) {
    // Convert data URL to Blob
    var arr = fileOrDataUrl.split(',');
    var mime = arr[0].match(/:(.*?);/)[1];
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bstr.charCodeAt(i);
    blob = new Blob([u8], { type: mime });
    ext = mime.split('/')[1] || 'jpg';
  } else {
    blob = fileOrDataUrl;
    ext = (fileOrDataUrl.name || 'image').split('.').pop() || 'jpg';
  }

  var userId = session.user.id;
  var filename = userId + '/' + Date.now() + '.' + ext;

  var uploadResult = await sb.storage.from('post-images').upload(filename, blob, {
    contentType: blob.type || 'image/jpeg',
    upsert: false,
  });
  if (uploadResult.error) throw new Error(uploadResult.error.message);

  var urlResult = sb.storage.from('post-images').getPublicUrl(filename);
  return urlResult.data.publicUrl;
}

const POST_ASPECTS = ASPECTS.filter(a=>a.surfaces.includes('post')).map(a=>a.id);
const AD_ASPECTS   = ASPECTS.map(a=>a.id);
const aspectMeta   = id => ASPECTS.find(a=>a.id===id) || ASPECTS[0];

// Which of our four sizes is a given canvas closest to? Templates carry pixel
// dimensions, the library files by aspect, so the two have to be reconciled.
function nearestAspect(w, h) {
  if (!w || !h) return '1:1';
  const got = w / h;
  return ASPECTS.reduce((b,a)=>
    Math.abs(got-a.ratio)/a.ratio < Math.abs(got-b.ratio)/b.ratio ? a : b, ASPECTS[0]).id;
}

// Ratio tolerance — a 1080x1082 export shouldn't be called wrong.
const RATIO_TOLERANCE = 0.04;
function ratioCheck(w, h, aspectId) {
  if (!w || !h) return { ok:true };
  const want = aspectMeta(aspectId).ratio;
  const got  = w / h;
  const off  = Math.abs(got - want) / want;
  if (off <= RATIO_TOLERANCE) return { ok:true };
  const near = ASPECTS.reduce((b,a)=>
    Math.abs(got-a.ratio)/a.ratio < Math.abs(got-b.ratio)/b.ratio ? a : b, ASPECTS[0]);
  return { ok:false, got, near:near.id, pct:Math.round(off*100) };
}

function readImageSize(file) {
  return new Promise(function(resolve) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { resolve({ w:img.naturalWidth, h:img.naturalHeight }); URL.revokeObjectURL(url); };
    img.onerror = () => { resolve({ w:0, h:0 }); URL.revokeObjectURL(url); };
    img.src = url;
  });
}

function useCampaigns() {
  const [campaigns, setCampaigns] = useState([]);
  const [loading, setLoading] = useState(true);
  const reload = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('campaigns').select('*').order('created_at',{ascending:false});
    setCampaigns(data || []); setLoading(false);
  }, []);
  useEffect(function(){ reload(); }, [reload]);

  const create = async function(fields) {
    const sb = getSB();
    const { data:{ user } } = await sb.auth.getUser();
    const { error } = await sb.from('campaigns').insert({ ...fields, created_by:user?.id });
    if (error) throw error;
    await reload();
  };
  const update = async function(id, fields) {
    const sb = getSB();
    const { error } = await sb.from('campaigns').update(fields).eq('id', id);
    if (error) throw error;
    await reload();
  };
  return { campaigns, loading, reload, create, update };
}

function useCreatives() {
  const [creatives, setCreatives] = useState([]);
  const [loading, setLoading] = useState(true);
  const reload = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('creatives').select('*').order('created_at',{ascending:false});
    setCreatives(data || []); setLoading(false);
  }, []);
  useEffect(function(){ reload(); }, [reload]);

  const upload = async function(file, meta) {
    const sb = getSB();
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Not authenticated');
    const size = await readImageSize(file);
    const ext  = (file.name||'image').split('.').pop() || 'jpg';
    const path = session.user.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;

    const up = await sb.storage.from('creatives').upload(path, file, {
      contentType: file.type || 'image/jpeg', upsert:false,
    });
    if (up.error) throw new Error(up.error.message);
    const url = sb.storage.from('creatives').getPublicUrl(path).data.publicUrl;

    const { error } = await sb.from('creatives').insert({
      name: meta.name, campaign_id: meta.campaignId || null, store_id: meta.storeId || null,
      aspect: meta.aspect, storage_path: path, public_url: url,
      width: size.w, height: size.h, bytes: file.size, mime: file.type,
      period: meta.period || null,
      created_by: session.user.id,
    });
    if (error) { await sb.storage.from('creatives').remove([path]); throw error; }
    await reload();
  };

  // Same thing for an image we rendered ourselves rather than one the user
  // picked off disk. Kept separate from `upload` because it takes known
  // dimensions instead of measuring a File, and because a batch run must not
  // reload the whole library after every single image.
  const addRendered = async function(blob, meta) {
    const sb = getSB();
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Not authenticated');
    const path = session.user.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.png';

    const up = await sb.storage.from('creatives').upload(path, blob, {
      contentType: 'image/png', upsert: false,
    });
    if (up.error) throw new Error(up.error.message);
    const url = sb.storage.from('creatives').getPublicUrl(path).data.publicUrl;

    // A rerun replaces last run's image for this feature+template rather than
    // stacking another copy beside it.
    if (meta.featureId && meta.templateId) {
      const { data: old } = await sb.from('creatives')
        .select('id, storage_path')
        .eq('feature_id', meta.featureId).eq('template_id', meta.templateId);
      if (old && old.length) {
        await sb.storage.from('creatives').remove(old.map(o=>o.storage_path));
        await sb.from('creatives').delete().in('id', old.map(o=>o.id));
      }
    }

    const { error } = await sb.from('creatives').insert({
      name: meta.name, campaign_id: meta.campaignId || null, store_id: meta.storeId || null,
      aspect: meta.aspect, storage_path: path, public_url: url,
      width: meta.width, height: meta.height, bytes: blob.size, mime: 'image/png',
      period: meta.period || null, feature_id: meta.featureId || null,
      template_id: meta.templateId || null, source: 'feature_batch',
      created_by: session.user.id,
    });
    if (error) { await sb.storage.from('creatives').remove([path]); throw error; }
    return url;
  };

  const remove = async function(c) {
    const sb = getSB();
    await sb.storage.from('creatives').remove([c.storage_path]);
    const { error } = await sb.from('creatives').delete().eq('id', c.id);
    if (error) throw error;
    await reload();
  };
  return { creatives, loading, reload, upload, addRendered, remove };
}

  const limit = max == null ? Infinity : max;
  const atLimit = picked.length >= limit;

  // Order matters: ticking 1, 2, 3 should add them in that order, so selection
  // is held as a list rather than a set.
  const toggle = id => setPicked(function(prev) {
    if (prev.includes(id)) return prev.filter(x => x !== id);
    if (prev.length >= limit) return prev;
    return prev.concat(id);
  });

  const confirm = function() {
    const chosen = picked
      .map(id => creatives.find(c => c.id === id))
      .filter(Boolean);
    if (!chosen.length) return;
    if (onPickMany) onPickMany(chosen);
    else chosen.forEach(onPick);
    onClose();

  const periods = creativePeriods(creatives);

  const visible = creatives.filter(function(c) {
    if (!allowed.includes(c.aspect)) return false;
    if (asp !== 'all' && c.aspect !== asp) return false;
    if (camp === 'none' && c.campaign_id) return false;
    if (camp !== 'all' && camp !== 'none' && c.campaign_id !== camp) return false;
    if (per !== 'all' && String(c.period) !== per) return false;
    if (storeIds && storeIds.length && c.store_id && !storeIds.includes(c.store_id)) return false;
    return true;
  }).sort(byPeriodThenDate);

  return (
    <Portal>

          <span className="ttl">Creative Library</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>

// Distinct months present in the library, newest first. Generated price ads
// carry the month they were made for; hand-uploaded creatives don't.
function creativePeriods(list) {
  const seen = {};
  list.forEach(c => { if (c.period) seen[String(c.period)] = true; });
  return Object.keys(seen).sort().reverse();
}

// Month first, then upload time inside a month. Undated uploads sort last so a
// year of generated ads doesn't get buried under them.
function byPeriodThenDate(a, b) {
  const ap = a.period ? String(a.period) : '';
  const bp = b.period ? String(b.period) : '';
  if (ap !== bp) return ap && bp ? bp.localeCompare(ap) : (ap ? -1 : 1);
  return String(b.created_at).localeCompare(String(a.created_at));
}

// Renders a blank template image and fills only the boxes an admin positioned.
// Nothing is invented — badges and panels that are baked into the artwork stay
// baked, which is what the hardcoded renderer got wrong.
const AD_FIELD_KEYS = [
  { key:'product_name',  label:'Product name',  type:'text',          hint:'e.g. CORONA EXTRA' },
  { key:'pack_size',     label:'Pack / size',   type:'text',          hint:'e.g. 12 PACK · 355ml' },
  { key:'price',         label:'Price',         type:'text',          hint:'e.g. 18.99' },
  { key:'save',          label:'Save amount',   type:'text',          hint:'e.g. $3.00' },
  { key:'product_image', label:'Product photo', type:'product_image', hint:'Bottle / pack shot' },
  { key:'custom',        label:'Custom text',   type:'text',          hint:'Anything else' },
];

const AD_FIELD_DEFAULTS = {
  field_key:'custom', field_type:'text', label:'New field',
  align:'left', valign:'top', color:'#1b365d', bold:true, uppercase:true,
  font_family:'Anton', font_weight:400, padding_pct:2,
  prefix_scale:55, prefix_valign:'middle', suffix_scale:35, suffix_valign:'bottom',
  wrap:true, max_lines:2, min_font_size:8, max_font_size:200,
  line_spacing:1.15, prefix:'', suffix:'',
  fit_mode:'contain', remove_bg:true, bg_tolerance:42,
};

// Rows saved before a column existed come back null. Every read path must go
// through this — reading the table directly is what silently disabled
// background removal and fell back to Arial.
function withFieldDefaults(rows) {
  return (rows || []).map(f => {
    const out = { ...AD_FIELD_DEFAULTS, ...f };
    for (const k of Object.keys(AD_FIELD_DEFAULTS)) {
      if (out[k] === null || out[k] === undefined) out[k] = AD_FIELD_DEFAULTS[k];
    }
    return out;
  });
}

function useAdTemplateFields(templateId) {
  const [fields, setFields] = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(async () => {
    if (!templateId) { setFields([]); return; }
    const sb=getSB(); if(!sb) return;
    setLoading(true);
    const { data } = await sb.from('ad_template_fields')
      .select('*').eq('template_id', templateId).order('field_order');
    setFields(withFieldDefaults(data));
    setLoading(false);
  }, [templateId]);

  useEffect(()=>{ load(); }, [load]);

  const save = async (list) => {
    const sb=getSB(); if(!sb) throw new Error('Not connected');
    await sb.from('ad_template_fields').delete().eq('template_id', templateId);
    if (list.length) {
      const rows = list.map((f,i) => {
        const { id:_a, created_at:_b, template_id:_c, ...rest } = f;
        return { ...rest, template_id: templateId, field_order: i };
      });
      const { error } = await sb.from('ad_template_fields').insert(rows);
      if (error) throw error;
    }
    await load();
  };

  return { fields, loading, save, reload: load };
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Could not load image'));
    i.src = src;
  });
}

// Draw an image inside a box without distorting it.
function drawImageFitted(ctx, img, box, mode) {
  const ir = img.width / img.height;
  const br = box.w / box.h;
  let dw, dh;
  if (mode === 'cover' ? ir > br : ir < br) { dh = box.h; dw = dh * ir; }
  else                                      { dw = box.w; dh = dw / ir; }
  const dx = box.x + (box.w - dw) / 2;
  const dy = box.y + (box.h - dh) / 2;
  ctx.save();
  if (mode === 'cover') { ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip(); }
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

async function renderFieldTemplate(tpl, fields, values, productDataUrl, onStep) {
  const W = tpl.canvas_w || 1080;
  const H = tpl.canvas_h || 1080;
  await ensureFontsReady();

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if (tpl.data) {
    const bg = await loadImg(tpl.data);
    ctx.drawImage(bg, 0, 0, W, H);
  }

  const imageFields = fields.filter(f => f.field_type === 'product_image');
  let productImg = null;
  if (productDataUrl && imageFields.length) {
    let src = productDataUrl;
    if (imageFields.some(f => f.remove_bg)) {
      if (onStep) onStep('removing');
      const tol = imageFields.find(f=>f.remove_bg)?.bg_tolerance ?? 42;
      try { src = await removeProductBackground(productDataUrl, 228, tol); } catch(e) { /* keep original */ }
    }
    try { productImg = await loadImg(src); }
    catch(e) {
      // Better to fail loudly than hand back an ad with an empty product box.
      throw new Error('Could not load the product image. If it was imported, check the product-media bucket is public.');
    }
  }

  if (onStep) onStep('compositing');

  const overflows = [];
  const sorted = [...fields].sort((a,b)=>(a.field_order||0)-(b.field_order||0));
  for (const f of sorted) {
    const box = {
      x: Number(f.x_pct)/100*W, y: Number(f.y_pct)/100*H,
      w: Number(f.w_pct)/100*W, h: Number(f.h_pct)/100*H,
    };

    if (f.field_type === 'product_image') {
      if (productImg) drawImageFitted(ctx, productImg, box, f.fit_mode || 'contain');
      continue;
    }

    let text = values[f.field_key];
    if (text == null || text === '') continue;
    text = String(text);

    // The field draws its own prefix, so a value that already carries it would
    // print twice. Two cases, because templates differ in where they put the
    // words: a prefix of "$" against a value of "$2.75", and a prefix of
    // "SAVE $" against a value of "$12.50" — the second slipped through when
    // only whole-prefix matches were stripped, and printed "SAVE $$12.50".
    // The rule now: drop the whole prefix if the value repeats it, otherwise
    // drop a leading currency symbol whenever the prefix already ends in one.
    const pre = String(f.prefix || '').trim();
    if (pre) {
      const bare = text.trim();
      if (bare.length > pre.length && bare.slice(0, pre.length) === pre) {
        text = bare.slice(pre.length).trim();
      } else {
        const CURRENCY = ['$', '\u20ac', '\u00a3'];
        const tail = pre.slice(-1);
        if (CURRENCY.includes(tail) && bare.length > 1 && bare[0] === tail) {
          text = bare.slice(1).trim();
        }
      }
    }

    if (f.uppercase) text = text.toUpperCase();

    const res = drawTextField(ctx, text, box, {
      align: f.align || 'left',
      valign: f.valign || 'top',
      color: f.color || '#000000',
      bold: !!f.bold,
      lineSpacing: Number(f.line_spacing) || 1.15,
      wrap: f.wrap !== false,
      maxLines: f.max_lines || null,
      minFontSize: f.min_font_size || 8,
      maxFontSize: f.max_font_size || 200,
      prefix: f.prefix || '',
      prefixScale: (f.prefix_scale ?? 55) / 100,
      prefixValign: f.prefix_valign || 'middle',
      suffix: f.suffix || '',
      suffixScale: (f.suffix_scale ?? 35) / 100,
      suffixValign: f.suffix_valign || 'bottom',
      fontFamily: fontStack(f.font_family),
      fontWeight: f.font_weight || null,
      // Breathing room so glyphs never sit flush against the clip edge.
      padding: Math.round(Math.min(box.w, box.h) * ((f.padding_pct ?? 2) / 100)),
    });
    if (res && res.overflow) overflows.push(f.label || f.field_key);
  }

  const url = canvas.toDataURL('image/png');
  // Attach non-fatally so callers that just want the image still work.
  try { url.overflows = overflows; } catch(e) {}
  return overflows.length ? { url, overflows } : url;
}

// ─────────────────────────────────────────────
// RECIPE CARDS
// ─────────────────────────────────────────────
// Composed on canvas from the product shot rather than generated by an image
// model. A set of cards has to look like a set, and an image model gives a
// different glass, garnish and lighting every time it's asked.
//
// 1080 × 1350 — Instagram's tallest feed size, so it takes the most screen.

const RECIPE_CARD_W = 1080;
const RECIPE_CARD_H = 1350;

// A generic modern look, to be overridden per store. Every read merges over
// these, so a token added later doesn't break cards saved before it existed.
const RECIPE_STYLE_DEFAULTS = {
  v: 2,
  band_pos:     'top',        // 'top' | 'bottom' | 'none'
  band_color:   '#f2ece1',
  band_height:  16,           // percent of the card height
  text:         '#141414',
  name_font:    'Jost',
  name_weight:  400,
  uppercase:    true,
  tracking:     18,           // letter spacing, percent of the font size
  // Used when the name sits straight on the photo rather than in a band.
  scrim:        0.5,
  // Cocktail stamp — the PNG itself lives on the brand profile, only its
  // placement belongs to the card look.
  show_stamp:   true,
  stamp_corner: 'br',      // 'tl' | 'tr' | 'bl' | 'br'
  stamp_size:   22,        // percent of the card width
  stamp_alpha:  100,       // percent
  // Only shown before a photo exists, so the card is never a blank rectangle.
  bg_top:       '#141c26',
  bg_bottom:    '#243542',
};

// Styles saved under the earlier card design used the same key names for
// different things — `text` was white, to sit over a dark photo. Merged
// blindly, that gives white text on a cream band. Anything without a version
// marker is treated as the old scheme and its colours dropped.
function withStyleDefaults(t) {
  const saved = (t && t.v === 2) ? t : {};
  return Object.assign({}, RECIPE_STYLE_DEFAULTS, saved);
}

function hexToRgba(hex, a) {
  const h = String(hex || '#000000').replace('#','');
  const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  // parseInt stops at the first bad character, so "bogus" would quietly become
  // #0b. Reject anything that isn't six hex digits outright.
  if (!/^[0-9a-f]{6}$/i.test(full)) return 'rgba(0,0,0,' + a + ')';
  const n = parseInt(full, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

// ── Letter-spaced text ──────────────────────────────────────────────────────
// Canvas has no tracking, and the wide-set capitals this card wants are the
// whole look. Drawn a character at a time instead: measure each glyph, add the
// gap, advance by hand. ctx.letterSpacing exists in current Chrome but is
// ignored by Safari and by canvas measurement in older builds, so it can't be
// relied on for something that has to come out identical every time.
function trackedWidth(ctx, text, gap) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + gap;
  return text.length ? w - gap : 0;
}

function drawTrackedLine(ctx, text, cx, baseline, fontSize, tracking) {
  const gap = fontSize * tracking;
  let x = cx - trackedWidth(ctx, text, gap) / 2;
  for (const ch of text) {
    ctx.fillText(ch, x, baseline);
    x += ctx.measureText(ch).width + gap;
  }
}

// Largest size that fits the box, wrapping to a second line only if it must.
function fitTrackedText(ctx, text, boxW, boxH, opts) {
  const { fontFamily, fontWeight, tracking, maxFontSize = 120, minFontSize = 18 } = opts;
  const words = String(text).split(/\s+/).filter(Boolean);

  const layout = function(size) {
    ctx.font = fontWeight + ' ' + size + 'px ' + fontFamily;
    const gap = size * tracking;
    const one = trackedWidth(ctx, words.join(' '), gap);
    if (one <= boxW) return { lines: [words.join(' ')], w: one };
    if (words.length < 2) return null;
    // Split as evenly as possible rather than greedily — two balanced lines
    // read better than one long and one short.
    let best = null;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      const wa = trackedWidth(ctx, a, gap), wb = trackedWidth(ctx, b, gap);
      if (wa > boxW || wb > boxW) continue;
      const score = Math.abs(wa - wb);
      if (!best || score < best.score) best = { lines: [a, b], w: Math.max(wa, wb), score };
    }
    return best;
  };

  for (let size = maxFontSize; size >= minFontSize; size -= 2) {
    const r = layout(size);
    if (!r) continue;
    const lineH = size * 1.18;
    if (r.lines.length * lineH <= boxH) return { size, lines: r.lines, lineH };
  }
  ctx.font = fontWeight + ' ' + minFontSize + 'px ' + fontFamily;
  return { size: minFontSize, lines: [words.join(' ')], lineH: minFontSize * 1.18 };
}

// What the image model is asked for. Built from the recipe itself so the photo
// shows the drink that the caption describes — the right colour, the right
// glass, the right garnish — rather than a generic cocktail.
function cocktailPhotoPrompt(recipe, hint) {
  const ing = (recipe.ingredients || [])
    .map(i => (i && i.item) ? String(i.item).trim() : '')
    .filter(Boolean);

  const parts = ['A photograph of a single finished cocktail called "' + (recipe.name || 'cocktail') + '".'];
  if (recipe.glass) parts.push('Served in a ' + recipe.glass + '.');
  if (ing.length)   parts.push('Made from ' + ing.slice(0, 5).join(', ') + ', so match its colour.');
  if (recipe.garnish) parts.push('Garnished with ' + recipe.garnish + '.');
  if (hint && hint.trim()) parts.push(hint.trim() + '.');

  parts.push(
    'Editorial lifestyle photography, shot on a 50mm lens at a wide aperture, ' +
    'natural window light, shallow depth of field with the background softly blurred. ' +
    'The glass sits in the lower two thirds of the frame, sharp and lit from the side, ' +
    'on a marble or polished stone surface in a modern bar or hotel lounge. ' +
    'Leave the top third of the frame calm and uncluttered — a caption is placed there. ' +
    'Warm, tasteful and understated, muted colours apart from the drink itself.',
    // Everything below is the negative half of the prompt. Bottles and labels
    // are the point of the price ads, not of this card, and any text the model
    // renders will collide with the drink name drawn on top.
    'No text, no writing, no lettering, no logos, no labels, no watermarks. ' +
    'No bottles, no packaging, no branding of any kind. No people, no hands. ' +
    'Vertical composition.',
  );
  return parts.join(' ');
}

// Photo first, drink name in a band across it. The photo is generated
// separately and passed in, because it costs money and fifteen seconds —
// restyling has to be free.
async function renderRecipeCard(styleTokens, recipe, photoDataUrl, stampDataUrl) {
  const s = withStyleDefaults(styleTokens);
  await ensureFontsReady();

  const W = RECIPE_CARD_W, H = RECIPE_CARD_H;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let drew = false;
  if (photoDataUrl) {
    try {
      const img = await loadImg(photoDataUrl);
      // Cover, not contain: the model returns 2:3 and the card is 4:5, so the
      // photo is cropped rather than letterboxed.
      drawImageFitted(ctx, img, { x:0, y:0, w:W, h:H }, 'cover');
      drew = true;
    } catch(e) { /* fall through to the placeholder */ }
  }

  if (!drew) {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, s.bg_top);
    grad.addColorStop(1, s.bg_bottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  const bandH = Math.round(H * (Math.max(8, Math.min(34, Number(s.band_height))) / 100));
  const hasBand = s.band_pos === 'top' || s.band_pos === 'bottom';
  const bandY = s.band_pos === 'bottom' ? H - bandH : 0;

  if (hasBand) {
    ctx.fillStyle = s.band_color;
    ctx.fillRect(0, bandY, W, bandH);
  } else {
    // No band: the name sits on the photo, so it needs shading to stay legible.
    const scrim = Math.max(0, Math.min(0.9, Number(s.scrim)));
    if (scrim > 0) {
      const g = ctx.createLinearGradient(0, H - 430, 0, H);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,' + scrim + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, H - 430, W, 430);
    }
  }

  // Drawn before the band so the band always wins where they meet — a stamp
  // half under a solid colour looks like a mistake, and the corner it sits in
  // is a choice made once for every card.
  if (s.show_stamp && stampDataUrl) {
    try {
      const st = await loadImg(stampDataUrl);
      const sw = W * (Math.max(6, Math.min(45, Number(s.stamp_size))) / 100);
      const sh = sw * (st.height / st.width);
      const pad = Math.round(W * 0.045);
      // Keep clear of the band rather than tucking underneath it.
      const topLimit    = (s.band_pos === 'top')    ? bandH + pad : pad;
      const bottomLimit = (s.band_pos === 'bottom') ? H - bandH - pad - sh : H - pad - sh;
      const x = (s.stamp_corner === 'tl' || s.stamp_corner === 'bl') ? pad : W - pad - sw;
      let   y = (s.stamp_corner === 'tl' || s.stamp_corner === 'tr') ? topLimit : bottomLimit;
      // A very tall stamp at a large size can be pushed off the card by the
      // band. Staying on the canvas beats staying clear of the band.
      y = Math.max(pad, Math.min(y, H - pad - sh));

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, Number(s.stamp_alpha) / 100));
      ctx.drawImage(st, x, y, sw, sh);
      ctx.restore();
    } catch(e) { /* a missing stamp shouldn't cost you the card */ }
  }

  const name = s.uppercase ? String(recipe.name || '').toUpperCase() : String(recipe.name || '');
  if (name) {
    const boxY = hasBand ? bandY : H - 330;
    const boxH = hasBand ? bandH : 240;
    const fit = fitTrackedText(ctx, name, W - 150, boxH - 34, {
      fontFamily: fontStack(s.name_font),
      fontWeight: s.name_weight || 400,
      tracking:   Math.max(0, Number(s.tracking) || 0) / 100,
      maxFontSize: Math.min(132, Math.round(boxH * 0.62)),
      minFontSize: 20,
    });

    ctx.fillStyle = hasBand ? s.text : '#ffffff';
    ctx.textBaseline = 'alphabetic';
    ctx.font = (s.name_weight || 400) + ' ' + fit.size + 'px ' + fontStack(s.name_font);

    // Centre the block on the band optically: cap height rather than the em
    // box, or all-capitals text sits noticeably low.
    const m = ctx.measureText(name);
    const capH = (m.actualBoundingBoxAscent || fit.size * 0.72);
    const blockH = (fit.lines.length - 1) * fit.lineH + capH;
    let baseline = boxY + (boxH - blockH) / 2 + capH;

    fit.lines.forEach(function(line) {
      drawTrackedLine(ctx, line, W/2, baseline, fit.size, (Number(s.tracking)||0)/100);
      baseline += fit.lineH;
    });
  }

  return canvas.toDataURL('image/png');
}

// Bar measures here are ounces. The model is told so, but it drifts to
// millilitres — Canada is metric on paper — and a recipe that mixes the two is
// worse than one that picks the wrong unit consistently.
//
// Converted rather than rejected, and rounded to the quarter ounce, because
// that is the resolution a jigger actually has: 30 ml becomes 1 oz, not 1.01.
function toOunces(amount) {
  const t = String(amount || '').trim();
  if (!t) return t;
  const m = /^([\d.,\/\s]+)\s*(ml|mls|millilitres?|milliliters?)\b(.*)$/i.exec(t);
  if (!m) return t;

  const raw = m[1].replace(/,/g, '.').trim();
  // "1 1/2" and "1/2" both turn up.
  let n = 0;
  raw.split(/\s+/).forEach(function(part) {
    const frac = /^(\d+)\/(\d+)$/.exec(part);
    if (frac) n += Number(frac[1]) / Number(frac[2]);
    else if (part) n += Number(part) || 0;
  });
  if (!n) return t;

  const oz = Math.round((n / 29.5735) * 4) / 4;
  if (oz < 0.25) return 'a splash' + (m[3] || '');
  const label = Number.isInteger(oz) ? String(oz) : String(oz);
  return label + ' oz' + (m[3] || '');
}

// "highball" is what the model returns, and "Serve in a highball." reads like
// a sentence with a word missing. Vessels that already name themselves —
// a mug, a jar, a flute — are left alone; everything else gets "glass".
const GLASS_NOUNS = /\b(glass(es)?|mug|jar|cup|flute|tin|goblet|stein|snifter|tumbler|coupe|pitcher|carafe|shot)\b/i;

function glassPhrase(glass) {
  const t = String(glass || '').trim().replace(/\.+$/, '');
  if (!t) return '';
  const full = GLASS_NOUNS.test(t) ? t : t + ' glass';
  const article = /^[aeiou]/i.test(full) ? 'an' : 'a';
  return 'Serve in ' + article + ' ' + full + '.';
}

// The recipe as a post caption: ingredients as a list, method as steps, and
// the offer if the drink was built around something on feature. A recipe post
// that doesn't mention the price is a recipe post; one that does is an ad for
// the bottle, which is the point.
function recipeCaption(recipe, productName, offer) {
  const lines = [];
  lines.push(recipe.name + (productName ? ' — made with ' + productName : ''));
  if (recipe.blurb) { lines.push(''); lines.push(recipe.blurb); }

  if (offer && offer.sale_price != null) {
    const bits = [(offer.name || productName || 'It') + ' is on feature at ' + money(offer.sale_price)];
    if (offer.savings != null && Number(offer.savings) > 0) {
      bits.push('save ' + money(offer.savings));
    } else if (offer.reg_price != null && Number(offer.reg_price) > Number(offer.sale_price)) {
      bits.push('down from ' + money(offer.reg_price));
    }
    lines.push('');
    lines.push(bits.join(', ') + '.');
  }

  const ing = (recipe.ingredients || []).filter(i => i && (i.item || i.amount));
  if (ing.length) {
    lines.push('');
    lines.push('You will need:');
    ing.forEach(i => lines.push('- ' + [i.amount, i.item].filter(Boolean).join(' ')));
  }
  const method = (recipe.method || []).filter(Boolean);
  if (method.length) {
    lines.push('');
    method.forEach((m, i) => lines.push((i+1) + '. ' + m));
  }
  const glassLine = glassPhrase(recipe.glass);
  if (glassLine) lines.push('', glassLine);
  if (recipe.garnish) lines.push('Garnish with ' + recipe.garnish + '.');
  return stripHashtags(lines.join('\n'));
}

function useRecipes() {
  const [recipes, setRecipes] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('recipes').select('*').order('created_at', { ascending:false });
    setRecipes(data || []); setLoading(false);
  }, []);
  useEffect(function(){ load(); }, [load]);

  const save = async function(row) {
    const sb = getSB();
    const { data:{ user } } = await sb.auth.getUser();
    if (row.id) {
      const { id, created_at, created_by, updated_at, ...patch } = row;
      const { error } = await sb.from('recipes').update(patch).eq('id', id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('recipes').insert({ ...row, created_by:user?.id });
      if (error) throw error;
    }
    await load();
  };

  const remove = async function(id) {
    const sb = getSB();
    const { error } = await sb.from('recipes').delete().eq('id', id);
    if (error) throw error;
    await load();
  };

  return { recipes, loading, reload:load, save, remove };
}

// A store's own look if it has set one, otherwise the chain default.
function useRecipeStyle(storeId) {
  const [rows, setRows] = useState([]);
  const load = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { data } = await sb.from('recipe_styles').select('*');
    setRows(data || []);
  }, []);
  useEffect(function(){ load(); }, [load]);

  const mine    = rows.find(r => r.store_id === storeId);
  const chain   = rows.find(r => r.store_id == null);
  const tokens  = withStyleDefaults((mine || chain || {}).tokens);
  const isOwn   = !!mine;

  const saveTokens = async function(next, scope) {
    const sb = getSB();
    const { data:{ user } } = await sb.auth.getUser();
    const target = scope === 'store' ? storeId : null;
    const existing = rows.find(r => (r.store_id ?? null) === (target ?? null));
    if (existing) {
      const { error } = await sb.from('recipe_styles')
        .update({ tokens: next, updated_by: user?.id }).eq('id', existing.id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('recipe_styles')
        .insert({ store_id: target, tokens: next, updated_by: user?.id });
      if (error) throw error;
    }
    await load();
  };

  const clearStore = async function() {
    if (!mine) return;
    const sb = getSB();
    await sb.from('recipe_styles').delete().eq('id', mine.id);
    await load();
  };

  return { tokens, isOwn, saveTokens, clearStore, reload:load };
}

// The card style editor. Deliberately a short list: these are the knobs that
// change the look without letting anyone build something that stops looking
// like the chain.
function RecipeStyleEditor({ tokens, isOwn, onSave, onClear, isAdmin, storeName, busy, hasStamp }) {
  const [t, setT] = useState(tokens);
  useEffect(function(){ setT(tokens); }, [tokens]);
  const set = function(k, v) {
    setT(function(prev) {
      const next = Object.assign({}, prev, { [k]: v });
      // Each face ships different weights. Carrying 300 over to Anton would
      // silently render as its only weight and the control would lie.
      if (k === 'name_font') {
        const ws = (AD_FONTS.find(f=>f.id===v) || { weights:[400] }).weights;
        if (ws.indexOf(next.name_weight) === -1) {
          next.name_weight = ws.indexOf(400) !== -1 ? 400 : ws[0];
        }
      }
      return next;
    });
  };

  const colorRow = (key, label) => (
    <div className="flex items-center gap-2 mb-2">
      <input type="color" value={t[key]} onChange={e=>set(key, e.target.value)}
             style={{width:'34px', height:'26px', background:'none', border:'1px solid var(--line)'}}/>
      <span className="lbl flex-1">{label}</span>
      <span className="mono text-xs" style={{color:'var(--txt3)'}}>{t[key]}</span>
    </div>
  );

  return (
    <div>
      <Label>Name band</Label>
      <div className="flex mb-3" style={{border:'1px solid var(--line)', width:'fit-content'}}>
        {[['top','Top'],['bottom','Bottom'],['none','No band']].map(function(o) {
          const on = t.band_pos===o[0];
          return (
            <button key={o[0]} onClick={()=>set('band_pos', o[0])}
              className="px-3 py-1.5 text-xs uppercase tracking-[.14em]"
              style={{ background:on?'var(--cy-glow)':'transparent', color:on?'var(--cy)':'var(--txt2)' }}>
              {o[1]}
            </button>
          );
        })}
      </div>

      {t.band_pos !== 'none' && colorRow('band_color','Band colour')}
      {colorRow('text','Drink name')}

      {t.band_pos !== 'none' && (
        <div className="mb-3">
          <Label>Band depth</Label>
          <div className="flex items-center gap-3">
            <input type="range" min="8" max="34" step="1" value={t.band_height}
                   onChange={e=>set('band_height', Number(e.target.value))} className="flex-1"/>
            <span className="mono text-xs" style={{color:'var(--txt3)'}}>{t.band_height}%</span>
          </div>
        </div>
      )}

      {t.band_pos === 'none' && (
        <div className="mb-3">
          <Label>Shading behind the name</Label>
          <div className="flex items-center gap-3">
            <input type="range" min="0" max="90" step="5" value={Math.round(t.scrim*100)}
                   onChange={e=>set('scrim', Number(e.target.value)/100)} className="flex-1"/>
            <span className="mono text-xs" style={{color:'var(--txt3)'}}>{Math.round(t.scrim*100)}%</span>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-2 mb-3">
        <div>
          <Label>Font</Label>
