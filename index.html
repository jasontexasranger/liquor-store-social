const RECIPE_BLANK = {
  name:'', blurb:'', glass:'', garnish:'',
  ingredients:[{amount:'',item:''}], method:[''],
  store_id:null, product_id:null, feature_id:null,
};

// Which products deserve a cocktail. Spirits always; wine sometimes (spritz
// and sangria territory — offered, never presumed); beer, cider, RTDs and
// mixers never — nobody shakes a cocktail out of a White Claw.
const RECIPE_SPIRIT_CATS = ['whisky','vodka','gin','rum','tequila','brandy','liqueurs'];
const RECIPE_WINE_CATS   = ['red-wine','white-wine','rose-sparkling'];
const recipeEligibility = cat =>
  RECIPE_SPIRIT_CATS.includes(cat) ? 'spirit'
  : RECIPE_WINE_CATS.includes(cat) ? 'wine'
  : null;

// The one recipe prompt, shared by the single-recipe editor and the monthly
// batch — same rules everywhere: ounces, full glass names, product first,
// Canadian spelling, no hashtags.
function cocktailRecipePrompt(base, label, kind) {
  return (
    'Invent one easy ' + (kind === 'wine' ? 'wine cocktail (spritz, sangria or similar)' : 'cocktail')
    + ' built around ' + base + ', for a liquor store in British Columbia.\n' +
    'It must be genuinely simple: at most 5 ingredients, no infusions, no syrups that need making, ' +
    'no equipment beyond a shaker or a spoon.\n\n' +
    'Reply with JSON only, no code fence, in exactly this shape:\n' +
    '{"name":"","blurb":"","glass":"","garnish":"",' +
    '"ingredients":[{"amount":"","item":""}],"method":[""]}\n\n' +
    'Measures in fluid ounces, written like "1.5 oz" — never millilitres, never centilitres. ' +
    'Countable things stay counts ("2 dashes", "1 lime wedge").\n' +
    'The first ingredient must be exactly "' + label + '" — name the product itself, ' +
    'not a generic spirit, and give it a measure. Every other ingredient should be ' +
    'something an ordinary kitchen already has.\n' +
    'Canadian English spelling throughout (colour, flavour, favourite, litre, centre).\n' +
    'glass: name the vessel in full, like "highball glass" or "copper mug", not just "highball". ' +
    'name: the drink name, 1 to 3 words. ' +
    'blurb: one sentence on what it tastes like. method: 2 to 4 short steps, ' +
    'referring to the product by name in the first step. ' +
    'No hashtags, no emoji, no brand claims beyond the product name.'
  );
}

// The model is told to lead with the product; when it drifts, the product is
// put back at the top with a sane pour.
function recipeProductFirst(list, label) {
  const rows = (list || []).filter(i => i && (i.item || i.amount));
  const idx = rows.findIndex(i => (i.item || '').toUpperCase().includes(label.toUpperCase().slice(0, 12)));
  if (idx > 0) { const [hit] = rows.splice(idx, 1); rows.unshift(hit); }
  if (idx === -1) rows.unshift({ amount:'1.5 oz', item: label });
  return rows.length ? rows : [{ amount:'1.5 oz', item: label }];
}

// ─────────────────────────────────────────────
// BCL PRICE CHECK
// ─────────────────────────────────────────────
// The LDB's published list, held locally: instant search across ~8,000
// products with no traffic on anyone's site. The list runs a few months
// behind, so every price is labelled with the list it came from, and a live
// check fetches today's number for the product in front of you.

function bclUnitLabel(row) {
  const parts = [];
  if (row.containers && row.containers > 1) parts.push(row.containers + ' ×');
  if (row.litres) parts.push((row.litres < 1 ? Math.round(row.litres*1000) + ' ml' : row.litres + ' L'));
  return parts.join(' ');
}

// Quote-aware CSV split for the POS item-master export. Headers arrive with
// stray leading spaces (" Dept.") — matching trims both sides.
function parsePosCsv(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(c => c.trim() !== '')) rows.push(row);
      row = [];
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); if (row.some(c => c.trim() !== '')) rows.push(row); }
  return rows;
}

// Import the POS item master for one store: replace that store's rows with
// what the file says. Item IDs are BCL SKUs, which is what makes everything
// downstream (price joins, stock warnings) work.
function StoreInventoryImport({ invMeta, onDone }) {
  const toast = useToast();
  const [target, setTarget] = useState(null);
  const [busy,   setBusy]   = useState(false);
  const [building, setBuilding] = useState(null);   // progress text while the library builds
  const buildStop = useRef(false);

  // Walk the store's inventory and create Product Library entries with BCL
  // photos — only for exact SKU matches whose image exists. Batched calls;
  // safe to stop and re-run, it never duplicates.
  const buildLibrary = async function() {
    if (!target) { toast.error('Pick a store first'); return; }
    buildStop.current = false;
    let cursor = '', created = 0, linked = 0, skipped = 0, guard = 0;
    setBuilding('Starting…');
    try {
      while (!buildStop.current && guard++ < 300) {
        const r = await callEdge('bcliquor', 'buildLibrary', { storeId: target, batch: 15, cursor });
        created += r.created; linked += r.linked;
        skipped += r.skippedNoBcl + r.skippedNoImage;
        cursor = r.cursor;
        setBuilding(created + ' added · ' + linked + ' linked · ' + skipped + ' skipped · '
          + r.remaining + ' to go');
        if (!r.remaining) break;
      }
      toast.success('Library build done: ' + created + ' products added with photos, '
        + linked + ' existing linked, ' + skipped + ' skipped (no BCL match or no photo)');
      setBuilding(null);
    } catch(e) {
      toast.error(e.message);
      setBuilding(null);
    }
  };

  const importFile = async function(file) {
    if (!target) { toast.error('Pick which store this export is from first'); return; }
    setBusy(true);
    try {
      const rows = parsePosCsv(await file.text());
      if (rows.length < 2) throw new Error('That file looks empty');
      const head = rows[0].map(h => h.trim().toLowerCase());
      const col = name => head.indexOf(name);
      const iId = col('item id'), iDesc = col('description'), iUnit = col('unit'),
            iDept = col('dept.'), iVend = col('vendor'), iCase = col('case-qty'),
            iAvl = col('avl');
      if (iId < 0 || iDesc < 0) {
        throw new Error('Could not find the "Item ID" and "Description" columns — is this the POS item export?');
      }
      const seen = new Set();
      const records = [];
      for (const r of rows.slice(1)) {
        const sku = String(r[iId] || '').trim();
        if (!/^\d+$/.test(sku) || seen.has(sku)) continue;
        if (iAvl >= 0 && String(r[iAvl] || '').trim().toUpperCase() === 'N') continue;
        seen.add(sku);
        records.push({
          store_id: target, sku,
          description: String(r[iDesc] || '').trim() || null,
          unit:  iUnit >= 0 ? String(r[iUnit] || '').trim() || null : null,
          dept:  iDept >= 0 ? String(r[iDept] || '').trim() || null : null,
          vendor: iVend >= 0 ? String(r[iVend] || '').trim() || null : null,
          case_qty: iCase >= 0 && String(r[iCase] || '').trim() ? Number(String(r[iCase]).trim()) || null : null,
          imported_at: new Date().toISOString(),
        });
      }
      if (!records.length) throw new Error('No product rows found in that file');

      const sb = getSB();
      // Replace, not merge — the file is the whole truth for this store.
      const { error: delErr } = await sb.from('store_inventory').delete().eq('store_id', target);
      if (delErr) throw new Error(delErr.message);
      for (let i = 0; i < records.length; i += 500) {
        const { error: insErr } = await sb.from('store_inventory').insert(records.slice(i, i + 500));
        if (insErr) throw new Error(insErr.message + ' (at row ' + i + ')');
      }
      toast.success(records.length + ' products imported for ' +
        ((STORES.find(s=>s.id===target)||{}).name || target));
      onDone && onDone();
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  return (
    <Card>
      <div className="flex items-center gap-3 mb-1">
        <span className="ttl">Store inventory</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
      </div>
      <p className="lbl mb-4">
        Import each store's POS item export (CSV). Item IDs are BCL SKUs, so the
        list powers the "carried at this store" filter above and stock warnings
        on monthly features.
      </p>
      <div className="flex items-end gap-4 flex-wrap">
        <StorePicker compact value={target || ''} onChange={setTarget}/>
        <label className="inline-block">
          <span className={'inline-flex items-center gap-2 px-3 py-2 text-xs cursor-pointer'}
                style={{border:'1px solid var(--cy)', color:'var(--cy)',
                        opacity: busy || !target ? 0.5 : 1}}>
            <Icon name="up" size={12}/>{busy ? 'Importing…' : 'Import CSV'}
          </span>
          <input type="file" accept=".csv,text/csv" className="hidden" disabled={busy || !target}
                 onChange={e=>{ const f = e.target.files[0]; e.target.value=''; if (f) importFile(f); }}/>
        </label>
        {building === null ? (
          <Button size="sm" variant="outline" disabled={busy || !target || !(invMeta||{})[target]}
                  onClick={buildLibrary}
                  title="Create Product Library entries for this store's inventory, with BCL photos linked only on exact SKU matches">
            <Icon name="image"/> Build product library
          </Button>
        ) : (
          <span className="flex items-center gap-2">
            <span className="lbl">{building}</span>
            <Button size="sm" variant="ghost" onClick={()=>{ buildStop.current = true; }}>Stop</Button>
          </span>
        )}
      </div>
      <div className="mt-3">
        {STORES.map(function(st) {
          const m = (invMeta || {})[st.id];
          return (
            <p key={st.id} className="lbl">
              {st.name.split(' ')[0]}: {m && m.count
                ? m.count + ' products · imported ' + new Date(m.at).toLocaleDateString(undefined,{day:'numeric',month:'short'})
                : 'nothing imported yet'}
            </p>
          );
        })}
      </div>
    </Card>
  );
}

function PriceCheckPage({ isAdmin }) {
  const toast = useToast();
  const [q,       setQ]       = useState('');
  const [cat,     setCat]     = useState('all');
  const [sub,     setSub]     = useState('all');
  const [sort,    setSort]    = useState({ col:'name', dir:'asc' });
  const [inv,     setInv]     = useState('all');   // 'all' = whole BCL list; store id = carried there
  const [invMeta, setInvMeta] = useState({});      // store_id -> {count, at}
  const [pageN,   setPageN]   = useState(0);
  const [rows,    setRows]    = useState([]);
  const [total,   setTotal]   = useState(0);
  const [count,   setCount]   = useState(null);
  const [label,   setLabel]   = useState('');
  const [updated, setUpdated] = useState(null);
  const [cats,    setCats]    = useState([]);
  const [subs,    setSubs]    = useState([]);
  const [busy,    setBusy]    = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [live,    setLive]    = useState({});
  const PER = 50;

  // How fresh the list is, and the category tree for the filters. The list
  // label says which published list this is; updated_at says when it was
  // actually pulled — both matter, and they answer different questions.
  const loadMeta = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const { count: n } = await sb.from('bcl_products').select('sku', { count:'exact', head:true });
    setCount(n ?? 0);
    if (!n) return;
    const { data: meta } = await sb.from('bcl_products')
      .select('list_label, updated_at').order('updated_at', { ascending:false }).limit(1);
    if (meta && meta[0]) {
      setLabel(meta[0].list_label || '');
      setUpdated(meta[0].updated_at || null);
    }
    const { data: c } = await sb.from('bcl_products').select('category, subcategory').limit(10000);
    const catSet = {}, subSet = {};
    (c || []).forEach(function(r) {
      if (r.category) {
        catSet[r.category] = true;
        (subSet[r.category] = subSet[r.category] || {})[r.subcategory || ''] = true;
      }
    });
    setCats(Object.keys(catSet).sort());
    setSubs(subSet);
  }, []);
  useEffect(function(){ loadMeta(); }, [loadMeta]);

  // Which stores have an inventory loaded, how big, how fresh.
  const loadInvMeta = useCallback(async function() {
    const sb = getSB(); if (!sb) return;
    const next = {};
    for (const st of STORES) {
      const { count: n } = await sb.from('store_inventory')
        .select('sku', { count:'exact', head:true }).eq('store_id', st.id);
      if (n) {
        const { data: m } = await sb.from('store_inventory')
          .select('imported_at').eq('store_id', st.id)
          .order('imported_at', { ascending:false }).limit(1);
        next[st.id] = { count: n, at: (m && m[0] && m[0].imported_at) || null };
      }
    }
    setInvMeta(next);
  }, []);
  useEffect(function(){ loadInvMeta(); }, [loadInvMeta]);

  // One query serves both browsing and searching: filters, sort and paging are
  // all pushed to the database, so flicking through 8,000 rows stays instant.
  useEffect(function() {
    const sb = getSB(); if (!sb || count === null || count === 0) return;
    let alive = true;
    const t = setTimeout(async function() {
      setBusy(true);
      const term = q.trim();

      // Store mode pages through that store's inventory and joins each page
      // onto BCL by SKU — .in() with fifty SKUs is fine, with three thousand
      // it is not, which is why the join happens per page.
      if (inv !== 'all') {
        let iq = sb.from('store_inventory').select('*', { count:'exact' }).eq('store_id', inv);
        if (term.length >= 2) {
          const digits = term.replace(/[^0-9]/g, '');
          iq = (digits.length >= 4 && digits.length === term.length)
            ? iq.eq('sku', digits)
            : iq.ilike('description', '%' + term.replace(/[%,()]/g, '') + '%');
        }
        iq = iq.order('description', { ascending:true })
               .range(pageN * PER, pageN * PER + PER - 1);
        const { data: invRows, count: n } = await iq;
        const skus = (invRows || []).map(r => r.sku);
        const { data: bcls } = skus.length
          ? await sb.from('bcl_products').select('*').in('sku', skus)
          : { data: [] };
        const bmap = {};
        (bcls || []).forEach(b => { bmap[b.sku] = b; });
        const joined = (invRows || []).map(ir => bmap[ir.sku]
          ? Object.assign({}, bmap[ir.sku], { _inv: ir })
          : { sku: ir.sku, name: ir.description, price: null, _inv: ir, _noBcl: true });
        if (alive) { setRows(joined); setTotal(n ?? 0); setBusy(false); }
        return;
      }

      let qy = sb.from('bcl_products').select('*', { count:'exact' });
      if (term.length >= 2) {
        const digits = term.replace(/[^0-9]/g, '');
        qy = (digits.length >= 4 && digits.length === term.length)
          ? qy.eq('sku', digits)
          : qy.ilike('name', '%' + term.replace(/[%,()]/g, '') + '%');
      }
      if (cat !== 'all') qy = qy.eq('category', cat);
      if (sub !== 'all') qy = qy.eq('subcategory', sub);
      qy = qy.order(sort.col, { ascending: sort.dir === 'asc', nullsFirst: false })
             .range(pageN * PER, pageN * PER + PER - 1);
      const { data, count: n } = await qy;
      if (alive) { setRows(data || []); setTotal(n ?? 0); setBusy(false); }
    }, q.trim() ? 250 : 0);
    return function(){ alive = false; clearTimeout(t); };
  }, [q, cat, sub, sort, pageN, count, inv]);

  // Any filter change starts back at page one.
  useEffect(function(){ setPageN(0); }, [q, cat, sub, sort, inv]);

  const flip = col => setSort(prev => ({
    col,
    // Prices sort high-first on first click — "what's expensive" is the
    // question people bring to a price column.
    dir: prev.col === col ? (prev.dir === 'asc' ? 'desc' : 'asc') : (col === 'price' ? 'desc' : 'asc'),
  }));

  const checkLive = async function(sku) {
    setLive(prev => Object.assign({}, prev, { [sku]: { loading:true } }));
    try {
      const r = await callEdge('bcliquor', 'search', { query: sku });
      const hit = (r.products || []).find(p => p.sku === sku);
      if (!hit) throw new Error('Not in the live catalogue — may be delisted');
      setLive(prev => Object.assign({}, prev, { [sku]: {
        price: hit.current_price, regular: hit.regular_price,
        at: new Date().toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }),
      }}));
    } catch(e) {
      setLive(prev => Object.assign({}, prev, { [sku]: { error: e.message } }));
    }
  };

  const sync = async function() {
    setSyncing(true);
    try {
      const r = await callEdge('bcliquor', 'syncPrices', {});
      toast.success(r.imported + ' products imported from the ' + r.list + ' list');
      await loadMeta();
    } catch(e) { toast.error(e.message); }
    finally { setSyncing(false); }
  };

  const Th = function({ col, children, right }) {
    const on = sort.col === col;
    return (
      <th className="lbl" style={{textAlign: right ? 'right' : 'left', padding:'0 8px 8px'}}>
        <button onClick={()=>flip(col)} className="lbl hover:underline"
                style={{color: on ? 'var(--cy)' : undefined}}>
          {children}{on ? (sort.dir === 'asc' ? ' ↑' : ' ↓') : ''}
        </button>
      </th>
    );
  };

  const pages = Math.max(1, Math.ceil(total / PER));

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex items-center gap-3 mb-1 flex-wrap">
          <span className="ttl">BCL Price Check</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {isAdmin && (
            <Button size="sm" variant="outline" onClick={sync} loading={syncing}>
              <Icon name="refresh"/> Update list
            </Button>
          )}
        </div>
        <p className="lbl mb-4">
          {label ? label + ' price list · ' + count + ' products' : 'BC Liquor Stores\' published prices'}
          {updated ? ' · imported ' + new Date(updated).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : ''}
          {' · use the live check when today\'s price matters'}
        </p>

        {count === 0 && (
          <div className="text-center py-10">
            <Icon name="search" size={34} style={{color:'var(--cy-dim)'}}/>
            <p className="lbl mt-3">No price list loaded yet</p>
            {isAdmin
              ? <Button size="sm" className="mt-3" onClick={sync} loading={syncing}>Import the current list</Button>
              : <p className="text-xs mt-2" style={{color:'var(--txt2)'}}>Ask an admin to import it under this screen.</p>}
          </div>
        )}

        {count > 0 && (
          <React.Fragment>
            {Object.keys(invMeta).length > 0 && (
              <div className="mb-4">
                <StorePicker compact value={inv} onChange={setInv} allLabel="Full BCL list"
                             stores={STORES.filter(s => invMeta[s.id])}/>
              </div>
            )}
            <div className="flex gap-2 flex-wrap items-center mb-4">
              <Input value={q} onChange={e=>setQ(e.target.value)} className="max-w-xs text-sm"
                     placeholder="Search name or SKU…"/>
              {inv === 'all' && (
                <React.Fragment>
                  <Select value={cat} className="w-auto text-xs"
                          onChange={e=>{ setCat(e.target.value); setSub('all'); }}>
                    <option value="all">All categories</option>
                    {cats.map(c=><option key={c} value={c}>{c}</option>)}
                  </Select>
                  {cat !== 'all' && subs[cat] && Object.keys(subs[cat]).filter(Boolean).length > 1 && (
                    <Select value={sub} className="w-auto text-xs" onChange={e=>setSub(e.target.value)}>
                      <option value="all">All {cat.toLowerCase()}</option>
                      {Object.keys(subs[cat]).filter(Boolean).sort().map(x=>
                        <option key={x} value={x}>{x}</option>)}
                    </Select>
                  )}
                </React.Fragment>
              )}
              {inv !== 'all' && (
                <span className="lbl">
                  carried at {(STORES.find(s=>s.id===inv)||{}).name || inv} · sorted by name
                </span>
              )}
              <span className="mono text-xs ml-auto self-center" style={{color:'var(--txt3)'}}>
                {busy ? '…' : total + ' product' + (total===1?'':'s')}
              </span>
            </div>

            <div className="overflow-x-auto">
              <table style={{width:'100%', minWidth:'720px', borderCollapse:'collapse'}}>
                <thead>
                  <tr style={{borderBottom:'1px solid var(--line2)'}}>
                    <Th col="name">Product</Th>
                    <Th col="litres">Size</Th>
                    <Th col="subcategory">Category</Th>
                    <Th col="alcohol_pct">Alc %</Th>
                    <Th col="price">BCL price</Th>
                    <th className="lbl" style={{textAlign:'left', padding:'0 8px 8px'}}>Live</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map(function(r) {
                    const lv = live[r.sku];
                    return (
                      <tr key={r.sku} style={{borderBottom:'1px solid rgba(212,175,55,.07)'}}>
                        <td style={{padding:'7px 8px'}}>
                          {/* Straight to that SKU's page on their site — new
                              tab, so the search and filters aren't lost. */}
                          <a href={'https://www.bcliquorstores.com/product/' + encodeURIComponent(r.sku)}
                             target="_blank" rel="noopener noreferrer"
                             className="text-xs hover:underline inline-flex items-center gap-1"
                             style={{color:'var(--txt)'}}>
                            {r.name}
                            <Icon name="up" size={10} style={{color:'var(--cy-dim)', transform:'rotate(45deg)'}}/>
                          </a>
                          <p className="lbl">SKU {r.sku}{r.country ? ' · ' + r.country : ''}</p>
                        </td>
                        <td className="text-xs" style={{padding:'7px 8px', color:'var(--txt2)', whiteSpace:'nowrap'}}>
                          {r._noBcl ? ((r._inv && r._inv.unit) || '') : bclUnitLabel(r)}
                        </td>
                        <td className="text-xs" style={{padding:'7px 8px', color:'var(--txt2)'}}>
                          {r._noBcl
                            ? <span className="lbl" title="Direct-vendor product — not on the BCL price list">
                                {(r._inv && r._inv.vendor) || 'not on BCL list'}
                              </span>
                            : (r.subcategory || r.category || '')}
                        </td>
                        <td className="mono text-xs" style={{padding:'7px 8px', color:'var(--txt2)'}}>
                          {r.alcohol_pct != null ? r.alcohol_pct + '%' : ''}
                        </td>
                        <td className="mono text-sm" style={{padding:'7px 8px', color:'var(--cy)', whiteSpace:'nowrap'}}>
                          {r.price != null ? money(r.price) : '—'}
                        </td>
                        <td style={{padding:'7px 8px', whiteSpace:'nowrap'}}>
                          {lv && lv.loading ? <span className="lbl">…</span>
                           : lv && lv.error ? <span className="text-xs" title={lv.error} style={{color:'var(--amb)'}}>{lv.error.length > 24 ? 'Unavailable' : lv.error}</span>
                           : lv ? (
                             <span className="mono text-sm" style={{color: lv.price !== lv.regular ? 'var(--grn)' : 'var(--txt)'}}>
                               {money(lv.price)}
                               {lv.regular != null && lv.regular !== lv.price &&
                                 <span className="lbl"> reg {money(lv.regular)}</span>}
                               <span className="lbl block">as of {lv.at}</span>
                             </span>
                           ) : r._noBcl ? (
                             <span className="lbl">—</span>
                           ) : (
                             <Button size="sm" variant="ghost" onClick={()=>checkLive(r.sku)}>Check</Button>
                           )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {pages > 1 && (
              <div className="flex items-center gap-2 mt-4 justify-end">
                <Button size="sm" variant="ghost" onClick={()=>setPageN(p=>Math.max(0,p-1))}
                        disabled={pageN===0}><Icon name="back" size={12}/></Button>
                <span className="mono text-xs" style={{color:'var(--txt2)'}}>
                  {pageN+1} / {pages}
                </span>
                <Button size="sm" variant="ghost" onClick={()=>setPageN(p=>Math.min(pages-1,p+1))}
                        disabled={pageN>=pages-1}><Icon name="fwd" size={12}/></Button>
              </div>
            )}
          </React.Fragment>
        )}
      </Card>

      {isAdmin && <StoreInventoryImport invMeta={invMeta} onDone={loadInvMeta}/>}
    </div>
  );
}

function RecipesPage({ isAdmin, myStores, onCompose }) {
  const toast = useToast();
  const [storeId, setStoreId] = useState((myStores[0]||{}).id || '');
  const { recipes, loading, save, remove, reload } = useRecipes();
  const { tokens, isOwn, saveTokens, clearStore } = useRecipeStyle(storeId);
  const { images: products } = useBrandImageLibrary();
  const { addRendered } = useCreatives();

  const [draft,    setDraft]    = useState(null);   // the recipe being edited
  const editorRef = useRef(null);
  const [preview,  setPreview]  = useState(null);   // rendered card data URL
  // The generated photo, kept apart from the card. Restyling redraws the name
  // over the same photo instead of paying for a new drink.
  const [photo,    setPhoto]    = useState(null);
  const [photoHint,setPhotoHint]= useState('');
  // The feature this drink was built around, if any. Held live rather than
  // copied into the recipe: prices change month to month, and the caption
  // should quote what the feature says now, not what it said when saved.
  const [offer,    setOffer]    = useState(null);
  const [stamp,    setStamp]    = useState(null);
  const [busy,     setBusy]     = useState(null);
  const [showStyle,setShowStyle]= useState(false);
  const [showPick, setShowPick] = useState(false);
  const [showFeat, setShowFeat] = useState(false);
  const [postAt,   setPostAt]   = useState('');
  const [capText,  setCapText]  = useState(null);   // null = auto caption from the recipe

  const storeName = (myStores.find(s=>s.id===storeId)||{}).name || '';

  // The editor renders below the recipe grid, not as an overlay — without
  // this, opening or starting a recipe on a full grid can land the new panel
  // entirely off-screen, and it looks like the click did nothing.
  useEffect(function() {
    if (draft && editorRef.current) {
      editorRef.current.scrollIntoView({ behavior:'smooth', block:'start' });
    }
  }, [draft && draft.id, !!draft]);

  useEffect(function() {
    const sb = getSB(); if (!sb || !storeId) { setStamp(null); return; }
    let alive = true;
    sb.from('brand_profiles').select('stamp_data').eq('store_id', storeId).maybeSingle()
      .then(({data}) => { if (alive) setStamp((data && data.stamp_data) || null); });
    return function(){ alive = false; };
  }, [storeId]);

  const productOf = r => products.find(p => p.id === (r && r.product_id)) || null;

  // Does this ingredient row refer to that product? Asked for "BACARDI WHITE",
  // a model often writes "Bacardi Superior white rum" — the same bottle. The
  // brand is nearly always the first word, and that's what's matched on.
  // Apostrophes are dropped rather than turned into spaces, so RYAN'S and
  // RYANS are the same bottle.
  function normLabel(t) {
    return String(t||'').toLowerCase()
      .replace(/['’]/g, '')
      .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }
  function isProductRow(item, label) {
    const a = normLabel(item), b = normLabel(label);
    if (!a || !b) return false;
    if (a === b) return true;
    const brand = b.split(' ')[0];
    return brand.length > 2 && a.indexOf(brand) !== -1;
  }

  // Switching the product on a recipe that was already written for a different
  // one. The rest of the ingredients belong to the old drink — mango juice and
  // lime are a rum recipe, not a whisky one — so the sane thing is to start
  // over rather than leave a mongrel list behind.
  function switchProduct(prev, label) {
    const filled  = (prev.ingredients || []).filter(i => (i.item||'').trim());
    const written = filled.length > 1 || (prev.method || []).filter(Boolean).length > 0;

    // No recipe yet, so whatever single ingredient is sitting there can only be
    // a product picked a moment ago and changed its mind about. Replace it.
    if (!written) {
      return Object.assign({}, prev, { ingredients: [{ amount:'2 oz', item: label }] });
    }

    // Already written around this same bottle — leave the work alone.
    if (filled.some(i => isProductRow(i.item, label))) {
      return Object.assign({}, prev, {
        ingredients: withProductIngredient(prev.ingredients, label),
      });
    }

    // Written around something else. Mango juice and lime belong to the rum
    // drink, not to a whisky, so the honest thing is to start over.
    return Object.assign({}, prev, {
      name: '', blurb: '', glass: '', garnish: '',
      ingredients: [{ amount:'2 oz', item: label }],
      method: [''],
    });
  }

  // The bottle you're trying to sell belongs in the ingredient list by name.
  // Written into the first empty row if there is one, otherwise added at the
  // top — never overwriting something already typed.
  function withProductIngredient(list, label) {
    if (!label) return list;
    const rows = (list || []).slice();
    if (rows.some(i => isProductRow(i.item, label))) return rows;
    const blank = rows.findIndex(i => !(i.item||'').trim() && !(i.amount||'').trim());
    if (blank >= 0) { rows[blank] = { amount:'2 oz', item:label }; return rows; }
    return [{ amount:'2 oz', item:label }].concat(rows);
  }

  // Redraw whenever the name or the look changes. Free — canvas only, no
  // network, and never a new photo.
  useEffect(function() {
    if (!draft) { setPreview(null); return; }
    let cancelled = false;
    (async function() {
      try {
        const url = await renderRecipeCard(tokens, draft, photo, stamp);
        if (!cancelled) setPreview(url);
      } catch(e) { if (!cancelled) setPreview(null); }
    })();
    return function(){ cancelled = true; };
  }, [draft && draft.name, tokens, photo, stamp]);

  const startNew = function(product, feature) {
    setPhoto(null); setPhotoHint(''); setOffer(feature || null);
    setDraft(Object.assign({}, RECIPE_BLANK, {
      store_id: null,
      product_id: product ? product.id : null,
      feature_id: feature ? feature.id : null,
      name: '',
    }));
  };

  const writeRecipe = async function() {
    const prod = productOf(draft);
    // The feature's name is the one the price is quoted against; fall back to
    // the linked product, then to whatever's been typed.
    const label = (offer && offer.name) || (prod && prod.product_name) || draft.name || '';
    const base  = label + (prod && prod.size ? ' (' + prod.size + ')' : '');
    if (!label) { toast.error('Pick a product first, or type a name'); return; }
    setBusy('write');
    try {
      const prompt =
        'Invent one easy cocktail built around ' + base + ', for a liquor store in British Columbia.\n' +
        'It must be genuinely simple: at most 5 ingredients, no infusions, no syrups that need making, ' +
        'no equipment beyond a shaker or a spoon.\n\n' +
        'Reply with JSON only, no code fence, in exactly this shape:\n' +
        '{"name":"","blurb":"","glass":"","garnish":"",' +
        '"ingredients":[{"amount":"","item":""}],"method":[""]}\n\n' +
        'Measures in fluid ounces, written like "1.5 oz" — never millilitres, never centilitres. ' +
        'Countable things stay counts ("2 dashes", "1 lime wedge").\n' +
        'The first ingredient must be exactly "' + label + '" — name the product itself, ' +
        'not a generic spirit, and give it a measure. Every other ingredient should be ' +
        'something an ordinary kitchen already has.\n' +
        'Canadian English spelling throughout (colour, flavour, favourite, litre, centre).\n' +
        'glass: name the vessel in full, like "highball glass" or "copper mug", not just "highball". ' +
        'name: the drink name, 1 to 3 words. ' +
        'blurb: one sentence on what it tastes like. method: 2 to 4 short steps, ' +
        'referring to the product by name in the first step. ' +
        'No hashtags, no emoji, no brand claims beyond the product name.';
      const r = await callEdge('meta-social', 'aiWrite', { prompt, maxTokens: 700 });
      const raw = (r.text || '').replace(/^```(?:json)?/i, '').replace(/```$/,'').trim();
      let parsed;
      try { parsed = JSON.parse(raw); }
      catch(e) { throw new Error('The model did not return usable JSON — press it again'); }

      setDraft(prev => Object.assign({}, prev, {
        name:     parsed.name || prev.name,
        blurb:    parsed.blurb || '',
        glass:    parsed.glass || '',
        garnish:  parsed.garnish || '',
        // Told to lead with the product, the model usually does — but not
        // always, and a recipe post that never names the bottle is pointless.
        ingredients: Array.isArray(parsed.ingredients) && parsed.ingredients.length
                     ? withProductIngredient(
                         parsed.ingredients.map(i=>({ amount:toOunces(i.amount||''), item:i.item||'' })),
                         label)
                     : withProductIngredient(prev.ingredients, label),
        method:   Array.isArray(parsed.method) && parsed.method.length ? parsed.method : prev.method,
      }));
      toast.success('Recipe drafted — check it before you save');
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  // Anything the image API hands back has to end up on our own Storage before
  // it touches a canvas: a cross-origin image taints the canvas and the export
  // then throws. Our bucket sends the CORS headers that make it exportable.
  const persistPhoto = async function(url) {
    if (!url) throw new Error('No image came back');
    if (url.startsWith('data:')) return uploadImageToStorage(url);
    const r = await callEdge('bcliquor', 'importUrl', { url });
    return r.image_url;
  };

  const generatePhoto = async function() {
    if (!draft || !draft.name.trim()) { toast.error('Draft the recipe first'); return; }
    setBusy('photo');
    try {
      // 2:3 is the tallest the model offers; the card crops it to 4:5.
      const img = await openAIGenerateImage(cocktailPhotoPrompt(draft, photoHint), '1024x1536', null);
      const hosted = await persistPhoto(img.url);
      setPhoto(hosted);
      toast.success('Photo made — press it again for a different take');
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  const saveRecipe = async function() {
    if (!draft.name.trim()) { toast.error('Give the drink a name'); return; }
    setBusy('save');
    try {
      await save({
        id: draft.id,
        name: draft.name.trim(),
        store_id: draft.store_id || null,
        product_id: draft.product_id || null,
        feature_id: draft.feature_id || null,
        glass: draft.glass || null,
        garnish: draft.garnish || null,
        notes: draft.blurb || null,
        ingredients: (draft.ingredients||[]).filter(i=>i.item || i.amount),
        method: (draft.method||[]).filter(Boolean),
        image_url: draft.image_url || null,
        photo_url: photo || null,
        photo_hint: photoHint || null,
      });
      toast.success('Saved');
      setDraft(null);
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  const saveCard = async function() {
    if (!preview) { toast.error('Nothing to save yet'); return; }
    setBusy('card');
    try {
      const url = await addRendered(dataUrlToBlob(preview), {
        name: (draft.name || 'Cocktail') + ' · card',
        storeId, aspect:'4:5',
        width: RECIPE_CARD_W, height: RECIPE_CARD_H,
      });
      setDraft(prev => Object.assign({}, prev, { image_url: url }));
      toast.success('Card saved to the creative library');
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  const draftPost = async function() {
    if (!preview)  { toast.error('Build the card first'); return; }
    if (!postAt)   { toast.error('Choose when it should go out'); return; }
    setBusy('post');
    try {
      const sb = getSB();
      const { data:{ user } } = await sb.auth.getUser();
      const imageUrl = draft.image_url || await addRendered(dataUrlToBlob(preview), {
        name: (draft.name || 'Cocktail') + ' · card',
        storeId, aspect:'4:5', width: RECIPE_CARD_W, height: RECIPE_CARD_H,
      });
      const prod = productOf(draft);
      const { error } = await sb.from('scheduled_posts').insert({
        store_id: storeId,
        caption: capText !== null ? capText : recipeCaption(draft, prod ? prod.product_name : '', offer),
        image_url: imageUrl,
        image_urls: [imageUrl],
        publish_to: ['facebook'],
        scheduled_at: new Date(postAt).toISOString(),
        status: 'needs_approval',
        auto_generated: true,
        created_by: user?.id,
      });
      if (error) throw error;
      setDraft(prev => Object.assign({}, prev, { image_url: imageUrl }));
      toast.success('Drafted — approve it under Posts → Scheduled');
    } catch(e) { toast.error(e.message); }
    finally { setBusy(null); }
  };

  const setIng = (i, k, v) => setDraft(prev => Object.assign({}, prev, {
    ingredients: prev.ingredients.map((x,ix)=> ix===i ? Object.assign({}, x, {[k]:v}) : x),
  }));
  const setStep = (i, v) => setDraft(prev => Object.assign({}, prev, {
    method: prev.method.map((x,ix)=> ix===i ? v : x),
  }));

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex items-center gap-3 mb-4 flex-wrap">
          <span className="ttl">Recipes</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          <StorePicker value={storeId} onChange={setStoreId} stores={myStores} compact/>
          <Button size="sm" variant="outline" onClick={()=>setShowStyle(v=>!v)}>
            <Icon name="spark"/> Card look
          </Button>
          <Button size="sm" onClick={()=>startNew(null, null)}>
            <Icon name="tag"/> New recipe
          </Button>
        </div>

        {showStyle && (
          <div className="p-4 mb-4" style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.4)'}}>
            <RecipeStyleEditor tokens={tokens} isOwn={isOwn} isAdmin={isAdmin}
              storeName={storeName} busy={busy==='style'} hasStamp={!!stamp}
              onSave={async function(t, scope){
                setBusy('style');
                try { await saveTokens(t, scope); toast.success('Look saved'); }
                catch(e){ toast.error(e.message); }
                finally { setBusy(null); }
              }}
              onClear={async function(){
                try { await clearStore(); toast.success('Back to the chain look'); }
                catch(e){ toast.error(e.message); }
              }}/>
          </div>
        )}

        {loading ? <p className="lbl text-center py-10">Loading…</p>
         : recipes.length === 0 ? (
          <div className="text-center py-12">
            <Icon name="spark" size={36} style={{color:'var(--cy-dim)'}}/>
            <p className="lbl mt-3">No recipes yet</p>
            <p className="text-xs mt-2" style={{color:'var(--txt2)'}}>
              Start from a product and let it draft one for you.
            </p>
          </div>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
            {recipes.map(function(r) {
              const p = products.find(x=>x.id===r.product_id);
              return (
                <div key={r.id} className="hud p-0 overflow-hidden group relative">
                  <div className="w-full" style={{aspectRatio:'4/5', background:'rgba(var(--sink-rgb),.7)'}}>
                    {r.image_url
                      ? <img src={r.image_url} alt="" className="w-full h-full object-cover"/>
                      : p && prodSrc(p)
                      ? <div className="w-full h-full flex items-center justify-center" style={{background:'#fff'}}>
                          <img src={prodSrc(p)} alt="" className="object-contain"
                               style={{maxWidth:'70%', maxHeight:'80%'}}/>
                        </div>
                      : <div className="w-full h-full flex items-center justify-center">
                          <Icon name="spark" size={22} style={{color:'var(--cy-dim)'}}/>
                        </div>}
                  </div>
                  <button onClick={async function(){
                            if (!confirm('Delete "' + r.name + '"?')) return;
                            try { await remove(r.id); toast.success('Deleted'); }
                            catch(e){ toast.error(e.message); }
                          }}
                    className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 p-1.5"
                    style={{background:'rgba(var(--sink2-rgb),.85)', color:'var(--red)', border:'1px solid var(--red)'}}>
                    <Icon name="trash" size={12}/>
                  </button>
                  <div className="p-2.5">
                    <p className="text-xs truncate" style={{color:'var(--txt)'}}>{r.name}</p>
                    {p && <p className="lbl mt-1 truncate">{p.product_name}</p>}
                    <Button size="sm" variant="ghost" className="mt-1.5"
                      onClick={function(){
                        setPhoto(r.photo_url || null);
                        setPhotoHint(r.photo_hint || '');
                        setOffer(null);
                        if (r.feature_id) {
                          getSB().from('features').select('*').eq('id', r.feature_id).maybeSingle()
                            .then(({data}) => setOffer(data || null));
                        }
                        setDraft({
                          id:r.id, name:r.name,
                          blurb:r.notes||'', glass:r.glass||'', garnish:r.garnish||'',
                          // Recipes written before the switch to ounces get
                          // converted as they're opened.
                          ingredients:(r.ingredients&&r.ingredients.length)
                            ? r.ingredients.map(i=>({ amount:toOunces(i.amount||''), item:i.item||'' }))
                            : [{amount:'',item:''}],
                          method:(r.method&&r.method.length)?r.method:[''],
                          store_id:r.store_id, product_id:r.product_id, feature_id:r.feature_id,
                          image_url:r.image_url,
                        });
                      }}>Open</Button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {draft && (
        <Card cardRef={editorRef}>
          <div className="flex items-center gap-3 mb-4">
            <span className="ttl">{draft.id ? 'Edit recipe' : 'New recipe'}</span>
            <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
            <button onClick={()=>setDraft(null)} style={{color:'var(--txt2)'}}><Icon name="close"/></button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div>
              <div className="flex gap-2 flex-wrap mb-4">
                <Button size="sm" variant="outline" onClick={()=>setShowPick(true)}>
                  <Icon name="image"/> {draft.product_id ? 'Change product' : 'Pick a product'}
                </Button>
                <Button size="sm" variant="outline" onClick={()=>setShowFeat(true)}>
                  <Icon name="tag"/> From a feature
                </Button>
                <Button size="sm" onClick={writeRecipe} loading={busy==='write'}>
                  <Icon name="spark"/> Draft the recipe
                </Button>
              </div>

              <div className="mb-3">
                <Label>Drink name — the only text on the card</Label>
                <Input value={draft.name} onChange={e=>setDraft({...draft, name:e.target.value})}/>
              </div>

              <Label>One line on the taste</Label>
              <Textarea rows={2} value={draft.blurb} className="mb-3"
                        onChange={e=>setDraft({...draft, blurb:e.target.value})}/>

              <Label>Ingredients</Label>
              {draft.ingredients.map(function(ing, i) {
                return (
                  <div key={i} className="flex gap-2 mb-1.5">
                    <Input value={ing.amount} placeholder="2 oz" className="w-24 text-xs"
                           onChange={e=>setIng(i,'amount',e.target.value)}/>
                    <Input value={ing.item} placeholder="white rum" className="flex-1 text-xs"
                           onChange={e=>setIng(i,'item',e.target.value)}/>
                    <Button size="sm" variant="ghost"
                      onClick={()=>setDraft({...draft, ingredients:draft.ingredients.filter((_,ix)=>ix!==i)})}>
                      <Icon name="close" size={12}/>
                    </Button>
                  </div>
                );
              })}
              <Button size="sm" variant="ghost" className="mb-3"
                onClick={()=>setDraft({...draft, ingredients:draft.ingredients.concat({amount:'',item:''})})}>
                Add ingredient
              </Button>

              <Label>Method</Label>
              {draft.method.map(function(m, i) {
                return (
                  <div key={i} className="flex gap-2 mb-1.5">
                    <span className="mono text-xs pt-2.5" style={{color:'var(--cy)'}}>{i+1}</span>
                    <Input value={m} className="flex-1 text-xs" onChange={e=>setStep(i, e.target.value)}/>
                    <Button size="sm" variant="ghost"
                      onClick={()=>setDraft({...draft, method:draft.method.filter((_,ix)=>ix!==i)})}>
                      <Icon name="close" size={12}/>
                    </Button>
                  </div>
                );
              })}
              <Button size="sm" variant="ghost" className="mb-3"
                onClick={()=>setDraft({...draft, method:draft.method.concat('')})}>
                Add step
              </Button>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <Label>Glass</Label>
                  <Input value={draft.glass} onChange={e=>setDraft({...draft, glass:e.target.value})}/>
                </div>
                <div>
                  <Label>Garnish</Label>
                  <Input value={draft.garnish} onChange={e=>setDraft({...draft, garnish:e.target.value})}/>
                </div>
              </div>
            </div>

            <div>
              <Label>Card · 1080 × 1350</Label>
              <div style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.6)'}}>
                {preview
                  ? <img src={preview} alt="Recipe card preview" className="w-full"/>
                  : <div className="flex items-center justify-center" style={{aspectRatio:'4/5'}}>
                      <p className="lbl">Building…</p>
                    </div>}
                {!photo && preview && (
                  <p className="lbl p-2">No photo yet — make one below.</p>
                )}
              </div>

              <div className="mt-3">
                <Label>Photo direction (optional)</Label>
                <div className="flex gap-2">
                  <Input value={photoHint} className="flex-1 text-xs"
                         placeholder="e.g. sunny patio table, late afternoon"
                         onChange={e=>setPhotoHint(e.target.value)}/>
                  <Button size="sm" onClick={generatePhoto} loading={busy==='photo'}>
                    <Icon name="spark"/> {photo ? 'New photo' : 'Make the photo'}
                  </Button>
                </div>
                <p className="lbl mt-1.5">
                  {photo
                    ? 'Restyling is free — only this button costs a generation.'
                    : 'Built from the ingredients, so the drink matches the recipe.'}
                </p>
              </div>

              <div className="flex gap-2 flex-wrap mt-3">
                <Button size="sm" variant="outline" onClick={saveCard} loading={busy==='card'}
                        disabled={!photo}>
                  <Icon name="down"/> Save card to library
                </Button>
                <Button size="sm" onClick={saveRecipe} loading={busy==='save'}>
                  <Icon name="save"/> Save recipe
                </Button>
              </div>

              <div className="mt-4 pt-3" style={{borderTop:'1px solid var(--line)'}}>
                <Label>The post</Label>
                {offer && offer.sale_price != null ? (
                  <p className="lbl mb-2" style={{color:'var(--cy)'}}>
                    <Icon name="tag" size={11}/> On feature — {offer.name} at {money(offer.sale_price)}
                    {offer.savings != null ? ', save ' + money(offer.savings) : ''}. Included in the caption.
                  </p>
                ) : (
                  <p className="lbl mb-2">
                    No feature attached, so no price in the caption. Use "From a feature" to add one.
                  </p>
                )}
                {/* The caption is a starting point, not a verdict — edit it
                    here and both routes below use your words. */}
                <textarea
                  className="w-full text-xs p-2.5 mb-1"
                  style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.4)',
                          color:'var(--txt2)', minHeight:'150px', resize:'vertical'}}
                  value={capText !== null ? capText
                    : recipeCaption(draft, (productOf(draft)||{}).product_name || '', offer)}
                  onChange={e=>setCapText(e.target.value)}/>
                {capText !== null && (
                  <button className="lbl hover:underline mb-2" onClick={()=>setCapText(null)}>
                    Reset to the written caption
                  </button>
                )}
                <Label>Send at</Label>
                <div className="flex gap-2 flex-wrap">
                  <Input type="datetime-local" value={postAt} className="flex-1 text-xs"
                         onChange={e=>setPostAt(e.target.value)}/>
                  <Button size="sm" variant="secondary" onClick={draftPost} loading={busy==='post'}>
                    <Icon name="cal"/> Draft post
                  </Button>
                  {onCompose && (
                    <Button size="sm" variant="outline" loading={busy==='compose'}
                      onClick={async function(){
                        if (!preview) { toast.error('Build the card first'); return; }
                        setBusy('compose');
                        try {
                          const imageUrl = draft.image_url || await addRendered(dataUrlToBlob(preview), {
                            name: (draft.name || 'Cocktail') + ' · card',
                            storeId, aspect:'4:5', width: RECIPE_CARD_W, height: RECIPE_CARD_H,
                          });
                          const cap = capText !== null ? capText
                            : recipeCaption(draft, (productOf(draft)||{}).product_name || '', offer);
                          onCompose({ image: imageUrl, caption: cap });
                        } catch(e) { toast.error(e.message); }
                        finally { setBusy(null); }
                      }}>
                      <Icon name="edit"/> Open in composer
                    </Button>
                  )}
                </div>
                <p className="lbl mt-2">
                  Goes into the approval queue with the recipe as the caption. Nothing publishes unread.
                </p>
              </div>
            </div>
          </div>

          {showPick && (
            <ProductPickerModal products={products}
              onPick={function(p){
                setDraft(prev => Object.assign({}, switchProduct(prev, p.product_name), {
                  product_id: p.id,
                }));
                setShowPick(false);
              }}
              onClose={()=>setShowPick(false)}/>
          )}

          {showFeat && (
            <FeaturePicker storeId={storeId}
              onPick={function(f, prod){
                setOffer(f);
                // The feature's own name is what the price is quoted against,
                // so it beats the linked product's name if they differ.
                const label = f.name || (prod||{}).product_name;
                setDraft(prev => Object.assign({}, switchProduct(prev, label), {
                  feature_id: f.id,
                  product_id: prod ? prod.id : prev.product_id,
                }));
                setShowFeat(false);
              }}
              onClose={()=>setShowFeat(false)}/>
          )}
        </Card>
      )}
    </div>
  );
}

function AdFieldEditor({ templateDataUrl, fields, onChange }) {
  const boxRef = useRef();
  const [sel, setSel] = useState(null);
  const [drag, setDrag] = useState(null);
  const [draw, setDraw] = useState(null);

  const rel = (e) => {
    const r = boxRef.current.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*100, y:(e.clientY-r.top)/r.height*100 };
  };
  const patch = (id, f) => onChange(fields.map(x=>x.id===id?{...x,...f}:x));
  const del   = (id) => { onChange(fields.filter(x=>x.id!==id)); setSel(null); };

  const onDown = (e) => {
    if (e.target !== boxRef.current && !e.target.dataset.canvas) return;
    const { x, y } = rel(e); setDraw({ x, y }); setSel(null);
  };
  const onMove = (e) => {
    if (drag) {
      const { x, y } = rel(e);
      const dx = x-drag.sx, dy = y-drag.sy, o = drag.orig;
      if (drag.mode==='move') patch(drag.id,{ x_pct:Math.max(0,Math.min(100-o.w_pct,o.x_pct+dx)), y_pct:Math.max(0,Math.min(100-o.h_pct,o.y_pct+dy)) });
      else patch(drag.id,{ w_pct:Math.max(3,Math.min(100-o.x_pct,o.w_pct+dx)), h_pct:Math.max(2,Math.min(100-o.y_pct,o.h_pct+dy)) });
    }
  };
  const onUp = (e) => {
    if (draw) {
      const { x, y } = rel(e);
      const w = Math.abs(x-draw.x), h = Math.abs(y-draw.y);
      if (w>3 && h>2) {
        const nf = { id:'new_'+Date.now(), ...AD_FIELD_DEFAULTS,
          x_pct:Math.min(x,draw.x), y_pct:Math.min(y,draw.y), w_pct:w, h_pct:h,
          label:'Field '+(fields.length+1) };
        onChange([...fields, nf]); setSel(nf.id);
      }
      setDraw(null);
    }
    setDrag(null);
  };

  const cur = fields.find(f=>f.id===sel);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2">
        <p className="lbl mb-2">Drag on the template to add a field · click one to edit it</p>
        <div ref={boxRef} data-canvas="1" onMouseDown={onDown} onMouseMove={onMove}
             onMouseUp={onUp} onMouseLeave={onUp}
             className="relative select-none"
             style={{ border:'1px solid var(--line)', cursor:'crosshair', lineHeight:0 }}>
          <img src={templateDataUrl} alt="" className="w-full block pointer-events-none"/>
          {fields.map(f=>{
            const on = f.id===sel;
            const img = f.field_type==='product_image';
            const c = img ? 'var(--amb)' : 'var(--cy)';
            return (
              <div key={f.id}
                onMouseDown={e=>{e.stopPropagation();setSel(f.id);const r=rel(e);setDrag({id:f.id,mode:'move',sx:r.x,sy:r.y,orig:{...f}});}}
                className="absolute"
                style={{ left:f.x_pct+'%', top:f.y_pct+'%', width:f.w_pct+'%', height:f.h_pct+'%',
                         border:'1px '+(img?'dashed':'solid')+' '+c,
                         background: on ? 'rgba(212,175,55,.14)' : 'rgba(212,175,55,.05)',
                         cursor:'move', boxShadow: on ? '0 0 12px rgba(212,175,55,.35)' : 'none' }}>
                <span className="mono absolute -top-4 left-0 whitespace-nowrap"
                      style={{ fontSize:'9px', color:c }}>{f.label}</span>
                {!img && (
                  <span className="absolute inset-0 flex items-center overflow-hidden pointer-events-none px-0.5"
                        style={{
                          fontFamily: fontStack(f.font_family),
                          fontWeight: f.font_weight || 400,
                          color: f.color || '#000',
                          fontSize: 'clamp(8px, 2.2vw, 22px)',
                          textTransform: f.uppercase ? 'uppercase' : 'none',
                          justifyContent: f.align==='center' ? 'center' : f.align==='right' ? 'flex-end' : 'flex-start',
                          opacity:.85, whiteSpace:'nowrap',
                        }}>
                    {(AD_FIELD_KEYS.find(k=>k.key===f.field_key)||{}).hint || f.label}
                  </span>
                )}
                <div onMouseDown={e=>{e.stopPropagation();setSel(f.id);const r=rel(e);setDrag({id:f.id,mode:'size',sx:r.x,sy:r.y,orig:{...f}});}}
                     className="absolute" style={{ right:-4, bottom:-4, width:9, height:9, background:c, cursor:'nwse-resize' }}/>
              </div>
            );
          })}
          {draw && <div className="absolute pointer-events-none"
            style={{ left:Math.min(draw.x,draw.x)+'%', top:Math.min(draw.y,draw.y)+'%',
                     border:'1px dashed var(--cy)', background:'rgba(212,175,55,.1)' }}/>}
        </div>
      </div>

      <div>
        {!cur ? (
          <div className="hud p-4">
            <p className="lbl">No field selected</p>
            <p className="text-xs mt-2" style={{color:'var(--txt2)'}}>
              Drag a box on the template to create one. Amber dashed boxes are product photos, cyan are text.
            </p>
          </div>
        ) : (
          <div className="hud p-4 space-y-3">
            <div className="flex items-center gap-2">
              <span className="ttl flex-1">Field</span>
              <Button size="sm" variant="danger" onClick={()=>del(cur.id)}><Icon name="trash" size={12}/></Button>
            </div>

            <div>
              <Label>Content</Label>
              <Select value={cur.field_key} onChange={e=>{
                const k = AD_FIELD_KEYS.find(x=>x.key===e.target.value);
                patch(cur.id,{ field_key:k.key, field_type:k.type, label:k.label });
              }}>
                {AD_FIELD_KEYS.map(k=><option key={k.key} value={k.key}>{k.label}</option>)}
              </Select>
              <p className="lbl mt-1">{(AD_FIELD_KEYS.find(k=>k.key===cur.field_key)||{}).hint}</p>
            </div>

            {cur.field_type === 'product_image' ? (
              <React.Fragment>
                <div>
                  <Label>Fit</Label>
                  <Select value={cur.fit_mode||'contain'} onChange={e=>patch(cur.id,{fit_mode:e.target.value})}>
                    <option value="contain">Contain — never crop</option>
                    <option value="cover">Cover — fill and crop</option>
                  </Select>
                </div>
                <label className="flex items-center gap-2 text-xs cursor-pointer" style={{color:'var(--txt2)'}}>
                  <input type="checkbox" checked={cur.remove_bg!==false}
                         onChange={e=>patch(cur.id,{remove_bg:e.target.checked})}/>
                  Remove background before placing
                </label>
                {cur.remove_bg !== false && (
                  <div>
                    <Label>Background tolerance</Label>
                    <Input type="number" min="8" max="120" value={cur.bg_tolerance ?? 42}
                           onChange={e=>patch(cur.id,{bg_tolerance:+e.target.value})}/>
                    <p className="lbl mt-1">
                      Higher removes more — raise it if a backdrop survives, lower it if the product gets eaten
                    </p>
                  </div>
                )}
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div>
                  <Label>Font</Label>
                  <Select value={cur.font_family||'Anton'} onChange={e=>{
                    const f = AD_FONTS.find(x=>x.id===e.target.value);
                    patch(cur.id,{ font_family:f.id, font_weight:f.weights[f.weights.length-1] });
                  }}>
                    {AD_FONTS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                  </Select>
                  <div className="mt-2 px-3 py-2 overflow-hidden"
                       style={{ border:'1px solid var(--line)', background:'#efe7d6' }}>
                    <span style={{
                      fontFamily: fontStack(cur.font_family),
                      fontWeight: cur.font_weight || 400,
                      color: cur.color || '#000',
                      fontSize: '26px', lineHeight: 1.1, whiteSpace: 'nowrap',
                      textTransform: cur.uppercase ? 'uppercase' : 'none',
                    }}>{(AD_FIELD_KEYS.find(k=>k.key===cur.field_key)||{}).hint || 'Sample'}</span>
                  </div>
                </div>

                {(AD_FONTS.find(f=>f.id===(cur.font_family||'Anton'))||{weights:[400]}).weights.length > 1 && (
                  <div>
                    <Label>Weight</Label>
                    <Select value={cur.font_weight||400} onChange={e=>patch(cur.id,{font_weight:+e.target.value})}>
                      {(AD_FONTS.find(f=>f.id===(cur.font_family||'Anton'))||{weights:[400]}).weights
                        .map(w=><option key={w} value={w}>{w}</option>)}
                    </Select>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Align</Label>
                    <Select value={cur.align||'left'} onChange={e=>patch(cur.id,{align:e.target.value})}>
                      <option value="left">Left</option><option value="center">Center</option><option value="right">Right</option>
                    </Select></div>
                  <div><Label>Vertical</Label>
                    <Select value={cur.valign||'top'} onChange={e=>patch(cur.id,{valign:e.target.value})}>
                      <option value="top">Top</option><option value="middle">Middle</option><option value="bottom">Bottom</option>
                    </Select></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Colour</Label>
                    <input type="color" value={cur.color||'#000000'} onChange={e=>patch(cur.id,{color:e.target.value})}
                           style={{width:'100%',height:'34px',background:'transparent',border:'1px solid var(--line)'}}/></div>
                  <div><Label>Max lines</Label>
                    <Input type="number" min="1" max="6" value={cur.max_lines||2}
                           onChange={e=>patch(cur.id,{max_lines:+e.target.value})}/></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Padding %</Label>
                    <Input type="number" min="0" max="25" value={cur.padding_pct ?? 2}
                           onChange={e=>patch(cur.id,{padding_pct:+e.target.value})}/></div>
                  <div><Label>Line spacing</Label>
                    <Input type="number" min="0.8" max="2" step="0.05" value={cur.line_spacing ?? 1.15}
                           onChange={e=>patch(cur.id,{line_spacing:+e.target.value})}/></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><Label>Prefix</Label>
                    <Input value={cur.prefix||''} onChange={e=>patch(cur.id,{prefix:e.target.value})} placeholder="$"/></div>
                  <div><Label>Suffix</Label>
                    <Input value={cur.suffix||''} onChange={e=>patch(cur.id,{suffix:e.target.value})} placeholder="ea"/></div>
                </div>
                {cur.prefix && (
                  <div className="grid grid-cols-2 gap-2">
                    <div><Label>Prefix size %</Label>
                      <Input type="number" min="15" max="100" value={cur.prefix_scale ?? 55}
                             onChange={e=>patch(cur.id,{prefix_scale:+e.target.value})}/></div>
                    <div><Label>Prefix position</Label>
                      <Select value={cur.prefix_valign||'middle'} onChange={e=>patch(cur.id,{prefix_valign:e.target.value})}>
                        <option value="middle">Middle</option>
                        <option value="top">Top</option>
                        <option value="baseline">Baseline</option>
                      </Select></div>
                  </div>
                )}
                {cur.suffix && (
                  <div className="grid grid-cols-2 gap-2">
                    <div><Label>Suffix size %</Label>
                      <Input type="number" min="10" max="100" value={cur.suffix_scale ?? 35}
                             onChange={e=>patch(cur.id,{suffix_scale:+e.target.value})}/></div>
                    <div><Label>Suffix position</Label>
                      <Select value={cur.suffix_valign||'bottom'} onChange={e=>patch(cur.id,{suffix_valign:e.target.value})}>
                        <option value="bottom">Bottom</option>
                        <option value="middle">Middle</option>
                        <option value="top">Top</option>
                      </Select></div>
                  </div>
                )}
                <div className="flex gap-4">
                  <label className="flex items-center gap-2 text-xs cursor-pointer" style={{color:'var(--txt2)'}}>
                    <input type="checkbox" checked={!!cur.bold} onChange={e=>patch(cur.id,{bold:e.target.checked})}/> Bold
                  </label>
                  <label className="flex items-center gap-2 text-xs cursor-pointer" style={{color:'var(--txt2)'}}>
                    <input type="checkbox" checked={!!cur.uppercase} onChange={e=>patch(cur.id,{uppercase:e.target.checked})}/> Uppercase
                  </label>
                </div>
              </React.Fragment>
            )}

            <div>
              <Label>Label (editor only)</Label>
              <Input value={cur.label||''} onChange={e=>patch(cur.id,{label:e.target.value})}/>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AdTemplateLayout({ tpl, onClose, onSaved }) {
  const toast = useToast();
  const { fields, loading, save } = useAdTemplateFields(tpl.id);
  const [draft, setDraft] = useState([]);
  const [busy, setBusy] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [mockup, setMockup] = useState(null);
  const [rendering, setRendering] = useState(false);
  const [overflows, setOverflows] = useState([]);
  const [art, setArt] = useState(tpl.data);
  const [swapping, setSwapping] = useState(false);
  const artRef = useRef();

  // Artwork can be replaced in place. Field geometry is stored in percentages,
  // so a revised graphic at any size keeps the existing layout — only the
  // pixels underneath change.
  const replaceArtwork = async (file) => {
    if (!file) return;
    setSwapping(true);
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('Could not read that file'));
        r.readAsDataURL(file);
      });
      const dims = await new Promise(res => {
        const i = new Image();
        i.onload  = () => res({ w:i.naturalWidth, h:i.naturalHeight });
        i.onerror = () => res(null);
        i.src = dataUrl;
      });
      const sb = getSB();
      const patchRow = { data: dataUrl };
      if (dims) { patchRow.canvas_w = dims.w; patchRow.canvas_h = dims.h; }
      const { error } = await sb.from('brand_templates').update(patchRow).eq('id', tpl.id);
      if (error) throw error;
      setArt(dataUrl);
      tpl.data = dataUrl;
      if (dims) { tpl.canvas_w = dims.w; tpl.canvas_h = dims.h; }
      setMockup(null);
      toast.success(dims
        ? `Artwork replaced (${dims.w}×${dims.h}) — field layout kept`
        : 'Artwork replaced — field layout kept');
      if (onSaved) onSaved();
    } catch(e) { toast.error(e.message); }
    finally { setSwapping(false); }
  };

  // Sample copy chosen to stress the layout: a long name that must wrap and
  // shrink, and a save value wider than "$0.00".
  const SAMPLE = {
    product_name:'Okanagan Crush Pad Narrative Rosé',
    pack_size:'6 × 355ml',
    price:'18.99',
    save:'$12.50',
  };

  const makeMockup = async () => {
    if (!draft.length) { toast.error('Add some fields first'); return; }
    setRendering(true);
    try {
      const rendered = await renderFieldTemplate({ ...tpl, data: art }, draft, SAMPLE, null);
      setMockup(typeof rendered === 'string' ? rendered : rendered.url);
      const over = typeof rendered === 'string' ? [] : rendered.overflows;
      setOverflows(over);
      if (over.length) toast.error('Does not fit: ' + over.join(', '));
    } catch(e) { toast.error(e.message); }
    finally { setRendering(false); }
  };

  useEffect(()=>{ setDraft(fields); setDirty(false); }, [fields]);

  const change = (list) => { setDraft(list); setDirty(true); };

  const persist = async () => {
    setBusy(true);
    try {
      await save(draft);
      const sb = getSB();
      await sb.from('brand_templates')
        .update({ kind: draft.length ? 'price_ad' : 'plain' })
        .eq('id', tpl.id);
      toast.success('Layout saved');
      setDirty(false);
      if (onSaved) onSaved();
    } catch(e) { toast.error(e.message); }
    finally { setBusy(false); }
  };

  return (
    <Card>
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <span className="ttl">Field layout — {tpl.name}</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
        {dirty && <Badge color="yellow">Unsaved</Badge>}
        <Button size="sm" variant="outline" onClick={()=>artRef.current?.click()} loading={swapping}>
          <Icon name="image"/> Replace artwork
        </Button>
        <input ref={artRef} type="file" accept="image/*" className="hidden"
               onChange={e=>{ replaceArtwork(e.target.files?.[0]); e.target.value=''; }}/>
        <Button size="sm" onClick={persist} loading={busy}><Icon name="save"/> Save layout</Button>
        <Button size="sm" variant="ghost" onClick={onClose}><Icon name="close"/></Button>
      </div>
      {loading
        ? <p className="lbl text-center py-8">Loading…</p>
        : <AdFieldEditor templateDataUrl={art} fields={draft} onChange={change}/>}

      <div className="mt-5 pt-4" style={{borderTop:'1px solid var(--line)'}}>
        <div className="flex items-center gap-3 mb-3 flex-wrap">
          <span className="ttl">Mockup</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          <Button size="sm" variant="outline" onClick={makeMockup} loading={rendering}>
            <Icon name="eye"/> Render with sample data
          </Button>
          {mockup && <Button size="sm" variant="ghost" onClick={()=>setMockup(null)}>Clear</Button>}
        </div>
        {overflows.length > 0 && (
          <div className="mb-3 p-2.5" style={{border:'1px solid var(--amb)', background:'rgba(240,168,48,.1)'}}>
            <p className="text-xs" style={{color:'var(--amb)'}}>
              <Icon name="warn" size={13} className="mr-1.5"/>
              Too small even at minimum size: {overflows.join(', ')}
            </p>
            <p className="lbl mt-1">Make the box taller or wider, or raise its max lines</p>
          </div>
        )}
        {mockup
          ? <img src={mockup} alt="Template mockup" className="w-full max-w-md mx-auto block"
                 style={{border:'1px solid var(--line)'}}/>
          : <p className="lbl text-center py-6">
              Renders the real canvas output with placeholder copy — exact fonts, sizes and wrapping
            </p>}
      </div>
    </Card>
  );
}

// Searches the public BC Liquor Stores catalogue and copies the selected
// product image into our own Storage. The BCLIQUOR price is shown only to help
// identify the right package — it never becomes the store's feature price.
function BCLiquorSearch({ onImported }) {
  const toast = useToast();
  const [q, setQ] = useState('');
  const [results, setResults] = useState(null);
  const [searching, setSearching] = useState(false);
  const [importing, setImporting] = useState(null);

  const search = async () => {
    const term = q.trim();
    if (term.length < 2)  { toast.error('Enter at least 2 characters'); return; }
    if (term.length > 80) { toast.error('Search is too long'); return; }
    setSearching(true);
    try {
      const r = await callEdge('bcliquor', 'search', { query: term });
      setResults(r.products || []);
      if (!r.products?.length) toast.info ? toast.info('No matches') : null;
    } catch(e) { toast.error(e.message); }
    finally { setSearching(false); }
  };

  const useImage = async (prod) => {
    setImporting(prod.sku);
    try {
      // Server re-verifies the SKU and rebuilds the image URL itself.
      const r = await callEdge('bcliquor', 'import', { sku: prod.sku });
      onImported({
        image_url: r.image_url,
        image_alt: r.image_alt,
        product: r.product,
      });
      toast.success('Product image copied — save the product to keep it');
    } catch(e) { toast.error(e.message); }
    finally { setImporting(null); }
  };

  const money = v => (v == null ? null : '$' + Number(v).toFixed(2));

  return (
    <div className="p-4" style={{border:'1px solid var(--line)', background:'rgba(var(--sink-rgb),.4)'}}>
      <div className="flex items-center gap-3 mb-3">
        <span className="ttl">BC Liquor lookup</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
      </div>

      <div className="flex gap-2 mb-3">
        <Input value={q} onChange={e=>setQ(e.target.value)}
               onKeyDown={e=>{ if(e.key==='Enter') search(); }}
               placeholder="Search the BC Liquor catalogue…" className="flex-1"/>
        <Button onClick={search} loading={searching}><Icon name="search"/> Search</Button>
      </div>

      {results && results.length === 0 && (
        <p className="lbl py-6 text-center">No products matched that search</p>
      )}

      {results && results.length > 0 && (
        <React.Fragment>
          <p className="lbl mb-2">
            {results.length} result{results.length===1?'':'s'} · price shown only to identify the package
          </p>
          <div className="space-y-2 max-h-96 overflow-auto">
            {results.map(function(p) {
              return (
                <div key={p.sku} className="flex items-center gap-3 p-2.5"
                     style={{border:'1px solid var(--line)', background:'rgba(var(--sink2-rgb),.5)'}}>
                  <img src={p.image_url} alt={p.name}
                       className="object-contain flex-none"
                       style={{width:'54px', height:'54px', background:'rgba(255,255,255,.04)'}}
                       onError={e=>{ e.currentTarget.style.visibility='hidden'; }}/>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm truncate" style={{color:'var(--txt)'}}>{p.name}</p>
                    <p className="lbl mt-1 truncate">
                      {[p.package_size, p.category, p.country].filter(Boolean).join(' · ')}
                    </p>
                    <p className="mono mt-1" style={{fontSize:'10px', color:'var(--txt3)'}}>
                      SKU {p.sku}
                      {money(p.current_price) && <span style={{marginLeft:'10px'}}>BCL {money(p.current_price)}</span>}
                      {p.regular_price != null && p.current_price != null && p.regular_price > p.current_price &&
                        <span style={{marginLeft:'6px', textDecoration:'line-through', opacity:.6}}>{money(p.regular_price)}</span>}
                    </p>
                  </div>
                  <Button size="sm" onClick={()=>useImage(p)} loading={importing===p.sku}>
                    <Icon name="down"/> Use image
                  </Button>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}
