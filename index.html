function useSTTemplates(storeId=null, isAdmin=false) {
  const [templates, setTemplates] = useState([]);
  const [loading,   setLoading]   = useState(true);

  const load = useCallback(async () => {
    const sb=getSB(); if(!sb) return;
    setLoading(true);
    try {
      const { data } = await sb.from('shelf_talker_templates')
        .select('*, shelf_talker_template_brands(store_id)')
        .order('created_at', { ascending: false });
      const all = data || [];
      if (isAdmin) {
        setTemplates(all);
      } else {
        // Show active global templates + templates assigned to this store
        setTemplates(all.filter(t =>
          t.is_active && (
            t.scope === 'global' ||
            (t.shelf_talker_template_brands||[]).some(b => b.store_id === storeId)
          )
        ));
      }
    } finally { setLoading(false); }
  }, [storeId, isAdmin]);

  useEffect(() => { load(); }, [load]);
  return { templates, loading, reload: load };
}

function useSTFields(templateId) {
  const [fields,  setFields]  = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(async () => {
    if (!templateId) { setFields([]); return; }
    const sb=getSB(); if(!sb) return;
    setLoading(true);
    const { data } = await sb.from('shelf_talker_fields')
      .select('*').eq('template_id', templateId)
      .order('field_order');
    setFields(data||[]);
    setLoading(false);
  }, [templateId]);

  useEffect(() => { load(); }, [load]);

  const save = async (fieldList) => {
    const sb=getSB(); if(!sb) throw new Error('Not connected');
    await sb.from('shelf_talker_fields').delete().eq('template_id', templateId);
    if (fieldList.length) {
      const { error } = await sb.from('shelf_talker_fields').insert(
        fieldList.map((f,i) => {
          // eslint-disable-next-line no-unused-vars
          const { id: _dropId, created_at: _dropCa, ...rest } = f;
          return { id: crypto.randomUUID(), ...rest, template_id: templateId, field_order: i };
        })
      );
      if (error) throw error;
    }
    await load();
  };

  return { fields, loading, save, reload: load };
}

function useSavedTags(userId, isAdmin) {
  const [saves,   setSaves]   = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(async () => {
    const sb = getSB(); if (!sb) return;
    if (!isAdmin && !userId) return;
    setLoading(true);
    try {
      var query = sb.from('saved_shelf_talkers')
        .select('*, shelf_talker_templates(name, file_data, category)')
        .order('created_at', { ascending: false });
      if (!isAdmin) query = query.eq('user_id', userId);
      const { data } = await query;
      setSaves(data || []);
    } finally { setLoading(false); }
  }, [userId, isAdmin]);

  useEffect(function() { load(); }, [load]);

  const saveTag = async (name, templateId, values, storeId) => {
    const sb = getSB(); if (!sb) return;
    var userEmail = null;
    try { var r = await sb.auth.getUser(); userEmail = r.data.user ? r.data.user.email : null; } catch(e) {}
    const { error } = await sb.from('saved_shelf_talkers')
      .insert({ user_id: userId, template_id: templateId, name, values, store_id: storeId || null, user_email: userEmail });
    if (error) throw error;
    await load();
  };

  const deleteTag = async (id) => {
    const sb = getSB(); if (!sb) return;
    await sb.from('saved_shelf_talkers').delete().eq('id', id);
    await load();
  };

  return { saves, loading, saveTag, deleteTag, reload: load };
}

function LoginScreen() {
  const toast = useToast();
  const [email,    setEmail]    = useState('');
  const [password, setPassword] = useState('');
  const [mode,     setMode]     = useState('login'); // 'login' | 'forgot'
  const [loading,  setLoading]  = useState(false);
  const [sent,     setSent]     = useState(false);

  const signIn = async () => {
    if (!email||!password) { toast.error('Enter email and password'); return; }
    setLoading(true);
    const { error } = await getSB().auth.signInWithPassword({ email, password });
    if (error) toast.error(error.message);
    setLoading(false);
  };

  const resetPw = async () => {
    if (!email) { toast.error('Enter your email'); return; }
    setLoading(true);

    if (error) toast.error(error.message);
    else setSent(true);

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-4">

            {mode==='login' ? 'Sign In' : 'Reset Password'}
          </h2>
          <div className="space-y-3">
            <div>
              <Label>Email</Label>
              <Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"
                onKeyDown={e=>e.key==='Enter'&&mode==='login'&&signIn()}/>
            </div>
            {mode==='login' && (
              <div>
                <Label>Password</Label>
                <Input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"
                  onKeyDown={e=>e.key==='Enter'&&signIn()}/>

            )}

          <div className="mt-5">
            {mode==='login' && <Button onClick={signIn} loading={loading} className="w-full" size="lg">Sign In</Button>}

          </div>
          <div className="mt-4 text-center text-xs text-gray-500">
            {mode==='login'
              ? <button onClick={()=>setMode('forgot')} className="hover:text-indigo-600 underline">Forgot password?</button>
              : <button onClick={()=>{setMode('login');setSent(false);}} className="hover:text-indigo-600 underline">← Back to sign in</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

      </div>
      <Button onClick={generate} loading={loading} variant="outline" className="w-full">Generate with Claude Haiku</Button>
    </div>
  );
}

// ─────────────────────────────────────────────
// INLINE IMAGE GENERATOR (embedded in PostComposer)
// ─────────────────────────────────────────────
function InlineImageGenerator({ storeId, settings, onGenerated }) {
  const toast = useToast();
  const [mode,        setMode]       = useState('template'); // 'template' | 'lifestyle'
  const [template,    setTemplate]   = useState('classic');
  const [brief,       setBrief]      = useState('');
  const [size,        setSize]       = useState('1024x1024');
  const [prodFile,    setProdFile]   = useState(null);
  const [prodPrev,    setProdPrev]   = useState(null);
  const [saveText,    setSaveText]   = useState('');
  const [priceText,   setPriceText]  = useState('');
  const [productName, setProductName]= useState('');
  const [productSize, setProductSize]= useState('');
  const [nameTouched, setNameTouched] = useState(false);
  const [sizeTouched, setSizeTouched] = useState(false);
  const [genStep,     setGenStep]    = useState('idle');
  const [brand,       setBrand]      = useState({ ...BRAND_DEFAULTS });
  const [logo,        setLogo]       = useState(null);
  const [showLib,     setShowLib]    = useState(false);
  const [lightbox,    setLightbox]   = useState(null);
  const [selectedTpl, setSelectedTpl]= useState(null); // uploaded template object
  const { images:libImages, remove:removeFromLib } = useBrandImageLibrary();
  const { templates: uploadedTpls }  = useBrandTemplates(storeId);
  const { save:saveToQuickLib } = useProductLibrary();
  const prodRef = useRef();

  useEffect(()=>{
    const sb=getSB(); if(!sb) return;
    sb.from('brand_profiles').select('*').eq('store_id',storeId).maybeSingle()
      .then(({data})=>{
        if(data){ const {logo_data,...p}=data; setBrand({...BRAND_DEFAULTS,...p}); setLogo(logo_data||null); }
        else { setBrand({...BRAND_DEFAULTS}); setLogo(null); }
      });
  },[storeId]);

  const handleProd = file => {
    if (!file) return;
    setProdFile(file);
    const r=new FileReader();
    r.onload=async()=>{ setProdPrev(r.result); try { await saveToLib(file.name, r.result); } catch{} };
    r.readAsDataURL(file);
  };

  const selectFromLib = img => {
    setProdPrev(prodSrc(img) || img.data);
    // Only prefill fields the user hasn't typed into — picking a product for
    // its photo shouldn't silently rewrite copy they already wrote.
    if (!nameTouched) setProductName(img.product_name || '');
    if (!sizeTouched) setProductSize(img.size || '');
    fetch(prodSrc(img)||img.data).then(r=>r.blob()).then(blob=>setProdFile(new File([blob],img.product_name||'product',{type:'image/jpeg'}))).catch(()=>{});
    setShowLib(false);
  };

  // ── TEMPLATE MODE: pure Canvas, no AI ──
  const generateTemplate = async () => {
    if (!prodPrev) { toast.error('Upload a product photo first'); return; }
    const store = STORES.find(s=>s.id===storeId);
    try {
      // Field-driven template: the artwork already contains its own panels and
      // badges, so only the positioned boxes get filled.
      if (selectedTpl && selectedTpl.kind === 'price_ad') {
        const sb = getSB();
        const { data: tplFields } = await sb.from('ad_template_fields')
          .select('*').eq('template_id', selectedTpl.id).order('field_order');
        if (!tplFields || tplFields.length === 0) {
          toast.error('That template has no fields yet — set them up under Ad Templates');
          return;
        }
        const rendered = await renderFieldTemplate(
          selectedTpl, tplFields,
          { product_name: productName.trim(), pack_size: productSize.trim(),
            price: priceText.trim(), save: saveText.trim() },
          prodPrev,
          step => setGenStep(step)
        );
        const finalUrl = typeof rendered === 'string' ? rendered : rendered.url;
        const over = typeof rendered === 'string' ? [] : rendered.overflows;
        onGenerated(finalUrl);
        if (over.length) toast.error('Too small to fit: ' + over.join(', ') + ' — enlarge the box in the template');
        else toast.success('Ad created');
        setGenStep('idle');
        if (sb) sb.from('generation_history').insert({
          store_id:storeId, store_name:store?.name, image_url:finalUrl,
          brief:`Template: ${selectedTpl.name}`, size_label:selectedTpl.size_label });
        return;
      }

      setGenStep('removing');
      let cleanProd = prodPrev;
      try { cleanProd = await removeProductBackground(prodPrev); } catch(e) {}

      setGenStep('compositing');
      // Use uploaded template if selected, otherwise fall back to built-in
      const bgDataUrl  = selectedTpl ? selectedTpl.data  : null;
      const canvasW    = selectedTpl ? selectedTpl.canvas_w : 1080;
      const canvasH    = selectedTpl ? selectedTpl.canvas_h : 1080;
      const sizeLabel  = selectedTpl ? selectedTpl.size_label : '1:1 Square';

      const finalUrl = await renderRetailTemplate(
        template,
        { productDataUrl: cleanProd, logoDataUrl: logo, brandPrimary: brand.primary_color||'#1e3a5f', brandAccent: brand.secondary_color||'#c4a35a', bgDataUrl, canvasW, canvasH },
        { saveText: saveText.trim(), priceText: priceText.trim(), productName: productName.trim(), productSize: productSize.trim(), storeName: store?.name||'' }
      );
      onGenerated(finalUrl);
      toast.success('Ad created!');
      setGenStep('idle');
      const sb=getSB();
      if(sb) sb.from('generation_history').insert({ store_id:storeId, store_name:store?.name, image_url:finalUrl, brief:`Template: ${selectedTpl?.name||template}`, size_label: sizeLabel });
    } catch(e) { toast.error(`Failed: ${e.message}`); setGenStep('idle'); }
  };

  // ── LIFESTYLE MODE: AI background + composite ──
  const generateLifestyle = async () => {
    const apiKey = null; // key is server-side; kept for signature compatibility
    const store    = STORES.find(s=>s.id===storeId);
    const storeName= store?.name || 'the store';
    const dalleSize= IMAGE_SIZES.find(s=>s.value===size)?.dalleSize || '1024x1024';
    setGenStep('building');
    try {
      const parts = [`Clean atmospheric background for a retail liquor store campaign in BC, Canada.`];
      if (brand.visual_style)   parts.push(`Visual style: ${brand.visual_style}.`);
      if (brand.mood)           parts.push(`Mood: ${brand.mood}.`);
      if (brand.style_keywords) parts.push(`Keywords: ${brand.style_keywords}.`);
      if (brand.avoid_visually) parts.push(`Avoid: ${brand.avoid_visually}.`);
      if (brief.trim())         parts.push(brief.trim());
      parts.push('NO text, NO bottles, NO products, NO logos, NO prices. Pure background only.');
      const prompt = parts.join(' ');

      setGenStep('generating');
      const img = await openAIGenerateImage(prompt, dalleSize, apiKey);

      let cleanProd = prodPrev;
      if (prodPrev) {
        setGenStep('removing');
        try { cleanProd = await removeProductBackground(prodPrev); } catch(e) {}
      }

      setGenStep('compositing');
      let finalUrl;
      if (prodPrev) {
        const priceOpts = { saveText: saveText.trim(), priceText: priceText.trim(), primaryColor: brand.primary_color, accentColor: brand.secondary_color };
        finalUrl = await compositeProductAndLogo(img.url, cleanProd, logo, priceOpts);
      } else {
        finalUrl = logo ? await compositeLogoOnImage(img.url, logo) : img.url;
      }

      onGenerated(finalUrl);
      toast.success('Image generated!');
      setGenStep('idle');
      const sb=getSB();
      if(sb) sb.from('generation_history').insert({ store_id:storeId, store_name:storeName, image_url:finalUrl, revised_prompt:img.revised, brief, size_label:size, prompt });
    } catch(e) { toast.error(e.message); setGenStep('idle'); }
  };

  const generate  = mode === 'template' ? generateTemplate : generateLifestyle;
  const isBusy    = genStep !== 'idle';
  const stepLabel = { building:'Building prompt…', generating:'Generating…', removing:'Removing background…', compositing:'Building ad…' };

  const clearProduct = () => { setProdFile(null); setProdPrev(null); setSaveText(''); setPriceText(''); setProductName(''); setProductSize(''); };

  return (
    <>
    {lightbox && <Lightbox src={lightbox} onClose={()=>setLightbox(null)}/>}
    <div className="rounded-xl border border-indigo-200 dark:border-indigo-800 bg-indigo-50 dark:bg-indigo-950/30 p-4 space-y-3">
      <p className="text-xs font-bold text-indigo-700 dark:text-indigo-300 uppercase tracking-widest"><Icon name="palette"/> Image Creator</p>

      {/* Mode toggle */}
      <div className="flex rounded-lg overflow-hidden border border-indigo-300 dark:border-indigo-700">
        <button onClick={()=>setMode('template')} className={`flex-1 py-2 text-xs font-bold transition-colors ${mode==='template'?'bg-indigo-600 text-white':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700'}`}>
          <Icon name="note"/> Price Ad
        </button>
        <button onClick={()=>setMode('lifestyle')} className={`flex-1 py-2 text-xs font-bold transition-colors ${mode==='lifestyle'?'bg-indigo-600 text-white':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700'}`}>
          <Icon name="palette"/> Lifestyle (AI)
        </button>
      </div>

      {/* ── TEMPLATE MODE ── */}
      {mode==='template' && (<>
        {/* Template picker — uploaded first, built-in as fallback */}
        <div>
          <Label>{uploadedTpls.length>0 ? 'Your Templates' : 'Template Style'}</Label>
          {uploadedTpls.length>0 ? (
            <>
              <div className="grid grid-cols-2 gap-2 mb-2">
                {uploadedTpls.map(t=>(
                  <button key={t.id} onClick={()=>setSelectedTpl(t)}
                    className={`rounded-xl border-2 overflow-hidden text-left transition-all ${selectedTpl?.id===t.id?'border-indigo-500 ring-2 ring-indigo-200 dark:ring-indigo-900':'border-gray-200 dark:border-gray-700'}`}>
                    <img src={t.data} alt={t.name} className="w-full aspect-video object-cover"/>
                    <div className="px-2 py-1.5">
                      <p className="text-xs font-semibold text-gray-800 dark:text-gray-200 truncate">{t.name}</p>
                      <p className="text-xs text-gray-400">{t.size_label}</p>
                    </div>
                  </button>
                ))}
                {/* Option to use built-in */}
                <button onClick={()=>setSelectedTpl(null)}
                  className={`rounded-xl border-2 p-2 text-center transition-all ${!selectedTpl?'border-indigo-500 ring-2 ring-indigo-200 dark:ring-indigo-900':'border-gray-200 dark:border-gray-700'}`}>
                  <div className="w-full h-10 rounded mb-1 overflow-hidden flex flex-col">
                    <div className="flex-none h-3" style={{background:'#1e3a5f'}}/>
                    <div className="flex-1 bg-amber-50"/>
                  </div>
                  <span className="text-xs font-semibold text-gray-600 dark:text-gray-400">Built-in Style</span>
                </button>
              </div>
              {!selectedTpl && (
                <div className="grid grid-cols-3 gap-1.5">
                  {RETAIL_TEMPLATES.map(t=>(
                    <button key={t.id} onClick={()=>setTemplate(t.id)}
                      className={`rounded-lg border-2 p-1.5 text-center transition-all ${template===t.id?'border-indigo-400':'border-gray-200 dark:border-gray-700'}`}>
                      <div className="w-full h-6 rounded mb-1 overflow-hidden flex flex-col">
                        <div className="flex-none h-2" style={{background:t.previewBar}}/>
                        <div className="flex-1" style={{background:t.previewBg}}/>
                      </div>
                      <span className="text-xs text-gray-600 dark:text-gray-400">{t.name}</span>
                    </button>
                  ))}
                </div>
              )}
              <p className="text-xs text-gray-400 mt-1.5 italic">
                {selectedTpl ? `Using: ${selectedTpl.name} (${selectedTpl.canvas_w}×${selectedTpl.canvas_h})` : 'Upload templates in Brand → Ad Templates'}
              </p>
            </>
          ) : (
            <>
              <div className="grid grid-cols-3 gap-2">
                {RETAIL_TEMPLATES.map(t=>(
                  <button key={t.id} onClick={()=>setTemplate(t.id)}
                    className={`rounded-lg border-2 p-1.5 text-center transition-all ${template===t.id?'border-indigo-500':'border-gray-200 dark:border-gray-700'}`}>
                    <div className="w-full h-8 rounded mb-1 overflow-hidden flex flex-col">
                      <div className="flex-none h-2.5" style={{background:t.previewBar}}/>
                      <div className="flex-1" style={{background:t.previewBg}}/>
                    </div>
                    <span className="text-xs font-semibold text-gray-700 dark:text-gray-300">{t.name}</span>
                  </button>
                ))}
              </div>
              <p className="text-xs text-indigo-500 dark:text-indigo-400 mt-1.5"><Icon name="bulb"/> Upload your own brand templates under Brand → Ad Templates</p>
            </>
          )}
        </div>

        {/* Product upload */}
        <div>
          <div className="flex items-center justify-between mb-1">
            <Label className="mb-0">Product Photo <span className="text-red-500">*</span></Label>
            {libImages.length>0 && <button onClick={()=>setShowLib(v=>!v)} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">{showLib?'Hide ↑':<React.Fragment><Icon name="book"/> Library ({libImages.length})</React.Fragment>}</button>}
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <Button variant="secondary" size="sm" onClick={()=>prodRef.current?.click()}><Icon name="package"/> Upload Photo</Button>
            {prodPrev && <button onClick={clearProduct} className="text-xs text-red-500 hover:underline"><Icon name="close"/> Clear</button>}
          </div>
          <input ref={prodRef} type="file" accept="image/*" className="hidden" onChange={e=>handleProd(e.target.files[0])}/>
          {prodPrev && <img src={prodPrev} alt="" className="mt-2 h-20 rounded-lg object-contain border border-gray-200 dark:border-gray-600 bg-white p-1"/>}
          {showLib && (
            <div className="mt-2">
              {libImages.length>0 ? (
                <div className="grid grid-cols-4 gap-2">
                  {libImages.map(img=>{
                    const cat=LIQUOR_CATEGORIES.find(c=>c.id===img.category);
                    return (
                      <div key={img.id} className="cursor-pointer group" onClick={()=>selectFromLib(img)}>
                        <img src={img.data} alt={img.product_name}

                        <p className="text-xs text-gray-600 dark:text-gray-400 mt-0.5 truncate font-medium">{img.product_name}</p>
                        <p className="text-xs text-gray-400">{img.size}</p>

        {/* Product details */}

        {/* Price fields */}
        <div className="grid grid-cols-2 gap-2">

        <p className="text-xs text-center text-gray-400 dark:text-gray-500">No AI image generation — fast, clean, brand-accurate</p>

      {/* ── LIFESTYLE MODE ── */}
      {mode==='lifestyle' && (<>
        <div>
          <Label>Scene Brief</Label>
          <Textarea value={brief} onChange={e=>setBrief(e.target.value)} rows={2} placeholder="e.g. warm wooden bar, soft amber lighting, craft whisky vibe — atmosphere only, no products"/>

}

// ─────────────────────────────────────────────
// MODULE 1 — POST COMPOSER
// ─────────────────────────────────────────────
function PostComposer({ settings, pendingImage, onClearPending, visibleStores }) {
  const toast = useToast();
  var myStores = (visibleStores && visibleStores.length > 0) ? visibleStores : STORES;
  const [selected,    setSelected]   = useState([myStores[0].id]);
  const [caption,     setCaption]    = useState('');
  const [imgFile,     setImgFile]    = useState(null);
  const [imgPrev,     setImgPrev]    = useState(null);
  const [genImgUrl,   setGenImgUrl]  = useState(null);
  const [schedule,    setSchedule]   = useState('');
  const [loading,     setLoading]    = useState(false);
  const [showAI,      setShowAI]     = useState(false);
  const [showImgGen,  setShowImgGen] = useState(false);
  const [lightbox,    setLightbox]   = useState(null);
  const [results,     setResults]    = useState([]);
  const [showCreatives, setShowCreatives] = useState(false);
  const [postToFB,    setPostToFB]   = useState(true);
  const [postToIG,    setPostToIG]   = useState(false);
  const [uploading,   setUploading]  = useState(false);

  useEffect(()=>{
    if (pendingImage) { setImgFile(null); setImgPrev(pendingImage); setGenImgUrl(pendingImage); setShowImgGen(false); }
  },[pendingImage]);

  const toggleStore = id => setSelected(p => p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const handleFile = file => {
    if (!file) return;
    setImgFile(file); setGenImgUrl(null);
    const r=new FileReader(); r.onload=()=>setImgPrev(r.result); r.readAsDataURL(file);
    if (onClearPending) onClearPending();
  };

  const clearImage = () => {
    setImgFile(null); setImgPrev(null); setGenImgUrl(null);
    if (onClearPending) onClearPending();
  };

  const handleGenerated = (url) => {
    setGenImgUrl(url); setImgPrev(url); setImgFile(null);
    setShowImgGen(false);
    if (onClearPending) onClearPending();
  };

  const post = async () => {
    if (!caption.trim())     { toast.error('Write a caption first'); return; }
    if (selected.length===0) { toast.error('Select at least one store'); return; }
    if (!postToFB && !postToIG) { toast.error('Choose Facebook, Instagram, or both'); return; }
    if (postToIG && !imgFile && !genImgUrl && !pendingImage) {
      toast.error('Instagram requires an image'); return;
    }
    if (schedule) {
      const ts = new Date(schedule).getTime();
      if (ts < Date.now()+10*60*1000) { toast.error('Scheduled time must be at least 10 minutes in the future'); return; }
    }

    setLoading(true); setResults([]);

    // Upload image to Storage first if we have one (gives a stable public URL for Meta)
    var imageUrl = null;
    var activeImgUrl = genImgUrl || (pendingImage&&!imgFile?pendingImage:null);
    if (imgFile || activeImgUrl) {
      try {
        setUploading(true);
        imageUrl = await uploadImageToStorage(imgFile || activeImgUrl);
      } catch(uploadErr) {
        toast.error('Image upload failed: ' + uploadErr.message);
        setLoading(false); setUploading(false); return;
      } finally { setUploading(false); }
    }

    const publishTo = [];
    if (postToFB) publishTo.push('facebook');
    if (postToIG && imageUrl) publishTo.push('instagram');
    if (publishTo.length === 0) {
      toast.error('Instagram needs an image — nothing to publish');
      setLoading(false); return;
    }

    try {
      if (schedule) {
        // Schedule via edge function + DB
        var sched = await callEdge('meta-social', 'schedule', {
          storeIds: selected,
          caption: caption,
          imageUrl: imageUrl,
          publishTo: publishTo,
          scheduledAt: new Date(schedule).toISOString(),
        });
        setResults(selected.map(id => ({ store: (STORES.find(s=>s.id===id)||{}).name||id, success:true, scheduled:true })));
        toast.success('Post scheduled!');
      } else {
        // Publish now via edge function
        var result = await callEdge('meta-social', 'publish', {
          storeIds: selected,
          caption: caption,
          imageUrl: imageUrl,
          publishTo: publishTo,
        });
        var res = (result.results || []).map(function(r) {
          var storeName = (STORES.find(s=>s.id===r.storeId)||{}).name || r.storeId;
          return { store: storeName, success: r.success, postId: r.fbPostId, igPostId: r.igPostId, error: r.error, igError: r.igError };
        });
        setResults(res);
        res.forEach(function(r) {
          if (r.success) {
            var where = (r.postId && r.igPostId) ? 'Facebook + Instagram'
                      : r.postId ? 'Facebook'
                      : 'Instagram';
            toast.success(r.store + ': Published to ' + where);
          } else if (r.error) {
            toast.error(r.store + ': ' + r.error);
          }
          // Channel-level warnings never contradict the success toast above.
          if (r.success && r.error) toast.error(r.store + ' Facebook: ' + r.error);
          if (r.igError) toast.error(r.store + ' Instagram: ' + r.igError);
        });
      }
      setCaption(''); setImgFile(null); setImgPrev(null); setGenImgUrl(null); setSchedule('');
      if (onClearPending) onClearPending();
    } catch(e) {
      toast.error('Failed: ' + e.message);
    }
    setLoading(false);
  };

  const activeStoreId = selected.length===1 ? selected[0] : myStores[0].id;
  const activeStore   = (STORES.find(s=>s.id===activeStoreId)||{}).name || 'our store';

  return (
    <>
    {lightbox && <Lightbox src={lightbox} onClose={()=>setLightbox(null)}/>}
    <Card>
      <h2 className="text-base font-bold text-gray-900 dark:text-white mb-4"><Icon name="note"/> Compose Post</h2>
      <div className="mb-4">
        <Label>Stores</Label>
        <div className="grid grid-cols-2 gap-2">
          {myStores.map(s => (
            <label key={s.id} className={`flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer text-sm transition-all
              ${selected.includes(s.id)?'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-800 dark:text-indigo-200 shadow-sm':'border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:border-indigo-300'}`}>
              <input type="checkbox" className="rounded" checked={selected.includes(s.id)} onChange={()=>toggleStore(s.id)}/>
              <span className="leading-tight">{s.name}</span>
            </label>
          ))}
        </div>
      </div>
      <div className="mb-4">
        <Label>Publish to</Label>
        <div className="grid grid-cols-2 gap-2">
          <label className={`flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer text-sm transition-all
            ${postToFB?'border-blue-500 bg-blue-50 dark:bg-blue-950/50 text-blue-800 dark:text-blue-200 shadow-sm':'border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:border-blue-300'}`}>
            <input type="checkbox" className="rounded accent-blue-600" checked={postToFB} onChange={e=>setPostToFB(e.target.checked)}/>
            <span className="leading-tight"><Icon name="fb"/> Facebook</span>
          </label>
          <label className={`flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer text-sm transition-all
            ${postToIG?'border-pink-500 bg-pink-50 dark:bg-pink-950/50 text-pink-800 dark:text-pink-200 shadow-sm':'border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:border-pink-300'}`}>
            <input type="checkbox" className="rounded accent-pink-500" checked={postToIG} onChange={e=>setPostToIG(e.target.checked)}/>
            <span className="leading-tight"><Icon name="ig"/> Instagram <span className="text-gray-400 text-xs">(needs image)</span></span>
          </label>
        </div>
        {!postToFB && !postToIG && (
          <p className="text-xs text-red-500 mt-1.5">Choose at least one destination.</p>
        )}
        {postToIG && !imgFile && !genImgUrl && !pendingImage && (
          <p className="text-xs text-amber-600 dark:text-amber-400 mt-1.5">Instagram needs an image — add one below.</p>
        )}
      </div>
      <div className="mb-3">
        <div className="flex items-center justify-between mb-1">
          <Label className="mb-0">Caption</Label>
          <button onClick={()=>setShowAI(v=>!v)} className="text-xs font-semibold text-violet-600 dark:text-violet-400 hover:underline">{showAI?'Hide AI Writer ↑':<React.Fragment><Icon name="spark"/> AI Writer</React.Fragment>}</button>
        </div>
        <Textarea value={caption} onChange={e=>setCaption(e.target.value)} rows={4} placeholder="What's happening at the store?"/>
        <p className="text-xs text-gray-400 mt-1 text-right">{caption.length} chars</p>
        <p className="text-xs text-gray-400 dark:text-gray-500 mt-1 italic">↳ <span className="text-gray-500 dark:text-gray-400">Auto-appended:</span> Prices exclude tax &amp; deposit - while supplies last</p>
      </div>
      {showAI && <div className="mb-4"><AIWriter storeName={activeStore} mode="caption" onResult={t=>setCaption(t)}/></div>}

      {/* Image section */}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-2">
          <Label className="mb-0">Image</Label>
          <div className="flex gap-3 items-center">
            <button onClick={()=>setShowCreatives(true)} className="text-xs font-semibold hover:underline" style={{color:'var(--cy)'}}><Icon name="image"/> Creative library</button>
            <button onClick={()=>setShowImgGen(v=>!v)} className="text-xs font-semibold hover:underline" style={{color:'var(--vio)'}}>{showImgGen?'Hide Generator ↑':<React.Fragment><Icon name="palette"/> Generate with AI</React.Fragment>}</button>
          </div>
        </div>

        {/* Generated image preview */}
        {(genImgUrl||(pendingImage&&!imgFile)) && (
          <div className="mb-3">
            <div className="relative inline-block group">
              <img src={genImgUrl||pendingImage} alt="" onClick={()=>setLightbox(genImgUrl||pendingImage)}
                className="h-36 rounded-xl object-cover border border-indigo-300 dark:border-indigo-600 shadow-sm cursor-zoom-in hover:opacity-90 transition-opacity"/>
              <button onClick={clearImage} className="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center hover:bg-red-600"><Icon name="close" size={12}/></button>
              <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                <span className="bg-black/50 text-white text-xs px-2 py-1 rounded-lg">Click to enlarge</span>
              </div>
            </div>
            <p className="text-xs text-amber-600 dark:text-amber-400 mt-1"><Icon name="warn" className="text-amber-400"/> Post soon — image may expire.</p>
          </div>
        )}

        {/* File upload (shown when no generated image) */}
        {!genImgUrl && !(pendingImage&&!imgFile) && (
          <ImagePicker file={imgFile} preview={imgPrev} onFile={handleFile} onClear={clearImage} label="Upload Image"/>
        )}

        {showCreatives && (
          <CreativePicker allowed={POST_ASPECTS} storeIds={selected}
            onPick={c=>{ setGenImgUrl(c.public_url); setImgPrev(c.public_url); setImgFile(null); }}
            onClose={()=>setShowCreatives(false)}/>
        )}

        {/* Inline generator */}
        {showImgGen && (
          <div className="mt-3">
            <InlineImageGenerator storeId={activeStoreId} settings={settings} onGenerated={handleGenerated}/>
          </div>
        )}
      </div>

      <div className="mb-5">
        <Label>Schedule (leave blank to post immediately)</Label>
        <Input type="datetime-local" value={schedule} onChange={e=>setSchedule(e.target.value)}/>
      </div>
      {uploading && <p className="text-xs text-indigo-500 dark:text-indigo-400 mb-2 text-center"><Icon name="up"/> Uploading image…</p>}
      <Button onClick={post} loading={loading} className="w-full" size="lg">
        {schedule?<React.Fragment><Icon name="cal"/> Schedule Post</React.Fragment>:<React.Fragment><Icon name="rocket"/> Publish Now</React.Fragment>}
      </Button>
      {results.length>0 && (
        <div className="mt-4 space-y-2">
          <Divider label="Results"/>
          {results.map((r,i) => (
            <div key={i} className={`flex flex-col gap-1 text-sm p-3 rounded-xl ${r.success?'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-300':'bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-400'}`}>
              <div className="flex items-center justify-between">
                <span>
                  <Icon name={r.success?"check":"cross"} style={{color:r.success?"var(--grn)":"var(--red)"}}/> {r.store} — {
                    !r.success ? (r.error || 'Not published')
                    : r.scheduled ? 'Scheduled'
                    : (r.postId && r.igPostId) ? 'Published to Facebook + Instagram'
                    : r.postId ? 'Published to Facebook'
                    : r.igPostId ? 'Published to Instagram'
                    : 'Published'
                  }
                </span>
                {r.postId && <a href={fbPostUrl(r.postId)} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline ml-3 whitespace-nowrap">FB →</a>}
                {r.igPostId && <a href={'https://www.instagram.com/p/'+r.igPostId} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-pink-600 dark:text-pink-400 hover:underline ml-1 whitespace-nowrap">IG →</a>}
              </div>
              {r.success && r.error && <p className="text-xs text-amber-600 dark:text-amber-400"><Icon name="warn" className="text-amber-400"/> Facebook: {r.error}</p>}
              {r.igError && <p className="text-xs text-amber-600 dark:text-amber-400"><Icon name="warn" className="text-amber-400"/> Instagram: {r.igError}</p>}
            </div>
          ))}
        </div>
      )}
    </Card>
    </>
  );
}

// MODULE 1 — POST HISTORY
// ─────────────────────────────────────────────
function PostHistory({ settings, visibleStores }) {
  const toast   = useToast();
  var myStores = (visibleStores && visibleStores.length > 0) ? visibleStores : STORES;
  const [storeId, setStoreId] = useState(myStores[0].id);
  const [posts,   setPosts]   = useState([]);
  const [loading, setLoading] = useState(false);
  const [loaded,  setLoaded]  = useState(false);

  useEffect(function(){setLoaded(false);setPosts([]);},[storeId]);

  const load = async () => {
    setLoading(true);
    try {
      var result = await callEdge('meta-social', 'listPosts', { storeId: storeId });
      setPosts(result.posts || []);
      setLoaded(true);
    } catch(e) { toast.error('Failed to load posts: ' + e.message); }
    finally    { setLoading(false); }
  };

  return (
    <Card>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <h2 className="text-base font-bold text-gray-900 dark:text-white flex-1"><Icon name="note"/> Post History</h2>
        <Select value={storeId} onChange={e=>setStoreId(e.target.value)} className="w-auto text-xs">{myStores.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</Select>
        <Button variant="secondary" size="sm" onClick={load} loading={loading}>{loaded?'Refresh':'Load Posts'}</Button>
      </div>
      {!loaded&&!loading && <div className="text-center py-10 text-gray-400 dark:text-gray-500 text-sm">Select a store and click Load Posts</div>}
      {loaded&&posts.length===0 && <div className="text-center py-10 text-gray-400 dark:text-gray-500 text-sm">No posts found.</div>}
      <div className="space-y-3 max-h-[480px] overflow-y-auto pr-1">
        {posts.map(function(p) {
          var text = p.message||p.story||'(no text)';
          var likesCount = p.likes && p.likes.summary ? (p.likes.summary.total_count || 0) : 0;
          var commentsCount = p.comments && p.comments.summary ? (p.comments.summary.total_count || 0) : 0;
          var sharesCount = p.shares ? (p.shares.count || 0) : 0;
          return (
            <div key={p.id} className="flex gap-3 p-3 rounded-xl border border-gray-100 dark:border-gray-700 hover:border-indigo-200 dark:hover:border-indigo-700 transition-colors">
              {p.full_picture && <img src={p.full_picture} alt="" className="w-16 h-16 rounded-lg object-cover flex-shrink-0 border border-gray-200 dark:border-gray-600"/>}
              <div className="flex-1 min-w-0">
                <p className="text-sm text-gray-800 dark:text-gray-200 line-clamp-3 leading-snug">{text}</p>
                <p className="text-xs text-gray-400 mt-1">{fmtDate(p.created_time)}</p>
                <div className="flex items-center gap-3 mt-1.5 flex-wrap">
                  <span className="text-xs text-gray-500 dark:text-gray-400"><Icon name="thumb"/> {likesCount}</span>
                  <span className="text-xs text-gray-500 dark:text-gray-400"><Icon name="comment"/> {commentsCount}</span>
                  {sharesCount>0 && <span className="text-xs text-gray-500 dark:text-gray-400"><Icon name="share"/> {sharesCount}</span>}
                  <a href={p.permalink_url||fbPostUrl(p.id)} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline ml-auto">Open →</a>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

// MODULE 2 — CAMPAIGN BUILDER
// ─────────────────────────────────────────────
function CampaignBuilder({ settings }) {
  const toast = useToast();
  const [storeId,     setStoreId]     = useState(STORES[0].id);
  const [objective,   setObjective]   = useState('OUTCOME_AWARENESS');
  const [campName,    setCampName]    = useState('');
  const [dailyBudget, setDailyBudget] = useState('20');
  const [lat,         setLat]         = useState(String(STORES[0].lat));
  const [lng,         setLng]         = useState(String(STORES[0].lng));
  const [radius,      setRadius]      = useState('25');
  const [ageMin,      setAgeMin]      = useState('21');
  const [ageMax,      setAgeMax]      = useState('65');
  const [placements,  setPlacements]  = useState(['facebook_feed']);
  const [headline,    setHeadline]    = useState('');
  const [bodyText,    setBodyText]    = useState('');
  const [ctaType,     setCtaType]     = useState('LEARN_MORE');
  const [destUrl,     setDestUrl]     = useState('');
  const [showAdCreatives, setShowAdCreatives] = useState(false);
  const [adCreativeUrl, setAdCreativeUrl] = useState(null);
  const [adImg,       setAdImg]       = useState(null);
  const [adImgPrev,   setAdImgPrev]   = useState(null);
  const [showAI,      setShowAI]      = useState(false);
  const [steps,       setSteps]       = useState([]);
  const [running,     setRunning]     = useState(false);

  const store = STORES.find(s=>s.id===storeId);

  useEffect(()=>{ const s=STORES.find(x=>x.id===storeId); if(s){setLat(String(s.lat));setLng(String(s.lng));} },[storeId]);

  const togglePlacement = p => setPlacements(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);

  const handleAI = (text) => {
    const lines = text.split('\n');
    for (const ln of lines) {
      if (ln.startsWith('HEADLINE:')) setHeadline(ln.replace('HEADLINE:','').trim().slice(0,25));
      if (ln.startsWith('BODY:'))     setBodyText(ln.replace('BODY:','').trim().slice(0,125));
    }
  };

  const addStep    = (label,status='pending',detail='') => setSteps(p=>[...p,{label,status,detail}]);
  const finishStep = (status,detail='') => setSteps(p=>{ const a=[...p]; a[a.length-1]={...a[a.length-1],status,detail}; return a; });

  const launch = async () => {
    if (!campName.trim())  { toast.error('Enter a campaign name'); return; }
    if (!headline.trim()||!bodyText.trim()) { toast.error('Enter headline and body copy'); return; }
    if (placements.length===0) { toast.error('Select at least one placement'); return; }

    setRunning(true); setSteps([{ label: 'Sending to server…', status: 'running', detail: '' }]);

    try {
      // Upload ad image to Storage first if provided
      var imageUrl = null;
      if (adCreativeUrl) {
        imageUrl = adCreativeUrl;
      } else if (adImg) {
        setSteps([{ label: 'Uploading image…', status: 'running', detail: '' }]);
        imageUrl = await uploadImageToStorage(adImg);
      }

      var result = await callEdge('meta-ads', 'createCampaign', {
        storeId: storeId,
        campName: store.name + ' — ' + campName,
        objective: objective,
        dailyBudget: parseFloat(dailyBudget) || 20,
        lat: parseFloat(lat) || store.lat,
        lng: parseFloat(lng) || store.lng,
        radius: parseInt(radius) || 25,
        ageMin: parseInt(ageMin) || 21,
        ageMax: parseInt(ageMax) || 65,
        placements: placements,
        headline: headline,
        bodyText: bodyText,
        ctaType: ctaType,
        destUrl: destUrl,
        imageUrl: imageUrl,
      });
      setSteps(result.steps || []);
      toast.success('Campaign created!');
    } catch(e) {
      setSteps(function(p) { var a=[...p]; if(a.length) a[a.length-1]={...a[a.length-1],status:'error',detail:e.message}; return a; });
      toast.error('Failed: ' + e.message);
    }
    finally    { setRunning(false); }
  };

  return (
    <div className="space-y-4">
      <Card>
        <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-4 uppercase tracking-wide">Campaign</h3>
        <div className="grid grid-cols-2 gap-4">
          <div><Label>Store</Label><Select value={storeId} onChange={e=>setStoreId(e.target.value)}>{STORES.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</Select></div>
          <div><Label>Objective</Label><Select value={objective} onChange={e=>setObjective(e.target.value)}>{AD_OBJECTIVES.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</Select></div>
          <div><Label>Campaign Name</Label><Input value={campName} onChange={e=>setCampName(e.target.value)} placeholder="Summer Whiskey Sale"/></div>
          <div><Label>Daily Budget (CAD $)</Label><Input type="number" min="1" step="1" value={dailyBudget} onChange={e=>setDailyBudget(e.target.value)}/></div>
        </div>
      </Card>
      <Card>
        <h3 className="text-sm font-bold text-gray-900 dark:text-white mb-4 uppercase tracking-wide">Ad Set &amp; Targeting</h3>
        <div className="grid grid-cols-3 gap-3 mb-4">
          <div><Label>Latitude</Label><Input value={lat} onChange={e=>setLat(e.target.value)} placeholder="50.6745"/></div>
          <div><Label>Longitude</Label><Input value={lng} onChange={e=>setLng(e.target.value)} placeholder="-120.3273"/></div>
          <div><Label>Radius (km)</Label><Input type="number" min="1" max="80" value={radius} onChange={e=>setRadius(e.target.value)}/></div>
          <div><Label>Min Age</Label><Input type="number" min="18" max="65" value={ageMin} onChange={e=>setAgeMin(e.target.value)}/></div>
          <div><Label>Max Age</Label><Input type="number" min="18" max="65" value={ageMax} onChange={e=>setAgeMax(e.target.value)}/></div>
        </div>
        <div><Label>Placements</Label>
          <div className="flex gap-2 flex-wrap">
            {AD_PLACEMENTS.map(p => (
              <label key={p.value} className={`flex items-center gap-2 px-3 py-2 rounded-xl border cursor-pointer text-sm transition-all
                ${placements.includes(p.value)?'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400'}`}>
                <input type="checkbox" className="rounded" checked={placements.includes(p.value)} onChange={()=>togglePlacement(p.value)}/>{p.label}
              </label>
            ))}
          </div>
        </div>
      </Card>
      <Card>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-sm font-bold text-gray-900 dark:text-white uppercase tracking-wide">Ad Creative</h3>
          <button onClick={()=>setShowAI(v=>!v)} className="text-xs font-semibold text-violet-600 dark:text-violet-400 hover:underline">{showAI?'Hide AI ↑':<React.Fragment><Icon name="spark"/> AI Copy</React.Fragment>}</button>
        </div>
        {showAI && <div className="mb-4"><AIWriter storeName={store.name} mode="ad" onResult={handleAI}/></div>}
        <div className="space-y-3">
          <div><Label>Headline <span className="text-gray-400 font-normal normal-case">({headline.length}/25)</span></Label><Input value={headline} onChange={e=>setHeadline(e.target.value)} maxLength={25} placeholder="Shop Our Whiskey Sale"/></div>
          <div><Label>Primary Text</Label><Textarea value={bodyText} onChange={e=>setBodyText(e.target.value)} rows={3} placeholder="Discover amazing local spirits…"/></div>
          <div className="grid grid-cols-2 gap-3">
            <div><Label>Call to Action</Label><Select value={ctaType} onChange={e=>setCtaType(e.target.value)}>{CTA_OPTIONS.map(c=><option key={c} value={c}>{c.replace(/_/g,' ')}</option>)}</Select></div>
            <div><Label>Destination URL</Label><Input value={destUrl} onChange={e=>setDestUrl(e.target.value)} placeholder="https://yourstore.com" type="url"/></div>
          </div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <Label className="mb-0">Ad Image (optional)</Label>
              <button onClick={()=>setShowAdCreatives(true)} className="text-xs font-semibold hover:underline" style={{color:'var(--cy)'}}>
                <Icon name="image"/> Creative library
              </button>
            </div>
            <ImagePicker file={adImg} preview={adImgPrev} onFile={f=>{setAdCreativeUrl(null);setAdImg(f);const r=new FileReader();r.onload=()=>setAdImgPrev(r.result);r.readAsDataURL(f);}} onClear={()=>{setAdImg(null);setAdImgPrev(null);setAdCreativeUrl(null);}} label=""/>
            {showAdCreatives && (
              <CreativePicker allowed={AD_ASPECTS} storeIds={storeId?[storeId]:null}
                onPick={c=>{ setAdCreativeUrl(c.public_url); setAdImgPrev(c.public_url); setAdImg(null); }}
                onClose={()=>setShowAdCreatives(false)}/>
            )}
          </div>
        </div>
      </Card>
      {steps.length>0 && <Card><h3 className="text-sm font-bold text-gray-900 dark:text-white mb-3 uppercase tracking-wide">Build Progress</h3><StepIndicator steps={steps}/></Card>}
      <Button onClick={launch} loading={running} className="w-full" size="lg"><Icon name="rocket"/> Create Campaign (starts Paused)</Button>
    </div>
  );
}

// MODULE 2 — CAMPAIGN DASHBOARD
// ─────────────────────────────────────────────
function CampaignDashboard({ settings }) {
  const toast = useToast();
  const [campaigns,  setCampaigns]  = useState([]);
  const [loading,    setLoading]    = useState(false);
  const [filter,     setFilter]     = useState('all');
  const [togglingId, setTogglingId] = useState(null);

  const [adStore, setAdStore] = useState(STORES[0]?.id || '');

  const load = async () => {
    if (!adStore) return;
    setLoading(true);
    try {
      var result = await callEdge('meta-ads', 'listCampaigns', { storeId: adStore });
      setCampaigns(result.campaigns || []);
    } catch(e) { setCampaigns([]); toast.error('Failed: ' + e.message); }
    finally    { setLoading(false); }
  };

  useEffect(function(){ load(); },[adStore]);

  const toggleStatus = async (camp) => {
    var newStatus = camp.status==='ACTIVE' ? 'PAUSED' : 'ACTIVE';
    setTogglingId(camp.id);
    try {
      await callEdge('meta-ads', 'toggleCampaign', { campaignId: camp.id, newStatus: newStatus });
      setCampaigns(function(p) { return p.map(function(c) { return c.id===camp.id ? Object.assign({},c,{status:newStatus}) : c; }); });
      toast.success('Campaign ' + (newStatus==='ACTIVE'?'resumed':'paused'));
    } catch(e) { toast.error('Failed: ' + e.message); }
    finally    { setTogglingId(null); }
  };

  const storeOf = function(name) { return STORES.find(function(s) { return (name||'').startsWith('['+s.name+']'); }); };
  const filtered = filter==='all' ? campaigns : campaigns.filter(function(c) { var s=storeOf(c.name); return s && s.id===filter; });
  const insight  = function(c,f) { return c.insights && c.insights.data && c.insights.data[0] ? (c.insights.data[0][f] || null) : null; };
  const statusColor = function(s) { return ({ACTIVE:'green',PAUSED:'yellow',DELETED:'red',ARCHIVED:'gray'}[s]||'gray'); };

  return (
    <Card>
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <h2 className="text-base font-bold text-gray-900 dark:text-white flex-1"><Icon name="chart"/> Campaign Dashboard</h2>
        {/* Each store has its own ad account, so campaigns are fetched per store. */}
        <Select value={adStore} onChange={e=>setAdStore(e.target.value)} className="w-auto text-xs">
          {STORES.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </Select>
        <Select value={filter} onChange={e=>setFilter(e.target.value)} className="w-auto text-xs">
          <option value="all">All Campaigns</option>
          {STORES.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </Select>
        <Button variant="secondary" size="sm" onClick={load} loading={loading}>Refresh</Button>
      </div>
      {!loading&&filtered.length===0 && <div className="text-center py-12 text-gray-400 dark:text-gray-500 text-sm">No campaigns found.</div>}
      {filtered.length>0 && (
        <div className="overflow-x-auto -mx-1">
          <table className="w-full text-sm min-w-[700px]">
            <thead>
              <tr className="border-b border-gray-100 dark:border-gray-700">
                {['Campaign','Store','Status','Budget/day','Spend','Impressions','CTR',''].map(h=>(
                  <th key={h} className="text-left py-2 px-3 text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide whitespace-nowrap">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-50 dark:divide-gray-700/50">
              {filtered.map(c => {
                const s=storeOf(c.name);
                const displayName=s?c.name.replace(`[${s.name}] `,''):c.name;
                const spend=insight(c,'spend'), imps=insight(c,'impressions'), ctr=insight(c,'ctr');
                return (
                  <tr key={c.id} className="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors">
                    <td className="py-3 px-3"><p className="font-medium text-gray-900 dark:text-gray-100 max-w-[180px] truncate" title={displayName}>{displayName}</p><p className="text-xs text-gray-400 font-mono">{c.id}</p></td>
                    <td className="py-3 px-3">{s?<Badge color="indigo">{s.name.split(' ')[0]}</Badge>:<span className="text-xs text-gray-400">—</span>}</td>
                    <td className="py-3 px-3"><Badge color={statusColor(c.status)}>{c.status}</Badge></td>
                    <td className="py-3 px-3 text-gray-700 dark:text-gray-300">{fmtBudget(c.daily_budget)}</td>
                    <td className="py-3 px-3 text-gray-700 dark:text-gray-300">{spend!==null?`$${parseFloat(spend).toFixed(2)}`:'—'}</td>
                    <td className="py-3 px-3 text-gray-700 dark:text-gray-300">{imps!==null?fmtNum(imps):'—'}</td>
                    <td className="py-3 px-3 text-gray-700 dark:text-gray-300">{ctr!==null?fmtCTR(ctr):'—'}</td>
                    <td className="py-3 px-3"><Button variant={c.status==='ACTIVE'?'danger':'success'} size="sm" loading={togglingId===c.id} onClick={()=>toggleStatus(c)}>{c.status==='ACTIVE'?'Pause':'Resume'}</Button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </Card>
  );
}

// ─────────────────────────────────────────────
// PRODUCT LIBRARY
// ─────────────────────────────────────────────
function ProductLibrary() {
  const toast    = useToast();
  const [catFilter,   setCatFilter]   = useState('all');
  const [editId,      setEditId]      = useState(null);
  const [search,      setSearch]      = useState('');
  const [showBCL,     setShowBCL]     = useState(false);
  const [bclSku,      setBclSku]      = useState(null);
  const [bclAlt,      setBclAlt]      = useState('');
  const [importedUrl, setImportedUrl] = useState(null);
  const [showForm,    setShowForm]    = useState(false);
  const [formImg,     setFormImg]     = useState(null);
  const [formPrev,    setFormPrev]    = useState(null);
  const [formName,    setFormName]    = useState('');
  const [formSize,    setFormSize]    = useState('750ml');
  const [formCat,     setFormCat]     = useState('');
  const [formNotes,   setFormNotes]   = useState('');
  const [saving,      setSaving]      = useState(false);
  const [deleting,    setDeleting]    = useState(null);
  const fileRef = useRef();
  const { images, add, update, remove } = useBrandImageLibrary();

  const handleFile = file => {
    if (!file) return;
    setFormImg(file);
    const r=new FileReader(); r.onload=()=>setFormPrev(r.result); r.readAsDataURL(file);
  };

  const resetForm = () => {
    setFormImg(null); setFormPrev(null); setFormName(''); setFormSize('750ml'); setFormCat(''); setFormNotes(''); setShowForm(false); setEditId(null); setBclSku(null); setBclAlt(''); setImportedUrl(null);
  };

  const applyImport = ({ image_url, image_alt, product }) => {
    setImportedUrl(image_url);
    setFormPrev(image_url);
    setFormImg(null);
    setBclSku(product.sku);
    // Don't overwrite anything already typed.
    if (!formName.trim())  setFormName(product.name || '');
    if (!formNotes.trim() && product.package_size) setFormNotes(product.package_size);
    if (!bclAlt.trim())    setBclAlt(image_alt || '');
    const matched = BOTTLE_SIZES.find(b => (product.package_size||'').includes(b));
    if (matched) setFormSize(matched);
    setShowBCL(false);
    setShowForm(true);
  };

  const startEdit = (prod) => {
    setEditId(prod.id);
    setFormName(prod.product_name || '');
    setFormSize(prod.size || '750ml');
    setFormCat(prod.category || '');
    setFormNotes(prod.notes || '');
    setFormPrev(prod.image_url || prod.data || null);
    setFormImg(null);
    setBclSku(prod.bcliquor_sku || null);
    setBclAlt(prod.image_alt || '');
    setImportedUrl(prod.image_url || null);
    setShowForm(true);
    window.scrollTo({ top:0, behavior:'smooth' });
  };

  const saveProduct = async () => {
    if (!editId && !formImg && !importedUrl) { toast.error('Upload a product image or import one'); return; }
    if (!formName.trim())    { toast.error('Enter a product name'); return; }
    if (!formCat)            { toast.error('Select a category'); return; }
    setSaving(true);
    try {
      const fields = { product_name:formName.trim(), size:formSize, category:formCat, notes:formNotes.trim() };
      // Provenance from a BCLIQUOR import — never blank out an existing value.
      if (bclSku)          fields.bcliquor_sku = bclSku;
      if (importedUrl)     fields.image_url    = importedUrl;
      if (bclAlt.trim())   fields.image_alt    = bclAlt.trim();
      if (editId) {
        // Only send a new image if one was actually chosen this time.
        if (formImg) fields.data = formPrev;
        await update(editId, fields);
        toast.success('Product updated');
      } else {
        await add({ ...fields, data: importedUrl ? null : formPrev });
        toast.success('Product added to library');
      }
      resetForm();
    } catch(e) { toast.error(e.message); }
    finally { setSaving(false); }
  };

  const deleteProduct = async (id) => {
    setDeleting(id);
    try { await remove(id); toast.success('Removed.'); }
    catch(e) { toast.error(e.message); }
    finally { setDeleting(null); }
  };

  const catCounts = {};
  images.forEach(i=>{ catCounts[i.category]=(catCounts[i.category]||0)+1; });
  const q = search.trim().toLowerCase();
  const filtered = images
    .filter(i=>catFilter==='all' || i.category===catFilter)
    .filter(i=>!q || (i.product_name||'').toLowerCase().includes(q) || (i.notes||'').toLowerCase().includes(q));
  const usedCats = LIQUOR_CATEGORIES.filter(c=>catCounts[c.id]);

  return (
    <div className="space-y-4">
      {/* Header */}
      <div className="flex items-center gap-3 flex-wrap">
        <div>
          <span className="ttl">Product Library</span>
          <p className="lbl mt-1">Shared across all four stores</p>
        </div>
        <Input value={search} onChange={e=>setSearch(e.target.value)}
               placeholder="Search products…" className="max-w-xs text-sm"/>
        <div className="flex-1"/>
        <Button onClick={()=>setShowBCL(v=>!v)} variant={showBCL?'secondary':'outline'} size="sm">
          <Icon name="search"/> {showBCL ? 'Hide BC Liquor' : 'Import from BC Liquor'}
        </Button>
        <Button onClick={()=>{ setEditId(null); resetForm(); setShowForm(v=>!v); }} variant={showForm?'secondary':'primary'} size="sm">
          {showForm?<React.Fragment><Icon name="close"/> Cancel</React.Fragment>:<React.Fragment><Icon name="tag"/> Add Product</React.Fragment>}
        </Button>
      </div>

      {showBCL && <BCLiquorSearch onImported={applyImport}/>}

      {/* Add product form */}
      {showForm && (
        <Card className="border-2 border-indigo-200 dark:border-indigo-700">
          <h3 className="ttl mb-4">{editId ? 'Edit Product' : 'Add Product'}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {/* Image upload */}
            <div className="sm:col-span-2">
              <Label>{editId ? 'Product Photo — leave as-is to keep current' : 'Product Photo'}</Label>
              <div className="flex items-center gap-3 flex-wrap">
                <Button variant="secondary" size="sm" onClick={()=>fileRef.current?.click()}><Icon name="cam"/> Choose Image</Button>
                {formImg && <span className="text-xs text-gray-500 truncate max-w-xs">{formImg.name}</span>}
                {formImg && <button onClick={()=>{setFormImg(null);setFormPrev(null);}} className="text-xs text-red-500 hover:underline">Remove</button>}
              </div>
              <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={e=>handleFile(e.target.files[0])}/>
              {formPrev && <img src={formPrev} alt="" className="mt-2 h-28 rounded-xl object-contain border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 p-1"/>}
            </div>
            <div>
              <Label>Product Name</Label>
              <Input value={formName} onChange={e=>setFormName(e.target.value)} placeholder="e.g. Maker's Mark Bourbon"/>
            </div>
            <div>
              <Label>Size</Label>
              <Select value={formSize} onChange={e=>setFormSize(e.target.value)}>
                {BOTTLE_SIZES.map(s=><option key={s} value={s}>{s}</option>)}
              </Select>
            </div>
            <div className="sm:col-span-2">
              <Label>Category</Label>
              <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                {LIQUOR_CATEGORIES.map(c=>(
                  <label key={c.id} className={`flex items-center gap-1.5 p-2 rounded-xl border cursor-pointer text-xs transition-all ${formCat===c.id?'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:border-indigo-300'}`}>
                    <input type="radio" name="formCat" value={c.id} checked={formCat===c.id} onChange={()=>setFormCat(c.id)} className="hidden"/>
                    <Icon name={c.icon} size={15}/><span className="font-medium">{c.label}</span>
                  </label>
                ))}
              </div>
            </div>
            {bclSku && (
              <div className="sm:col-span-2 p-2.5" style={{border:'1px solid var(--line)', background:'rgba(56,224,240,.06)'}}>
                <p className="mono text-xs" style={{color:'var(--cy)'}}>
                  <Icon name="check" size={12} className="mr-1.5"/>
                  Image copied from BC Liquor · SKU {bclSku}
                </p>
                <p className="lbl mt-1">Save the product to keep this change</p>
              </div>
            )}
            <div className="sm:col-span-2">
              <Label>Notes (optional)</Label>
              <Input value={formNotes} onChange={e=>setFormNotes(e.target.value)} placeholder="e.g. Our best-seller, BC exclusive, seasonal"/>
            </div>
          </div>
          <div className="mt-4 flex gap-2">
            <Button onClick={saveProduct} loading={saving} className="flex-1"><Icon name="save"/> {editId ? 'Save changes' : 'Save to Library'}</Button>
            <Button onClick={resetForm} variant="secondary">Cancel</Button>
          </div>
        </Card>
      )}

      {/* Category filter */}
      {images.length>0 && (
        <div className="flex gap-2 overflow-x-auto pb-1">
          <button onClick={()=>setCatFilter('all')} className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all border ${catFilter==='all'?'bg-indigo-600 text-white border-indigo-600':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border-gray-200 dark:border-gray-700 hover:border-indigo-300'}`}>
            All ({images.length})
          </button>
          {usedCats.map(c=>(
            <button key={c.id} onClick={()=>setCatFilter(c.id)} className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all border flex items-center gap-1 ${catFilter===c.id?'bg-indigo-600 text-white border-indigo-600':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border-gray-200 dark:border-gray-700 hover:border-indigo-300'}`}>
              <Icon name={c.icon} size={13} className="mr-1.5"/>{c.label} <span className="opacity-70">({catCounts[c.id]})</span>
            </button>
          ))}
        </div>
      )}

      {/* Product grid */}
      {filtered.length===0 && !showForm && (
        <div className="text-center py-16 text-gray-400 dark:text-gray-500">
          <p className="mb-3"><Icon name="package" size={40} style={{color:"var(--cy-dim)"}}/></p>
          <p className="text-sm font-medium">No products yet</p>
          <p className="text-xs mt-1">Click "+ Add Product" to build your library</p>
        </div>
      )}
      {filtered.length>0 && (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3">
          {filtered.map(p=>{
            const cat = LIQUOR_CATEGORIES.find(c=>c.id===p.category);
            return (
              <div key={p.id} className="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 overflow-hidden group hover:border-indigo-300 dark:hover:border-indigo-600 transition-all shadow-sm">
                <div className="relative">
                  <img src={prodSrc(p)} alt={p.product_name} className="w-full aspect-square object-cover"/>
                  <div className="absolute top-1.5 right-1.5 gap-1 hidden group-hover:flex">
                    <button onClick={()=>startEdit(p)} aria-label={'Edit '+p.product_name}
                      className="w-6 h-6 flex items-center justify-center transition-colors"
                      style={{background:'rgba(2,5,11,.85)', color:'var(--cy)', border:'1px solid var(--cy)'}}>
                      <Icon name="edit" size={12}/>
                    </button>
                    <button onClick={()=>deleteProduct(p.id)} disabled={deleting===p.id}
                      aria-label={'Delete '+p.product_name}
                      className="w-6 h-6 flex items-center justify-center transition-colors"
                      style={{background:'rgba(2,5,11,.85)', color:'var(--red)', border:'1px solid var(--red)'}}>
                      {deleting===p.id?'…':<Icon name="trash" size={12}/>}
                    </button>
                  </div>
                </div>
                <div className="p-2.5">
                  <p className="text-xs font-bold text-gray-900 dark:text-gray-100 leading-tight truncate" title={p.product_name}>{p.product_name}</p>
                  <div className="flex items-center gap-1 mt-1.5 flex-wrap">
                    <span className="px-1.5 py-0.5 rounded-md bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 text-xs font-medium">{p.size}</span>
                    {cat && <span className="px-1.5 py-0.5 rounded-md bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 text-xs font-medium"><Icon name={cat.icon} size={12} className="mr-1"/>{cat.label}</span>}
                  </div>
                  {p.notes && <p className="text-xs text-gray-400 mt-1 truncate" title={p.notes}>{p.notes}</p>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

        <div className="space-y-4">
          <div className="grid grid-cols-3 gap-3">
            {[{key:'primary_color',label:'Primary'},{key:'secondary_color',label:'Secondary'},{key:'accent_color',label:'Accent'}].map(c=>(
              <div key={c.key}><Label>{c.label} Colour</Label>

                  <input type="color" value={form[c.key]||'#000000'} onChange={e=>setForm(p=>({...p,[c.key]:e.target.value}))} className="h-9 w-10 rounded-lg border border-gray-200 dark:border-gray-600 cursor-pointer p-0.5 bg-white flex-shrink-0"/>
                  <Input value={form[c.key]||''} onChange={e=>setForm(p=>({...p,[c.key]:e.target.value}))} placeholder="#1e3a5f" className="font-mono text-xs"/>
                </div>
              </div>

          </div>
          <div className="flex gap-2">
            {['primary_color','secondary_color','accent_color'].map((k,i)=>form[k]?(
              <div key={i} className="flex items-center gap-1.5">
                <div className="h-8 w-12 rounded-lg border border-gray-200 dark:border-gray-700 shadow-inner" style={{backgroundColor:form[k]}}/>

        </div>
      </Card>
      <Button onClick={save} loading={saving} size="lg" className="w-full">Save Brand Profile</Button>
    </div>
  );
}
