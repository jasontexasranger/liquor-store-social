const STORE_COLORS = ['var(--cy)','var(--amb)','var(--grn)','var(--vio)'];
const storeColor = id => STORE_COLORS[Math.max(0, STORES.findIndex(s=>s.id===id)) % 4];

const fmtMoney = v => '$' + Math.round(Number(v)||0).toLocaleString();
const fmtCompact = v => {
  const n = Math.round(Number(v)||0);
  return n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n);
};

// Loads every period with its rows. A few hundred rows total, so one fetch.
function useAllFeatures() {
  const [periods, setPeriods] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(function(){
    const sb = getSB(); if (!sb) return;
    let live = true;
    sb.from('feature_periods')
      .select('id, store_id, period, status, features(*)')
      .order('period')
      .then(function(r){
        if (!live) return;
        setPeriods(r.data || []);
        setLoading(false);
      });
    return function(){ live = false; };
  }, []);

  return { periods, loading };
}

function StatCard({ label, value, sub, tone }) {
  return (
    <div className="hud hud-brk p-4">
      <p className="lbl">{label}</p>
      <p className="mono mt-2" style={{fontSize:'26px', lineHeight:1, color:tone||'var(--txt)'}}>{value}</p>
      {sub && <p className="lbl mt-1.5" style={{color:'var(--txt3)'}}>{sub}</p>}
    </div>
  );
}

// Grouped bars: one cluster per month, one bar per store.
function GroupedBars({ months, series, height=210 }) {
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const W = 760, padL = 46, padB = 26, padT = 8;
  const plotW = W - padL - 8, plotH = height - padB - padT;
  const groupW = plotW / Math.max(1, months.length);
  const barW = Math.min(16, (groupW - 10) / Math.max(1, series.length));

  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(max*f));

  return (
    <svg viewBox={'0 0 '+W+' '+height} style={{width:'100%', height:'auto', display:'block'}}
         role="img" aria-label="Revenue by month and store">
      {ticks.map(function(t,i){
        const y = padT + plotH - (t/max)*plotH;
        return (
          <g key={i}>
            <line x1={padL} x2={W-8} y1={y} y2={y} stroke="rgba(212,175,55,.12)" strokeWidth="1"/>
            <text x={padL-6} y={y+3} textAnchor="end"
                  style={{fontSize:'9px', fill:'var(--txt3)', fontFamily:'var(--mono)'}}>{fmtCompact(t)}</text>
          </g>
        );
      })}
      {months.map(function(m,gi){
        const gx = padL + gi*groupW;
        return (
          <g key={m}>
            {series.map(function(s,si){
              const v = s.values[gi] || 0;
              const h = (v/max)*plotH;
              const x = gx + (groupW - barW*series.length)/2 + si*barW;
              return <rect key={s.id} x={x} y={padT+plotH-h} width={barW-2} height={Math.max(0,h)}
                           fill={s.color} opacity={v?0.85:0.15}>
                       <title>{s.label + ' · ' + m + ' · ' + fmtMoney(v)}</title>
                     </rect>;
            })}
            <text x={gx+groupW/2} y={height-8} textAnchor="middle"
                  style={{fontSize:'9.5px', fill:'var(--txt2)', fontFamily:'var(--mono)'}}>{m}</text>
          </g>
        );
      })}
      <line x1={padL} x2={W-8} y1={padT+plotH} y2={padT+plotH} stroke="var(--line2)" strokeWidth="1"/>
    </svg>
  );
}

// Horizontal bars for rankings.
function RankBars({ rows, max, colorOf, valueFmt, onSelect }) {
  const top = max || Math.max(1, ...rows.map(r=>r.value));
  return (
    <div className="space-y-2">
      {rows.map(function(r,i){
        const pct = Math.max(1, (r.value/top)*100);
        const clickable = !!onSelect;
        return (
          <div key={i}
               onClick={clickable ? function(){ onSelect(r); } : undefined}
               role={clickable ? 'button' : undefined}
               tabIndex={clickable ? 0 : undefined}
               onKeyDown={clickable ? function(e){ if(e.key==='Enter'||e.key===' ') onSelect(r); } : undefined}
               style={clickable ? { cursor:'pointer' } : undefined}
               onMouseEnter={clickable ? function(e){ e.currentTarget.style.background='rgba(212,175,55,.05)'; } : undefined}
               onMouseLeave={clickable ? function(e){ e.currentTarget.style.background='transparent'; } : undefined}>
            <div className="flex items-baseline gap-2 mb-1">
              <span className="text-xs truncate flex-1" style={{color:'var(--txt)'}}>{r.label}</span>
              {r.note && (
                <span className="lbl" style={{
                  color: clickable ? 'var(--cy)' : 'var(--txt3)',
                  borderBottom: clickable ? '1px dotted var(--cy-dim)' : 'none',
                }}>{r.note}</span>
              )}
              <span className="mono text-xs" style={{color:'var(--cy)'}}>{(valueFmt||fmtMoney)(r.value)}</span>
              {clickable && <Icon name="search" size={11} style={{color:'var(--cy-dim)'}}/>}
            </div>
            <div style={{height:'3px', background:'rgba(212,175,55,.1)'}}>
              <div style={{height:'100%', width:pct+'%',
                           background: colorOf ? colorOf(r) : 'var(--cy)',
                           boxShadow:'0 0 6px '+(colorOf ? colorOf(r) : 'var(--cy)')}}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// Shows exactly which rows add up to a headline number, so a total on the
// dashboard can always be traced back to the feature rows behind it.
function FeatureDrill({ title, subtitle, rows, onClose }) {
  const dragPanel = useDragPanel();
  const sorted = [...rows].sort(function(a,b){
    return String(a.period).localeCompare(String(b.period)) ||
           String(a.store_id).localeCompare(String(b.store_id));
  });
  const totalRev = sorted.reduce((a,r)=>a+Number(r.revenue||0), 0);
  const totalQty = sorted.reduce((a,r)=>a+Number(r.qty_sold||0), 0);
  const missing  = sorted.filter(r => r.revenue == null).length;

  // Feature price varies between runs, so show the span rather than one number.
  const prices = sorted.map(r => Number(r.sale_price)).filter(v => isFinite(v) && v > 0);
  const priceRange = prices.length
    ? (Math.min(...prices) === Math.max(...prices)
        ? money(prices[0])
        : money(Math.min(...prices)) + ' – ' + money(Math.max(...prices)))
    : null;

  const discs = sorted.filter(r => r.savings != null && r.reg_price)
                      .map(r => Number(r.savings)/Number(r.reg_price)*100);
  const avgDiscount = discs.length ? discs.reduce((a,b)=>a+b,0)/discs.length : null;

  return (
    <Portal>
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-6"
         style={{background:'rgba(var(--sink2-rgb),.88)', backdropFilter:'blur(4px)'}} onClick={onClose}>
      <div className="hud hud-brk w-full max-w-3xl max-h-[86vh] overflow-auto p-6"
           style={dragPanel.style} onClick={e=>e.stopPropagation()}>
        <div {...dragPanel.handleProps} className="flex items-start gap-3 mb-1">
          <div className="flex-1 min-w-0">
            <p className="ttl truncate">{title}</p>
            {subtitle && <p className="lbl mt-1">{subtitle}</p>}
          </div>
          <button onClick={onClose} style={{color:'var(--txt2)'}} aria-label="Close">
            <Icon name="close"/>
          </button>
        </div>

        <div className="flex gap-5 my-4 flex-wrap">
          <div>
            <p className="lbl">Revenue</p>
            <p className="mono" style={{fontSize:'20px', color:'var(--cy)'}}>{fmtMoney(totalRev)}</p>
          </div>
          <div>
            <p className="lbl">Units</p>
            <p className="mono" style={{fontSize:'20px'}}>{totalQty.toLocaleString()}</p>
          </div>
          <div>
            <p className="lbl">Average price</p>
            <p className="mono" style={{fontSize:'20px'}}>{totalQty ? fmtMoney(totalRev/totalQty) : '—'}</p>
          </div>
          <div>
            <p className="lbl">Appearances</p>
            <p className="mono" style={{fontSize:'20px'}}>{sorted.length}</p>
          </div>
          {priceRange && (
            <div>
              <p className="lbl">Feature price</p>
              <p className="mono" style={{fontSize:'20px'}}>{priceRange}</p>
            </div>
          )}
          {avgDiscount != null && (
            <div>
              <p className="lbl">Average discount</p>
              <p className="mono" style={{fontSize:'20px', color:'var(--amb)'}}>{avgDiscount.toFixed(1)}%</p>
            </div>
          )}
        </div>

        {missing > 0 && (
          <p className="text-xs mb-3" style={{color:'var(--amb)'}}>
            <Icon name="warn" size={12} className="mr-1.5"/>
            {missing} of {sorted.length} {missing===1?'row has':'rows have'} no sales recorded — the revenue above excludes {missing===1?'it':'them'}
          </p>
        )}

        <div className="overflow-x-auto">
          <table style={{width:'100%', minWidth:'780px', borderCollapse:'collapse'}}>
            <thead>
              <tr style={{borderBottom:'1px solid var(--line2)'}}>
                {['Month','Store','Product','Size','Reg','Sale','Save','Units','Revenue'].map(function(h,i){
                  return <th key={h} className="lbl"
                             style={{textAlign: i>=4?'right':'left', padding:'0 6px 8px'}}>{h}</th>;
                })}
              </tr>
            </thead>
            <tbody>
              {sorted.map(function(r,i){
                const st = STORES.find(x=>x.id===r.store_id);
                return (
                  <tr key={i} style={{borderBottom:'1px solid rgba(212,175,55,.07)'}}>
                    <td className="mono" style={{padding:'7px 6px', fontSize:'11px', color:'var(--txt2)'}}>
                      {monthLabel(r.period).replace(' 20',' ')}
                    </td>
                    <td style={{padding:'7px 6px', fontSize:'12px'}}>
                      <span className="inline-flex items-center gap-1.5">
                        <span style={{width:'7px',height:'7px',background:storeColor(r.store_id),display:'inline-block'}}/>
                        {st ? st.name.split(' ')[0] : r.store_id}
                      </span>
                    </td>
                    <td style={{padding:'7px 6px', fontSize:'12px', color:'var(--txt)'}}>{r.name}</td>
                    <td className="mono" style={{padding:'7px 6px', fontSize:'11px', color:'var(--txt3)'}}>{r.size||''}</td>
                    <td className="mono" style={{padding:'7px 6px', fontSize:'11px', textAlign:'right',
                                                 color:'var(--txt3)', textDecoration:'line-through'}}>
                      {r.reg_price != null ? money(r.reg_price) : ''}
                    </td>
                    <td className="mono" style={{padding:'7px 6px', fontSize:'11px', textAlign:'right'}}>
                      {r.sale_price != null ? money(r.sale_price) : ''}
                    </td>
                    <td className="mono" style={{padding:'7px 6px', fontSize:'11px', textAlign:'right', color:'var(--amb)'}}>
                      {r.savings != null ? money(r.savings) : ''}
                      {r.savings != null && r.reg_price ? (
                        <span style={{color:'var(--txt3)', marginLeft:'5px'}}>
                          {Math.round(Number(r.savings)/Number(r.reg_price)*100)}%
                        </span>
                      ) : null}
                    </td>
                    <td className="mono" style={{padding:'7px 6px', fontSize:'11px', textAlign:'right'}}>
                      {r.qty_sold != null ? Number(r.qty_sold).toLocaleString() : '—'}
                    </td>
                    <td className="mono" style={{padding:'7px 6px', fontSize:'11px', textAlign:'right',
                                                 color: r.revenue != null ? 'var(--cy)' : 'var(--txt3)'}}>
                      {r.revenue != null ? fmtMoney(r.revenue) : 'not recorded'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{borderTop:'1px solid var(--line2)'}}>
                <td colSpan={7} className="lbl" style={{padding:'9px 6px'}}>Total</td>
                <td className="mono" style={{padding:'9px 6px', textAlign:'right', color:'var(--cy)'}}>
                  {totalQty.toLocaleString()}
                </td>
                <td className="mono" style={{padding:'9px 6px', textAlign:'right', color:'var(--cy)'}}>
                  {fmtMoney(totalRev)}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
    </Portal>
  );
}

function FeaturesDashboard() {
  const { periods, loading } = useAllFeatures();
  const [year, setYear] = useState(String(new Date().getFullYear()));
  const [drill, setDrill] = useState(null);

  const inYear = periods.filter(p => String(p.period).startsWith(year));
  const years = [...new Set(periods.map(p => String(p.period).slice(0,4)))].sort().reverse();

  // Flatten to rows tagged with their store and month.
  const rows = inYear.flatMap(p =>
    (p.features||[]).map(f => ({ ...f, store_id:p.store_id, period:p.period })));

  const withSales = rows.filter(r => r.revenue != null);
  const totalRev  = withSales.reduce((a,r)=>a+Number(r.revenue||0), 0);
  const totalQty  = rows.reduce((a,r)=>a+Number(r.qty_sold||0), 0);
  const discounts = rows.filter(r => r.reg_price && r.savings)
                        .map(r => Number(r.savings)/Number(r.reg_price)*100);
  const avgDisc   = discounts.length ? discounts.reduce((a,b)=>a+b,0)/discounts.length : 0;

  const months = [...new Set(inYear.map(p => String(p.period).slice(0,7)))].sort();
  const monthLabels = months.map(m => new Date(+m.slice(0,4), +m.slice(5,7)-1, 1)
                        .toLocaleString(undefined,{month:'short'}));

  const series = STORES.map(function(st){
    return {
      id: st.id, label: st.name, color: storeColor(st.id),
      values: months.map(function(m){
        return rows.filter(r => r.store_id===st.id && String(r.period).startsWith(m))
                   .reduce((a,r)=>a+Number(r.revenue||0), 0);
      }),
    };
  });

  const byStore = STORES.map(function(st){
    const mine = rows.filter(r => r.store_id===st.id);
    return {
      label: st.name,
      value: mine.reduce((a,r)=>a+Number(r.revenue||0), 0),
      note: mine.length + ' features',
      store: st.id,
    };
  }).sort((a,b)=>b.value-a.value);

  // Same product can run in several stores or months — roll them up.
  const byProduct = Object.values(rows.reduce(function(acc,r){
    if (!r.revenue) return acc;
    const k = (r.name||'').trim().toUpperCase();
    if (!k) return acc;
    if (!acc[k]) acc[k] = { label:k, value:0, runs:0, qty:0 };
    acc[k].value += Number(r.revenue||0);
    acc[k].qty   += Number(r.qty_sold||0);
    acc[k].runs  += 1;
    return acc;
  }, {})).sort((a,b)=>b.value-a.value).slice(0,10)
     .map(p => ({ ...p, note: p.runs + (p.runs===1?' run':' runs') }));

  // Store-months where features were planned but no sales were ever entered.
  const gaps = inYear.filter(p => (p.features||[]).length &&
                                  !(p.features||[]).some(f => f.revenue != null))
    .map(p => ({ store:(STORES.find(s=>s.id===p.store_id)||{}).name || p.store_id,
                 month:monthLabel(p.period), n:(p.features||[]).length }));

  if (loading) return <Card><p className="lbl text-center py-12">Loading…</p></Card>;
  if (!rows.length) return (
    <Card>
      <div className="text-center py-14">
        <Icon name="chart" size={38} style={{color:'var(--cy-dim)'}}/>
        <p className="lbl mt-3">No feature data for {year}</p>
      </div>
    </Card>
  );

  return (
    <div className="space-y-4">
      {drill && <FeatureDrill title={drill.title} subtitle={drill.subtitle}
                              rows={drill.rows} onClose={()=>setDrill(null)}/>}
      <div className="flex items-center gap-3 flex-wrap">
        <span className="ttl">Performance</span>
        <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
        <Select value={year} onChange={e=>setYear(e.target.value)} className="w-auto text-xs">
          {years.map(y=><option key={y} value={y}>{y}</option>)}
        </Select>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard label="Feature revenue" value={fmtMoney(totalRev)} tone="var(--cy)"
                  sub={withSales.length + ' of ' + rows.length + ' rows recorded'}/>
        <StatCard label="Units sold" value={totalQty.toLocaleString()}
                  sub={totalQty ? fmtMoney(totalRev/totalQty) + ' average' : '—'}/>
        <StatCard label="Features run" value={rows.length}
                  sub={months.length + ' months · ' + new Set(rows.map(r=>r.store_id)).size + ' stores'}/>
        <StatCard label="Average discount" value={avgDisc.toFixed(1) + '%'} tone="var(--amb)"
                  sub="off regular price"/>
      </div>

      <Card>
        <div className="flex items-center gap-3 mb-4 flex-wrap">
          <span className="ttl">Revenue by month</span>
          <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
          {STORES.map(st=>(
            <span key={st.id} className="flex items-center gap-1.5">
              <span style={{width:'8px',height:'8px',background:storeColor(st.id),display:'block'}}/>
              <span className="lbl">{st.name.split(' ')[0]}</span>
            </span>
          ))}
        </div>
        <GroupedBars months={monthLabels} series={series}/>
      </Card>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card>
          <div className="flex items-center gap-3 mb-4">
            <span className="ttl">By store</span>
            <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
            <span className="lbl">Click for breakdown</span>
          </div>
          <RankBars rows={byStore} colorOf={r=>storeColor(r.store)}
            onSelect={function(r){
              const mine = rows.filter(x=>x.store_id===r.store);
              setDrill({ title:r.label, subtitle:mine.length+' features in '+year, rows:mine });
            }}/>
        </Card>

        <Card>
          <div className="flex items-center gap-3 mb-4">
            <span className="ttl">Top features</span>
            <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
            <span className="lbl">Click for breakdown</span>
          </div>
          {byProduct.length
            ? <RankBars rows={byProduct}
                onSelect={function(r){
                  const mine = rows.filter(x=>(x.name||'').trim().toUpperCase()===r.label);
                  setDrill({ title:r.label, subtitle:'Every time this ran in '+year, rows:mine });
                }}/>
            : <p className="lbl py-6 text-center">No sales figures recorded yet</p>}
        </Card>
      </div>

      {gaps.length > 0 && (
        <Card>
          <div className="flex items-center gap-3 mb-3">
            <span className="ttl">Missing sales figures</span>
            <span className="flex-1 h-px" style={{background:'linear-gradient(90deg,var(--line2),transparent)'}}/>
            <Badge color="yellow">{gaps.length}</Badge>
          </div>
          <p className="lbl mb-3">
            Features were planned for these months but no sales were entered — the totals above understate by however much these sold
          </p>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {gaps.map(function(g,i){
              return (
                <div key={i} className="flex items-center gap-2 p-2"
                     style={{border:'1px solid var(--line)', background:'rgba(240,168,48,.06)'}}>
                  <Icon name="warn" size={12} style={{color:'var(--amb)'}}/>
                  <span className="text-xs truncate flex-1" style={{color:'var(--txt2)'}}>{g.store}</span>
                  <span className="lbl">{g.month.split(' ')[0]}</span>
                  <span className="mono text-xs" style={{color:'var(--txt3)'}}>{g.n}</span>
                </div>
              );
            })}
          </div>
        </Card>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────
// PASTE / DROP AN IMAGE
// ─────────────────────────────────────────────
// Three ways an image arrives from a browser without saving it first:
//   • "Copy image"         -> real bytes on the clipboard, handled here
//   • "Copy image address" -> a URL, which needs a server fetch because the
//                             source site won't send CORS headers to us
//   • drag from a tab      -> either a file or a URL, depending on the site
const IMAGE_URL_RE = /^https?:\/\/\S+$/i;

function extractImageFile(dt) {
  if (!dt) return null;
  const items = Array.from(dt.items || []);
  const img = items.find(i => i.kind === 'file' && (i.type || '').startsWith('image/'));
  if (img) return img.getAsFile();
  const file = Array.from(dt.files || []).find(f => (f.type || '').startsWith('image/'));
  return file || null;
}

function extractImageUrl(dt) {
  if (!dt) return null;
  // Dragging from a page usually offers text/uri-list; pasting gives text/plain.
  const raw = (dt.getData && (dt.getData('text/uri-list') || dt.getData('text/plain'))) || '';
  const first = String(raw).split(/\s+/).find(Boolean) || '';
  return IMAGE_URL_RE.test(first) ? first : null;
}

// Returns a data URL for a file, or asks the server to fetch a URL for us.
async function resolvePastedImage({ file, url }) {
  if (file) {
    return await new Promise(function(res, rej){
      const r = new FileReader();
      r.onload  = () => res({ dataUrl: r.result, file });
      r.onerror = () => rej(new Error('Could not read that image'));
      r.readAsDataURL(file);
    });
  }
  if (url) {
    const r = await callEdge('bcliquor', 'importUrl', { url });
    return { dataUrl: r.image_url, hostedUrl: r.image_url };
  }
  throw new Error('No image found');
}

// Wraps any area so it accepts pasted and dropped images.
function ImageDropZone({ onImage, children, className='', style={} }) {
  const toast = useToast();
  const [over, setOver] = useState(false);
  const [busy, setBusy] = useState(false);
  const ref = useRef();

  const handle = useCallback(async function(dt) {
    const file = extractImageFile(dt);
    const url  = file ? null : extractImageUrl(dt);
    if (!file && !url) return false;
    setBusy(true);
    try {
      const out = await resolvePastedImage({ file, url });
      await onImage(out);
      toast.success(url ? 'Image copied from the web' : 'Image added');
    } catch(e) {
      toast.error(e.message);
    } finally { setBusy(false); }
    return true;
  }, [onImage]);

  // Paste only counts while the pointer is over this zone, so two zones on one
  // screen don't both grab the same paste.
  useEffect(function(){
    const el = ref.current; if (!el) return;
    let inside = false;
    const enter = () => { inside = true; };
    const leave = () => { inside = false; };
    const onPaste = function(e){
      if (!inside) return;
      if (handle(e.clipboardData)) e.preventDefault();
    };
    el.addEventListener('mouseenter', enter);
    el.addEventListener('mouseleave', leave);
    document.addEventListener('paste', onPaste);
    return function(){
      el.removeEventListener('mouseenter', enter);
      el.removeEventListener('mouseleave', leave);
      document.removeEventListener('paste', onPaste);
    };
  }, [handle]);

  return (
    <div ref={ref} className={className}
         onDragOver={e=>{ e.preventDefault(); setOver(true); }}
         onDragLeave={()=>setOver(false)}
         onDrop={e=>{ e.preventDefault(); setOver(false); handle(e.dataTransfer); }}
         style={{ ...style, position:'relative',
                  outline: over ? '1px dashed var(--cy)' : 'none',
                  outlineOffset:'3px' }}>
      {children}
      {(over || busy) && (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none"
             style={{background:'rgba(var(--sink2-rgb),.8)', zIndex:5}}>
          <p className="lbl" style={{color:'var(--cy)'}}>
            {busy ? 'Fetching image…' : 'Drop to add'}
          </p>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────
// DRAGGABLE PANELS
// ─────────────────────────────────────────────
// Dialogs render into <body> rather than wherever they were declared. Cards use
// the .hud clip-path, and a clipped ancestor clips position:fixed descendants —
// so a dialog opened from inside a table cell was being cropped to that card and
// could not be dragged past its edges.
function Portal({ children }) {
  return ReactDOM.createPortal(children, document.body);
}

// Lets a dialog be moved out of the way to see what's underneath — useful when
// a picker covers the row you're working on.
//
// Returns a style to spread on the panel and props for its header. Movement is
// a transform, so it doesn't disturb the centring layout, and it's clamped so a
// panel can never be dragged fully off screen.
function useDragPanel() {
  const [pos, setPos] = useState({ x:0, y:0 });
  const drag = useRef(null);

  useEffect(function(){
    function move(e) {
      if (!drag.current) return;
      const d = drag.current;
      const maxX = Math.max(0, window.innerWidth  / 2 - 60);
      const maxY = Math.max(0, window.innerHeight / 2 - 40);
      setPos({
        x: Math.max(-maxX, Math.min(maxX, d.ox + (e.clientX - d.sx))),
        y: Math.max(-maxY, Math.min(maxY, d.oy + (e.clientY - d.sy))),
      });
    }
    function up() {
      if (!drag.current) return;
      drag.current = null;
      document.body.style.userSelect = '';
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    return function(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
  }, []);

  const onMouseDown = function(e) {
    // Don't start a drag from a control inside the header.
    if (e.target.closest('button, a, input, select, textarea')) return;
    drag.current = { sx:e.clientX, sy:e.clientY, ox:pos.x, oy:pos.y };
    document.body.style.userSelect = 'none';
    e.preventDefault();
  };

  return {
    style: { transform: `translate(${pos.x}px, ${pos.y}px)` },
    handleProps: { onMouseDown, style: { cursor: 'move' }, title: 'Drag to move' },
    moved: pos.x !== 0 || pos.y !== 0,
    reset: function(){ setPos({ x:0, y:0 }); },
  };
}

const ToastCtx = createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type='info') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 5000);
  }, []);
  const toast = { success:m=>add(m,'success'), error:m=>add(m,'error'), info:m=>add(m,'info') };
  return (
    <ToastCtx.Provider value={toast}>
      {children}
      <div className="fixed bottom-4 right-4 space-y-2 z-50 pointer-events-none">
        {toasts.map(t => (
          <div key={t.id} className={`px-4 py-3 rounded-xl shadow-lg text-white text-sm max-w-sm pointer-events-auto
            ${t.type==='success'?'bg-emerald-600':t.type==='error'?'bg-red-600':'bg-blue-600'}`}>
            <Icon name={t.type==='success'?'check':t.type==='error'?'cross':'info'} className="mr-1.5"/>{t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

function useBrandProfile(storeId) {
  const [profile, setProfile] = useState({ ...BRAND_DEFAULTS });
  const [logo,    setLogo]    = useState(null);
  const [stamp,   setStamp]   = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const sb = getSB();
    if (!sb) { setLoading(false); return; }
    setLoading(true);
    sb.from('brand_profiles').select('*').eq('store_id', storeId).maybeSingle()
      .then(({ data }) => {
        if (data) {
          // Images are held apart from the editable profile fields, or saving
          // the profile would rewrite them as a side effect.
          const { logo_data, stamp_data, id, updated_at, store_id, ...p } = data;
          setProfile({ ...BRAND_DEFAULTS, ...p });
          setLogo(logo_data || null);
          setStamp(stamp_data || null);
        } else {
          setProfile({ ...BRAND_DEFAULTS });
          setLogo(null);
          setStamp(null);
        }
      })
      .finally(() => setLoading(false));
  }, [storeId]);

  const saveProfile = async (p) => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    const { error } = await sb.from('brand_profiles')
      .upsert({ store_id: storeId, ...p }, { onConflict: 'store_id' });
    if (error) throw error;
    setProfile(p);
  };

  const saveLogo = async (dataUrl) => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    const { error } = await sb.from('brand_profiles')
      .upsert({ store_id: storeId, logo_data: dataUrl }, { onConflict: 'store_id' });
    forgetStoreLogos();
    if (error) throw error;
    setLogo(dataUrl);
  };

  const clearLogo = async () => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    await sb.from('brand_profiles').update({ logo_data: null }).eq('store_id', storeId);
    forgetStoreLogos();
    setLogo(null);
  };

  const saveStamp = async (dataUrl) => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    const { error } = await sb.from('brand_profiles')
      .upsert({ store_id: storeId, stamp_data: dataUrl }, { onConflict: 'store_id' });
    if (error) throw error;
    setStamp(dataUrl);
  };

  const clearStamp = async () => {
    const sb = getSB();
    if (!sb) throw new Error('Supabase not connected');
    await sb.from('brand_profiles').update({ stamp_data: null }).eq('store_id', storeId);
    setStamp(null);
  };

  return { profile, logo, stamp, loading, saveProfile, saveLogo, clearLogo, saveStamp, clearStamp };
}

// ─────────────────────────────────────────────
// IMAGE COMPRESSION UTILITY
// ─────────────────────────────────────────────
function compressImage(dataUrl, maxPx=600, quality=0.75) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

// STORE PICKER
// ─────────────────────────────────────────────
// Four stores, chosen dozens of times a session. A logo is recognised faster
// than a name is read, and it makes the store you're working on visible at a
// glance rather than something you have to go and check.

// Fetched once for the whole session and shared. Every screen has a store
// picker, and four of them mounting at once shouldn't mean four queries.
let _storeLogoPromise = null;
function loadStoreLogos() {
  if (!_storeLogoPromise) {
    const sb = getSB();
    if (!sb) return Promise.resolve({});
    _storeLogoPromise = sb.from('brand_profiles').select('store_id, logo_data')
      .then(function(res) {
        const map = {};
        (res.data || []).forEach(r => { if (r.logo_data) map[r.store_id] = r.logo_data; });
        return map;
      })
      .catch(() => ({}));
  }
  return _storeLogoPromise;
}
// Called after a logo is uploaded or cleared, so pickers pick it up.
function forgetStoreLogos() { _storeLogoPromise = null; }

function useStoreLogos() {
  const [logos, setLogos] = useState({});
  useEffect(function() {
    let alive = true;
    loadStoreLogos().then(m => { if (alive) setLogos(m); });
    return function(){ alive = false; };
  }, []);
  return logos;
}

// One tile, drawn the same everywhere. Logos differ wildly in shape — some
// wide wordmarks, some tall badges — so the tile is a fixed square and the
// artwork is contained inside it. Uniform tiles read as a set; letting each
// logo set its own size reads as a mistake.
const TILE = { sm: 46, md: 64 };

function StoreTile({ store, logo, active, onClick, size = 'md', showLabel, badge, disabled }) {
  const px = TILE[size] || TILE.md;
  return (
    <button onClick={onClick} disabled={disabled} title={store.name}
      className="flex flex-col items-center gap-1.5"
      style={{ opacity: disabled ? 0.4 : 1 }}>
      <span className="relative flex items-center justify-center"
        style={{
          width: px + 'px', height: px + 'px',
          // Always a solid white plate. Brand marks are drawn for white paper,
          // and dimming the plate to show "unselected" makes them look broken —
          // so selection is shown by the border and the label instead.
          background: '#ffffff',
          border: '2px solid ' + (active ? 'var(--cy)' : 'var(--line)'),
          boxShadow: active ? '0 0 14px rgba(212,175,55,.28)' : 'none',
          transition: 'border-color .15s, box-shadow .15s',
        }}>
        {logo
          ? <img src={logo} alt={store.name} className="object-contain"
                 style={{ maxWidth: Math.round(px * 0.78) + 'px', maxHeight: Math.round(px * 0.78) + 'px' }}/>
          : <span className="mono" style={{ color:'#1a2230', fontSize: Math.round(px/3) + 'px' }}>
              {store.name.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('')}
            </span>}
        {badge}
      </span>
      {showLabel && (
        <span className="text-center leading-tight"
              style={{ fontSize:'10px', letterSpacing:'.06em', textTransform:'uppercase',
                       color: active ? 'var(--cy)' : 'var(--txt3)', maxWidth:(px+18)+'px' }}>
          {store.name.replace(/ Liquor Store.*$/i,'').replace(/^Brothers.*/i,'Brothers')}
        </span>
      )}
    </button>
  );
}

function StorePicker({ value, onChange, stores, allLabel, allValue = 'all', extra, compact }) {
  const logos = useStoreLogos();
  const list  = stores || STORES;
  const size  = compact ? 'sm' : 'md';
  const px    = TILE[size];

  // "All" and "Global" aren't stores, so they get a plain chip the same height
  // as the tiles rather than a white plate with nothing on it.
  const chip = (key, label, active, title) => (
    <button key={key} onClick={()=>onChange(key)} title={title || label}
      className="flex flex-col items-center gap-1.5">
      <span className="flex items-center justify-center px-3"
        style={{ height: px + 'px', minWidth: px + 'px',
                 border: '2px solid ' + (active ? 'var(--cy)' : 'var(--line)'),
                 background: active ? 'var(--cy-glow)' : 'rgba(var(--sink-rgb),.45)',
                 color: active ? 'var(--cy)' : 'var(--txt2)',
                 fontSize:'11px', letterSpacing:'.1em', textTransform:'uppercase' }}>
        {label}
      </span>
      {!compact && <span style={{fontSize:'10px'}}>&nbsp;</span>}
    </button>
  );

  return (
    <div className="flex gap-3 flex-wrap items-start">
      {(extra || []).map(x => chip(x.value, x.label, value === x.value, x.title))}
      {allLabel && chip(allValue, allLabel, value === allValue)}
      {list.map(function(st) {
        return (
          <StoreTile key={st.id} store={st} logo={logos[st.id]} size={size}
            showLabel={!compact} active={value === st.id}
            onClick={()=>onChange(st.id)}/>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────
// BACKGROUND REMOVER
// Flood-fills from all 4 edges to cut out near-white/near-cream backgrounds.
// Returns a transparent-background PNG data URL.
// ─────────────────────────────────────────────
function removeProductBackground(dataUrl, threshold=228, tolerance=42) {
  return new Promise(resolve => {
    if (!dataUrl) { resolve(dataUrl); return; }

    // This must never hang. Every failure path resolves with the original
    // image so the caller still gets something drawable:
    //   • cross-origin canvas taint (imported Storage URLs) -> SecurityError
    //   • image fails to load at all -> onerror
    //   • anything unexpectedly slow -> watchdog
    let settled = false;
    const done = v => { if (!settled) { settled = true; resolve(v); } };
    const watchdog = setTimeout(() => done(dataUrl), 15000);
    const finish = v => { clearTimeout(watchdog); done(v); };

    const img = new Image();
    // Required for getImageData() on a Supabase Storage URL. Supabase serves
    // the CORS headers that make this work.
    img.crossOrigin = 'anonymous';
    img.onerror = () => finish(dataUrl);
    img.onload = () => {
     try {
      const canvas = document.createElement('canvas');
      canvas.width  = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const { data, width, height } = imgData;
      const visited = new Uint8Array(width * height);

      // Learn the actual backdrop colour from the border rather than assuming
      // white. Product shots are often off-white, light grey or faintly warm,
      // and a fixed brightness cutoff leaves those untouched.
      const samples = [];
      const push = (x,y) => {
        const i = (y*width + x) * 4;
        if (data[i+3] > 0) samples.push([data[i], data[i+1], data[i+2]]);
      };
      for (let x = 0; x < width;  x += Math.max(1, Math.floor(width/24)))  { push(x, 0); push(x, height-1); }
      for (let y = 0; y < height; y += Math.max(1, Math.floor(height/24))) { push(0, y); push(width-1, y); }
      const med = ch => {
        const v = samples.map(s=>s[ch]).sort((a,b)=>a-b);
        return v.length ? v[Math.floor(v.length/2)] : 255;
      };
      const bgR = med(0), bgG = med(1), bgB = med(2);
      const bgIsLight = (bgR + bgG + bgB) / 3 >= 200;

      // Squared-distance tolerance around the sampled colour.
      const tol = Math.max(8, tolerance);
      const tolSq = tol * tol * 3;

      const isBg = (i) => {
        if (data[i+3] === 0) return false;
        const dr = data[i]   - bgR;
        const dg = data[i+1] - bgG;
        const db = data[i+2] - bgB;
        if (dr*dr + dg*dg + db*db <= tolSq) return true;
        // Keep the original near-white rule as a safety net for backdrops that
        // blow out to pure white in places.
        return bgIsLight &&
               data[i] >= threshold && data[i+1] >= threshold && data[i+2] >= threshold;
      };

      // Iterative flood fill seeded from all 4 edges (avoids recursion stack overflow)
      const stack = [];
      for (let x = 0; x < width; x++)  { stack.push(x, 0); stack.push(x, height - 1); }
      for (let y = 1; y < height - 1; y++) { stack.push(0, y); stack.push(width - 1, y); }

      while (stack.length) {
        const y = stack.pop(), x = stack.pop();
        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        const idx = y * width + x;
        if (visited[idx]) continue;
        visited[idx] = 1;
        const i = idx * 4;
        if (!isBg(i)) continue;
        data[i + 3] = 0; // punch out pixel
        stack.push(x+1, y, x-1, y, x, y+1, x, y-1);
      }

      // Feather: slightly soften opaque pixels that border a transparent one
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const idx = y * width + x;
          const i   = idx * 4;
          if (data[i+3] !== 255) continue; // skip transparent & already-soft
          const neighbors = [
            ((y-1)*width+x)*4, ((y+1)*width+x)*4,
            (y*width+x-1)*4,   (y*width+x+1)*4
          ];
          const nearTransp = neighbors.some(ni => data[ni+3] === 0);
          if (nearTransp) data[i+3] = 180; // anti-alias edge pixel
        }
      }

      ctx.putImageData(imgData, 0, 0);
      finish(canvas.toDataURL('image/png'));
     } catch (err) {
       // Tainted canvas or any other draw failure: use the original image.
       finish(dataUrl);
     }
    };
    img.src = dataUrl;
  });
}

// ─────────────────────────────────────────────
// LOGO COMPOSITOR
// ─────────────────────────────────────────────
function compositeLogoOnImage(imageDataUrl, logoDataUrl, logoSizePct=0.18) {
  return new Promise(resolve => {
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');
    const img    = new Image();
    img.onload = () => {
      canvas.width  = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      if (!logoDataUrl) { resolve(canvas.toDataURL('image/png')); return; }
      const logo = new Image();
      logo.onload = () => {
        const logoW  = Math.round(img.width * logoSizePct);
        const logoH  = Math.round(logoW * (logo.height / logo.width));
        const pad    = Math.round(img.width * 0.03);
        const x      = img.width  - logoW - pad;
        const y      = img.height - logoH - pad;
        const bgPad  = 10;
        const radius = 10;
        // White pill background
        ctx.globalAlpha = 0.88;
        ctx.fillStyle   = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(x-bgPad, y-bgPad, logoW+bgPad*2, logoH+bgPad*2, radius);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.drawImage(logo, x, y, logoW, logoH);
        resolve(canvas.toDataURL('image/png'));
      };
      logo.onerror = () => resolve(canvas.toDataURL('image/png'));
      logo.src = logoDataUrl;
    };
    img.onerror = () => resolve(imageDataUrl);
    img.src = imageDataUrl;
  });
}

// ─────────────────────────────────────────────
// PRODUCT + LOGO + PRICE COMPOSITOR
// Composites real product photo onto AI background, price labels, then logo
// priceOpts: { saveText, priceText, primaryColor, accentColor }
// ─────────────────────────────────────────────
function compositeProductAndLogo(bgDataUrl, productDataUrl, logoDataUrl, priceOpts={}) {
  return new Promise(resolve => {
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');
    const bg     = new Image();
    bg.onload = () => {
      canvas.width  = bg.width;
      canvas.height = bg.height;
      ctx.drawImage(bg, 0, 0);

      const addLogo = () => {
        if (!logoDataUrl) { resolve(canvas.toDataURL('image/png')); return; }
        const logo = new Image();
        logo.onload = () => {
          const logoW = Math.round(bg.width * 0.18);
          const logoH = Math.round(logoW * (logo.height / logo.width));
          const pad   = Math.round(bg.width * 0.03);
          const x     = bg.width  - logoW - pad;
          const y     = bg.height - logoH - pad;
          const bgPad = 10;
          ctx.globalAlpha = 0.88; ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.roundRect(x-bgPad, y-bgPad, logoW+bgPad*2, logoH+bgPad*2, 10); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.drawImage(logo, x, y, logoW, logoH);
          resolve(canvas.toDataURL('image/png'));
        };
        logo.onerror = () => resolve(canvas.toDataURL('image/png'));
        logo.src = logoDataUrl;
      };

      const addPriceThenLogo = () => {
        const { saveText, priceText, primaryColor='#1e3a5f', accentColor='#c4a35a' } = priceOpts;
        if (!saveText && !priceText) { addLogo(); return; }

        const W   = bg.width, H = bg.height;
        const pad = Math.round(W * 0.042);
        const bx  = pad; // left margin

        ctx.textBaseline = 'middle';
        ctx.textAlign    = 'left';

        // ── PRICE BLOCK (main) ──
        // Positioned at vertical center-ish of the left zone, anchored from bottom
        let blockBottom = Math.round(H * 0.80);

        if (priceText) {
          const priceVal  = priceText.startsWith('$') ? priceText : `$${priceText}`;
          const priceFs   = Math.round(H * 0.115); // large price number
          const justFs    = Math.round(H * 0.040); // "JUST" label
          const innerPadV = Math.round(H * 0.018);
          const innerPadH = Math.round(W * 0.030);

          ctx.font = `bold ${justFs}px -apple-system,Arial,sans-serif`;
          const justW = ctx.measureText('JUST').width;

          ctx.font = `900 ${priceFs}px -apple-system,Arial Black,sans-serif`;
          const priceW = ctx.measureText(priceVal).width;

          const blockW = Math.max(justW, priceW) + innerPadH * 2;
          const blockH = justFs * 1.6 + priceFs * 1.3 + innerPadV * 2;
          const by     = blockBottom - blockH;

          // Drop shadow under block
          ctx.save();
          ctx.shadowColor   = 'rgba(0,0,0,0.4)';
          ctx.shadowBlur    = Math.round(W * 0.025);
          ctx.shadowOffsetX = Math.round(W * 0.006);
          ctx.shadowOffsetY = Math.round(H * 0.008);
          ctx.globalAlpha   = 0.93;
          ctx.fillStyle     = primaryColor;
          ctx.beginPath(); ctx.roundRect(bx, by, blockW, blockH, 14); ctx.fill();
          ctx.restore();

          // "JUST" label in accent colour
          ctx.globalAlpha  = 1;
          ctx.font         = `bold ${justFs}px -apple-system,Arial,sans-serif`;
          ctx.fillStyle    = accentColor;
          ctx.fillText('JUST', bx + innerPadH, by + innerPadV + justFs * 0.75);

          // Price in white
          ctx.font      = `900 ${priceFs}px -apple-system,Arial Black,sans-serif`;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(priceVal, bx + innerPadH, by + innerPadV + justFs * 1.6 + priceFs * 0.62);

          blockBottom = by - Math.round(H * 0.018);
        }

        // ── SAVE BADGE (above price block) ──
        if (saveText) {
          const saveVal  = (function(){ var raw = saveText.replace(/^\$/, ''); var n = parseFloat(raw); return 'SAVE $' + (!isNaN(n) ? n.toFixed(2) : raw); }());
          const saveFs   = Math.round(H * 0.052);
          const innerPad = Math.round(W * 0.025);

          ctx.font = `bold ${saveFs}px -apple-system,Arial,sans-serif`;
          const tw  = ctx.measureText(saveVal).width;
          const bw  = tw + innerPad * 2;
          const bh  = Math.round(saveFs * 1.65);
          const by  = blockBottom - bh;

          ctx.save();
          ctx.shadowColor   = 'rgba(0,0,0,0.3)';
          ctx.shadowBlur    = Math.round(W * 0.018);
          ctx.shadowOffsetX = Math.round(W * 0.004);
          ctx.shadowOffsetY = Math.round(H * 0.005);
          ctx.globalAlpha   = 0.95;
          ctx.fillStyle     = accentColor;
          ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.fill();
          ctx.restore();

          ctx.globalAlpha  = 1;
          ctx.font         = `bold ${saveFs}px -apple-system,Arial,sans-serif`;
          ctx.fillStyle    = primaryColor;
          ctx.fillText(saveVal, bx + innerPad, by + bh / 2);
        }

        addLogo();
      };

      if (!productDataUrl) { addPriceThenLogo(); return; }
      const prod = new Image();
      prod.onload = () => {
        // Shift product right so price labels on left don't overlap
        const hasPriceLabels = !!(priceOpts.saveText || priceOpts.priceText);
        const prodH  = Math.round(bg.height * 0.62);
        const prodW  = Math.round(prodH * (prod.width / prod.height));
        const clampW = Math.min(prodW, Math.round(bg.width * (hasPriceLabels ? 0.55 : 0.65)));
        const prodWf = clampW;
        const prodHf = Math.round(prodWf * (prod.height / prod.width));
        // Right-shifted when price labels present, centered otherwise
        const px = hasPriceLabels
          ? Math.round(bg.width * 0.38)
          : Math.round((bg.width - prodWf) / 2);
        const py = bg.height - prodHf - Math.round(bg.height * 0.04);
        ctx.save();
        ctx.shadowColor   = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur    = Math.round(bg.width * 0.04);
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = Math.round(bg.height * 0.02);
        ctx.drawImage(prod, px, py, prodWf, prodHf);
        ctx.restore();
        addPriceThenLogo();
      };
      prod.onerror = addPriceThenLogo;
      prod.src = productDataUrl;
    };
    bg.onerror = () => resolve(bgDataUrl);
    bg.src = bgDataUrl;
  });
}

// ─────────────────────────────────────────────
// RETAIL TEMPLATE RENDERER
// Builds the entire ad with Canvas — no AI involved.
// Locked layout: top bar (logo), left (price), right (product), footer.
// tplId: 'classic' | 'dark' | 'bold'
// brandColors: { primary, accent }
// data: { saveText, priceText, productName, productSize, storeName }
// ─────────────────────────────────────────────
// bgDataUrl: optional uploaded template image (replaces flat-colour background + top bar)
// canvasW/canvasH: from the template metadata (defaults to 1080x1080)
async function renderRetailTemplate(tplId, { productDataUrl, logoDataUrl, brandPrimary='#1e3a5f', brandAccent='#c4a35a', bgDataUrl=null, canvasW=1080, canvasH=1080 }, { saveText='', priceText='', productName='', productSize='', storeName='' }) {
  const W = canvasW, H = canvasH;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const isDark  = tplId === 'dark';
  const txtMain = isDark ? '#FFFFFF' : brandPrimary;

  // ── Layer 1: background (uploaded template or flat colour) ──
  let BAR_H = 0; // when using a custom bg, no bar needed — it's in the design
  if (bgDataUrl) {
    await new Promise(res => {
      const bg = new Image();
      bg.onload = () => { ctx.drawImage(bg, 0, 0, W, H); res(); };
      bg.onerror = res;
      bg.src = bgDataUrl;
    });
  } else {
    // Built-in flat-colour template
    BAR_H = Math.round(H * 0.139); // ~150px at 1080
    const BG = isDark ? '#0D1B2A' : tplId === 'bold' ? '#FFFFFF' : '#F5EDDA';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = brandPrimary;
    ctx.fillRect(0, 0, W, BAR_H);
    ctx.fillStyle = brandAccent;
    ctx.fillRect(0, BAR_H, W, Math.round(H * 0.006));

    // Logo or store name in top bar
    await new Promise(res => {
      if (!logoDataUrl) {
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.round(BAR_H * 0.35)}px -apple-system,Arial,sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((storeName || '').toUpperCase(), W/2, BAR_H/2);
        return res();
      }
      const logo = new Image();
      logo.onload = () => {
        const lh = BAR_H * 0.68, lw = lh * (logo.width / logo.height);
        ctx.drawImage(logo, (W - lw)/2, (BAR_H - lh)/2, lw, lh);
        res();
      };
      logo.onerror = res;
      logo.src = logoDataUrl;
    });

    // Subtle vertical divider
    ctx.strokeStyle = txtMain + '28';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(Math.round(W * 0.477), BAR_H + Math.round(H * 0.046));
    ctx.lineTo(Math.round(W * 0.477), H - Math.round(H * 0.051));
    ctx.stroke();
  }

  // ── LEFT ZONE: measure total height first, then vertically center ──
  // All sizes scale proportionally to canvas dimensions
  const LX          = Math.round(W * 0.057);
  const MAX_TXT_W   = Math.round(W * 0.388);
  const CONTENT_TOP = BAR_H + Math.round(H * 0.013);
  const CONTENT_BOT = H - Math.round(H * 0.051);
  const CONTENT_H   = CONTENT_BOT - CONTENT_TOP;
  const FS_SAVE  = Math.round(H * 0.041);
  const IPV_SAVE = Math.round(H * 0.009);
  const IPH_SAVE = Math.round(W * 0.013);
  const FS_NAME  = Math.round(H * 0.031);
  const FS_SIZE  = Math.round(H * 0.025);
  const FS_JUST  = Math.round(H * 0.030);
  const FS_PRICE = Math.round(H * 0.109);

  // Pre-measure product name lines
  let nameLines = [];
  if (productName) {
    ctx.font = `bold ${FS_NAME}px -apple-system,Arial,sans-serif`;
    const words = productName.toUpperCase().split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? `${line} ${w}` : w;
      if (ctx.measureText(test).width > MAX_TXT_W && line) { nameLines.push(line); line = w; }
      else line = test;
    }
    if (line) nameLines.push(line);
  }

  // Calculate total block height
  const saveBlockH  = saveText    ? (FS_SAVE + IPV_SAVE * 2) + 28 : 0;
  const nameBlockH  = nameLines.length > 0 ? nameLines.length * FS_NAME * 1.35 + 10 : 0;
  const sizeBlockH  = productSize ? FS_SIZE * 1.7 + 4 : 0;
  const priceBlockH = priceText   ? 22 + FS_JUST * 1.45 + FS_PRICE * 1.15 : 0;
  const totalH      = saveBlockH + nameBlockH + sizeBlockH + priceBlockH;

  // Center the block vertically
  let ly = CONTENT_TOP + Math.round(Math.max(30, (CONTENT_H - totalH) / 2));

  ctx.textAlign = 'left'; ctx.textBaseline = 'top';

  // SAVE badge
  if (saveText) {
    const label = (function(){ var raw = saveText.replace(/^\$/, ''); var n = parseFloat(raw); return 'SAVE $' + (!isNaN(n) ? n.toFixed(2) : raw); }());
    ctx.font = `bold ${FS_SAVE}px -apple-system,Arial,sans-serif`;
    const tw = ctx.measureText(label).width;
    const bw = tw + IPH_SAVE * 2, bh = FS_SAVE + IPV_SAVE * 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    ctx.fillStyle = brandAccent;
    ctx.beginPath(); ctx.roundRect(LX, ly, bw, bh, 10); ctx.fill();
    ctx.restore();
    ctx.fillStyle = brandPrimary;
    ctx.textBaseline = 'middle';
    ctx.fillText(label, LX + IPH_SAVE, ly + bh / 2);
    ctx.textBaseline = 'top';
    ly += bh + 28;
  }

  // Product name
  if (nameLines.length > 0) {
    ctx.font = `bold ${FS_NAME}px -apple-system,Arial,sans-serif`;
    ctx.fillStyle = txtMain;
    for (const line of nameLines) { ctx.fillText(line, LX, ly); ly += FS_NAME * 1.35; }
    ly += 10;
  }

  // Product size
  if (productSize) {
    ctx.font = `${FS_SIZE}px -apple-system,Arial,sans-serif`;
    ctx.fillStyle = txtMain + (isDark ? 'aa' : '88');
    ctx.fillText(productSize, LX, ly);
    ly += FS_SIZE * 1.7 + 4;
  }

  // JUST + Price
  if (priceText) {
    const priceVal = priceText.startsWith('$') ? priceText : `$${priceText}`;
    ly += 22;
    ctx.font = `bold ${FS_JUST}px -apple-system,Arial,sans-serif`;
    ctx.fillStyle = brandAccent;
    ctx.fillText('JUST', LX, ly);
    ly += FS_JUST * 1.45;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.12)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
    ctx.font = `900 ${FS_PRICE}px -apple-system,Arial Black,sans-serif`;
    ctx.fillStyle = txtMain;
    ctx.fillText(priceVal, LX, ly);
    ctx.restore();
  }

  // Footer — pinned to bottom
  ctx.font = `22px -apple-system,Arial,sans-serif`;
  ctx.fillStyle = txtMain + (isDark ? '66' : '55');
  ctx.textBaseline = 'bottom';
  ctx.fillText('Plus tax & deposit. While supplies last.', LX, H - 24);

  // ── RIGHT ZONE: product photo — vertically centered ──
  if (productDataUrl) {
    await new Promise(res => {
      const prod = new Image();
      prod.onload = () => {
        const PX = Math.round(W * 0.49), PY = BAR_H + Math.round(H * 0.018), PW = Math.round(W * 0.454), PH = H - BAR_H - Math.round(H * 0.055);
        const scale = Math.min(PW / prod.width, PH / prod.height);
        const dw = prod.width * scale, dh = prod.height * scale;
        const dx = PX + (PW - dw) / 2;
        const dy = PY + (PH - dh) / 2; // vertically centered
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.20)';
        ctx.shadowBlur = 32; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 18;
        ctx.drawImage(prod, dx, dy, dw, dh);
        ctx.restore();
        res();
      };
      prod.onerror = res;
      prod.src = productDataUrl;
    });
  }

  return canvas.toDataURL('image/png');
}

// ─────────────────────────────────────────────
// LIGHTBOX
// ─────────────────────────────────────────────
function Lightbox({ src, onClose }) {
  useEffect(()=>{
    const esc = e => { if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  },[onClose]);
  if (!src) return null;
  return (
    <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onClick={onClose}>
      <div className="relative" onClick={e=>e.stopPropagation()}>
        <button onClick={onClose} className="absolute -top-9 right-0 text-white text-sm font-semibold hover:text-gray-300 flex items-center gap-1"><Icon name="close"/> Close</button>
        <img src={src} alt="Generated" className="max-w-[90vw] max-h-[88vh] rounded-2xl shadow-2xl object-contain"/>
        <a href={src} download="generated.png" onClick={e=>e.stopPropagation()} className="absolute -bottom-9 right-0 text-white text-xs font-semibold hover:text-gray-300"><Icon name="down"/> Download</a>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// GRAPH API HELPERS
// ─────────────────────────────────────────────
async function gFetch(path, opts={}) {
  const res  = await fetch(`${GRAPH_API}${path}`, opts);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || 'Graph API error');
  return data;
}
async function gGet(path, params, token) {
  const qs = new URLSearchParams({ ...params, access_token: token }).toString();
  return gFetch(`${path}?${qs}`);
}
async function gPost(path, body, token) {
  return gFetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, access_token: token }),
  });
}
async function gPostForm(path, form) {
  return gFetch(path, { method: 'POST', body: form });
}

// ─────────────────────────────────────────────
// AI HELPERS
// ─────────────────────────────────────────────
// Routed through the meta-social edge function so the Anthropic API key stays
// in Edge Function secrets. It is never loaded into the browser.
async function callAI(prompt, _unusedApiKey, maxTokens=600) {
  const result = await callEdge('meta-social', 'aiWrite', { prompt, maxTokens });
  return (result.text || '').trim();
}

// Both OpenAI calls run server-side via the meta-social edge function so that
// OPENAI_API_KEY never reaches the browser.
async function openAIDescribeImage(base64, mime, _unusedApiKey) {
  const result = await callEdge('meta-social', 'aiDescribeImage', { base64, mime });
  return (result.text || '').trim();
}

async function openAIGenerateImage(prompt, dalleSize, _unusedApiKey) {
  const result = await callEdge('meta-social', 'aiGenerateImage', { prompt, size: dalleSize });
  if (!result.url) throw new Error('No image returned from API');
  return { url: result.url, revised: result.revised || '' };
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function fmtDate(iso)   { return new Date(iso).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' }); }
function fmtBudget(c)   { return c ? `$${(+c/100).toFixed(2)}` : '—'; }
function fmtNum(n)      { if (!n||n==='—') return '—'; return Number(n).toLocaleString(); }
function fmtCTR(v)      { if (!v||v==='—') return '—'; return `${parseFloat(v).toFixed(2)}%`; }
function fbPostUrl(id)  { const p=String(id).split('_'); return p.length===2?`https://www.facebook.com/permalink.php?story_fbid=${p[1]}&id=${p[0]}`:`https://www.facebook.com/${id}`; }

function Button({ children, variant='primary', size='md', className='', loading=false, style={}, ...p }) {
  const base = 'clip inline-flex items-center justify-center gap-2 font-semibold uppercase tracking-[.16em] transition-all outline-none border disabled:opacity-40 disabled:cursor-not-allowed';
  const sz   = { sm:'px-3 py-1.5 text-[10px]', md:'px-4 py-2.5 text-[11px]', lg:'px-5 py-3 text-[11.5px]' }[size];
  const V = {

const ST_CATEGORIES = ['Generic','Regular Price','Sale','Multi-Buy','Limited Time','New Product','Staff Pick','Clearance','Seasonal'];

// Render a PDF's first page to a data URL via PDF.js
async function pdfPageToDataUrl(pdfDataUrl, maxPx=2000) {
  if (!window.pdfjsLib) throw new Error('PDF.js not loaded');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const raw = atob(pdfDataUrl.split(',')[1]);
  const bytes = new Uint8Array(raw.length);
  for (let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  const pdf = await window.pdfjsLib.getDocument({ data: bytes }).promise;
  const page = await pdf.getPage(1);
  const vp0 = page.getViewport({ scale: 1 });
  const scale = Math.min(maxPx / vp0.width, maxPx / vp0.height, 4);
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vp.width);
  canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return canvas.toDataURL('image/png');
}

// Binary-search text fitting — returns { fontSize, lines, overflow }
// Operates on an off-screen canvas for measurement; scale-independent.
// Display faces available to ad template fields. Loaded in <head>, so the
// canvas can use them — a font the document hasn't loaded silently falls back.
const AD_FONTS = [
  { id:'Anton',            label:'Anton',            stack:"'Anton',sans-serif",            weights:[400] },
  { id:'Archivo Black',    label:'Archivo Black',    stack:"'Archivo Black',sans-serif",    weights:[400] },
  { id:'Bebas Neue',       label:'Bebas Neue',       stack:"'Bebas Neue',sans-serif",       weights:[400] },
  { id:'Oswald',           label:'Oswald',           stack:"'Oswald',sans-serif",           weights:[400,500,600,700] },
  { id:'Barlow Condensed', label:'Barlow Condensed', stack:"'Barlow Condensed',sans-serif", weights:[600,700,800] },
  { id:'Montserrat',       label:'Montserrat',       stack:"'Montserrat',sans-serif",       weights:[300,400,500,600,700,800,900] },
  { id:'Inter',            label:'Inter',            stack:"'Inter',sans-serif",            weights:[300,400,500,600,700,800,900] },
  { id:'Jost',             label:'Jost (geometric)', stack:"'Jost',sans-serif",             weights:[300,400,500,600] },
  { id:'Chakra Petch',     label:'Chakra Petch',     stack:"'Chakra Petch',sans-serif",     weights:[400,500,600,700] },
  { id:'Arial',            label:'Arial (system)',   stack:'Arial,Helvetica,sans-serif',    weights:[400,700] },
];
const fontStack = id => (AD_FONTS.find(f=>f.id===id) || AD_FONTS[0]).stack;

// Canvas silently substitutes a fallback if the face isn't ready yet.
async function ensureFontsReady() {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e) {}
}

function fitText(text, boxW, boxH, settings={}) {
  const {
    maxFontSize=48, minFontSize=8, bold=false,
    lineSpacing=1.2, wrap=true, maxLines=null, align='left',
    fontFamily='Arial,Helvetica,sans-serif', fontWeight=null,
    padding=0,
    prefix='', prefixScale=0.55,
    suffix='', suffixScale=0.35,
  } = settings;
  const weightOf = () => fontWeight != null ? String(fontWeight) : (bold ? 'bold' : 'normal');

  const canvas = document.createElement('canvas');
  canvas.width=2000; canvas.height=2000;
  const ctx = canvas.getContext('2d');

  // Usable area, minus optional breathing room.
  const availW = Math.max(1, boxW - padding*2);
  const availH = Math.max(1, boxH - padding*2);

  // Real ink extents, not the em square. fontSize consistently understates
  // height for display faces (tall caps) and ignores accents and descenders,
  // which is what caused text to be clipped by the box.
  const inkOf = (str) => {
    const m = ctx.measureText(str);
    const asc  = (m.actualBoundingBoxAscent  != null && isFinite(m.actualBoundingBoxAscent))
      ? m.actualBoundingBoxAscent  : parseFloat(ctx.font) * 0.8;
    const desc = (m.actualBoundingBoxDescent != null && isFinite(m.actualBoundingBoxDescent))
      ? m.actualBoundingBoxDescent : parseFloat(ctx.font) * 0.2;
    // Glyphs can overhang the advance width on either side (italics, swashes).
    const left  = (m.actualBoundingBoxLeft  != null && isFinite(m.actualBoundingBoxLeft))  ? m.actualBoundingBoxLeft  : 0;
    const right = (m.actualBoundingBoxRight != null && isFinite(m.actualBoundingBoxRight)) ? m.actualBoundingBoxRight : m.width;
    return { asc, desc, w: Math.max(m.width, right + Math.max(0, left)) };
  };

  const measure = (fontSize) => {
    // Affixes are drawn at their own size beside the text, so the space they
    // occupy has to come out of the width available for wrapping.
    let affixW = 0;
    if (prefix) {
      ctx.font = `${weightOf()} ${Math.max(6, fontSize*prefixScale)}px ${fontFamily}`;
      affixW += ctx.measureText(prefix).width;
    }
    if (suffix) {
      ctx.font = `${weightOf()} ${Math.max(6, fontSize*suffixScale)}px ${fontFamily}`;
      affixW += ctx.measureText(suffix).width;
    }
    const textW = Math.max(1, availW - affixW);

    ctx.font = `${weightOf()} ${fontSize}px ${fontFamily}`;

    let lines;
    if (!wrap) {
      lines = [text];
    } else {
      lines = [];
      let cur = '';
      for (const w of text.split(/\s+/)) {
        const test = cur ? cur+' '+w : w;
        if (inkOf(test).w > textW && cur) { lines.push(cur); cur = w; }
        else cur = test;
      }
      if (cur) lines.push(cur);
    }

    const inks = lines.map(inkOf);
    const maxW = inks.reduce((a,k)=>Math.max(a,k.w), 0);
    const advance = fontSize * lineSpacing;
    // Ink height: ascent of the first line, descent of the last, plus the
    // baseline-to-baseline advance in between.
    const totalH = inks.length
      ? (inks.length-1)*advance + inks[0].asc + inks[inks.length-1].desc
      : 0;

    const limit = maxLines || 99;
    return {
      lines, inks, advance, totalH, affixW,
      fits: lines.length<=limit && totalH<=availH && maxW<=textW,
    };
  };

  // Binary search gets close fast, but fits() is not strictly monotonic —
  // changing font size changes where lines wrap, so a larger size can need
  // fewer lines and suddenly fit. Search, then verify downwards so the value
  // returned is guaranteed to fit and can never be clipped.
  let lo=minFontSize, hi=maxFontSize, candidate=minFontSize;
  while (lo<=hi) {
    const mid=Math.floor((lo+hi)/2);
    if (measure(mid).fits) { candidate=mid; lo=mid+1; }
    else hi=mid-1;
  }

  for (let fs=Math.max(candidate, minFontSize); fs>=minFontSize; fs--) {
    const r=measure(fs);
    if (r.fits) return { fontSize:fs, ...r, overflow:false };
  }

  // Nothing fits even at the minimum — the box is genuinely too small. Render
  // at the floor and flag it so the caller can tell the user which field.
  const r=measure(minFontSize);
  return { fontSize:minFontSize, ...r, overflow:true };
}

// Draw a single text field onto a canvas context.
// box: { x, y, w, h } in canvas pixels
function drawTextField(ctx, text, box, settings={}, fit=null) {
  const { align='left', valign='top', color='#000000', bold=false,
          lineSpacing=1.2, minFontSize=8, maxFontSize=48, wrap=true, maxLines=null,
          fontFamily='Arial,Helvetica,sans-serif', fontWeight=null, padding=0,
          prefix='', prefixScale=0.55, prefixValign='middle',
          suffix='', suffixScale=0.35, suffixValign='bottom' } = settings;
  const wt = fontWeight != null ? String(fontWeight) : (bold ? 'bold' : 'normal');
  const r = fit || fitText(text, box.w, box.h, {
    align, bold, lineSpacing, wrap, maxLines, maxFontSize, minFontSize,
    fontFamily, fontWeight, padding, prefix, prefixScale, suffix, suffixScale,
  });
  const { fontSize, lines, inks, advance, totalH } = r;
  if (!lines || !lines.length) return r;

  ctx.save();
  ctx.beginPath();
  // Inflated by 1px: the fit already guarantees containment, so this is only a
  // safety net and must not shave antialiased glyph edges.
  ctx.rect(box.x - 1, box.y - 1, box.w + 2, box.h + 2);
  ctx.clip();

  ctx.fillStyle = color;
  // Baseline positioning: 'top' guesses the em top, which clips accents on
  // display faces. Anchoring to the measured ascent is exact.
  ctx.textBaseline = 'alphabetic';
  ctx.font = `${wt} ${fontSize}px ${fontFamily}`;

  const innerX = box.x + padding;
  const innerW = box.w - padding*2;
  const innerY = box.y + padding;
  const innerH = box.h - padding*2;

  const preSize = prefix ? Math.max(6, Math.round(fontSize * prefixScale)) : 0;
  const sufSize = suffix ? Math.max(6, Math.round(fontSize * suffixScale)) : 0;

  ctx.font = `${wt} ${preSize}px ${fontFamily}`;
  const preW = prefix ? ctx.measureText(prefix).width : 0;
  ctx.font = `${wt} ${sufSize}px ${fontFamily}`;
  const sufW = suffix ? ctx.measureText(suffix).width : 0;

  // The text block sits between the affixes; each gets its own lane.
  const textX = innerX + preW;
  const textW = innerW - preW - sufW;

  let top = innerY;
  if (valign === 'middle')      top = innerY + (innerH - totalH) / 2;
  else if (valign === 'bottom') top = innerY + innerH - totalH;
  top = Math.max(top, innerY);

  const firstAsc = inks && inks[0] ? inks[0].asc : fontSize * 0.8;
  let baseline = top + firstAsc;

  ctx.font = `${wt} ${fontSize}px ${fontFamily}`;
  let lastLineW = 0;
  for (let k = 0; k < lines.length; k++) {
    let x = textX;
    if (align === 'center')     { ctx.textAlign = 'center'; x = textX + textW/2; }
    else if (align === 'right') { ctx.textAlign = 'right';  x = textX + textW; }
    else                        { ctx.textAlign = 'left'; }
    ctx.fillText(lines[k], x, baseline);
    if (k === lines.length-1) lastLineW = ctx.measureText(lines[k]).width;
    baseline += advance;
  }

  const lastIdx  = lines.length - 1;
  const lastBase = top + firstAsc + lastIdx * advance;
  const lastAsc  = inks && inks[lastIdx] ? inks[lastIdx].asc  : fontSize * 0.8;
  const lastDesc = inks && inks[lastIdx] ? inks[lastIdx].desc : fontSize * 0.2;

  // Where the drawn text actually starts and ends horizontally.
  let textLeft, textRight;
  if (align === 'center')     { textLeft = textX + textW/2 - lastLineW/2; textRight = textLeft + lastLineW; }
  else if (align === 'right') { textRight = textX + textW; textLeft = textRight - lastLineW; }
  else                        { textLeft = textX; textRight = textLeft + lastLineW; }

  // Prefix: smaller, in its own lane to the left, vertically centred against
  // the first line by default (a $ shouldn't sit on the same baseline as a
  // 200px numeral).
  if (prefix) {
    ctx.font = `${wt} ${preSize}px ${fontFamily}`;
    ctx.textAlign = 'left';
    const pm = ctx.measureText(prefix);
    const pAsc  = isFinite(pm.actualBoundingBoxAscent)  ? pm.actualBoundingBoxAscent  : preSize*0.8;
    const pDesc = isFinite(pm.actualBoundingBoxDescent) ? pm.actualBoundingBoxDescent : preSize*0.2;
    const firstTop = top;
    const firstBot = top + firstAsc;
    let py;
    if (prefixValign === 'top')          py = firstTop + pAsc;
    else if (prefixValign === 'baseline')py = firstBot;
    else                                 py = firstTop + (firstAsc + pAsc - pDesc) / 2; // middle
    ctx.fillText(prefix, textLeft - preW, py);
  }

  // Suffix: to the right of the text, sitting on the last line's baseline by
  // default so it reads as a unit with the price without overlapping it.
  if (suffix) {
    ctx.font = `${wt} ${sufSize}px ${fontFamily}`;
    ctx.textAlign = 'left';
    const sm = ctx.measureText(suffix);
    const sAsc = isFinite(sm.actualBoundingBoxAscent) ? sm.actualBoundingBoxAscent : sufSize*0.8;
    let sy;
    if (suffixValign === 'top')          sy = lastBase - lastAsc + sAsc;
    else if (suffixValign === 'middle')  sy = lastBase - lastAsc/2 + sAsc/2;
    else                                 sy = lastBase; // bottom / baseline
    const sx = Math.min(textRight + Math.round(sufSize*0.12), innerX + innerW - sm.width);
    ctx.fillText(suffix, sx, sy);
  }

  ctx.restore();
  return r;
}

function useSTTemplates(storeId=null, isAdmin=false) {
  const [templates, setTemplates] = useState([]);
  const [loading,   setLoading]   = useState(true);

  const load = useCallback(async () => {
    const sb=getSB(); if(!sb) return;
    setLoading(true);
    try {
      const { data } = await sb.from('shelf_talker_templates')
        .select('*, shelf_talker_template_brands(store_id)')
        .order('created_at', { ascending: false });
      const all = data || [];
      if (isAdmin) {
        setTemplates(all);
      } else {
        // Show active global templates + templates assigned to this store
        setTemplates(all.filter(t =>
          t.is_active && (
            t.scope === 'global' ||
            (t.shelf_talker_template_brands||[]).some(b => b.store_id === storeId)
          )
        ));
      }
    } finally { setLoading(false); }
  }, [storeId, isAdmin]);

  useEffect(() => { load(); }, [load]);
  return { templates, loading, reload: load };
}

function useSTFields(templateId) {
  const [fields,  setFields]  = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(async () => {
    if (!templateId) { setFields([]); return; }
    const sb=getSB(); if(!sb) return;
    setLoading(true);
    const { data } = await sb.from('shelf_talker_fields')
      .select('*').eq('template_id', templateId)
      .order('field_order');
    setFields(data||[]);
    setLoading(false);
  }, [templateId]);

  useEffect(() => { load(); }, [load]);

  const save = async (fieldList) => {
    const sb=getSB(); if(!sb) throw new Error('Not connected');
    await sb.from('shelf_talker_fields').delete().eq('template_id', templateId);
    if (fieldList.length) {
      const { error } = await sb.from('shelf_talker_fields').insert(
        fieldList.map((f,i) => {
          // eslint-disable-next-line no-unused-vars
          const { id: _dropId, created_at: _dropCa, ...rest } = f;
          return { id: crypto.randomUUID(), ...rest, template_id: templateId, field_order: i };
        })
      );
      if (error) throw error;
    }
    await load();
  };

  return { fields, loading, save, reload: load };
}

function useSavedTags(userId, isAdmin) {
  const [saves,   setSaves]   = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(async () => {
    const sb = getSB(); if (!sb) return;
    if (!isAdmin && !userId) return;
    setLoading(true);
    try {
      var query = sb.from('saved_shelf_talkers')
        .select('*, shelf_talker_templates(name, file_data, category)')
        .order('created_at', { ascending: false });
      if (!isAdmin) query = query.eq('user_id', userId);
      const { data } = await query;
      setSaves(data || []);
    } finally { setLoading(false); }
  }, [userId, isAdmin]);

  useEffect(function() { load(); }, [load]);

  const saveTag = async (name, templateId, values, storeId) => {
    const sb = getSB(); if (!sb) return;
    var userEmail = null;
    try { var r = await sb.auth.getUser(); userEmail = r.data.user ? r.data.user.email : null; } catch(e) {}
    const { error } = await sb.from('saved_shelf_talkers')
      .insert({ user_id: userId, template_id: templateId, name, values, store_id: storeId || null, user_email: userEmail });
    if (error) throw error;
    await load();
  };

  const deleteTag = async (id) => {
    const sb = getSB(); if (!sb) return;
    await sb.from('saved_shelf_talkers').delete().eq('id', id);
    await load();
  };

  return { saves, loading, saveTag, deleteTag, reload: load };
}

  const [sent,     setSent]     = useState(false);

  const signIn = async () => {
    if (!email||!password) { toast.error('Enter email and password'); return; }
    setLoading(true);
    const { error } = await getSB().auth.signInWithPassword({ email, password });
    if (error) toast.error(error.message);
    setLoading(false);
  };

  const resetPw = async () => {
    if (!email) { toast.error('Enter your email'); return; }
    setLoading(true);
    const { error } = await getSB().auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
    if (error) toast.error(error.message);
    else setSent(true);
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <Icon name="whisky" size={54} style={{color:"var(--cy)"}}/>
          <h1 className="text-2xl font-bold text-white mt-3">Liquor Store Social</h1>
          <p className="text-gray-400 text-sm mt-1">4 locations · Social Media Manager</p>
        </div>
        <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6">
          <h2 className="text-lg font-bold text-gray-900 dark:text-white mb-5 text-center">
            {mode==='login' ? 'Sign In' : 'Reset Password'}
          </h2>
          <div className="space-y-3">
            <div>
              <Label>Email</Label>
              <Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"
                onKeyDown={e=>e.key==='Enter'&&mode==='login'&&signIn()}/>
            </div>
            {mode==='login' && (
              <div>
                <Label>Password</Label>
                <Input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"
                  onKeyDown={e=>e.key==='Enter'&&signIn()}/>
              </div>
            )}
          </div>
          <div className="mt-5">
            {mode==='login' && <Button onClick={signIn} loading={loading} className="w-full" size="lg">Sign In</Button>}
            {mode==='forgot' && !sent && <Button onClick={resetPw} loading={loading} className="w-full" size="lg">Send Reset Email</Button>}
            {sent && <p className="text-center text-sm text-emerald-600 font-medium py-2"><Icon name="check"/> Check your inbox for the reset link</p>}
          </div>
          <div className="mt-4 text-center text-xs text-gray-500">
            {mode==='login'
              ? <button onClick={()=>setMode('forgot')} className="hover:text-indigo-600 underline">Forgot password?</button>
              : <button onClick={()=>{setMode('login');setSent(false);}} className="hover:text-indigo-600 underline">← Back to sign in</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// AI WRITER PANEL
// ─────────────────────────────────────────────
function AIWriter({ storeName, apiKey, mode='caption', onResult, seedTopic='' }) {
  const toast = useToast();
  const [topic,   setTopic]   = useState(seedTopic || '');
  const [tone,    setTone]    = useState('Friendly');
  const [extra,   setExtra]   = useState('');
  const [loading, setLoading] = useState(false);

  // A feature pulled in from the monthly sheet seeds the topic. Only overwrite
  // while the box is untouched, so a seed never wipes something typed by hand.
  const seededRef = useRef(seedTopic || '');
  useEffect(function(){
    if (!seedTopic) return;
    if (topic.trim() === '' || topic === seededRef.current) {
      setTopic(seedTopic);
      seededRef.current = seedTopic;
    }
  }, [seedTopic]);

  const generate = async () => {
